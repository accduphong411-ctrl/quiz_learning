924298.jpg", "note_img": "images/q_455_note_1794473924298.jpg"}, {"id": 456, "subject": "GLI202", "question": "", "options": {"A": "A supplier delivers all agreed goods and the buyer pays in full", "B": "A buyer cancels the order without notice", "C": "A supplier refuses to deliver due to price disputes", "D": "A buyer delays payment without reason"}, "answers": ["A"], "explanation": "Ví dụ nào thề hiện rõ nhất việc chắấm dứt hợp đồng do các bên đã hoàn thành nghĩa vụ (Contract discharge by performance)?\nA. A supplier delivers all agreed goods and the buyer pays in full (Nhà cung cắp giao đủ hàng đã thỏa thuận và người mua thanh toán đầy đủ) — Discharge by performance xảy ra\nkhi các bên hoàn thành các nghĩa vụ theo hợp đồng, làm chấm dứt những nghĩa vụ đã được thực hiện.", "slide_img": "images/q_456_slide_1794473926314.jpg", "note_img": "images/q_456_note_1794473926314.jpg"}, {"id": 457, "subject": "GLI202", "question": "Which characteristic must be applied to contract terms and conditions to ensure effective pre-emption of conflicts?", "options": {"A": "Terms must be subjectively judged by both parties", "B": "The fulfillment of terms and conditions must be measurable", "C": "Terms must allow for maximum ambiguity in interpretation", "D": "Terms must be consistent with foreign law only"}, "answers": ["B"], "explanation": "Các điều khoản và điều kiện hợp đồng cần có đặc điềểm nào đề chủ động phòng ngừa xung đột?\nB. The fulfiliment of terms and conditions must be measurable (Việc thực hiện các điều khoản và điều kiện phải có khả năng đo lường) — Điều khoản có tiêu chí đo lường rõ ràng\ngiúp các bên xác định mức độ hoàn thành và hạn chế tranh cãi.", "slide_img": "images/q_457_slide_1794473928241.jpg", "note_img": "images/q_457_note_1794473928241.jpg"}, {"id": 458, "subject": "GLI202", "question": "Which example best illustrates contract discharge by performance?", "options": {"A": "A supplier delivers all agreed goods and the buyer pays in full", "B": "A buyer cancels the order without notice", "C": "A supplier refuses to deliver due to price disputes", "D": "A buyer delays payment without reason"}, "answers": ["A"], "explanation": "Ví dụ nào thề hiện việc chấm dứt hợp đồng do hoàn thành nghĩa vụ?\nA. A supplier delivers all agreed goods and the buyer pays in full (Nhà cung cắp giao đủ hàng và người mua thanh toán đầy đủ) — Discharge by performance xảy ra khi các bên\nthực hiện đầy đủ nghĩa vụ theo hợp đồng.", "slide_img": "images/q_458_slide_1794473930105.jpg", "note_img": "images/q_458_note_1794473930105.jpg"}, {"id": 459, "subject": "GLI202", "question": "", "options": {"A": "Asupplier guarantees product quality for a specified period", "B": "A supplier offers verbal assurances without documentation", "C": "A buyer assumes performance without terms", "D": "Acontract is silent on product standards"}, "answers": ["A"], "explanation": "Đâu là một điều khoản bảo đảm hợp lệ trong hợp đồng chuối cung ứng?\nA. A supplier guarantees product quality for a specified period (Nhà cung cấp bảo đảm chất lượng sản phẩm trong một thời hạn xác định) — Warranty là cam két về chất lượng\nhoặc tình trạng sản phẩm trong thời hạn đã thỏa thuận.", "slide_img": "images/q_459_slide_1794473932038.jpg", "note_img": "images/q_459_note_1794473932038.jpg"}, {"id": 460, "subject": "GLI202", "question": "Which of the following best describes the scope section of a contract management plan?", "options": {"A": "Defines deliverables, objectives, and responsibilities", "B": "Focuses on brand image and marketing", "C": "Outlines recruitment of new staff", "D": "Specifies customer satisfaction surveys only"}, "answers": ["A"], "explanation": "Phần Scope trong kế hoạch quản lý hợp đồng được mô tả chính xác nhất như thế nào?\nA. Defines deliverables, objectives, and responsibilities (Xác định sản phẩm bàn giao, mục tiêu và trách nhiệm) — Scope quy định phạm vi công việc, kết quả cần đạt và trách nhiệm\ncủa các bên liên quan.", "slide_img": "images/q_460_slide_1794473933874.jpg", "note_img": "images/q_460_note_1794473933874.jpg"}, {"id": 461, "subject": "GLI202", "question": "Which of the following best describes the purpose of a Contract Risk Register?", "options": {"A": "Identification and documentation of potential risks in a structured format", "B": "Establishing a schedule for contractor performance reporting", "C": "Monitoring supplier negotiations and contract award decisions", "D": "Tracking changes in commercial market trends only"}, "answers": ["A"], "explanation": "Mục đích của Contract Risk Register là gì?\nA. Identification and documentation of potential risks in a structured format (Xác định và ghi nhận các rủi ro tiềm ân theo một cấu trúc có hệ thống) — Risk Register là số đăng ký\nrủi ro, giúp theo dõi các vấn đề có thể ảnh hưởng đến việc thực hiện hợp đồng.", "slide_img": "images/q_461_slide_1794473935675.jpg", "note_img": "images/q_461_note_1794473935675.jpg"}, {"id": 462, "subject": "GLI202", "question": "Which characteristic must be applied to contract terms and conditions to ensure effective pre-emption of conflicts?", "options": {"A": "Terms must be subjectively judged by both parties", "B": "The fulfillment of terms and conditions must be measurable", "C": "Terms must allow for maximum ambiguity in interpretation", "D": "Terms must be consistent with foreign law only"}, "answers": ["B"], "explanation": "Các điều khoản hợp đồng cần có đặc điểm nào đề chủ động phòng ngừa xung đột?\nB. The fulfiliment of terms and conditions must be measurable (Việc thực hiện các điều khoản và điều kiện phải có khả năng đo lường) — Điều khoản có tiêu chí rõ ràng giúp đánh\ngiá mức độ hoàn thành và hạn chế tranh cãi.", "slide_img": "images/q_462_slide_1794473937674.jpg", "note_img": "images/q_462_note_1794473937674.jpg"}, {"id": 463, "subject": "GLI202", "question": "Which international organization is dedicated to the promotion of global trade development and integration of developing countries into world commerce (providing research and support for trade negotiations)?", "options": {"A": "UNCTAD (United Nations Conference on Trade and Development)", "B": "ICC (International Chamber of Commerce)", "C": "WTO (World Trade Organization)", "D": "WCO (World Customs Organization)"}, "answers": ["A"], "explanation": "Tổ chức quốc tế nào thúc đầy phát triển thương mại toàn cầu và hỗ trợ các nước đang phát triển hội nhập thương mại quốc té?\nA. UNCTAD - United Nations Conference on Trade and Development (Hội nghị Liên Hợp Quốc về Thương mại và Phát triên) — UNCTAD cung cấp nghiên cứu, dữ liệu, tư vấn chính\nsách và hỗ trợ các quốc gia đang phát triển tham gia thương mại toàn cầu.", "slide_img": "images/q_463_slide_1794473939612.jpg", "note_img": "images/q_463_note_1794473939612.jpg"}, {"id": 464, "subject": "GLI202", "question": "When interpreting contract terms, courts generally favor:", "options": {"A": "The plain and ordinary meaning of the words", "B": "The intentions not written in the document", "C": "The interests of the party with more bargaining power", "D": "Ignoring ambiguous terms altogether"}, "answers": ["A"], "explanation": "Khi giải thích các điều khoản hợp đồng, tòa án thường ưu tiên nguyên tắc nào?\nA. The plain and ordinary meaning of the words (Ý nghĩa rõ ràng và thông thường của từ ngữ) — Plain meaning rule ưu tiên cách hiều thông thường của ngôn từ trong hợp đồng, đặc\nbiệt khi điều khoản rõ ràng và không mơ hồ.", "slide_img": "images/q_464_slide_1794473941480.jpg", "note_img": "images/q_464_note_1794473941480.jpg"}, {"id": 465, "subject": "GLI202", "question": "When defining roles in a contract management plan, what is the biggest risk if responsibilities overlap?", "options": {"A": "Confusion in accountability and reduced compliance", "B": "Increased supplier bargaining power and higher costs", "C": "Better collaboration but longer contract negotiation", "D": "Stronger performance measurement but weaker supplier relations"}, "answers": ["A"], "explanation": "Khi xác định vai trò trong kế hoạch quản lý hợp đồng, rủi ro lớn nhất nếu trách nhiệm bị chồng chéo là gì?\nA. Confusion in accountability and reduced compliance (Không rõ trách nhiệm giải trình và giảm mức độ tuân thủ) — Khi nhiều người cùng phụ trách một nhiệm vụ mà không phân\nđịnh rõ quyền hạn, công việc dễ bị bỏ sót hoặc xử lý không nhất quán.", "slide_img": "images/q_465_slide_1794473943298.jpg", "note_img": "images/q_465_note_1794473943298.jpg"}, {"id": 466, "subject": "GLI202", "question": "8 a Which of the following is an example of a major maritime chokepoint on global sea traffic routes, where geography funnels ships through a narrow passage?", "options": {"A": "The Suez Canal (connecting the Red Sea with the Mediterranean)", "B": "The mid-Pacific open ocean", "C": "The coast of Antarctica", "D": "The interior of Australia"}, "answers": ["A"], "explanation": "Đâu là ví dụ về điểm nghẽn hàng hải quan trọng (Maritime Chokepoint)?\nA. The Suez Canal (connecting the Red Sea with the Mediterranean) (Kênh đào Suez, kết nói Biên Đỏ với Địa Trung Hải) — Đây là tuyến đường hẹp có ý nghĩa chiến lược đối với\nthương mại hàng hải.", "slide_img": "images/q_466_slide_1794473945252.jpg", "note_img": "images/q_466_note_1794473945252.jpg"}, {"id": 467, "subject": "GLI202", "question": "es Effective team formation in contract management ensures:", "options": {"A": "Alignment with organizational goals and compliance", "B": "Maximization of brand visibility", "C": "Reduction in product promotion costs", "D": "Elimination of global competition"}, "answers": ["A"], "explanation": "Việc thành lập nhóm làm việc hiệu quả (Effective Team Formation) trong quản lý hợp đồng (Contract Management) bảo đảm điều gì?\n\nA. Alignment with organizational goals and compliance\n\n— Bảo đảm sự phù hợp với các mục tiêu của tổ chức và việc tuân thủ các quy định.\n\nỮf`ective Ệe_am %frnnatiolnẮgiúp mảy,dựrịg m.ột mặóm qu`ảin ự hợp3đc`“›,r1gJ CÓ fflầỵ đủ Kỹ ®r1g, ưả'ch ựìiệm va sự Wộiằhợp gìữa các ư2ành viên. Điều này bảo đảm các hoạt động quản lý hợp đồng", "slide_img": "images/q_467_slide_1794473948617.jpg", "note_img": "images/q_467_note_1794473948617.jpg"}, {"id": 468, "subject": "GLI202", "question": "According to Incoterms, which of the following tasks is the seller's responsibility under FCA (Free Carrier)?", "options": {"A": "Export clearance of the goods before handing them over to the carrier", "B": "Paying for main international carriage to the buyer's country", "C": "Unloading the goods at the buyer's premises", "D": "Paying import duties in the buyer's country"}, "answers": ["A"], "explanation": "Theo FCA, nghĩa vụ nào thuộc về người bán?\nA. Export clearance of the goods before handing them over to the carrier (Làm thủ tục thông quan xuất khâu trước khi giao hàng cho người vận tải) ¬ FCA yêu cầu người bán\ngiao hàng cho người vận tải hoặc người được người mua chỉ định tại địa điểm thỏa thuận và thực hiện thông quan xuất khẩu.", "slide_img": "images/q_468_slide_1794473950579.jpg", "note_img": "images/q_468_note_1794473950579.jpg"}, {"id": 469, "subject": "GLI202", "question": "A forwarder decides to self-insure small routinely occurring losses (e.g., minor cargo scuffs) but buys insurance for catastrophic losses. This approach is an example of:", "options": {"A": "Risk bearing (retention) for minor issues, and risk transfer for major issues", "B": "Risk avoidance for all issues", "C": "Risk ignorance for major issues", "D": "Complete risk prevention"}, "answers": ["A"], "explanation": "Freight Forwarder tự chịu những tồn thất nhỏ thường xuyên nhưng mua bảo hiểm cho tổồn thất nghiêm trọng. Đây là phương pháp gì?\nA. Risk bearing (retention) for minor issues, and risk transfer for major issues (Giữ lại rủi ro đối với tôn thắt nhỏ và chuyên giao rủi ro đối với tồn thất lớn) › Kết hợp hai phương\npháp quản trị rủi ro theo mức độ thiệt hại.", "slide_img": "images/q_469_slide_1794473952451.jpg", "note_img": "images/q_469_note_1794473952451.jpg"}, {"id": 470, "subject": "GLI202", "question": "Clear administrative procedures in Contract Administration are necessary to ensure that all parties understand which three elements?", "options": {"A": "Who does what, when, and how", "B": "Cost projections, quality benchmarks, and time schedules", "C": "Legal jurisdiction, applicable law, and contract formation", "D": "Market dynamics, supplier capacity, and inventory levels"}, "answers": ["A"], "explanation": "Các thủ tục hành chính rõ ràng trong quản trị hợp đồng càn đảm bảo tất cả các bên hiểu ba yếu tố nào?\nA. Who does what, when, and how (Ai làm gì, khi nào và bằng cách nào) — Quy trình rõ ràng giúp phân định trách nhiệm, thời hạn và phương pháp thực hiện công việc.", "slide_img": "images/q_470_slide_1794473954188.jpg", "note_img": "images/q_470_note_1794473954188.jpg"}, {"id": 471, "subject": "GLI202", "question": "ee. ee eee Cee eee ee eee ee eee ee ee Digitalization in freight forwarding mainly results in:", "options": {"A": "Faster. more transparent, and cost-effective logistics operations", "B": "Increased manual paperwork.", "C": "Reduced data accuracy.", "D": "Elimination of all human roles."}, "answers": ["A"], "explanation": "Số hóa trong hoạt động giao nhận vận tải chủ yếu mang lại kết quả gì?\nA. Faster, more transparent, and cost-effective logistics operations (Hoạt động Iogistics nhanh hơn, minh bạch hơn và tiết kiệm chi phí hơn)\n— Digitalization giúp tự động hóa chứng từ, theo dõi lô hàng và giảm thao tác thủ công.", "slide_img": "images/q_471_slide_1794473956082.jpg", "note_img": "images/q_471_note_1794473956082.jpg"}, {"id": 472, "subject": "GLI202", "question": "Documentary proof of delivery is often tied to Incoterms. For instance, under FOB the seller should provide which document to prove delivery/shipment?", "options": {"A": "An on-board Bill of Lading issued by the carrier BA Delivery Order from the destination port", "C": "An airwaybill (regardless of transport mode) DA letter from the buyer acknowledging receipt of goods at destination"}, "answers": ["A"], "explanation": "Theo FOB, người bán nên cung cấp chứng từ nào để chứng minh hàng đã được giao hoặc xếp lên tàu?\nA. An on-board Bill of Lading issued by the carrier (Vận đơn đã xếp hàng lên tàu do người vận tải phát hành) ¬ On-board B/L xác nhận hàng đã được xếp lên tàu và là bằng chứng\nvận chuyền quan trọng trong thương mại đường biền.", "slide_img": "images/q_472_slide_1794473958024.jpg", "note_img": "images/q_472_note_1794473958024.jpg"}, {"id": 473, "subject": "GLI202", "question": "Incoterms define:", "options": {"A": "The responsibilities of buyers and sellers in international transactions", "B": "The exchange rate between two currencies.", "C": "The quality standard of imported goods.", "D": "The tax system for exports."}, "answers": ["A"], "explanation": "Incoterms quy định điều gì?\nA. The responsibilities of buyers and sellers in international transactions (Trách nhiệm của người mua và người bán trong giao dịch quóc té)\n— Incoterms quy định việc phân chia trách nhiệm, chi phí và rủi ro giao hàng giữa người mua và người bán.", "slide_img": "images/q_473_slide_1794473959989.jpg", "note_img": "images/q_473_note_1794473959989.jpg"}, {"id": 474, "subject": "GLI202", "question": "In the freight business, the term \"multimodal transport” refers to:", "options": {"A": "The use of multiple carriers under one single transport contract.", "B": "Shipping goods by only one mode of transport.", "C": "Delivery services within a single country.", "D": "The consolidation of air cargo only."}, "answers": ["A"], "explanation": "Trong ngành giao nhận, vận tải đa phương thức (Multimodal transport) được hiều là gì?\n\nA. The use of multiple carriers under one single transport contract (Sử dụng nhiều đơn vị vận chuyên theo một hợp đồng vận tải duy nhất)\n\n— Multimodal transport sử dụng ít nhất hai phương thức vận tải khác nhau theo một hợp đồng vận tải thống nhất. Đáp án A là lựa chọn gần nhất, nhưng điểm cốt lõi là nhiều phương thức\nvận tải, không nhất thiết nhiều hãng vận chuyền.", "slide_img": "images/q_474_slide_1794473961952.jpg", "note_img": "images/q_474_note_1794473961952.jpg"}, {"id": 475, "subject": "GLI202", "question": "Electronic freight platforms primarily aim to:", "options": {"A": "Simplify and digitalize shipment booking and documentation.", "B": "Replace international trade laws.", "C": "Increase manual data entry.", "D": "Eliminate carrier competition."}, "answers": ["A"], "explanation": "Các nền tảng giao nhận điện tử chủ yếu hướng đến mục tiêu gì?\nA. Simplify and digitalize shipment booking and documentation (Đơn giản hóa và số hóa việc đặt chỗ vận chuyên và xử lý chứng từ) — Electronic freight platforms giúp giảm giấy\ntờ thủ công, cải thiện khả năng theo dõi và tăng tốc độ xử lý đơn hàng.", "slide_img": "images/q_475_slide_1794473963904.jpg", "note_img": "images/q_475_note_1794473963904.jpg"}, {"id": 476, "subject": "GLI202", "question": "Hazardous materials must be:", "options": {"A": "Properly classified, packed, labeled, and documented.", "B": "Shipped without labeling for security.", "C": "Declared only at the port of destination.", "D": "Transported only by sea"}, "answers": ["A"], "explanation": "Hàng hóa nguy hiểm phải được xử lý như thế nào?\nA. Properly classified, packed, labeled, and documented (Được phân loại, đóng gói, dán nhãn và lập chứng từ đúng quy định) › Hazardous materials phải tuân thủ các yêu cầu an\ntoàn để hạn chế nguy cơ cháy nồ, rò rỉ hoặc gây hại trong vận chuyển.", "slide_img": "images/q_476_slide_1794473966047.jpg", "note_img": "images/q_476_note_1794473966047.jpg"}, {"id": 477, "subject": "GLI202", "question": "Incoterms deal with the division of logistics costs and risks. Which of the following is outside the scope of Incoterms rules?", "options": {"A": "Who arranges transportation and insurance", "B": "Who handles export and import clearance", "C": "The method and timing of payment from buyer to seller", "D": "The point at which risk of loss transfers from seller to buyer (2) eas 3, ot ="}, "answers": ["C"], "explanation": "Yếu tố nào nằm ngoài phạm vi điều chỉnh của Incoterms?\nC. The method and timing of payment from buyer to seller (Phương thức và thời hạn thanh toán giữa người mua và người bán) — Incoterms không quy định việc thanh toán bằng\nT/T, L/C hay thời hạn thanh toán. Những nội dung này thuộc hợp đồng mua bán.", "slide_img": "images/q_477_slide_1794473967876.jpg", "note_img": "images/q_477_note_1794473967876.jpg"}, {"id": 478, "subject": "GLI202", "question": "The intent behind asking advanced questions to suppliers, such as what they need from the buyer, is to ensure the supplier is treated as what?", "options": {"A": "A transactional vendor for short-term gains", "B": "A temporary solution for capacity gaps", "C": "A partner for a win-win relationship", "D": "A controllable subsidiary unit"}, "answers": ["C"], "explanation": "Mục đích của việc đặt những câu hỏi chuyên sâu cho nhà cung cấp, chẳng hạn họ cần gì từ người mua, là để đảm bảo nhà cung cấp được đối xử như thế nào?\nC. A partner for a win-win relationship (Một đối tác trong mồi quan hệ đôi bên cùng có lợi) › Cách tiếp cận hợp tác giúp người mua và nhà cung cấp hiều nhu cầu của nhau, cùng giải\nquyết vấn đề và tạo giá trị lâu dài.", "slide_img": "images/q_478_slide_1794473969815.jpg", "note_img": "images/q_478_note_1794473969815.jpg"}, {"id": 479, "subject": "GLI202", "question": "The performance measurement part of a contract management plan should:", "options": {"A": "Track compliance with agreed terms and KPls", "B": "Monitor global marketing campaigns", "C": "Enhance R&D investments", "D": "Evaluate employee personal goals"}, "answers": ["A"], "explanation": "Phần đo lường hiệu quả trong kế hoạch quản lý hợp đồng cần thực hiện điều gì?\nA. Track compliance with agreed terms and KPIs (Theo dõi việc tuân thủ điều khoản đã thỏa thuận và các KPI) ¬ Performance measurement đánh giá kết quả thực hiện dựa trên các\nchỉ số và nghĩa vụ được quy định trong hợp đồng.", "slide_img": "images/q_479_slide_1794473971660.jpg", "note_img": "images/q_479_note_1794473971660.jpg"}, {"id": 480, "subject": "GLI202", "question": "The FIATA Consignment Note (FCR) confirms that:", "options": {"A": "Goods have been received by the freight forwarder for dispatch", "B": "The exporter has been paid.", "C": "Customs clearance is completed.", "D": "Cargo is insured."}, "answers": ["A"], "explanation": "Chứng từ FIATA FCR xác nhận điều gì?\nA. Goods have been received by the freight forwarder for dispatch (Hàng hóa đã được người giao nhận tiếp nhận đề gửi đi) ¬ FCR (Forwarders Certificate of Receipt) xác nhận\nngười giao nhận đã nhận hàng theo các điều kiện ghi trên chứng từ.", "slide_img": "images/q_480_slide_1794473973537.jpg", "note_img": "images/q_480_note_1794473973537.jpg"}, {"id": 481, "subject": "GLI202", "question": "", "options": {"A": "Taxes imposed on imported goods.", "B": "Fees for port handling and customs inspection.", "C": "Subsidies paid to exporters.", "D": "Service charges for insurance coverage."}, "answers": ["A"], "explanation": "Tariffs được mô tả chính xác nhất là gì?\nA. Taxes imposed on imported goods (Thuế đánh vào hàng hóa nhập khâu) — Tariffs là thuế quan, có thể được sử dụng đề tạo nguồn thu ngân sách hoặc bảo vệ ngành sản xuất trong\nnước.", "slide_img": "images/q_481_slide_1794473975374.jpg", "note_img": "images/q_481_note_1794473975374.jpg"}, {"id": 482, "subject": "GLI202", "question": "The FIATA Certificate of Origin is used to:", "options": {"A": "Identify the country where goods were produced.", "B": "Declare cargo insurance value.", "C": "Show customs tariff codes.", "D": "Certify packaging materials."}, "answers": ["A"], "explanation": "Giấy chứng nhận xuất xứ hàng hóa được sử dụng đề làm gì?\nA. Identify the country where goods were produced (Xác định quốc gia nơi hàng hóa được sản xuất) — Certificate of Origin (C/O) xác nhận xuất xứ hàng hóa đề phục vụ thủ tục hải\nquan và xác định ưu đãi thương mại.", "slide_img": "images/q_482_slide_1794473977259.jpg", "note_img": "images/q_482_note_1794473977259.jpg"}, {"id": 483, "subject": "GLI202", "question": "Trade credit risk (the risk that the buyer won't pay) can be reduced by a forwarder or exparter by using which payment method?", "options": {"A": "An Irrevocable Letter of Credit confirmed by a reputable bank", "B": "Open account payment with 90-day terms without any security", "C": "Consignment stock (ship goods with payment after sale)", "D": "Informal promise to pay later without documentation"}, "answers": ["A"], "explanation": "Phương thức thanh toán nào giúp giảm rủi ro người mua không thanh toán?\nA. An Irrevocable Letter of Credit confirmed by a reputable bank (Thư tín dụng không hủy ngang được xác nhận bởi một ngân hàng uy tín) › Ngân hàng xác nhận bồ sung cam\nkết thanh toán khi bộ chứng từ phù hợp.", "slide_img": "images/q_483_slide_1794473979189.jpg", "note_img": "images/q_483_note_1794473979189.jpg"}, {"id": 484, "subject": "GLI202", "question": "ee Tariffs are best described as:", "options": {"A": "Taxes imposed on imported goods.", "B": "Fees for port handling and customs inspection.", "C": "Subsidies paid to exporters.", "D": "Service charges for insurance coverage."}, "answers": ["A"], "explanation": "Tariffs được định nghĩa chính xác nhất là gì?\nA. Taxes imposed on imported goods (Thuế áp dụng đối với hàng hóa nhập khâu) — Tariffs là thuế quan đánh vào hàng nhập khẩu, có thể được sử dụng đề tạo nguồn thu hoặc bảo vệ\nsản xuất trong nước.", "slide_img": "images/q_484_slide_1794473981139.jpg", "note_img": "images/q_484_note_1794473981139.jpg"}, {"id": 485, "subject": "GLI202", "question": "The “FIATA Bill of Lading” is:", "options": {"A": "A transport document recognized under multimodal conventions.", "B": "A customs clearance form.", "C": "A marine insurance policy.", "D": "A goverment-issued export license."}, "answers": ["A"], "explanation": "FIATA Bill of Lading là gì?\nA. A transport document recognized under multimodal conventions (Chứng từ vận tải được công nhận trong hoạt động vận tải đa phương thức) — FIATA Bill of Lading (FBL) là\nchứng từ vận tải do người giao nhận phát hành, thường được sử dụng trong vận tải đa phương thức.", "slide_img": "images/q_485_slide_1794473982952.jpg", "note_img": "images/q_485_note_1794473982952.jpg"}, {"id": 486, "subject": "GLI202", "question": "The FIATA Certificate of Origin is used to:", "options": {"A": "Identify the country where goods were produced.", "B": "Declare cargo insurance value.", "C": "Show customs tariff codes.", "D": "Certify packaging materials."}, "answers": ["A"], "explanation": "Giấy chứng nhận xuất xứ hàng hóa (Certificate of Origin) được sử dụng đểề làm gì?\nA. Identify the country where goods were produced (Xác định quốc gia nơi hàng hóa được sản xuất) — Certificate of Origin (C/O) xác nhận xuất xứ hàng hóa, phục vụ thủ tục hải\nquan và xác định khả năng được hưởng ưu đãi thuế quan. Lưu ý: C/O không phải chứng từ riêng của FIATA.", "slide_img": "images/q_486_slide_1794473984817.jpg", "note_img": "images/q_486_note_1794473984817.jpg"}, {"id": 487, "subject": "GLI202", "question": "Under standard practice, a freight forwarder is not liable for loss or damage caused by a subcontracted carrier provided that the forwarder has:", "options": {"A": "Absolute insurance coverage for all shipments.", "B": "Physically handled the goods personally.", "C": "Signed a contract making the carrier fully liable.", "D": "Exercised due diligence in selecting, instructing, and supervising that carrier."}, "answers": ["D"], "explanation": "Theo thông lệ, Freight Forwarder có thể không chịu trách nhiệm về tồn thất do Carrier thuê ngoài gây ra nếu đã thực hiện điều gì?\n\nD. Exercised due diligence in selecting, instructing, and supervising that carrier (Thực hiện sự thận trọng cần thiết khi lựa chọn, hướng dẫn và giám sát người vận tải) › Trong\nvai trò đại lý, việc thực hiện due diligence có thể giúp giới hạn trách nhiệm. Tuy nhiên, điều này còn phụ thuộc hợp đồng và luật áp dụng; không tự động miễn trách nhiệm trong mọi trường\nhợp.", "slide_img": "images/q_487_slide_1794473986820.jpg", "note_img": "images/q_487_note_1794473986820.jpg"}, {"id": 488, "subject": "GLI202", "question": "A freight forwarder primarily acts as:", "options": {"A": "Atransport operator owning ships and aircraft.", "B": "An intermediary arranging shipments between shippers and carriers", "C": "Acustoms officer supervising border regulations.", "D": "A financial institution providing trade credit."}, "answers": ["B"], "explanation": "Vai trò chính của một Freight Forwarder là gì?\nB. An intermediary arranging shipments between shippers and carriers (Đơn vị trung gian tổ chức vận chuyên giữa chủ hàng và người vận tải) › Freight forwarder sắp xếp\nphương tiện vận chuyền, chứng từ và các dịch vụ logistics thay mặt khách hàng.", "slide_img": "images/q_488_slide_1794473988707.jpg", "note_img": "images/q_488_note_1794473988707.jpg"}, {"id": 489, "subject": "GLI202", "question": "The main goal of freight forwarding in global trade is to:", "options": {"A": "Facilitate the smooth, cost-effective movement of goods internationally.", "B": "Manufacture goods in multiple countries.", "C": "Regulate currency exchange rates.", "D": "Promote tourism logistics."}, "answers": ["A"], "explanation": "Mục tiêu chính của hoạt động Freight Forwarding trong thương mại toàn cầu là gì?\nA. Facilitate the smooth, cost-effective movement of goods internationally (Đảm bảo hàng hóa được vận chuyên quốc tế thuận lợi và tiết kiệm chi phí) ¬ Freight forwarding hỗ trợ\nphói hợp vận tải, chứng từ và các dịch vụ liên quan để tối ưu hóa quá trình giao hàng.", "slide_img": "images/q_489_slide_1794473990633.jpg", "note_img": "images/q_489_note_1794473990633.jpg"}, {"id": 490, "subject": "GLI202", "question": "The term \"door-to-door service’ in freight forwarding means:", "options": {"A": "Delivering goods from the factory of the seller to the buyer's warehouse.", "B": "Only providing sea transport between two ports.", "C": "Managing customs procedures only.", "D": "Delivering documents electronically."}, "answers": ["A"], "explanation": "Thuật ngữ Door-to-door service trong giao nhận vận tải có nghĩa là gì?\nA. Delivering goods from the factory of the seller to the buyer's warehouse (Vận chuyên hàng từ nhà máy người bán đến kho người mua) —› Door-to-door service cung cấp dịch vụ\nvận chuyền từ địa điểm nhận hàng đến địa điềểm giao hàng cuối cùng đã thỏa thuận.", "slide_img": "images/q_490_slide_1794473992577.jpg", "note_img": "images/q_490_note_1794473992577.jpg"}, {"id": 491, "subject": "GLI202", "question": "The main goal of freight forwarding in global trade is to:", "options": {"A": "Facilitate the smooth, cost-effective movement of goods internationally.", "B": "Manufacture goods in multiple countries.", "C": "Regulate currency exchange rates.", "D": "Promote tourism logistics."}, "answers": ["A"], "explanation": "Mục tiêu chính của hoạt động giao nhận vận tải trong thương mại toàn cầu là gì?\nA. Facilitate the smooth, cost-effective movement of goods internationally (Tạo điều kiện vận chuyên hàng hóa quốc tế thuận lợi và tiết kiệm chi phí) — Freight forwarding phói\nhợp vận tải, chứng từ và các dịch vụ liên quan đề tối ưu hóa việc vận chuyển hàng hóa.", "slide_img": "images/q_491_slide_1794473994431.jpg", "note_img": "images/q_491_note_1794473994431.jpg"}, {"id": 492, "subject": "GLI202", "question": "The term “door-to-door service' in freight forwarding means:", "options": {"A": "Delivering goods from the factory of the seller to the buyer's warehouse.", "B": "Only providing sea transport between two ports.", "C": "Managing customs procedures only.", "D": "Delivering documents electronically."}, "answers": ["A"], "explanation": "Door-to-door service trong giao nhận vận tải có nghĩa là gì?\nA. Delivering goods from the factory of the seller to the buyer's warehouse (Giao hàng từ nhà máy của người bán đến kho của người mua) — Door-to-door là dịch vụ vận chuyền từ\nđịa điểm nhận hàng đến địa điểm giao hàng cuối cùng theo thỏa thuận.", "slide_img": "images/q_492_slide_1794473996482.jpg", "note_img": "images/q_492_note_1794473996482.jpg"}, {"id": 493, "subject": "GLI202", "question": "The “FIATA Bill of Lading\" is: AA transport document recognized under multimodal conventions.", "options": {"B": "Acustoms clearance form.", "C": "A marine insurance policy.", "D": "A goverment-issued export license."}, "answers": ["A"], "explanation": "FIATA Bill of Lading là gì?\nA. A transport document recognized under multimodal conventions (Chứng từ vận tải được công nhận trong hoạt động vận tải đa phương thức) — FIATA Bill of Lading (FBL) là\nchứng từ vận tải do người giao nhận phát hành, thường được sử dụng trong vận tải đa phương thức.", "slide_img": "images/q_493_slide_1794473998358.jpg", "note_img": "images/q_493_note_1794473998358.jpg"}, {"id": 494, "subject": "GLI202", "question": "Hazardous materials must be:", "options": {"A": "Properly classified, packed, labeled, and documented.", "B": "Shipped without labeling for security.", "C": "Declared only at the port of destination.", "D": "Transported only by sea"}, "answers": ["A"], "explanation": "Hàng hóa nguy hiểm phải được xử lý như thế nào?\nA. Properly classified, packed, labeled, and documented (Được phân loại, đóng gói, dán nhãn và lập chứng từ đúng quy định) — Việc tuân thủ các yêu cầu an toàn giúp giảm rủi ro\ntrong vận chuyển hàng nguy hiểm.", "slide_img": "images/q_494_slide_1794474000211.jpg", "note_img": "images/q_494_note_1794474000211.jpg"}, {"id": 495, "subject": "GLI202", "question": "The intent behind asking advanced questions to suppliers, such as what they need from the buyer, is to ensure the supplier is treated as what?", "options": {"A": "A transactional vendor for short-term gains", "B": "A temporary solution for capacity gaps", "C": "A partner for a win-win relationship", "D": "Acontrollable subsidiary unit"}, "answers": ["C"], "explanation": "Mục đích của việc đặt câu hỏi chuyên sâu cho nhà cung cấp, chẳng hạn họ cần gì từ người mua, là gì?\nC. A partner for a win-win relationship (Xem nhà cung cắp là đối tác trong mồi quan hệ đôi bên cùng có lợi) › Cách tiếp cận hợp tác giúp xây dựng quan hệ lâu dài và tạo lợi ích cho\ncả hai bên.", "slide_img": "images/q_495_slide_1794474002128.jpg", "note_img": "images/q_495_note_1794474002128.jpg"}, {"id": 496, "subject": "GLI202", "question": "International trade involves additional uncertainties compared to domestic trade. Which of the following is unique to international trade and can increase risk for the parties?", "options": {"A": "Dealing with different currencies and exchange rate fluctuations", "B": "The possibility of goods being damaged in transit", "C": "The need for a contract between buyer and seller", "D": "The chance that a buyer might not pay for goods"}, "answers": ["A"], "explanation": "Yếu tố nào đặc trưng cho thương mại quốc tế và có thể làm tăng rủi ro so với thương mại nội địa?\nA. Dealing with different currencies and exchange rate fluctuations (Giao dịch bằng nhiều đồng tiền và chịu biến động tỷ giá) › Exchange rate fluctuations có thể ảnh hưởng đén\ndoanh thu, chi phí và giá trị thanh toán quốc té.", "slide_img": "images/q_496_slide_1794474004194.jpg", "note_img": "images/q_496_note_1794474004194.jpg"}, {"id": 497, "subject": "GLI202", "question": "ee EE Ee ne If a buyer has knowledge about the supplier's materials (Supply of Supply Market), what specific benefit is gained regarding the Buyer's position?", "options": {"A": "Increase the supplier's capacity instantly", "B": "Increase confidence of Buyer in negotiation or in tasking with Supplier", "C": "Guarantee the elimination of all supply obstacles", "D": "Reduce the supplier's price below market rate"}, "answers": ["B"], "explanation": "Nếu người mua (Buyer) có kiến thức về nguyên vật liệu và thị trường cung ứng của nhà cung cấp (Supply Market), người mua sẽ nhận được lợi ích cụ thể nào về vị thế của mình?\n\nB. Increase confidence of Buyer in negotiation or in tasking with Supplier\n\n— Tăng sự tự tin của người mua trong quá trình đàm phán hoặc khi giao nhiệm vụ cho nhà cung cấp.\n\nKhi người muaIhi<-²zu rõ nguyên vật liệu, mtgồn cung và fflètị kiện thị trường cặủa nhà cung pr, họ có thể đánh giá tốt hơn ỵề giá ệ, chất lượng và khả năng cung ứng. Kiến thức này giúp", "slide_img": "images/q_497_slide_1794474006633.jpg", "note_img": "images/q_497_note_1794474006633.jpg"}, {"id": 498, "subject": "GLI202", "question": "Which statement best differentiates schedule risks from cost risks?", "options": {"A": "Schedule risks relate to unrealistic milestones, while cost risks stem from incorrect estimates and inflation", "B": "Schedule risks are always external, while cost risks are always internal", "C": "Schedule risks focus on supplier contracts, while cost risks are about subcontractor quality", "D": "Schedule risks impact contract termination, while cost risks concern dispute resolution only"}, "answers": ["A"], "explanation": "Phát biểu nào phân biệt chính xác nhất giữa rủi ro tiền độ (Schedule risks) và rủi ro chi phí (Cost risks)?\nA. Schedule risks relate to unrealistic milestones, while cost risks stem from incorrect estimates and inflation (Rủi ro tiền độ liên quan đến các móc thời gian thiếu thực tế, còn\nrủi ro chi phí xuất phát từ dự toán sai và lạm phát) ¬ Schedule risks ảnh hưởng đến thời gian hoàn thành; Cost risks ảnh hưởng đến ngân sách và tổng chỉ phí thực hiện.", "slide_img": "images/q_498_slide_1794474009488.jpg", "note_img": "images/q_498_note_1794474009488.jpg"}, {"id": 499, "subject": "GLI202", "question": "Which statement best differentiates schedule risks from cost risks?", "options": {"A": "Schedule risks relate to unrealistic milestones, while cost risks stem from incorrect estimates and inflation", "B": "Schedule risks are always external, while cost risks are always internal", "C": "Schedule risks focus on supplier contracts, while cost risks are about subcontractor quality", "D": "Schedule risks impact contract termination, while cost risks concern dispute resolution only"}, "answers": ["A"], "explanation": "Phát biểu nào phân biệt chính xác nhất giữa rủi ro tiền độ và rủi ro chi phí?\nA. Schedule risks relate to unrealistic milestones, while cost risks stem from incorrect estimates and inflation (Rủi ro tiền độ liên quan đến các móc thời gian thiếu thực tế, còn\nrủi ro chi phí xuất phát từ dự toán sai và lạm phát) — Schedule risks ảnh hưởng đến thời gian hoàn thành; Cost risks ảnh hưởng đến ngân sách thực hiện.", "slide_img": "images/q_499_slide_1794474011507.jpg", "note_img": "images/q_499_note_1794474011507.jpg"}, {"id": 500, "subject": "GLI202", "question": "When recording progress against schedule, besides the proposed and actual dates, what specific negative event detail must be included?", "options": {"A": "The total insurance premium paid", "B": "Delay period and cause", "C": "The name of the contract's legal advisor", "D": "The original negotiation minutes"}, "answers": ["B"], "explanation": "Khi ghi nhận tiền độ thực hiện, ngoài ngày dự kiến và ngày thực tế, cần ghi thêm thông tin nào về sự kiện bất lợi?\nB. Delay period and cause (Thời gian chậm trễ và nguyên nhân) — Thông tin này giúp đánh giá tác động của việc chậm tiền độ và xác định trách nhiệm.", "slide_img": "images/q_500_slide_1794474013289.jpg", "note_img": "images/q_500_note_1794474013289.jpg"}, {"id": 501, "subject": "GLI202", "question": "How does a freight forwarder's role differ from that of a carrier? AA freight forwarder owns the transport vessels and physically carries the goods like a carrier.", "options": {"B": "A freight forwarder arranges transportation and logistics on behalf of shippers, whereas a carrier actually transports the goods.", "C": "A forwarder only handles domestic shipments while a carrier handles international shipments.", "D": "There is no difference - \"freight forwarder” and \"carrier\" mean the same thing."}, "answers": ["B"], "explanation": "Vai trò của Freight Forwarder khác Carrier như thế nào?\n\nB. A freight forwarder arranges transportation and Iogistics on behalf of shippers, whereas a carrier actually transports the goods (Người giao nhận tô chức vận chuyên thay\nmặt chủ hàng, còn người vận tải trực tiếp vận chuyên hàng hóa) — Freight forwarder thường tồ chức và điều phói dịch vụ, trong khi Carrier thực hiện hoặc chịu trách nhiệm vận chuyển\ntheo hợp đồng vận tải.", "slide_img": "images/q_501_slide_1794474015463.jpg", "note_img": "images/q_501_note_1794474015463.jpg"}, {"id": 502, "subject": "GLI202", "question": "ee What primary benefit does a freight forwarder provide to companies involved in international trade?", "options": {"A": "Coordinating the complex logistics of moving goods globally. so sellers and buyers can focus on their core business", "B": "Purchasing the goods from the seller and then reselling them at a profit", "C": "Eliminating the need for insurance or export documentation in a transaction", "D": "Acting as a government body to enforce trade laws for the shipper"}, "answers": ["A"], "explanation": "Kỹ năng hoặc lĩnh vực chuyên môn nào sau đây KHÔNG thường được yêu cầu đối với\n\nFreight Forwarder?\n\nA. Coordinating the complex logistics of moving goods globally, so sellers and buyers can focus on their core business (Điều phói các hoạt động logistics phức tạp trong vận\nchuyên hàng hóa toàn câu, giúp người mua và người bán tập trung vào hoạt động kinh doanh côt lõi) ¬ Lợi ích chính mà Freight Forwarder mang lại cho các doanh nghiệp tham gia\nthương mại quốc tề là gì?", "slide_img": "images/q_502_slide_1794474017544.jpg", "note_img": "images/q_502_note_1794474017544.jpg"}, {"id": 503, "subject": "GLI202", "question": "ee What is the difference between a broker and a commission agent in international trade?", "options": {"A": "A broker enters contracts in their own name. whereas a commission agent only introduces the buyer and seller.", "B": "A broker negotiates deals between buyers and sellers, while a commission agent enters into contracts with third parties in their own name (even though they act for a principal).", "C": "There is no real difference - \"broker\" and “commission agent” are two terms for the same role.", "D": "A commission agent typically takes possession of goods, whereas a broker never handles goods directly."}, "answers": ["B"], "explanation": "Sự khác biệt giữa Broker và Commission Agent trong thương mại quốc tề là gì?\n\nB. A broker negotiates deals between buyers and sellers, while a commission agent enters into contracts with third parties in their own name (even though they act for a\nprincipal). (Broker làm trung gian đàm phán giao dịch giữa người mua và người bán, trong khi Commission Agent ký hợp đông với bên thứ ba dưới tên của chính mình mặc dù\nhành động vì lợi ích của bên ủy thác). ¬ Broker (Người môi giới) chủ yếu kết nồi và hỗ trợ đàm phán giữa các bên. Commission Agent (Đại lý hoa hồng) có thể ký hợp đồng dưới tên\nmình nhưng thực hiện giao dịch vì lợi ích của bên ủy thác.", "slide_img": "images/q_503_slide_1794474019947.jpg", "note_img": "images/q_503_note_1794474019947.jpg"}, {"id": 504, "subject": "GLI202", "question": "Which of the following best describes the role of a loading broker in the freight business? AA loading broker provides financing for cargo loading operations through banks.", "options": {"B": "A loading broker acts as a carrier by using its own vessels to transport goods.", "C": "A loading broker arranges and oversees the physical loading of goods (for example, onto a ship) on behalf of the exporter or shipping line. DA loading broker negotiates freight rates exclusively with shippers for a commission."}, "answers": ["C"], "explanation": "Vai trò của Loading Broker trong hoạt động giao nhận vận tải là gì?\nC. A loading broker arranges and oversees the physical loading of goods on behalf of the exporter or shipping line (Sắp xếp và giám sát việc xếp hàng lên phương tiện vận tải\nthay mặt nhà xuất khâu hoặc hãng tàu) — Theo cách mô tả của đề, Loading Broker hỗ trợ tổ chức hoạt động xếp hàng. Phạm vi công việc thực tế có thể khác nhau tùy thị trường.", "slide_img": "images/q_504_slide_1794474022075.jpg", "note_img": "images/q_504_note_1794474022075.jpg"}, {"id": 505, "subject": "GLI202", "question": "Why is it important for a freight forwarder to understand international payment methods such as letters of credit?", "options": {"A": "Because freight forwarders themselves issue letters of credit to buyers.", "B": "Because forwarders are responsible for setting currency exchange rates for their clients.", "C": "So that forwarders can directly pay the exporter on behalf of the importer.", "D": "Because the forwarder must coordinate shipping documents and timing to meet the requirements of the buyer's payment terms (e.g. a letter of credit)."}, "answers": ["D"], "explanation": "Tại sao Freight Forwarder cần hiều các phương thức thanh toán quốc tế như Letter of Credit?\nD. Because the forwarder must coordinate shipping documents and timing to meet the requirements of the buyer's payment terms (Vì người giao nhận phải phối hợp chứng từ\nvà thời gian vận chuyên đề đáp ứng điều kiện thanh toán) — Với L/C, chứng từ vận tải và thời hạn xuất trình cần phù hợp với điều kiện thư tín dụng để tránh sai biệt.", "slide_img": "images/q_505_slide_1794474024190.jpg", "note_img": "images/q_505_note_1794474024190.jpg"}, {"id": 506, "subject": "GLI202", "question": "What does \"This Side Up\" or an arrow symbol on a package indicate, and why must it be heeded?", "options": {"A": "It shows the upright orientation of the package to keep it in the correct position (for goods that might leak, spill or get damaged if flipped). Ignoring it could result in damage or spillage.", "B": "It is just a suggestion for stacking efficiency and can be ignored if space is tight.", "C": "It's for customs information only.", "D": "It is meant for warehouse storage but not relevant during transport."}, "answers": ["A"], "explanation": "Ký hiệu This Side Ủp hoặc mũi tên hướng lên trên bao bì có ý nghĩa gì?\nA. lt shows the upright orientation of the package to keep it in the correct position (Chỉ hướng đặt thẳng đứng của kiện hàng đề đảm bảo hàng luôn ở đúng vị trí) ¬ Nếu đặt\nngược, hàng có thể bị đồ, rò rỉ hoặc hư hỏng.", "slide_img": "images/q_506_slide_1794474026087.jpg", "note_img": "images/q_506_note_1794474026087.jpg"}, {"id": 507, "subject": "GLI202", "question": "One of the risks of not having a cross-functional team is:", "options": {"A": "Increased likelihood of contract disputes", "B": "Faster approval of contracts", "C": "Improved supplier collaboration", "D": "Reduced need for documentation"}, "answers": ["A"], "explanation": "Một rủi ro khi không có nhóm quản lý hợp đồng liên chức năng là gì?\nA. Increased Iikelinood of contract disputes (Gia tăng khả năng phát sinh tranh chấp hợp đồng) — Thiếu sự phối hợp giữa các bộ phận có thể dẫn đến trách nhiệm không rõ ràng và\nnhững bất đồng trong thực hiện hợp đồng.", "slide_img": "images/q_507_slide_1794474027981.jpg", "note_img": "images/q_507_note_1794474027981.jpg"}, {"id": 508, "subject": "GLI202", "question": "", "options": {"A": "By guaranteeing that nothing will go wrong during transit.", "B": "By reimbursing the full cargo value out of pocket for any incident.", "C": "By refusing to handle any high-risk or high-value cargo.", "D": "By arranging appropriate cargo insurance coverage for the goods on behalf of the client."}, "answers": ["D"], "explanation": "Freight Forwarder có thề giúp bảo vệ hàng hóa của khách hàng trước mắt mát hoặc hư hỏng bằng cách nào?\nD. By arranging appropriate cargo insurance coverage for the goods on behalf of the client (Sắp xếp bảo hiểm hàng hóa phù hợp thay mặt khách hàng) — Cargo insurance giúp\nbồi thường những tồn thất thuộc phạm vi bảo hiểm trong quá trình vận chuyền.", "slide_img": "images/q_508_slide_1794474029979.jpg", "note_img": "images/q_508_note_1794474029979.jpg"}, {"id": 509, "subject": "GLI202", "question": "Why are Incoterms important in an international sales contract?", "options": {"A": "They provide a clear definition of each party's obligations for transport, customs clearance, and risk, reducing misunderstandings across different countries.", "B": "They determine the price of the goods being sold.", "C": "They dictate the quality standards of the products.", "D": "They serve as a substitute for the sales contract itself."}, "answers": ["A"], "explanation": "Tại sao Incoterms quan trọng trong hợp đồng mua bán quốc tê?\nA. They provide a clear definition of each party's obligations for transport, customs clearance, and risk (Xác định rõ nghĩa vụ vận chuyền, thông quan và rủi ro của mỗi bên) ¬\nIncoterms giúp giảm hiểu nhằm khi người mua và người bán hoạt động ở các quốc gia khác nhau.", "slide_img": "images/q_509_slide_1794474031865.jpg", "note_img": "images/q_509_note_1794474031865.jpg"}, {"id": 510, "subject": "GLI202", "question": "What is the purpose of specifying a named place or port alongside the Incoterm (e.g., \"CIP New York” or \"FOB Hamburg\")?", "options": {"A": "It identifies the exact point where the responsibilities transfer and which location the term applies to (such as the destination city or port).", "B": "It is required for customs to determine the cargo's origin.", "C": "It locks the exchange rate at the named location.", "D": "It is only for the marketing convenience and has no contractual significance."}, "answers": ["A"], "explanation": "Mục đích của việc ghi rõ địa điểm hoặc cảng bên cạnh Incoterm, ví dụ CIP New York hoặc FOB Hamburg, là gì?\nA. lt identifies the exact point where the responsibilities transfer and which location the term applies to (Xác định địa điểm áp dụng điều kiện và các nghĩa vụ liên quan) ¬\nNamed place/port giúp làm rõ nơi giao hàng hoặc nơi đến. Lưu ý: với một số điều kiện nhóm C như CIP, địa điểm đích được nêu không nhất thiết là nơi chuyển giao rủi ro.", "slide_img": "images/q_510_slide_1794474033815.jpg", "note_img": "images/q_510_note_1794474033815.jpg"}, {"id": 511, "subject": "GLI202", "question": "Which of the following statements about Incoterms and risk is correct?", "options": {"A": "In any Incoterm, risk of loss or damage to the goods passes from seller to buyer at a clearly defined point - for example, on board the vessel for FOB.", "B": "The risk always stays with the seller until he goods reach the buyer's warehouse.", "C": "Risk transfer is not addressed by Incoterms at all.", "D": "Under every Incoterm, the risk passes only after the buyer has paid in full."}, "answers": ["A"], "explanation": "Phát biểu nào về Incoterms và chuyền giao rủi ro là đúng?\nA. In any Incoterm, risk of loss or damage to the goods passes from seller to buyer at a clearly defined point (Trong mỗi điều kiện Incoterms, rủi ro mắt mát hoặc hư hỏng hàng\nhóa được chuyên giao tại một thời điêm xác định) — Ví dụ, với FOB, rủi ro chuyền khi hàng đã được xếp lên tàu tại cảng đi.", "slide_img": "images/q_511_slide_1794474035745.jpg", "note_img": "images/q_511_note_1794474035745.jpg"}, {"id": 512, "subject": "GLI202", "question": "What is the mission of the World Trade Organization (WTO)?", "options": {"A": "To establish and enforce the global rules of trade between nations and serve as a forum for trade negotiations and dispute settlement", "B": "To control all shipping lines and freight forwarders globally", "C": "To set technical standards for transportation equipment", "D": "To manage exchange rates between countries"}, "answers": ["A"], "explanation": "Sứ mệnh của World Trade Organization (WTO) là gì?\n\nA. To establish and enforce the global rules of trade between nations and serve as a forum for trade negotiations and dispute settlement (Thiết lập và thực thi các quy tắc\nthương mại toàn cầu, đồng thời là diễn đàn đàm phán và giải quyết tranh chấp thương mại) › WTO quản lý hệ thống quy tắc thương mại đa phương và hỗ trợ giải quyết tranh chấp\ngiữa các thành viên.", "slide_img": "images/q_512_slide_1794474037762.jpg", "note_img": "images/q_512_note_1794474037762.jpg"}, {"id": 513, "subject": "GLI202", "question": "Which statement is true about the structure of ISO? ASO is a network of national standards bodies from many countries, bridging public and private sectors to reach consensus on international standards.", "options": {"B": "ISO is an agency of the United Nations that strictly consists of government delegates.", "C": "ISO issues regulations that are legally binding in all countries.", "D": "ISO only focuses on environmental standards."}, "answers": ["A"], "explanation": "Phát biều nào đúng về cơ cấu tổ chức của ISO?\n\nA. ISO is a network of national standards bodies from many countries, bridging public and private sectors to reach consensus on international standards (ISO là mạng lưới các tổ chức tiêu\nchuẩn quốc gia, kết nồi khu vực công và tư để đạt đồng thuận về tiêu chuẩn quốc tế) — ISO không phải cơ quan thuộc Liên Hợp Quốc và các tiêu chuần ISO không tự động có hiệu lực pháp\nluật bắt buộc tại mọi quốc gia.", "slide_img": "images/q_513_slide_1794474039827.jpg", "note_img": "images/q_513_note_1794474039827.jpg"}, {"id": 514, "subject": "GLI202", "question": "What does the World Trade Organization (WTO) do when member countries have trade disputes (for example, if one country accuses another of unfair tariffs)?", "options": {"A": "The WTO provides a formal dispute resalution process where an independent panel can rule on the issue and authorize penalties if necessary.", "B": "The WTO lends money to the country that suffered losses.", "C": "The WTO sends peacekeepers to enforce trade agreements.", "D": "The WTO does not involve itself in disputes between countries."}, "answers": ["A"], "explanation": "WTO làm gì khi các quốc gia thành viên phát sinh tranh chấp thương mại?\n\nA. The WTO provides a formal dispute resolution process where an independent panel can rule on the issue and authorize penalties i necessary (WTO cung cấp cơ chế giải\nquyết tranh chấp chính thức với hội đồng xem xét vụ việc và các biện pháp xử lý khi cần thiết) › WTO có cơ chế giải quyết tranh chấp giữa các thành viên. Tuy nhiên, việc đình chỉ\nnhượng bộ thương mại phải theo thủ tục cho phép; hội đồng xét xử không trực tiếp tự áp đặt hình phạt.", "slide_img": "images/q_514_slide_1794474041966.jpg", "note_img": "images/q_514_note_1794474041966.jpg"}, {"id": 515, "subject": "GLI202", "question": "Which organization would most likely assist a country in improving its port and transportation infrastructure through loans or grants?", "options": {"A": "The World Bank (through its focus on development and infrastructure projects)", "B": "The World Customs Organization", "C": "The International Chamber of Commerce", "D": "The International Maritime Organization"}, "answers": ["A"], "explanation": "Tổ chức nào có khả năng hỗ trợ một quốc gia cải thiện cơ sở hạ tằng cảng biển và giao thông thông qua các khoản vay hoặc viện trợ?\nA. The World Bank (Ngân hàng Thế giới) › World Bank hỗ trợ tài chính cho các dự án phát triển cơ sở hạ tằng, bao gồm cảng biển, đường bộ và hệ thóng vận tải.", "slide_img": "images/q_515_slide_1794474043773.jpg", "note_img": "images/q_515_note_1794474043773.jpg"}, {"id": 516, "subject": "GLI202", "question": "What is a primary function of the International Maritime Organization (IMO) relevant to international forwarding?", "options": {"A": "The IMO sets safety. security, and environmental standards for international shipping (such as regulations for vessels and handling of hazardous goods at sea).", "B": "The IMO negotiates freight rates for shipping lines.", "C": "The IMO manages seaport customs procedures worldwide.", "D": "The IMO operates a global fleet of ships available to freight forwarders."}, "answers": ["A"], "explanation": "Chức năng chính của International Maritime Organization (IMO) liên quan đến giao nhận vận tải quốc tề là gì?\nA. The IMO sets safety, security, and environmental standards for international shipping (IMO xây dựng các tiêu chuân an toàn, an ninh và bảo vệ môi trường trong vận tải biên\nquốc tế) — IMO xây dựng các công ước và quy định liên quan đến an toàn hàng hải, bảo vệ môi trường và vận chuyển hàng nguy hiểm bằng đường biền.", "slide_img": "images/q_516_slide_1794474045765.jpg", "note_img": "images/q_516_note_1794474045765.jpg"}, {"id": 517, "subject": "GLI202", "question": "What is an NVOCC (Non-Vessel Operating Common Carrier) in the forwarding industry?", "options": {"A": "A type of freight forwarder that acts as a carrier by issuing its own bill of lading even though it doesn't operate the ships - essentially, it buys space from actual carriers and resells it, assuming carrier responsibility toward shippers.", "B": "A carrier that operates vessels without any crew on board.", "C": "Aconsortium of vessel owners who do not carry cargo.", "D": "A government agency regulating ocean freight."}, "answers": ["A"], "explanation": "NVOCO (Non-Vessel Operating Common Carrier) là gì?\n\nA. A type of freight forwarder that acts as a carrier by issuing its own bill of lading even though it doesn't operate the ships (Một đơn vị kinh doanh vận tải biên không khai thác\ntàu nhưng phát hành vận đơn của chính mình và chịu trách nhiệm như người vận tải) @= NVOCC thường mua chỗ từ hãng tàu, bán lại dịch vụ vận tải và phát hành House Bill of\nLading cho khách hàng.", "slide_img": "images/q_517_slide_1794474047788.jpg", "note_img": "images/q_517_note_1794474047788.jpg"}, {"id": 518, "subject": "GLI202", "question": "What is the main purpose of implementing a Quality Management System (QMS). such as ISO 9001:2015, in a freight forwarding company?", "options": {"A": "To ensure the company's processes are standardized and continuously improved in order to consistently meet customer requirements and deliver reliable service", "B": "To guarantee the lowest price for all shipments", "C": "To comply with government financial reporting requirements", "D": "To eliminate the need for employee training by using checklists"}, "answers": ["A"], "explanation": "Mục đích chính của việc triển khai hệ thống quản lý chất lượng (QMS), chẳng hạn ISO 9001:2015, trong công ty Freight Forwarding là gì?\n\nA. To ensure the company's processes are standardized and continuously improved in order to consistently meet customer requirements and deliver reliable service (Đảm bảo\ncác quy trình của công ty được tiêu chuân hóa và cải tiền liên tục đề đáp ứng yêu cầu khách hàng và cung cấp dịch vụ đáng tin cậy) › QMS giúp giảm sai sót và nâng cao chất\nlượng dịch vụ.", "slide_img": "images/q_518_slide_1794474050062.jpg", "note_img": "images/q_518_note_1794474050062.jpg"}, {"id": 519, "subject": "GLI202", "question": "What aspect of performance is ISO 14001:2015 designed to help a freight forwarder manage?", "options": {"A": "The company’s environmental impact - ISO 14001 sets out criteria for an Environmental Management System to reduce pollution, waste, and improve environmental compliance", "B": "The company’s financial accounting practices", "C": "The security of cargo in transit", "D": "The design and manufacturing of freight containers"}, "answers": ["A"], "explanation": "ISO 14001:2015 giúp Freight Forwarder quản lý khía cạnh hiệu quả hoạt động nào?\n\nA. The company's environmenftal impact - ISO 14001 sets out criteria for an Environmental Management System to reduce pollution, waste, and improve environmental\ncompliance (Tác động môi trường của doanh nghiệp - ISO 14001 quy định tiêu chí cho hệ thống quản lý môi trường nhằm giảm ô nhiễm, chất thải và cải thiện việc tuân thủ quy\nđịnh môi trường) — ISO 14001 tập trung vào quản lý môi trường.", "slide_img": "images/q_519_slide_1794474052159.jpg", "note_img": "images/q_519_note_1794474052159.jpg"}, {"id": 520, "subject": "GLI202", "question": "ee Which of the following is an example of a fixed cost for a freight forwarding business?", "options": {"A": "Office rent and salaries of full-time staff - costs that remain constant regardless of the number of shipments", "B": "Fuel surcharges paid to trucking companies - which vary with each shipment", "C": "Toll fees for a specific delivery - which depend on the route taken", "D": "Packaging materials for cargo - which depend on how many shipments are handled"}, "answers": ["A"], "explanation": "Đâu là ví dụ về chi phí có định (Fixed Cost) của một công ty Freight Forwarding?\nA. Office rent and salaries of full-time staff (Tiền thuê văn phòng và lương nhân viên toàn thời gian) — Đây là các khoản chỉ phí tương đối ồn định, không thay đổi trực tiếp theo só\nlượng lô hàng.", "slide_img": "images/q_520_slide_1794474054108.jpg", "note_img": "images/q_520_note_1794474054108.jpg"}, {"id": 521, "subject": "GLI202", "question": "Which cost would be considered variable for a forwarder?", "options": {"A": "Trucking and ocean freight charges paid per shipment, which increase as more shipments are handled", "B": "Monthly warehouse lease fee that doesn't change with volume", "C": "Annual software license fee for logistics management system", "D": "Property insurance for the office building"}, "answers": ["A"], "explanation": "Chi phí nào được xem là chỉ phí biến đổi (Variable Cost) của Freight Forwarder?\nA. Trucking and ocean freight charges paid per shipment (Chi phí vận tải đường bộ và đường biên được thanh toán theo từng lô hàng) — Số lượng lô hàng tăng thường khiến tổng\nchi phí vận chuyền tăng.", "slide_img": "images/q_521_slide_1794474056083.jpg", "note_img": "images/q_521_note_1794474056083.jpg"}, {"id": 522, "subject": "GLI202", "question": "Why is accurate cost accounting important when a forwarder is quoting freight rates to customers?", "options": {"A": "To ensure that all expenses (fixed and variable) are covered and to set profitable rates while remaining competitive", "B": "To satisfy customs audit requirements", "C": "Because customers demand to see the breakdown of costs", "D": "Itisn't important: forwarders set prices arbitrarily"}, "answers": ["A"], "explanation": "Tại sao kế toán chi phí chính xác lại quan trọng khi Freight Forwarder báo giá vận chuyền cho khách hàng?\nA. To ensure that all expenses (fixed and variable) are covered and to set profitable rates while remaining compeftitive (Đảm bảo bù đắp mọi chi phí có định và biến đôi, đồng thời\nđưa ra mức giá có lợi nhuận và cạnh tranh) = Tính đúng chi phí giúp tránh báo giá quá thấp gây thua lỗ.", "slide_img": "images/q_522_slide_1794474058019.jpg", "note_img": "images/q_522_note_1794474058019.jpg"}, {"id": 523, "subject": "GLI202", "question": "What key feature makes the FIATA FBL \"negotiable\"?", "options": {"A": "It can be endorsed and transferred to a third party, effectively allowing transfer of ownership of the cargo (similar to a traditional ocean Bill of Lading).", "B": "It negotiates freight rates between carriers.", "C": "It can be used as a bank note for financing.", "D": "It automatically guarantees payment to the shipper."}, "answers": ["A"], "explanation": "Đặc điểm nào khiến FIATA FBL được gọi là Negotiable?\nA. lt can be endorsed and transferred to a third party, effectively allowing transfer of ownership of the cargo (Có thê được ký hậu và chuyên giao cho bên thứ ba, qua đó hỗ trợ\nchuyền giao quyền định đoạt hàng hóa) — Đây là đặc điểm quan trọng của vận đơn có thể chuyển nhượng.", "slide_img": "images/q_523_slide_1794474059934.jpg", "note_img": "images/q_523_note_1794474059934.jpg"}, {"id": 524, "subject": "GLI202", "question": "Which statement is true about the FIATA FCR?", "options": {"A": "It is not a document of title: it simply acknowledges receipt of cargo by the forwarder and is non-negotiable.", "B": "It transfers ownership of goods to the forwarder.", "C": "It can be endorsed to different consignees like an FBL.", "D": "It doubles as an insurance certificate."}, "answers": ["A"], "explanation": "Phát biểu nào đúng về FIATA FCR?\nA. ltis not a document of title; it simply acknowledges receipt of cargo by the forwarder and is non-negotiable (Không phải chứng từ sở hữu hàng hóa; chỉ xác nhận Freight\nForwarder đã nhận hàng và không thể chuyền nhượng) — FCR không có chức năng chuyển nhượng như FBL.", "slide_img": "images/q_524_slide_1794474061760.jpg", "note_img": "images/q_524_note_1794474061760.jpg"}, {"id": 525, "subject": "GLI202", "question": "What is a key difference between the FCR and FCT documents?", "options": {"A": "negotiable document that could be used similarly to a bill of lading for securing payment (cash against document).", "B": "The FCR transfers title, the FCT does not.", "C": "The FCR is used for air freight and the FCT for sea freight.", "D": "The FCR is issued by customs, the FCT by banks."}, "answers": ["A"], "explanation": "Điểm khác biệt chính giữa FCR và FCT là gì?\n\nA. The FCR is only a receipt (non-negotiable), while the FCT was a negotiable document that could be used similarly to a bill of lading for securing payment (FCR chỉ là biên\nnhận không thê chuyên nhượng, còn FCT từng là chứng từ có thê chuyên nhượng, được sử dụng tương tự vận đơn đề hỗ trợ thanh toán) — Khác biệt chủ yếu nằm ở chức năng\nchứng từ.", "slide_img": "images/q_525_slide_1794474063770.jpg", "note_img": "images/q_525_note_1794474063770.jpg"}, {"id": 526, "subject": "GLI202", "question": "What is the FIATA FWR (Warehouse Receipt) used for?", "options": {"A": "Itis issued by a forwarder when goods are placed into a warehouse under the forwarder's custody, detailing the goods stored. It can serve as proof for the owner that the goods are stared and can be transferable if marked negotiable.", "B": "It is a receipt for payment of freight charges.", "C": "It is a customs duty receipt.", "D": "It is the same as a Bill of Lading."}, "answers": ["A"], "explanation": "FIATA FWR (Warehouse Receipt) được sử dụng đề làm gì?\nA. lt is issued by a forwarder when goods are placed into a warehouse under the forwarder's custody, detailing the goods stored (Được Freight Forwarder phát hành khi hàng\nhóa được đưa vào kho thuộc quyền quản lý của họ, ghi rõ thông tin hàng hóa lưu kho) › FWR là chứng từ xác nhận hàng đang được lưu kho.", "slide_img": "images/q_526_slide_1794474065728.jpg", "note_img": "images/q_526_note_1794474065728.jpg"}, {"id": 527, "subject": "GLI202", "question": "Who is authorized to sign the FIATA Dangerous Goods Declaration (SDT)?", "options": {"A": "Only the shipper (the party offering the dangerous goods for transport) can sign the dangerous goods declaration - the forwarder cannot sign it on the shipper's behalf.", "B": "The freight forwarder, on behalf of the shipper.", "C": "Any truck driver carrying the goods.", "D": "The insurance company of the shipper."}, "answers": ["A"], "explanation": "Ai có thẩm quyền ký FIATA Dangerous Goods Declaration (SDT)?\n\nA. Only the shipper (the party offering the dangerous goods for transport) can sign the dangerous goods declaration (Người gửi hàng, tức bên đưa hàng nguy hiểm vào vận\nchuyền, chịu trách nhiệm Ký tờ khai hàng nguy hiểm) — Theo cách phân định trách nhiệm của đề, người gửi hàng là bên chịu trách nhiệm khai báo. Trong thực tế, việc ký qua đại diện\nđược ủy quyền còn phụ thuộc quy định vận tải áp dụng.", "slide_img": "images/q_527_slide_1794474067670.jpg", "note_img": "images/q_527_note_1794474067670.jpg"}, {"id": 528, "subject": "GLI202", "question": "What is the FIATA SIC (Shipper's Intermodal Weight Certificate) used for, particularly in the US context?", "options": {"A": "To certify the weight of an intermodal container's contents as required by the Intermodal Safe Container Act (mainly in the USA), ensuring compliance with weight regulations for intermodal transport", "B": "To declare the value of goods for insurance purposes", "C": "To certify cargo weight for air freight only", "D": "To serve as a certificate of origin"}, "answers": ["A"], "explanation": "FIATA SIC (Shipper's Intermodal Weight Certificate) dùng đề làm gì?\nA. To certify the weight of an intermodal container's contents as required by the Intermodal Safe Container Act (Chứng nhận trọng lượng hàng hóa trong container vận tải đa\nphương thức theo yêu cầu của Đạo luật An toàn Container Liên vận) — Hỗ trợ tuân thủ quy định trọng lượng, đặc biệt trong bồi cảnh Hoa Kỳ.", "slide_img": "images/q_528_slide_1794474069739.jpg", "note_img": "images/q_528_note_1794474069739.jpg"}, {"id": 529, "subject": "GLI202", "question": "Why is it important for freight forwarders to understand time zones when coordinating international shipments?", "options": {"A": "Because time zone differences affect communication and cut-off times for flights/ships - knowing the time in various regions helps in scheduling pickups, tracking shipments, and arranging meetings across couniries.", "B": "Because forwarders calculate freight rates based on time zones.", "C": "Because insurance is void if goods cross too many time Zones.", "D": "Itis not important; modern systems convert times automatically."}, "answers": ["A"], "explanation": "Tại sao Freight Forwarder cần hiều sự chênh lệch múi giờ khi điều phối lô hàng quốc té?\nA. Because time zone differences affect communication and cut-off times for flights/ships (Vì chênh lệch múi giờ ảnh hưởng đến liên lạc và thời hạn tiếp nhận hàng, chứng từ\ncủa chuyến bay hoặc tàu biên) — Hiều múi giờ giúp sắp xếp lịch trình và tránh lỡ hạn.", "slide_img": "images/q_529_slide_1794474071727.jpg", "note_img": "images/q_529_note_1794474071727.jpg"}, {"id": 530, "subject": "GLI202", "question": "What is one of the major world sea trade routes that carries a significant portion of global cargo volume?", "options": {"A": "The Asia-Europe route via the Suez Canal (connecting East Asia with Europe)", "B": "The Trans-Antarctic route", "C": "The Arctic Ocean circle route (used year-round by all carriers)", "D": "A direct South America-Africa route that surpasses all others in volume"}, "answers": ["A"], "explanation": "Đâu là một trong những tuyến vận tải biển lớn của thế giới, vận chuyền khói lượng hàng hóa đáng kề?\nA. The Asia-Europe route via the Suez Canal (Tuyến châu Á - châu Âu qua kênh đào Suez) — Đây là tuyến hàng hải quan trọng kết nói Đông Á và châu Âu.", "slide_img": "images/q_530_slide_1794474073570.jpg", "note_img": "images/q_530_note_1794474073570.jpg"}, {"id": 531, "subject": "GLI202", "question": "Which of the following is a primary air cargo route or corridor in global trade?", "options": {"A": "Trans-Pacific route (e.g., China and Southeast Asia to North America) involving major air cargo hubs", "B": "Across Antarctica between research stations", "C": "Intra-village routes within a small country only", "D": "None - air freight doesn't have established routes"}, "answers": ["A"], "explanation": "Đâu là một hành lang vận tải hàng hóa hàng không quan trọng trong thương mại toàn cầu?\nA. Trans-Pacific route (e.g., China and Southeast Asia to North America) involving major air cargo hubs (Tuyến xuyên Thái Bình Dương, ví dụ từ Trung Quốc và Đông Nam Á đến\nBắc Mỹ, kết nói các trung tâm hàng không vận chuyên hàng hóa lớn) — Đây là tuyến vận chuyền hàng không quốc tế quan trọng.", "slide_img": "images/q_531_slide_1794474075655.jpg", "note_img": "images/q_531_note_1794474075655.jpg"}, {"id": 532, "subject": "GLI202", "question": "What do we refer to with \"Main transport corridors Europe-Asia” in logistics?", "options": {"A": "Overland routes (rail and road) that connect Europe and Asia, such as the Trans-Siberian Railway or the New Silk Road corridors, used as alternatives to sea and air transport", "B": "Only the ocean shipping lane around the Cape of Good Hope", "C": "Air routes that circle the globe via the poles", "D": "Local delivery routes within European and Asian cities"}, "answers": ["A"], "explanation": "Trong logistics, Main Transport Corridors Europe-Asia có nghĩa là gì?\nA. Overland routes (rail and road) that connect Europe and Asia, such as the Trans-Siberian Railway or the New Silk Road corridors (Các tuyến vận tải đường bộ và đường sắt\nkết nối châu Âu với châu Á, như đường sắt xuyên Siberia hoặc hành lang Con đường Tơ lụa mới) — Đây là những lựa chọn thay thế vận tải biển và hàng không.", "slide_img": "images/q_532_slide_1794474077689.jpg", "note_img": "images/q_532_note_1794474077689.jpg"}, {"id": 533, "subject": "GLI202", "question": "What is the Sea-Air transport technique? AA term for coastal shipping routes with short flights overland", "options": {"B": "Shipping goods in hovercraft that travel an both sea and air", "C": "Air freight one way and sea freight on the return trip", "D": "A multimodal shipping method where part of the journey is by sea and the next part by air (often from a major transshipment hub), to combine the cost advantage of sea freight with the speed of air freight"}, "answers": ["D"], "explanation": "Sea-Air Transport là phương thức vận tải gì?\nD. A multimodal shipping method where part of the journey is by sea and the next part by air (Phương thức vận tải đa phương thức kết hợp một chặng đường biên và một\nchặng đường hàng không) — Kết hợp ưu thế chi phí của vận tải biển và tốc độ của vận tải hàng không.", "slide_img": "images/q_533_slide_1794474079606.jpg", "note_img": "images/q_533_note_1794474079606.jpg"}, {"id": 534, "subject": "GLI202", "question": "Why might a forwarder recommend a sea-air routing (for example, Asia to Europe via Dubai with a sea leg then an air leg) instead of an all-sea or all-air shipment?", "options": {"A": "Because it's always faster than direct air service.", "B": "It offers a balance between transit time and cost - faster than all-ocean and cheaper than all-air, useful for goods where all-air is too expensive but time is more critical than an all-sea joumey.", "C": "Because it avoids customs checks entirely.", "D": "There is no practical reason; it's done only due to carrier constraints."}, "answers": ["B"], "explanation": "Tại sao Freight Forwarder có thể đề xuất vận tải Sea-Air thay vì hoàn toàn bằng đường biển hoặc hàng không?\nB. lt offers a balance between transit time and cost - faster than all-ocean and cheaper than all-air (Cân bằng giữa thời gian và chi phí - nhanh hơn vận tải hoàn toàn bằng\nđường biên và rẻ hơn vận tải hoàn toàn bằng đường hàng không) — Phù hợp với hàng cần giao tương đối nhanh nhưng ngân sách có hạn.", "slide_img": "images/q_534_slide_1794474081736.jpg", "note_img": "images/q_534_note_1794474081736.jpg"}, {"id": 535, "subject": "GLI202", "question": "What are transport \"corridors\" such as the Trans-Siberian route or the Eurasian Land Bridge often promoted for?", "options": {"A": "Providing land-based alternatives to shipping by sea, which can reduce transit times between Europe and Asia (e.g. rail service culting transit to around 2 weeks versus 4-6 weeks by sea)", "B": "Allowing trucks to drive directly from Europe to America", "C": "Eliminating the need for any mode of transport changes", "D": "Primarily tourist travel, not freight"}, "answers": ["A"], "explanation": "Các hành lang vận tải như Trans-Siberian hoặc Eurasian Land Bridge thường được phát triển nhằm mục đích gì?\nA. Providing land-based alternatives to shipping by sea, which can reduce transit times between Europe and Asia (Cung cấp phương án vận tải đường bộ hoặc đường sắt thay\nthế đường biên, có thê rút ngắn thời gian vận chuyên giữa châu Âu và châu Á) — Vận tải đường sắt có thể nhanh hơn đường biển trên một số tuyến.", "slide_img": "images/q_535_slide_1794474083903.jpg", "note_img": "images/q_535_note_1794474083903.jpg"}, {"id": 536, "subject": "GLI202", "question": "When considering routing, why must forwarders be aware of geographical considerations like mountain ranges or canals?", "options": {"A": "Only airlines need to worry about mountains, not forwarders.", "B": "Geography has little impact due to modern technology.", "C": "Physical geography affects viable transport routes - for instance, high mountain ranges may slow or block ground transport, and canals (Panama, Suez) offer strategic shortcuts for shipping routes.", "D": "Because forwarders prefer scenic routes for cargo."}, "answers": ["C"], "explanation": "Tại sao Freight Forwarder cần quan tâm đến các yếu tố địa lý như núi và kênh đào khi lựa chọn tuyến đường?\nC. Physical geography affects viable transport routes (Địa hình tự nhiên ảnh hưởng đến khả năng lựa chọn tuyến vận tải) — Núi cao có thể cản trở vận tải đường bộ, trong khi kênh\nđào tạo tuyến đường biền ngắn hơn.", "slide_img": "images/q_536_slide_1794474085863.jpg", "note_img": "images/q_536_note_1794474085863.jpg"}, {"id": 537, "subject": "GLI202", "question": "What does freight consolidation (groupage) mean in forwarding?", "options": {"A": "The cancellation of shipments due to low volume", "B": "Moving one shipment at a time, separately", "C": "Combining multiple smaller shipments (often from different shippers) into one larger shipment to move together, thereby achieving better freight rates and efficiency for all parties", "D": "Splitting one shipment into many parts for separate transport"}, "answers": ["C"], "explanation": "Freight Consolidation (Groupage) có nghĩa là gì?\nC. Combining multiple smaller shipments into one larger shipment to move together, thereby achieving better freight rates and efficiency (Gom nhiều lô hàng nhỏ thành một lô\nhàng lớn đề vận chuyên chung, giúp tối ưu cước phí và hiệu quả) — Đây là hình thức gom hàng, thường gặp trong vận tải LCL.", "slide_img": "images/q_537_slide_1794474087821.jpg", "note_img": "images/q_537_note_1794474087821.jpg"}, {"id": 538, "subject": "GLI202", "question": "Why is consolidation beneficial for a freight forwarder and its shipping clients?", "options": {"A": "win-win in cost savings.", "B": "It guarantees zero transit time.", "C": "It allows charging each client the full cost of a whole container.", "D": "Itis only done to meet regulatory requirements."}, "answers": ["A"], "explanation": "Tại sao Consolidation mang lại lợi ích cho Freight Forwarder và khách hàng?\nA. The forwarder can fill a container or truck with cargo from various customers and get a lower rate per unit, while each customer pays a smaller share (Người giao nhận có thề\ngom hàng của nhiều khách vào một container hoặc xe tải đề giảm đơn giá vận chuyền, trong khi mỗi khách hàng chỉ trả một phần chiỉ phí) — Giúp tiết kiệm chỉ phí cho cả hai bên.", "slide_img": "images/q_538_slide_1794474089862.jpg", "note_img": "images/q_538_note_1794474089862.jpg"}, {"id": 539, "subject": "GLI202", "question": "When handling out-of-gauge (oversized) cargo, a freight forwarder must ensure:", "options": {"A": "Route surveys are done for any obstacles (low bridges, road width), required permits are obtained, proper lifting/loading gear is arranged, and experienced handlers are involved.", "B": "The cargo is split into smaller pieces regardless of what it is.", "C": "It's only shipped by air.", "D": "No special steps; they treat it like any other cargo."}, "answers": ["A"], "explanation": "Khi vận chuyển hàng quá khổ (Out-of-Gauge), Freight Forwarder cần đảm bảo điều gì?\nA. Route surveys are done for any obstacles, required permits are obtained, proper lifting/loading gear is arranged, and experienced handlers are involved (Khảo sát tuyến\nđường đề xác định vật cản, xin giấy phép cần thiết, chuân bị thiết bị nâng hạ phù hợp và sử dụng nhân sự có kinh nghiệm) — Hạn chế tai nạn và trở ngại trong vận chuyền.", "slide_img": "images/q_539_slide_1794474091867.jpg", "note_img": "images/q_539_note_1794474091867.jpg"}, {"id": 540, "subject": "GLI202", "question": "Which of the following is true about transporting dangerous goods?", "options": {"A": "They are divided into specific classes (e.g., explosives, flammable liquids, toxic substances. etc.), and certain classes cannot be loaded together or may require special containers or handling procedures.", "B": "They can be freely mixed with any other goods without restriction.", "C": "No special documentation is needed if it's a short journey.", "D": "Only the shipper is responsible for them; the forwarder has no role."}, "answers": ["A"], "explanation": "Phát biểu nào đúng về vận chuyền hàng nguy hiểm?\nA. They are divided into specific classes, and certain classes cannot be loaded together or may require special containers or handling procedures (Hàng nguy hiểm được chia\nthành các nhóm cụ thê; một số nhóm không được xếp chung hoặc cần container và quy trình xử lý đặc biệt) — Phân loại giúp kiểm soát rủi ro cháy nồ, độc hại và ăn mòn.", "slide_img": "images/q_540_slide_1794474094005.jpg", "note_img": "images/q_540_note_1794474094005.jpg"}, {"id": 541, "subject": "GLI202", "question": "What additional requirements come with shipping perishable goods (e.g. fresh produce, dairy)?", "options": {"A": "Maintaining specific environmental conditions (temperature/humidity) using refrigerated transport and swift handling, since these items can spoil if not kept within required conditions or if delayed.", "B": "Only shipping in winter to keep them cold.", "C": "Packaging them in ordinary boxes without ventilation.", "D": "They are treated the same as non-perishables in all respects."}, "answers": ["A"], "explanation": "Vận chuyển hàng dễ hư hỏng (Perishable Goods) như rau quả tươi và sữa cần yêu cầu bồ sung nào?\nA. Maintaining specific environmental conditions (temperature/humidity) using refrigerated transport and swift handling (Duy trì nhiệt độ và độ âm phù hợp bằng vận tải lạnh và\nxử lý nhanh chóng) — Giúp giữ chất lượng và hạn chế hư hỏng.", "slide_img": "images/q_541_slide_1794474095900.jpg", "note_img": "images/q_541_note_1794474095900.jpg"}, {"id": 542, "subject": "GLI202", "question": "Why would a freight forwarder apply a \"minimum charge” per consignment in a
