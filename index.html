 organizations because it requires no cybersecurity analyst involvement once installed.", "C": "SOAR automates incident investigation and responds to workflows based on playbooks.", "D": "SOAR automation guarantees an uptime factor of \"5 nines\"."}, "answers": ["C"], "explanation": "Lợi ích của SOAR khi được dùng cùng SIEM là gì?\nSOAR tự động hóa qlều tra sự cố và phản hồi dựa trên playbook.\nGiảm tải cho SOC bằng cách tự động thực hiện các bước xử lý.", "slide_img": "images/q_247_slide_1794419209108.jpg", "note_img": "images/q_247_note_1794419209108.jpg"}, {"id": 248, "subject": "IAO202", "question": "What is a difference between symmetric and asymmetric encryption algorithms?", "options": {"A": "Symmetric encryption algorithms are used to authenticate secure communications. Asymmetric encryption algorithms are used to repudiate messages.", "B": "Symmetric encryption algorithms are used to encrypt data. Asymmetric encryption algorithms are used to decrypt data.", "C": "Symmetric encryption algorithms use pre-shared keys. Asymmetric encryption algorithms use different keys to encrypt and decrypt data.", "D": "Symmetric algorithms are typically hundreds to thousands of times slower than asymmetric algorithms."}, "answers": ["C"], "explanation": "Điểm khác biệt giữa mã hóa đồi xứng và bất đối xứng là gì?\nMã hóa đối xứng dùng khóa chia sẻ trước, mã hóa bất đối xứng dùng hai khóa khác nhau đễ mã hóa và giải mã.\nĐồi xứng cùng một khóa; bất đối xứng dùng cặp khóa công khai - bí mật.", "slide_img": "images/q_248_slide_1794419211304.jpg", "note_img": "images/q_248_note_1794419211304.jpg"}, {"id": 249, "subject": "IAO202", "question": "What is a host-based intrusion detection system (HIDS)?", "options": {"A": "It combines the functionalities of antimalware applications with firewall protection.", "B": "It is an agentless system that scans files on a host for potential malware.", "C": "It identifies potential attacks and sends alerts but does not stop the traffic.", "D": "It detects and stops potential direct attacks but does not scan for malware."}, "answers": ["C"], "explanation": "HIDS là gì?\n\nHIDS là hệ thống phát hiện xâm nhập trên máy chủ (host)\n\nNhiệm vụ chính: phát hiện và cảnh báo (detect + alert)\n\nKhông tự động chăn (không stop trafitc) ¬ đó là chức năng của IPS (Intrusion Prevention System)", "slide_img": "images/q_249_slide_1794419213296.jpg", "note_img": "images/q_249_note_1794419213296.jpg"}, {"id": 250, "subject": "IAO202", "question": "What is a rogue wireless hotspot?", "options": {"A": "It is a hotspot that appears to be from a legitimate business but was actually set up by someone without the permission from the business.", "B": "It is a hotspot that does not implement strong user authentication mechanisms.", "C": "It is a hotspot that was set up with outdated devices.", "D": "It is a hotspot that does not encrypt network user traffic."}, "answers": ["A"], "explanation": "Rogue wireless hotspot là gì?\nĐiểm phát WiFi trông hợp pháp nhưng được ai đó dựng lên mà không có sự cho phép.\nDùng đề đánh lừa người dùng và đánh cắp dữ liệu.", "slide_img": "images/q_250_slide_1794419215304.jpg", "note_img": "images/q_250_note_1794419215304.jpg"}, {"id": 251, "subject": "IAO202", "question": "What is a characteristic of the security artichoke, defense-in-depth approach?", "options": {"A": "Threat actors can easily compromise all layers safeguarding the data or systems.", "B": "Threat actors no longer have to peel away each layer before reaching the target data or system.", "C": "Threat actors can no longer penetrate any layers safeguarding the data or system.", "D": "Each layer has to be penetrated before the threat actor can reach the target data or system."}, "answers": ["D"], "explanation": "Đặc điễm của mô hình bảo mật “security artichoke / defense-in-depth\" là gì?\nDefense-in-depth = bảo mật nhiều lớp (giống củ atiso € )\n\nKề tân công phải vượt qua từng lớp bàảo vệ một mới tới được dữ liệu\n\nKhông có lớp nào là tuyệt đối — nhưng nhiều lớp sẽ tăng độ an toàn", "slide_img": "images/q_251_slide_1794419217499.jpg", "note_img": "images/q_251_note_1794419217499.jpg"}, {"id": 252, "subject": "IAO202", "question": "What is the significant characteristic of worm malware?", "options": {"A": "Aworm can execute independently of the host system.", "B": "Once installed on a host system, a worm does not replicate itself.", "C": "Worm malware disguises itself as legitimate software.", "D": "A worm must be triggered by an event on the host system."}, "answers": ["A"], "explanation": "Đặc điểm quan trọng nhất của worm malware là gì?\nWorm có thễ tự chạy độc lập không cần chương trình chủ.\nWorm tự lan truyền qua mạng mà không cần người dùng kích hoạt.", "slide_img": "images/q_252_slide_1794419219444.jpg", "note_img": "images/q_252_note_1794419219444.jpg"}, {"id": 253, "subject": "IAO202", "question": "What is the purpose of a digital certificate?", "options": {"A": "It provides proof that data has a traditional signature attached.", "B": "It guarantees that a website has not been hacked.", "C": "It ensures that the person who is gaining access to a network device is authorized.", "D": "It authenticates a website and establishes a secure connection to exchange confidential data."}, "answers": ["D"], "explanation": "Mục đích của chứng chỉ số là gì?\nXác thực vưebsite và thiết lập kết nói bảo mật đề trao đôi dữ liệu mật.\nChứng chỉ số đảm bảo trang vveb là thật và hỗ trợ HTTPS.", "slide_img": "images/q_253_slide_1794419221368.jpg", "note_img": "images/q_253_note_1794419221368.jpg"}, {"id": 254, "subject": "IAO202", "question": "What is the primary purpose of the Forum of Incident Response and Security Teams (FIRST)?", "options": {"A": "To enable a variety of computer security incident response teams to collaborate, cooperate, and coordinate information sharing, incident prevention, and rapid reaction strategies", "B": "To provide a security news portal that aggregates the latest breaking news pertaining to alerts, exploits, and vulnerabilities.", "C": "To offer 24x7 cyberthreat warnings and advisories. vulnerability identification, and mitigation and incident response.", "D": "To provide vendor neutral education products and career services to industry professionals worldwide."}, "answers": ["A"], "explanation": "Mục đích chính của tô chức FIRST là gì?\nGiúp các đội phản ứng sự có phối hợp, chia sẻ thông tin và phản ứng nhanh với sự cố.\nFIRST là mạng lưới hợp tác toàn cầu giữa các CSIRT.", "slide_img": "images/q_254_slide_1794419223502.jpg", "note_img": "images/q_254_note_1794419223502.jpg"}, {"id": 255, "subject": "IAO202", "question": "What is an advantage of HIPS that is not provided by IDS?", "options": {"A": "HIPS protects critical system resources and monitors operating system processes.", "B": "HIPS deploys sensors at network entry points and protects critical network segments.", "C": "HIPS monitors network processes and protects critical files.", "D": "HIPS provides quick analysis of events through detailed logging."}, "answers": ["A"], "explanation": "Ưu điểm của HIPS mà IDS không có là gì?\nHIPS bảo vệ tài nguyên hệ thống quan trong và giám sát các tiền trình hệ điều hành.\nHIPS nằm trên host nên can thiệp trực tiếp vào hoạt động của hệ thống.", "slide_img": "images/q_255_slide_1794419225473.jpg", "note_img": "images/q_255_note_1794419225473.jpg"}, {"id": 256, "subject": "IAO202", "question": "What is the difference between an HIDS and a firewall?", "options": {"A": "An HIDS blocks intrusions, whereas a firewall filters them.", "B": "A firewall allows and denies traffic based on rules and an HIDS monitors network traffic.", "C": "An HIDS monitors operating systems on host computers and processes file system activity. Firewalls allow or deny traffic between the computer and other systems.", "D": "A firewall performs packet filtering and therefore is limited in effectiveness. whereas an HIDS blocks intrusions.", "E": "An HIDS works like an IPS, whereas a firewall just monitors traffic."}, "answers": ["C"], "explanation": "Điễm khác nhau giữa HIDS và firevall là gì? \\ \\\nHIDS giám sát hệ điều hành và hoạt động tệp trên host; firewall cho phép hoặc chặn lưu lượng giữa thiết bị và hệ thống khác.\nFirewall xử lý lưu lượng mạng, HIDS xử lý hoạt động nội bộ trên máy.", "slide_img": "images/q_256_slide_1794419227684.jpg", "note_img": "images/q_256_note_1794419227684.jpg"}, {"id": 257, "subject": "IAO202", "question": "What is the purpose for using digital signatures for code signing?", "options": {"A": "to establish an encrypted connection to exchange confidential data with a vendor website", "B": "to verify the integrity of executable files downloaded from a vendor website", "C": "to authenticate the identity of the system with a vendor website", "D": "to generate a virtual ID"}, "answers": ["B"], "explanation": "Mục đích của việc dùng chữ ký số đề ký mã (code signing) là gì?\nXác minh tính toàn vẹn của các tệp thực thi được tải xuống từ trang web của nhà cung cấp.\nChữ ký số chứng minh file không bị chỉnh sửa hoặc cải mã độc.", "slide_img": "images/q_257_slide_1794419229613.jpg", "note_img": "images/q_257_note_1794419229613.jpg"}, {"id": 258, "subject": "IAO202", "question": "What is the purpose of mobile device management (MDM) software?", "options": {"A": "It is used to create a security policy.", "B": "It is used to implement security policies, setting, and software configurations on mobile devices.", "C": "It is used to identify potential mobile device vulnerabilities.", "D": "It is used by threat actors to penetrate the system."}, "answers": ["B"], "explanation": "Mục đích wazpnầ_n mềm quản lý thiết bị di động (MDM) là gì?\nĐược dùng đề triển khai chính sách bảo mật, cài đặt và cầu hình phần mềm trên thiết bị di động.\nMDM quản lý và kiếm soát thiết bị theo chính sách doanh nghiệp.", "slide_img": "images/q_258_slide_1794419231818.jpg", "note_img": "images/q_258_note_1794419231818.jpg"}, {"id": 259, "subject": "IAO202", "question": "What is the difference between an HIDS and a firewall?", "options": {"A": "A firewall performs packet filtering and therefore Is limited in effectiveness, whereas an HIDS blocks intrusions.", "B": "An HIDS blocks intrusions, whereas a firewall filters them.", "C": "An HIDS works like an IPS, whereas a firewall just monitors traffic.", "D": "An HIDS monitors operating systems on host computers and processes file system activity. Firewalls allow or deny traffic between the computer and other systems.", "E": "A firewall allows and denies traffic based on rules and an HIDS monitors network traffic."}, "answers": ["D"], "explanation": "Sư khác nhau giữa HIDS và firewall là gì?\nHIDS giám sát hệ điều hành và hoạt động tệp trên máy, còn firewall cho phép hoặc chặn lưu lượng giữa máy và hệ thống khác.\nFirewall xử lý lưu lượng mạng, HIDS xử lý hoạt động nội bộ của host.", "slide_img": "images/q_259_slide_1794419233870.jpg", "note_img": "images/q_259_note_1794419233870.jpg"}, {"id": 260, "subject": "IAO202", "question": "What is the principle behind the nondiscretionary access control model?", "options": {"A": "|t allows access decisions to be based on roles and responsibilities of a user within the organization.", "B": "It allows users to control access to their data as owners of that data", "C": "It applies the strictest access control possible.", "D": "It allows access based on attributes of the object be to accessed."}, "answers": ["A"], "explanation": "Nguyên tắc của mô hình kiễm soát truy cập không tùy ý (nondiscretionary) là gì?\nQuyết định truy cập dựa trên vai trò và trách nhiệm của người dùng trong tỗ chức.\nQuyền được cấp theo chức vụ, không do người dùng tự kiếm soát.", "slide_img": "images/q_260_slide_1794419235830.jpg", "note_img": "images/q_260_note_1794419235830.jpg"}, {"id": 261, "subject": "IAO202", "question": "A. to publish all informational materials on known and newly discovered cyberthreats", "options": {"B": "to enable automated sharing of |OCs between people and machines using the STIX and other exports formats", "C": "to provide a set of standardized schemata for specifying and capturing events and properties of network operations", "D": "to exchange all the response mechanisms to known threats"}, "answers": ["B"], "explanation": "Mục đích chính của nêền tảng chia sẻ thông tin malvrare MISP là gì?\nCho phép chia sẻ tự động IOC giữa người và máy bằng STIX và các định dạng khác.\nMISP giúp chia sẻ thông tin đe dọa nhanh và chuẩn hóa.", "slide_img": "images/q_261_slide_1794419237987.jpg", "note_img": "images/q_261_note_1794419237987.jpg"}, {"id": 262, "subject": "IAO202", "question": "What is the benefit of a defense-in-depth approach?", "options": {"A": "The effectiveness of other security measures is not impacted when a security mechanism fails.", "B": "The need for firewalls is eliminated.", "C": "All network vulnerabilities are mitigated.", "D": "Only a single layer of security at the network core is required."}, "answers": ["A"], "explanation": "Lợi ích của phương pháp phòng thủ nhiều lớp (defense-in-depth) là gì2\nHiệu quả của các cơ chế bảo mật khác không bị ảnh hưởng khi một cơ chế bị thất bại.\nNhiều lớp bảo vệ độc lập giúp giảm nguy cơ bị phá toàn bộ.", "slide_img": "images/q_262_slide_1794419239967.jpg", "note_img": "images/q_262_note_1794419239967.jpg"}, {"id": 263, "subject": "IAO202", "question": "What is blacklisting?", "options": {"A": "This is a user list to prevent blacklisted users from accessing a computer.", "B": "This is a network process list to stop a listed process from running on a computer.", "C": "This is a Heuristics-based list to prevent a process from running on a computer.", "D": "This is an application list that can dictate which user applications are not permitted to run on a computer."}, "answers": ["D"], "explanation": "Blacklisting là gì?\nDanh sách ứng dụng không được phép chạy trên máy tính.\nChặn những ứng dụng bị liệt kê vì không an toàn hoặc không mong muốn.", "slide_img": "images/q_263_slide_1794419242206.jpg", "note_img": "images/q_263_note_1794419242206.jpg"}, {"id": 264, "subject": "IAO202", "question": "What is indicated by a Snort signature ID that is below 3464?", "options": {"A": "The SID was created by Sourcefire and distributed under a GPL agreement.", "B": "This is a custom signature developed by the organization to address locally observed rules.", "C": "The SID was created by the Snort community and is maintained in Community Rules.", "D": "The SID was created by members of EmergingThreats."}, "answers": ["A"], "explanation": "Một chữ ký Snort có SID nhỏ hơn 3464 cho biết điều gì?\nSID được tạo bởi Sourcefire và phân phối theo giấy phép GPL.\nSID thấp thuộc về bộ quy tắc mặc định do Sourcefire phát triên.", "slide_img": "images/q_264_slide_1794419244252.jpg", "note_img": "images/q_264_note_1794419244252.jpg"}, {"id": 265, "subject": "IAO202", "question": "What is a difference between symmetric and asymmetric encryption algorithms?", "options": {"A": "Symmetric encryption algorithms are used to authenticate secure communications. Asymmetric encryption algorithms are used to repudiate messages.", "B": "Symmetric encryption algorithms use pre-shared keys. Asymmetric encryption algorithms use different keys to encrypt and decrypt data.", "C": "Symmetric algorithms are typically hundreds to thousands of times slower than asymmetric algorithms.", "D": "Symmetric encryption algorithms are used to encrypt data. Asymmetric encryption algorithms are used to peo data."}, "answers": ["B"], "explanation": "Điểm khác biệt giữa mã hóa đồi xứng và bất đối xứng là gì?\nMã hóa đối xứng dùng khóa chia sẻ trước; mã hóa bất đồi xứng dùng hai khóa khác nhau đề mã hóa và giải mã.\nĐồi xứng dùng một khóa, bắt đối xứng dùng cặp khóa công khai - bí mật.", "slide_img": "images/q_265_slide_1794419246520.jpg", "note_img": "images/q_265_note_1794419246520.jpg"}, {"id": 266, "subject": "IAO202", "question": "What does the telemetry function provide in host-based security software?", "options": {"A": "|t updates the heuristic antivirus signature database.", "B": "It blocks the passage of zero-day attacks", "C": "It enables updates of malware signatures.", "D": "It enables host-based security programs to have comprehensive logging functions."}, "answers": ["D"], "explanation": "Chức năng telemetry cung cấp gì trong phần mềm bảo mật dựa trên host?\nCho phép các chương trình bảo mật trên host có khả năng ghi log đây đủ.\nTelemetry thu thập dữ liệu hoạt động đễ phân tích và cải thiện bảo mật.", "slide_img": "images/q_266_slide_1794419248711.jpg", "note_img": "images/q_266_note_1794419248711.jpg"}, {"id": 267, "subject": "IAO202", "question": "What causes a buffer overflow?", "options": {"A": "downloading and installing too many software updates at one time", "B": "sending too much information to two or more interfaces of the same device, thereby causing dropped packets", "C": "launching a security countermeasure to mitigate a Trojan horse", "D": "attempting to write more data to a memory location than that location can hold"}, "answers": ["D"], "explanation": "Điều gì gây ra lối tràn bộ đệm2\ncó gắng ghi nhiều dữ liệu vào một vị trí bộ nhớ hơn khả năng chứa của vị trí đó\nTràn bộ đêm xảy ra khi dữ liệu vượt quá dung lượng vùng nhớ.", "slide_img": "images/q_267_slide_1794419250741.jpg", "note_img": "images/q_267_note_1794419250741.jpg"}, {"id": 268, "subject": "IAO202", "question": "What action does a DHCPV4 client take if it receives more than one DHCPOFFER from multiple DHCP servers?", "options": {"A": "It sends a DHCPNAK and begins the DHCP process over again.", "B": "It accepts both DHCPOFFER messages and sends a DHCPACK.", "C": "It discards both offers and sends a new DHCPDISCOVER.", "D": "It sends a DHCPREQUEST that identifies which lease offer the client is accepting."}, "answers": ["A"], "explanation": "DHCPv4 client sẽ làm gì nếu nhận nhiều DHCPOFFER từ nhiều server?\nNó gửi DHCPREOUEST để cho biết nó chọn đề nghị nào.\nClient phải chọn một lease và phản hồi lại server tương ứng.", "slide_img": "images/q_268_slide_1794419252698.jpg", "note_img": "images/q_268_note_1794419252698.jpg"}, {"id": 269, "subject": "IAO202", "question": "What functionality is provided by Cisco SPAN in a switched network?", "options": {"A": "It mirrors traffic that passes through a switch port or VLAN to another port for traffic analysis.", "B": "It prevents traffic on a LAN from being disrupted by a broadcast storm.", "C": "It protects the switched network from receiving BPDUs on ports that should not be receiving them.", "D": "It copies traffic that passes through a switch interface and sends the data directly to a syslog or SNMP server for analysis.", "E": "It inspects voice protocols to ensure that SIP- SCCP. H 323. and MGCP requests conform to voice standards.", "F": "It mitigates MAC address overflow attacks."}, "answers": ["A"], "explanation": "Cisco SPAN cung cấp chức năng gì trong mạng chuyên mạch?\nNó sao chép lưu lượng đi qua một công hoặc VLAN sang công khác đễ phân tích.\nSPAN dùng đê mirror traffic cho IDS hoặc phân tích gói tin.", "slide_img": "images/q_269_slide_1794419254804.jpg", "note_img": "images/q_269_note_1794419254804.jpg"}, {"id": 270, "subject": "IAO202", "question": "What information is gathered by the CSIRT when determining the scope of a security incident?", "options": {"A": "the networks, systems, and applications affected by an incident", "B": "the amount of time and resources needed to handle an incident", "C": "the strategies and procedures used for incident containment", "D": "the processes used to preserve evidence"}, "answers": ["A"], "explanation": "CSIRT thu thập thông tin gì khi xác định phạm vi sự có?\nCác mạng, hệ thống và ứng dụng bị ảnh hưởng.\nPhạm vi giúp xác định mức độ lan rộng của sự cồ.", "slide_img": "images/q_270_slide_1794419256769.jpg", "note_img": "images/q_270_note_1794419256769.jpg"}, {"id": 271, "subject": "IAO202", "question": "Which is a BYOD security best practice?", "options": {"A": "have all users install an antivirus program of their choice on the BYOD device", "B": "subscribe to a device locator service with remote wipe feature", "C": "disable use of MDM software on any of the BYOD devices", "D": "use one global complex password for all BYOD devices"}, "answers": ["B"], "explanation": "Thực hành bảo mật BYOD tốt nhất là gì?\nĐăng ký dịch vụ tìm thiết bị có tính năng xóa dữ liệu từ xa.\nRemote wipe giúp bảo vệ dữ liệu nếu thiết bị bị mắt.", "slide_img": "images/q_271_slide_1794419258579.jpg", "note_img": "images/q_271_note_1794419258579.jpg"}, {"id": 272, "subject": "IAO202", "question": "Which methods can be used to harden a computing device?", "options": {"A": "Allow USB auto-detection and allow default services to remain enabled.", "B": "None of the mentioned.", "C": "Ensure physical security and enforce the password history mechanism.", "D": "Update patches on a strict annual basis irrespective of release date and allow USB auto-detection"}, "answers": ["C"], "explanation": "Phương pháp nào dùng đễ tăng cường bảo mật thiết bị?\nĐảm bảo an ninh vật lý và bật cơ chế lưu lịch sử mật khẩu.\nGiảm khả năng truy cập trái phép và tái sử dụng mật khâu.", "slide_img": "images/q_272_slide_1794419260546.jpg", "note_img": "images/q_272_note_1794419260546.jpg"}, {"id": 273, "subject": "IAO202", "question": "Which statement is a feature of HMAC?", "options": {"A": "HMAC uses a secret key that is only known to the sender and defeats man-in-the-middle attacks.", "B": "HMAC uses protocols such as SSL or TLS to provide session layer confidentiality.", "C": "HMAC uses a secret key as input to the hash function, adding authentication to integrity assurance.", "D": "HMAC is based on the RSA hash function."}, "answers": ["C"], "explanation": "", "slide_img": "images/q_273_slide_1794419262209.jpg", "note_img": "images/q_273_note_1794419262209.jpg"}, {"id": 274, "subject": "IAO202", "question": "Which statement describes statistical data in network security monitoring processes?", "options": {"A": "|t is created through an analysis of other forms of network data.", "B": "It shows the results of network activities between network hosts.", "C": "It contains conversations between network hosts.", "D": "It lists each alert message along with statistical information."}, "answers": ["A"], "explanation": "Mô tả nào nói về dữ liệu thông kê trong giám sát an ninh mạng?\nNó được tạo ra từ việc phân tích các dạng dữ liệu mạng khác.\nDữ liệu thông kê là tổng hợp, không phải bản ghi trực tiếp.", "slide_img": "images/q_274_slide_1794419264056.jpg", "note_img": "images/q_274_note_1794419264056.jpg"}, {"id": 275, "subject": "IAO202", "question": "Which statement describes session data in security logs?", "options": {"A": "It is a record of a conversation between network hosts", "B": "It shows the result of network sessions", "C": "It can be used to describe or predict network behavior.", "D": "It reports detailed network activities between network hosts."}, "answers": ["A"], "explanation": "Mô tả nào nói về session data trong log bảo mật?\nĐó là bản ghi của cuộc trò chuyệên giữa các host mạng.\nSession data ghi lại ai liên lạc với ai, thời gian, công, giao thức.", "slide_img": "images/q_275_slide_1794419265906.jpg", "note_img": "images/q_275_note_1794419265906.jpg"}, {"id": 276, "subject": "IAO202", "question": "Which statement describes Trusted Automated Exchange of Indicator Information (TAXII)?", "options": {"A": "It is a set of specifications for exchanging cyber threat information between organizations.", "B": "It is a signature-less engine utilizing stateful attack analysis to detect zero-day threats.", "C": "It is a dynamic database of real-time vulnerabilities.", "D": "It is the specification for an application layer protocol that allows the communication of CTI over HTTPS."}, "answers": ["D"], "explanation": "TAXII được mô tả như thế nào? Ì\nNó là giao thức tầng ứng dụng cho phép truyền thông tin CTI qua HTTPS.\nTAXII hố trợ chia sẻ threat intelligence tự động, bảo mật.", "slide_img": "images/q_276_slide_1794419267894.jpg", "note_img": "images/q_276_note_1794419267894.jpg"}, {"id": 277, "subject": "IAO202", "question": "Which statement describes the policy-based intrusion detection approach?", "options": {"A": "It compares the operations of a host against well-defined security rules.", "B": "It compares the signatures of incoming traffic to a known intrusion database.", "C": "It compares the antimalware definitions to a central repository for the latest updates.", "D": "It compares the behaviors of a host to an established baseline to identify potential intrusion."}, "answers": ["A"], "explanation": "Mô tả phương pháp IDS dựa trên policy là gì?\nSo sánh hoạt động của host với các quy tắc bảo mật được định nghĩa rõ.\nIDS phát hiện vi phạm khi hành vi không tuân theo chính sách.", "slide_img": "images/q_277_slide_1794419269797.jpg", "note_img": "images/q_277_note_1794419269797.jpg"}, {"id": 278, "subject": "IAO202", "question": "Which statement describes a Cisco Web Security Appliance (WSA)?", "options": {"A": "It protects a web server by preventing security threats from accessing the server.", "B": "It provides high performance web services.", "C": "It acts as an SSL-based VPN server for an enterprise.", "D": "It functions as a web proxy."}, "answers": ["D"], "explanation": "Cisco Web Security Appliance là gì?\nNó hoạt động như web proxy.\nWSA lọc web, chặn malware, kiễm soát truy cập Internet.", "slide_img": "images/q_278_slide_1794419271680.jpg", "note_img": "images/q_278_note_1794419271680.jpg"}, {"id": 279, "subject": "IAO202", "question": "Which statement describes the ping and tracert commands?", "options": {"A": "Tracert uses IP addresses: ping does not.", "B": "Both ping and tracert can show results in a graphical display.", "C": "Ping shows whether the transmission is successful, tracert does not.", "D": "Tracert shows each hop, while ping shows a destination reply only."}, "answers": ["D"], "explanation": "Mô tả nào đúng về lệnh ping và tracert?\nTracert hiến thị từng bước nhảy, còn ping chì hiến thị phản hồi từ đích.\nPing kiễm tra kết nồi; tracert cho biết đường đi qua các router.", "slide_img": "images/q_279_slide_1794419273628.jpg", "note_img": "images/q_279_note_1794419273628.jpg"}, {"id": 280, "subject": "IAO202", "question": "Which statement describes an operational characteristic of NetFlow?", "options": {"A": "NetFlow collects basic information about the packet flow, not the flow data itself.", "B": "NetFlow captures the entire contents of a packet.", "C": "NetFlow flow records can be viewed by the tcpdump tool.", "D": "NetFlow can provide services for user access control."}, "answers": ["A"], "explanation": "Đặc điễm hoạt động của NetFlow là gì?\nNetFlow thu thập thông tin cơ bản về luông, mỆng thu toàn bộ dữ liệu gói tin.\nNó chỉ lưu metadata như IP. cống, giao thức, số byte.", "slide_img": "images/q_280_slide_1794419275512.jpg", "note_img": "images/q_280_note_1794419275512.jpg"}, {"id": 281, "subject": "IAO202", "question": "Which statement describes cybersecurity? | ioang Hoang", "options": {"A": "|t is a framework for security policy development.", "B": "It is an ongoing effort to protect Internet-connected systems and the data associated with those systems from unauthorized use or harm.", "C": "It is a standard-based model for developing firewall technologies to fight against cybercriminals.", "D": "It is the name of a comprehensive security application for end users to protect workstations from being attacked."}, "answers": ["B"], "explanation": "Mô tả nào đúng về cybersecurity? \\\nĐó là nố lực liên tục nhằm bảo vệ hệ thống kết nói Internet và dữ liệu khỏi truy cập hoặc gây hại trái phép.\nCybersecurity bao gồm con người, quy trình và công nghệ.", "slide_img": "images/q_281_slide_1794419277523.jpg", "note_img": "images/q_281_note_1794419277523.jpg"}, {"id": 282, "subject": "IAO202", "question": "Which statement describes one of the rules that govern interface behavior in the context of implementing a zone-based policy firewall configuration?", "options": {"A": "An administrator can assign interfaces to zones. regardless of whether the zone has been configured.", "B": "An administrator can assign an interface to multiple security Zones.", "C": "By default, traffic is allowed to flow among interfaces that are members of the same zone.", "D": "By default, traffic is allowed to flow between a zone member interface and any interface that is not a zone member."}, "answers": ["C"], "explanation": "Quy tắc nào mô tả hành vi giao diện trong cầu hình zone-based firewall?\nMặc định, lưu lượng được phép đi giữa các giao diện thuộc cùng một zone.\nZone-based firewall chặn giao tiếp giữa các zone trừ khi được cho phép.", "slide_img": "images/q_282_slide_1794419279576.jpg", "note_img": "images/q_282_note_1794419279576.jpg"}, {"id": 283, "subject": "IAO202", "question": "Which technique would a threat actor use to disguise traces of an ongoing exploit?", "options": {"A": "Create an invisible iFrame on a web page.", "B": "Corrupt time information by attacking the NTP infrastructure.", "C": "Encapsulate other protocols within DNS to evade security measures.", "D": "Use SSL to encapsulate malware."}, "answers": ["B"], "explanation": "", "slide_img": "images/q_283_slide_1794419281131.jpg", "note_img": "images/q_283_note_1794419281131.jpg"}, {"id": 284, "subject": "IAO202", "question": "Which statement describes cyberwarfare?", "options": {"A": "It is Internet-based conflict that involves the penetration of information systems of other nations.", "B": "It is simulation software for Air Force pilots that allows them to practice under a simulated war scenario.", "C": "Cyberwarfare is an attack carned out by a group of script kiddies.", "D": "It is a series of personal protective equipment developed for soldiers involved in nuclear war."}, "answers": ["A"], "explanation": "", "slide_img": "images/q_284_slide_1794419282793.jpg", "note_img": "images/q_284_note_1794419282793.jpg"}, {"id": 285, "subject": "IAO202", "question": "Which statement describes the threat-vulnerability (T-V) pairing?", "options": {"A": "It is the identification of threats and vulnerabilities and the matching of threats with vulnerabilities.", "B": "It is the comparison between known malware and system risks.", "C": "It is the detection of malware against a central vulnerability research center.", "D": "It is the advisory notice from a vulnerability research center."}, "answers": ["A"], "explanation": "", "slide_img": "images/q_285_slide_1794419284608.jpg", "note_img": "images/q_285_note_1794419284608.jpg"}, {"id": 286, "subject": "IAO202", "question": "Why is Kali Linux a popular choice in testing the network security of an organization?", "options": {"A": "It can be used to test weaknesses by using only malicious software.", "B": "It can be used to intercept and log network traffic.", "C": "It is a network scanning tool that prioritizes security risks.", "D": "It is an open source Linux security distribution containing many penetration tools."}, "answers": ["D"], "explanation": "Tại sao Kali Linux phỗ biến trong việc kiểm thử bảo mật mạng của tổ chức?\nNó là bản phân phối Linux mã nguồn mở chứa nhiều công cụ tần công thâm nhập.\nKali tích hợp sẵản hàng trăm công cụ pentest phục vụ đánh giá an ninh.", "slide_img": "images/q_286_slide_1794419286623.jpg", "note_img": "images/q_286_note_1794419286623.jpg"}, {"id": 287, "subject": "IAO202", "question": "Why do loT devices pose a greater risk than other computing devices on a network?", "options": {"A": "Most loT devices do not require an Internet connection and are unable to receive new updates.", "B": "loT devices require unencrypted wireless connections.", "C": "Most loT devices do not receive frequent firmware updates.", "D": "loT devices cannot function on an isolated network with only an Internet connection."}, "answers": ["C"], "explanation": "Tại sao thiết bị loT gây rủi ro cao hơn các thiết bị khác trong mạng?\nHầu hết loT không ựận cập nhật firmware thường xuyên.\nKhông cập nhật khiến loT dễ bị khai thác qua lỗ hồng cũ.", "slide_img": "images/q_287_slide_1794419288633.jpg", "note_img": "images/q_287_note_1794419288633.jpg"}, {"id": 288, "subject": "IAO202", "question": "Why is Linux considered to be better protected against malware than other operating systems?", "options": {"A": "customizable penetration and protection tools", "B": "file system structure, file permissions. and user account restrictions", "C": "fewer deployments", "D": "integrated firewall"}, "answers": ["B"], "explanation": "Tại sao Linux được xem bảo vệ tốt hơn trước malware?\nCấu trúc file system, quyền tập tin và giới hạn tài khoản người dùng.\nLinux hạn chế quyền cao, giảm khả năng mã độc hoạt động.", "slide_img": "images/q_288_slide_1794419290536.jpg", "note_img": "images/q_288_note_1794419290536.jpg"}, {"id": 289, "subject": "IAO202", "question": "Why does HTTPS technology add complexity to network security monitoring?", "options": {"A": "HTTPS dynamically changes the port number on the web server", "B": "HTTPS uses tunneling technology for confidentiality.", "C": "HTTPS hides the true source IP address using NAT/PAT.", "D": "HTTPS conceals data traffic through end-to-end encryption."}, "answers": ["D"], "explanation": "Tại sao HTTPS làm tăng độ phức tạp cho việc giám sát an ninh mạng?\nHTTPS che giấu dữ liệu bằng mã hóa đầu cuối.\nMã hóa làm IDS/IPS khó đọc và phân tích nội dung gói tin.", "slide_img": "images/q_289_slide_1794419292486.jpg", "note_img": "images/q_289_note_1794419292486.jpg"}, {"id": 290, "subject": "IAO202", "question": "Why do loT devices pose a greater risk than other computing devices on a network?", "options": {"A": "Most loT devices do not receive frequent firmware updates.", "B": "Most loT devices do not require an Internet connection and are unable to receive new updates.", "C": "loT devices cannot function on an isolated network with only an Internet connection.", "D": "loT devices require unencrypted wireless connections."}, "answers": ["A"], "explanation": "Tại sao thiết bị loT gây rủi ro cao hơn các thiết bị khác trong mạng?\nHầu hết loT không ựận cập nhật firmware thường xuyên.\nKhông cập nhật khiến chúng dế bị tắn công qua lố hỗng chưa vá.", "slide_img": "images/q_290_slide_1794419294369.jpg", "note_img": "images/q_290_note_1794419294369.jpg"}, {"id": 291, "subject": "IAO202", "question": "Why would an attacker want to spoof a MAC address?", "options": {"A": "so that a switch on the LAN will start forwarding all frames toward the device that is under control of the attacker (that can then capture the LAN traffic)", "B": "so that the attacker can capture traffic from multiple VLANs rather than from just the VLAN that is assigned to the port to which the attacker device is attached", "C": "so that the attacker can launch another type of attack in order to gain access to the switch", "D": "so that a switch on the LAN will start forwarding frames to the attacker instead of to the legitimate host"}, "answers": ["D"], "explanation": "Tại sao kẻ tần công muốn giả mạo địa chỉ MAC?\nĐễ switch chuyên khung đến kẻ tần công thay vì host hợp lệ.\nMAC spoofing cho phép chiếm quyền nhận lưu lượng của nạn nhân.", "slide_img": "images/q_291_slide_1794419296447.jpg", "note_img": "images/q_291_note_1794419296447.jpg"}, {"id": 292, "subject": "IAO202", "question": "Why would a network administrator choose Linux as an operating system in the Security Operations Center (SOC)?", "options": {"A": "It is easier to use than other operating systems.", "B": "More network applications are created for this environment.", "C": "The administrator has more control over the operating system.", "D": "It is more secure than other server operating systems."}, "answers": ["C"], "explanation": "Tại sao quản trị viên mạng chọn Linux cho SOC?\nQuản trị viên có nhiều quyền kiểmxsoát hệ điều hành hơn.\nLinux cho phép tùy biến sâu và kiếm soát toàn diện phục vụ phân tích bảo mật.", "slide_img": "images/q_292_slide_1794419298381.jpg", "note_img": "images/q_292_note_1794419298381.jpg"}, {"id": 293, "subject": "IAO202", "question": "When a connectionless protocol is in use at a lower layer of the OSI model, how is missing data detected and", "options": {"A": "Connectionless acknowledgements are used to request retransmission.", "B": "Upper-layer connection-oriented protocols keep track of the data received and can request retransmission from the upper-level protocols on the sending host.", "C": "Network layer IP protocols manage the communication sessions if connection-oriented transport services are not available.", "D": "The best-effort delivery process guarantees that all packets that are sent are received."}, "answers": ["B"], "explanation": "Khi giao thức không kết nồi được dùng ở tầng dưới OSI, mắt dữ liệu được phát hiện và gửi lại thế nào?\nGiao thức tầng trên có kết nối theo dõi dữ liệu và yêu cầu gửi lại nếu cần.\nTCP ở tầng trên đảm bảo độ tin cậy dù tầằng dưới không cung cấp.", "slide_img": "images/q_293_slide_1794419300560.jpg", "note_img": "images/q_293_note_1794419300560.jpg"}, {"id": 294, "subject": "IAO202", "question": "How is a DHCPDISCOVER transmitted on a network to reach a DHCP server?", "options": {"A": "ADHCPDISCOVER message is sent with the broadcast IP address as the destination address.", "B": "ADHCPDISCOVER message is sent with a multicast |P address that all DHCP servers listen to as the destination address.", "C": "ADHCPDISCOVER message Is sent with the IP address of the default gateway as the destination address.", "D": "ADHCPDISCOVER message is sent with the IP address of the DHCP server as the destination address."}, "answers": ["A"], "explanation": "DHCPDISCOVER được gửi trong mạng thế nào đễ đến DHCP server?\nGói DHCPDISCOVER được gửi đến địa chỉ broadcast.\nBroadcast đảm bảo tắt cả DHCP server trong mạng đều nhận được gói tin.", "slide_img": "images/q_294_slide_1794419302592.jpg", "note_img": "images/q_294_note_1794419302592.jpg"}, {"id": 295, "subject": "IAO202", "question": "How does a security information and event management system (SIEM) in a SOC help the personnel fight against security threats?", "options": {"A": "by combining data from multiple technologies", "B": "by analyzing logging data in real time", "C": "by dynamically implementing firewall rules", "D": "by integrating all security devices and appliances in an organization"}, "answers": ["B"], "explanation": "Hệ thống quản lý thông tin và sự kiện bảo mật (SIEM) trong SOC giúp nhân viên chồng lại các mồôi đe dọa bảo mật như thế nào?\nB. Bằng cách phân tích dữ liệu nhật ký (log) theo thời gian thực.\nSIEM có chức năng chính là:\n\ns _ Thu thập log từ nhiều hệ thống\n\nPhân tích theo thời gian thực đễ phát hiện bắt thường\n\ns Cảnh báo sớm các cuộc tần công", "slide_img": "images/q_295_slide_1794419304758.jpg", "note_img": "images/q_295_note_1794419304758.jpg"}, {"id": 296, "subject": "IAO202", "question": "How does FireEye detect and prevent zero-day attacks?", "options": {"A": "by keeping a detailed analysis of all viruses and malware", "B": "by establishing an authentication parameter prior to any data exchange", "C": "by only accepting encrypted data packets that validate against their configured hash values", "D": "by addressing all stages of an attack lifecycle with a signature-less engine utilizing stateful attack analysis"}, "answers": ["D"], "explanation": "", "slide_img": "images/q_296_slide_1794419306424.jpg", "note_img": "images/q_296_note_1794419306424.jpg"}, {"id": 297, "subject": "IAO202", "question": "How do end devices determine the correct destination for the data packets they send?", "options": {"A": "They always direct their packets to the default gateway, which will be responsible for the packet delivery.", "B": "They send a query packet to the default gateway asking for the best route.", "C": "They search in their own local routing table for a route to the network destination address and pass this information to the default gateway.", "D": "They have to keep their own local routing table that contains a route to the loopback interface, a local network route. and a remote default route."}, "answers": ["D"], "explanation": "", "slide_img": "images/q_297_slide_1794419308137.jpg", "note_img": "images/q_297_note_1794419308137.jpg"}, {"id": 298, "subject": "IAO202", "question": "A user logs in to Windows with a regular user account and attempts to use an application that requires administrative privileges. What can the user do to successfully use the application?", "options": {"A": "Right-click the application and choose Run as root.", "B": "Right-click the application and choose Run as Privileged", "C": "Right-click the application and choose Run as Administrator.", "D": "Right-click the application and choose Run as Super-user."}, "answers": ["C"], "explanation": "Người dùng đăng nhập Windows bằng tài khoản thường và chạy ứng dụng cần quyền quản trị thì phải làm gì?\nNhắn chuột phải vào ứng dụng và chọn Run as Administrator.\nTùy chọn này cấp quyền đặc quyền tạm thời cho ứng dụng.", "slide_img": "images/q_298_slide_1794419310248.jpg", "note_img": "images/q_298_note_1794419310248.jpg"}, {"id": 299, "subject": "IAO202", "question": "A system administrator runs a file scan utility on a Windows PC and notices a file Isass.exe in the Program Files directory. What should the administrator do?", "options": {"A": "Delete the file because it is probably malware.", "B": "Move it to Program Files (x86) because it is a 32bit application.", "C": "Uninstall the Isass application because it is a legacy application and no longer required by Windows.", "D": "Open the Task Manager, right-click on the Isass process and choose End Task."}, "answers": ["A"], "explanation": "Quản trị viên phát hiện tệp lsass.exe trong thư mục Program Files thì phải làm gì?\nXóa tệp vì rất có thễ đó là malvvare.\nIsass.exe hợp lệ nằm ở C:\\Windows\\System32, nên bản trong Program Files là giả mạo.", "slide_img": "images/q_299_slide_1794419312348.jpg", "note_img": "images/q_299_note_1794419312348.jpg"}, {"id": 300, "subject": "IAO202", "question": "A technician has installed a third party utility that is used to manage a Windows 7 computer. However, the utility does not automatically start whenever the computer is started. What can the technician do to resolve this problem?", "options": {"A": "Change the startup type for the utility to Automatic in Services.", "B": "Set the application registry key value to one.", "C": "Use the Add or Remove Programs utility to set program access and defaults.", "D": "Uninstall the program and then choose Add New Programs in the Add or Remove Programs utility to install the application."}, "answers": ["A"], "explanation": "Một tiện ích Windows 7 không tự khởi động khi máy mở, kỹ thuật viên phải làm gì?\nĐặt chế độ khởi động của tiện ích thành ửtẹmatic trong Services.\nThiết lập này cho phép ứng dụng tự chạy mối khi hệ thống khởi động.", "slide_img": "images/q_300_slide_1794419314481.jpg", "note_img": "images/q_300_note_1794419314481.jpg"}, {"id": 301, "subject": "IAO202", "question": "A company has contracted with a network security firm to help identify the vulnerabilities of the corporate network. The firm sends a team to perform penetration tests to the company network. Why would the team use applications such as Nmap, SuperScan. and Angry IP Scanner?", "options": {"A": "To probe network devices, servers, and hosts for open TCP or UDP ports", "B": "To detect installed tools within files and directories that provide threat actors remote access and control over a computer or network", "C": "To reverse engineer binary files when writing exploits and when analyzing malware", "D": "To detect any evidence of a hack or malware in a computer or network"}, "answers": ["A"], "explanation": "P;Ịi sao nhóm kiếm thử xâm nhập dùng Nmap, SuperScan, Angry IP Scanner?\nĐễ quét thiết bị mạng, máy chủ và host nhằm tìm công TCP hoặc UDP đang mở.\nCác công cụ này giúp xác định điểm yếu qua các dịch vụ đang lắng nghe.", "slide_img": "images/q_301_slide_1794419316745.jpg", "note_img": "images/q_301_note_1794419316745.jpg"}, {"id": 302, "subject": "IAO202", "question": "A user is executing a tracert to a remote device. At what point would a router, which is in the path to the destination device, stop forwarding the packet?", "options": {"A": "when the router receives an ICMP Time Exceeded message", "B": "when the RTT value reaches zero", "C": "when the host responds with an ICMP Echo Reply message", "D": "when the value in the TTL field reaches zero", "E": "when the values of both the Echo Request and Echo Reply messages reach zero"}, "answers": ["D"], "explanation": "", "slide_img": "images/q_302_slide_1794419318587.jpg", "note_img": "images/q_302_note_1794419318587.jpg"}, {"id": 303, "subject": "IAO202", "question": "An administrator suspects polymorphic malware has successfully entered the network past the HIDS system perimeter. The polymorphic malware is, however, successfully identified and isolated. What must the administrator do to create signatures to prevent the file from entering the network again?", "options": {"A": "Execute the polymorphic file in the Cisco Threat Grid Glovebox.", "B": "Run the Cisco Talos security intelligence service.", "C": "Use Cisco AMP to track the trajectory of a file through the network.", "D": "Run a baseline to establish an accepted amount of risk, and the environmental components that contribute to the risk level of the polymorphic malware."}, "answers": ["A"], "explanation": "", "slide_img": "images/q_303_slide_1794419320673.jpg", "note_img": "images/q_303_note_1794419320673.jpg"}, {"id": 304, "subject": "IAO202", "question": "In which way does the use of HTTPS increase the security monitoring challenges within enterprise networks?", "options": {"A": "HTTPS traffic can carry a much larger data payload than HTTP can carry.", "B": "HTTPS traffic is much faster than HTTP traffic", "C": "HTTPS traffic does not require authentication.", "D": "HTTPS traffic enables end-to-end encryption."}, "answers": ["D"], "explanation": "Việc sử dụng HTTPS khiến giám sát an ninh khó khăn hơn như thế nào?\nLưu lượng HTTPS được mã hóa đầu cuối.\nMã hóa khiến hệ thống giám sát không thễ xem nội dung gói tin đễ phân tích.", "slide_img": "images/q_304_slide_1794419322756.jpg", "note_img": "images/q_304_note_1794419322756.jpg"}, {"id": 305, "subject": "IAO202", "question": "What is the role of the Logical Link Control (LLC) sublayer within the data link layer?", "options": {"A": "It is responsible for media access contro!", "B": "It communicates with upper protocol layers.", "C": "It performs data encapsulation.", "D": "It adds a header and trailer to a packet to form an OSI Layer 2 PDU."}, "answers": ["B"], "explanation": "Vai trò của lớp con Logical Link Control (LLC) trong tầng liên kết dữ liệu (Data Link Layer) là gì?\n\nB. I communicates wïth upper protocol layers.\n\n— Nó giao tiếp với các tằng giao thức phía trên.\n\nLLC là lớp con phía trên của Data Link Layer, đóng vai trò giao tiếp giữa các giao thức tầng mạng và lớp con MAC.", "slide_img": "images/q_305_slide_1794419324873.jpg", "note_img": "images/q_305_note_1794419324873.jpg"}, {"id": 306, "subject": "IAO202", "question": "A host is trying to send a packet to a device on a remote LAN segment, but there are currently no mappings in the ARP cache. How will the device obtain a destination MAC address?", "options": {"A": "It will send an ARP request for the MAC address of the destination device.", "B": "It will send the frame and use the device MAC address as the destination.", "C": "It will send the frame with a broadcast MAC address.", "D": "It will send an ARP request for the MAC address of the default gateway.", "E": "It will send an ARP request to the DNS server for the destination MAC address."}, "answers": ["D"], "explanation": "Một host đang có gửi packet đến một thiết bị trên LAN segment từ xa, nhưng hiện tại ARP cache không có ánh xạ nào. Thiết bị sẽ lầy địa chỉ MAC đích bằng cách nào?\nD. It will send an ARP request for tne MAC address oí the default gateway.\n\n— Nó sẽ gửi ARP request đễ tìm địa chỉ MAC của default gatevray.\n\nVì thiết bị đích nằm trên mạng từ xa, host không ARP trực tiếp MAC của thiết bị đích. Nó cần gửi frame đến default gateway nên sế ARP đề tìm MAC của gateway.", "slide_img": "images/q_306_slide_1794419327214.jpg", "note_img": "images/q_306_note_1794419327214.jpg"}, {"id": 307, "subject": "IAO202", "question": "What is the purpose of the TCP sliding window?", "options": {"A": "to ensure that segments arrive in order at the destination", "B": "to end communication when data transmission is complete", "C": "to inform a source to retransmit data from a specific point forward", "D": "to request that a source decrease the rate at which it transmits data"}, "answers": ["D"], "explanation": "Mục đích của TCP sliding window là gì?\n\nD. To request that a source decrease the rate at which ït transmits data\n\n— Yêu cầu nguồn giảm tốc độ truyền dữ liệu.\n\nTCP sliding window là cơ chế flow control. Receiver sử dụng giá trị vvïndow đề thông báo lượng dữ liệu nó có thế tiếp nhận, qua đó điều chình tốc độñượng dữ liệu mà sent", "slide_img": "images/q_307_slide_1794419329242.jpg", "note_img": "images/q_307_note_1794419329242.jpg"}, {"id": 308, "subject": "IAO202", "question": "What focus describes a characteristic of an indicator of attack (IOA)?", "options": {"A": "It focuses more on the motivation behind an attack and the means used to compromise vulnerabilities to gain access to assets.", "B": "It focuses more on the mitigation after an attack and the potential compromised vulnerabilities.", "C": "It focuses more on the risk management strategies after an attack and compromise of systems.", "D": "It focuses more on threat avoidance after an attack and the potential cost implications."}, "answers": ["A"], "explanation": "Đặc điễm nào mô tả trọng tâm của Indicator of Attack (IOA)?\n\nA. Itfocuses more on the motivation behind an attack and the means used to compromise vulnerabililies to gain access to assets.\n\n— Nó tập trung nhiều hơn vào động cơ của cuộc tần công và các phương thức được sử dụng đễ khai thác lỗ hồng nhằm truy cập tài sản.\nIOA tập trung vào hành vĩ, ý định và phương thức của kẻ tần công, giúp nhận diện một cuộc tắn công đang hoặc sắp diễn ra.", "slide_img": "images/q_308_slide_1794419331254.jpg", "note_img": "images/q_308_note_1794419331254.jpg"}, {"id": 309, "subject": "IAO202", "question": "Which is an example of social engineering?", "options": {"A": "Acomputer displaying unauthorized pop-ups and adware", "B": "The infection of a computer by a virus carried by a Trojan", "C": "An anonymous programmer directing a DDoS attack on a data center", "D": "An unidentified person claiming to be a technician collecting user information from employees"}, "answers": ["D"], "explanation": "Điều nào sau đây là một ví dụ về social engineering?\n\nD. An unidentified person claiming to be a technician collecting user information from employees\n\n— Một người không rõ danh tính giả danh kỹ thuật viên đễ thu thập thông tin người dùng từ nhân viên.\n\nSocial engineering khai thác yếu tố con người bằng cách lừa đảo hoặc giả danh đễ khiến nạn nhân cung cấp thông tin nhạy cảm.", "slide_img": "images/q_309_slide_1794419333208.jpg", "note_img": "images/q_309_note_1794419333208.jpg"}, {"id": 310, "subject": "IAO202", "question": "What is the primary function of the Center for Internet Security (CIS)?", "options": {"A": "to maintain a list of common vulnerabilities and exposures (CVE) used by security organizations", "B": "to provide a security news portal that aggregates the latest breaking news pertaining to alerts, exploits, and vulnerabilities", "C": "to offer 24x7 cyberthreat warnings and advisories, vulnerability identification, and mitigation and incident responses", "D": "to provide vendor-neutral education products and career services to industry professionals worldwide"}, "answers": ["C"], "explanation": "Chức năng chính của Center for Internet Security (CIS) là gì?\n\nC. To offer 24x7 cyberthreat warnings and advisories, vulnerability Mentifigatign, and mtigệtion and incident responses\n— Cung cấp cảnh báo và tư vần về các mồi đe dọa mạng 24/7, xác định lỗ hỗng, giảm thiêu rủi ro và ứng phó sự cố.\nTrong các lựa chọn của câu hỏi, C phù hợp nhắt với vai trò hố trợ an ninh mạng và ứng phó mới đe dọa của CIS.", "slide_img": "images/q_310_slide_1794419335830.jpg", "note_img": "images/q_310_note_1794419335830.jpg"}, {"id": 311, "subject": "IAO202", "question": "What is an essential function of SIEM?", "options": {"A": "forwarding traffic and physical layer errors to an analysis device", "B": "providing 24x7 statistics on packets flowing through a Cisco router or multilayer switch", "C": "monitoring traffic and comparing it against the configured rules", "D": "providing reporting and analysis of security events"}, "answers": ["D"], "explanation": "Chức năng thiết yếu của SIEM (Security Information and Event Management) là gì?\n\nD. Providing reporting and analysis of security events\n\n— Cung cấp báo cáo và phân tích các sự kiện bảo mật.\n\nSIEM thu thập, tổng hợp và phân tích log/sự kiện từ nhiều nguồn đễ phát hiện và hố trợ điều tra các vần đề bảo mật.", "slide_img": "images/q_311_slide_1794419338033.jpg", "note_img": "images/q_311_note_1794419338033.jpg"}, {"id": 312, "subject": "IAO202", "question": "How does the adoption of BYOD alter the way businesses design and manage their networks?", "options": {"A": "BYOD devices are more expensive than devices that are purchased by an organization.", "B": "BYOD provides flexibility in where and how users can access network resources.", "C": "BYOD requires organizations to purchase laptops rather than desktops.", "D": "BYOD users are responsible for their own network security, thus reducing the need for organizational security policies."}, "answers": ["B"], "explanation": "Việc áp dụng BYOD (Bring Your Own Device) thay đối cách doanh nghiệp thiết kế và quản lý mạng như thế nào?\n\nB. BYOD provides flexibility In where wg how USers can access network resources.\n\n— BYODmang lại sự linh hoạt về địa điểm và cách thức người dùng truy cập tài nguyên mạng.\n\nBYOD cho phép nhân viên sử dụng thiết bị cá nhân đễ truy cập tài nguyên của tổ chức từ nhiều địa điểm, đồng thời đòi hỏi doanh nghiệp có chính sách bảo mật phù hợp.", "slide_img": "images/q_312_slide_1794419340190.jpg", "note_img": "images/q_312_note_1794419340190.jpg"}, {"id": 313, "subject": "IAO202", "question": "Which action should be specified in a plan component within a computer security incident response capability (CSIRC)?", "options": {"A": "Create an organizational structure and definition of roles, responsibilities, and levels of authority.", "B": "Detail how incidents should be handled based on the mission and functions of an organization.", "C": "Prioritize severity ratings of security incidents.", "D": "Develop metrics for measuring the incident response capability and its effectiveness."}, "answers": ["D"], "explanation": "Hành động nào nên được quy định trong thành phần plan của năng lực ứng phó sự có an ninh máy tính (CSIRC)?\n\nD. Develop metrics for measuring the incident response apạbility and its effectiveness.\n\n— Phát triển các chì số đề đo lường năng lực ứng phó sự có và mức độ hiệu quả của nó.\n\nTrong CSIRC, plan bao gồm cách thức triễn khai và duy trì năng lực incident response, trong đó có việc xác định các chỉ số đề đánh giá hiệu quả.", "slide_img": "images/q_313_slide_1794419342500.jpg", "note_img": "images/q_313_note_1794419342500.jpg"}];
let questions = JSON.parse(JSON.stringify(RAW_QUESTIONS));

const STORAGE_KEY = "slide_quiz_state_v3";
let savedState = {};
try {
  savedState = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
} catch(e) {}

if (savedState.customAnswers) {
  questions.forEach(q => {
    if (savedState.customAnswers[q.id]) {
      q.answers = savedState.customAnswers[q.id];
    }
  });
}

let currentSubject = savedState.currentSubject || "ALL";
let currentMode = "practice";
let activePool = [];
let currentIndex = 0;
let userAttempts = {};
let wrongIds = new Set(savedState.wrongIds || []);

function getSubjectsMap() {
  const map = {};
  questions.forEach(q => {
    const s = q.subject || "Khác";
    map[s] = (map[s] || 0) + 1;
  });
  return map;
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      currentSubject,
      wrongIds: Array.from(wrongIds),
      customAnswers: savedState.customAnswers || {}
    }));
  } catch(e) {}
}

function renderSubjectBar() {
  const bar = document.getElementById("subjectBar");
  const smap = getSubjectsMap();
  const subjects = Object.keys(smap);
  if (currentSubject !== "ALL" && !smap[currentSubject]) {
    currentSubject = subjects.length > 0 ? subjects[0] : "ALL";
  }

  let html = `<span class="subject-label">📂 CHỌN MÔN HỌC:</span>`;
  html += `<button class="subj-pill ${currentSubject === 'ALL' ? 'active' : ''}" onclick="selectSubject('ALL')">Tất cả các môn (${questions.length})</button>`;
  subjects.forEach(s => {
    const active = currentSubject === s ? "active" : "";
    html += `<button class="subj-pill ${active}" onclick="selectSubject('${s.replace(/'/g, "\\'")}')">📘 ${s} (${smap[s]} câu)</button>`;
  });
  bar.innerHTML = html;
}

function renderSubjectsOverview() {
  const box = document.getElementById("subjectsOverview");
  const smap = getSubjectsMap();
  const subjects = Object.keys(smap);

  let cardsHtml = subjects.map(s => {
    const pool = questions.filter(q => (q.subject || "Khác") === s);
    const wrongCount = pool.filter(q => wrongIds.has(q.id)).length;
    let doneCount = 0;
    pool.forEach(q => { if (userAttempts[q.id]?.submitted) doneCount++; });

    return `<div class="subject-card" onclick="openSubjectPractice('${s.replace(/'/g, "\\'")}')">
      <div>
        <div style="font-size:1.25rem;font-weight:700;color:#38bdf8;margin-bottom:6px;">📘 Môn: ${s}</div>
        <div style="color:var(--muted);font-size:0.92rem;">Tổng số: <strong style="color:#fff">${pool.length} câu trắc nghiệm</strong></div>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;padding-top:10px;border-top:1px solid var(--border);font-size:0.85rem;">
        <span>📊 Đã làm: ${doneCount}/${pool.length}</span>
        <span style="color:${wrongCount > 0 ? '#f87171' : '#4ade80'}">🔥 Câu sai: ${wrongCount}</span>
      </div>
    </div>`;
  }).join("");

  box.innerHTML = `
    <h2 style="margin-bottom:14px;font-size:1.25rem;">🗂️ Chọn Môn Học Để Bắt Đầu Làm Quiz</h2>
    <div class="subjects-grid">${cardsHtml}</div>
  `;
}

function openSubjectPractice(subj) {
  currentSubject = subj;
  saveState();
  setMode("practice");
}

function selectSubject(subj) {
  currentSubject = subj;
  saveState();
  rebuildActivePool();
  renderSubjectBar();
  if (currentMode === "subjects") {
    setMode("practice");
  } else if (currentMode === "list") {
    renderListView();
  } else {
    renderCurrentQuestion();
  }
}

function rebuildActivePool() {
  let base = currentSubject === "ALL"
    ? [...questions]
    : questions.filter(q => (q.subject || "Khác") === currentSubject);

  if (currentMode === "wrong") {
    activePool = base.filter(q => wrongIds.has(q.id));
  } else {
    activePool = base;
  }
  currentIndex = 0;
}

function updateHeaderStats() {
  const subjPool = currentSubject === "ALL"
    ? questions
    : questions.filter(q => (q.subject || "Khác") === currentSubject);
  const subjWrongCount = subjPool.filter(q => wrongIds.has(q.id)).length;

  document.getElementById("totalBadge").textContent = subjPool.length + " Câu";
  document.getElementById("wrongCountTab").textContent = subjWrongCount;
  document.getElementById("statSubject").textContent = currentSubject === "ALL" ? "Tất cả các môn" : currentSubject;

  let c = 0, w = 0, done = 0;
  activePool.forEach(q => {
    const att = userAttempts[q.id];
    if (!att || !att.submitted) return;
    done++;
    if (att.isCorrect) c++; else w++;
  });
  document.getElementById("statCorrect").textContent = c;
  document.getElementById("statWrong").textContent = w;
  document.getElementById("statProgress").textContent = done + "/" + activePool.length;
}

function setMode(mode) {
  currentMode = mode;
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
  document.getElementById("tab-" + mode).classList.add("active");

  rebuildActivePool();
  renderSubjectBar();

  document.getElementById("subjectsOverview").style.display = mode === "subjects" ? "block" : "none";
  document.getElementById("quizView").style.display = (mode === "practice" || mode === "wrong") ? "block" : "none";
  document.getElementById("listView").style.display = mode === "list" ? "block" : "none";

  if (mode === "subjects") {
    renderSubjectsOverview();
  } else if (mode === "list") {
    renderListView();
  } else {
    renderCurrentQuestion();
  }
}

function getOptionsForQuestion(q) {
  if (q.options && Object.keys(q.options).length > 0) return q.options;
  const fallback = { A: "Phương án A (Xem trên ảnh Slide)", B: "Phương án B (Xem trên ảnh Slide)", C: "Phương án C (Xem trên ảnh Slide)", D: "Phương án D (Xem trên ảnh Slide)" };
  (q.answers || []).forEach(a => {
    if (!fallback[a]) fallback[a] = "Phương án " + a + " (Xem trên ảnh Slide)";
  });
  return fallback;
}

function renderCurrentQuestion() {
  renderSubjectBar();
  updateHeaderStats();
  const card = document.getElementById("questionCard");
  if (activePool.length === 0) {
    card.innerHTML = `<div style="text-align:center;padding:40px 20px;">
      <h2 style="margin-bottom:10px;">🎉 Không có câu hỏi nào trong mục này!</h2>
      <p style="color:var(--muted);margin-bottom:20px;">Môn học này chưa có câu sai hoặc đã hoàn thành.</p>
      <button class="btn btn-primary" onclick="setMode('practice')">Quay lại Luyện Tập</button>
    </div>`;
    document.getElementById("questionGrid").innerHTML = "";
    return;
  }

  if (currentIndex >= activePool.length) currentIndex = activePool.length - 1;
  if (currentIndex < 0) currentIndex = 0;

  const q = activePool[currentIndex];
  const opts = getOptionsForQuestion(q);
  const hasOcrOptions = q.options && Object.keys(q.options).length > 0;
  const forceShowSlide = document.getElementById("toggleSlideImg").checked || !q.question || !hasOcrOptions;
  const attempt = userAttempts[q.id] || { selected: [], submitted: false, isCorrect: false };
  const requiredCount = Math.max(1, (q.answers || []).length);

  let multiHintHtml = "";
  if (requiredCount > 1) {
    multiHintHtml = `<div class="multi-hint">📌 Câu có ${requiredCount} đáp án đúng — Hãy chọn đủ ${requiredCount} phương án (Đã chọn: ${attempt.selected.length}/${requiredCount})</div>`;
  }

  let slideImgHtml = "";
  if (forceShowSlide && q.slide_img) {
    slideImgHtml = `<div class="slide-img-box"><img loading="lazy" src="${q.slide_img}" alt="Slide ${q.id}"></div>`;
  }

  let optionsHtml = "";
  Object.keys(opts).sort().forEach(letter => {
    let cls = "option-btn";
    const isPicked = attempt.selected.includes(letter);
    const isRight = q.answers.includes(letter);

    if (attempt.submitted) {
      cls += " locked";
      if (isRight && isPicked) cls += " correct";
      else if (isRight && !isPicked) cls += " missed";
      else if (!isRight && isPicked) cls += " wrong";
    } else if (isPicked) {
      cls += " selected";
    }

    optionsHtml += `
      <button class="${cls}" onclick="selectOption(${q.id}, '${letter}')">
        <span class="opt-letter">${letter}</span>
        <span>${opts[letter]}</span>
      </button>
    `;
  });

  let feedbackHtml = "";
  if (attempt.submitted) {
    const ansText = q.answers.length ? q.answers.join(", ") : "Chưa xác định (Xem ảnh ghi chú bên dưới)";
    const statusText = attempt.isCorrect
      ? `<span style="color:#4ade80">✅ CHÍNH XÁC! Đáp án đúng là: ${ansText}</span>`
      : `<span style="color:#f87171">❌ CHƯA ĐÚNG! Bạn chọn: ${attempt.selected.join(", ")} — Đáp án đúng là: ${ansText}</span>`;

    const expHtml = q.explanation
      ? `<div style="margin-top:8px;color:#e2e8f0;white-space:pre-line;">${q.explanation}</div>`
      : "";

    const noteImgHtml = q.note_img
      ? `<div style="margin-top:10px;"><div style="font-size:0.82rem;color:var(--muted);margin-bottom:4px;">Ảnh chụp vùng Đáp án / Giải thích gốc:</div><div class="note-img-wrap"><img loading="lazy" src="${q.note_img}" alt="Answer Note"></div></div>`
      : "";

    feedbackHtml = `
      <div class="feedback-box">
        <div class="feedback-title">${statusText}</div>
        ${expHtml}
        ${noteImgHtml}
      </div>
    `;
  }

  card.innerHTML = `
    <div class="q-header">
      <div>
        <span class="q-number">CÂU ${currentIndex + 1} / ${activePool.length}</span>
        <span class="subj-tag">📘 Môn: ${q.subject || 'Chung'}</span>
      </div>
      <div style="display:flex;gap:8px;align-items:center;">
        <span class="kbd-hint">Sửa đáp án đúng (VD: C hoặc ADE):</span>
        <input class="edit-ans-input" value="${q.answers.join('')}" onchange="overrideAnswer(${q.id}, this.value)">
      </div>
    </div>
    ${multiHintHtml}
    <div class="q-text">${q.question || "(Xem nội dung câu hỏi trên ảnh Slide bên dưới)"}</div>
    ${slideImgHtml}
    <div class="options-grid">${optionsHtml}</div>
    ${feedbackHtml}
    <div class="nav-footer">
      <button class="btn" onclick="prevQuestion()" ${currentIndex===0?'disabled':''}>⬅ Câu trước (←)</button>
      <span class="kbd-hint">Phím tắt: Bấm <b>1-6</b> hoặc <b>A-F</b> để chọn, <b>Space / →</b> sang câu tiếp</span>
      <button class="btn btn-primary" onclick="nextQuestion()" ${currentIndex===activePool.length-1?'disabled':''}>Câu tiếp theo (→) ➡</button>
    </div>
  `;

  renderQuestionGrid();
}

function evaluateSelection(q, selectedList) {
  if (!q.answers || q.answers.length === 0) return true;
  const s1 = [...selectedList].sort().join(",");
  const s2 = [...q.answers].sort().join(",");
  return s1 === s2;
}

function selectOption(qId, letter) {
  const q = activePool.find(item => item.id === qId);
  if (!q) return;

  let att = userAttempts[qId];
  if (!att) {
    att = { selected: [], submitted: false, isCorrect: false };
    userAttempts[qId] = att;
  }
  if (att.submitted) return;

  const requiredCount = Math.max(1, (q.answers || []).length);

  if (att.selected.includes(letter)) {
    att.selected = att.selected.filter(x => x !== letter);
  } else {
    att.selected.push(letter);
  }

  if (att.selected.length >= requiredCount) {
    att.submitted = true;
    att.isCorrect = evaluateSelection(q, att.selected);
    if (!att.isCorrect) {
      wrongIds.add(qId);
    } else {
      wrongIds.delete(qId);
    }
    saveState();
  }
  renderCurrentQuestion();
}

function overrideAnswer(qId, rawStr) {
  const letters = (rawStr.toUpperCase().match(/[A-F]/g) || []);
  const uniq = [...new Set(letters)];
  if (uniq.length === 0) return;

  const q = questions.find(item => item.id === qId);
  if (q) q.answers = uniq;
  const pq = activePool.find(item => item.id === qId);
  if (pq) pq.answers = uniq;

  if (!savedState.customAnswers) savedState.customAnswers = {};
  savedState.customAnswers[qId] = uniq;
  delete userAttempts[qId];
  saveState();
  renderCurrentQuestion();
}

function prevQuestion() {
  if (currentIndex > 0) {
    currentIndex--;
    renderCurrentQuestion();
  }
}

function nextQuestion() {
  if (currentIndex < activePool.length - 1) {
    currentIndex++;
    renderCurrentQuestion();
  }
}

function jumpToQuestion(idx) {
  currentIndex = idx;
  renderCurrentQuestion();
}

function shuffleQuestions() {
  for (let i = activePool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [activePool[i], activePool[j]] = [activePool[j], activePool[i]];
  }
  currentIndex = 0;
  renderCurrentQuestion();
}

function resetProgress() {
  activePool.forEach(q => {
    delete userAttempts[q.id];
  });
  currentIndex = 0;
  renderCurrentQuestion();
}

function renderQuestionGrid() {
  const grid = document.getElementById("questionGrid");
  grid.innerHTML = activePool.map((q, idx) => {
    let cls = "grid-dot";
    if (idx === currentIndex) cls += " current";
    const att = userAttempts[q.id];
    if (att && att.submitted) cls += att.isCorrect ? " done-ok" : " done-bad";
    return `<button class="${cls}" onclick="jumpToQuestion(${idx})">${idx + 1}</button>`;
  }).join("");
}

function renderListView() {
  renderSubjectBar();
  updateHeaderStats();
  const kw = (document.getElementById("searchInput").value || "").toLowerCase().trim();
  const container = document.getElementById("listContainer");
  const pool = currentSubject === "ALL"
    ? questions
    : questions.filter(q => (q.subject || "Khác") === currentSubject);

  const filtered = pool.filter(q => {
    if (!kw) return true;
    const textBlob = (q.question + " " + Object.values(q.options || {}).join(" ") + " " + q.explanation).toLowerCase();
    return textBlob.includes(kw);
  });

  container.innerHTML = filtered.map((q, idx) => {
    const opts = getOptionsForQuestion(q);
    const optsList = Object.keys(opts).sort().map(k => {
      const isRight = q.answers.includes(k);
      return `<div style="padding:4px 0;${isRight ? 'color:#4ade80;font-weight:700;' : 'color:#cbd5e1;'}">
        ${isRight ? '✓ ' : '&nbsp;&nbsp;&nbsp;'}${k}. ${opts[k]}
      </div>`;
    }).join("");

    return `<div class="list-item">
      <div style="display:flex;justify-content:space-between;margin-bottom:8px;">
        <div>
          <strong style="color:var(--primary)">Câu ${idx + 1} (#${q.id})</strong>
          <span class="subj-tag">📘 ${q.subject || 'Chung'}</span>
        </div>
        <span style="color:#4ade80;font-weight:700;">Đáp án đúng: ${q.answers.join(", ") || "?"}</span>
      </div>
      <div style="font-weight:600;font-size:1.05rem;margin-bottom:10px;">${q.question || "(Câu hỏi hình ảnh)"}</div>
      ${q.slide_img ? `<div style="margin-bottom:10px;"><img loading="lazy" src="${q.slide_img}" style="max-height:180px;border-radius:8px;background:#fff;padding:4px;"></div>` : ''}
      <div style="margin-bottom:10px;">${optsList}</div>
      ${q.explanation ? `<div style="color:#cbd5e1;font-size:0.93rem;white-space:pre-line;margin-top:6px;">${q.explanation}</div>` : ''}
      ${q.note_img ? `<div class="note-img-wrap"><img loading="lazy" src="${q.note_img}" style="max-height:110px;"></div>` : ''}
    </div>`;
  }).join("");
}

document.addEventListener("keydown", (e) => {
  if (currentMode !== "practice" && currentMode !== "wrong") return;
  if (["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement?.tagName)) return;
  const key = e.key.toUpperCase();
  const q = activePool[currentIndex];
  if (!q) return;

  const keyMap = { "1": "A", "2": "B", "3": "C", "4": "D", "5": "E", "6": "F", "A": "A", "B": "B", "C": "C", "D": "D", "E": "E", "F": "F" };
  if (keyMap[key]) {
    e.preventDefault();
    selectOption(q.id, keyMap[key]);
  } else if (e.key === "ArrowRight" || e.key === " ") {
    e.preventDefault();
    nextQuestion();
  } else if (e.key === "ArrowLeft") {
    e.preventDefault();
    prevQuestion();
  }
});

rebuildActivePool();
renderCurrentQuestion();
</script>
</body>
</html>
