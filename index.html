5.jpg", "note_img": "images/q_342_note_1794473713605.jpg"}, {"id": 343, "subject": "GLI202", "question": "Which type of container is used for oversized cargo?", "options": {"A": "Flat rack container", "B": "Reefer container", "C": "Tank container", "D": "Open top only"}, "answers": ["A"], "explanation": "Loại container nào được sử dụng cho hàng hóa quá khổ?\nA. Flat rack container (Container mặt bằng) — Flat rack container có kết cầu phù hợp với hàng quá khổ hoặc hàng nặng như máy móc và thiết bị công nghiệp.", "slide_img": "images/q_343_slide_1794473715252.jpg", "note_img": "images/q_343_note_1794473715252.jpg"}, {"id": 344, "subject": "GLI202", "question": "Which means of dispute resolution is described as convenient, fast, simple, flexible, efficient, and inexpensive?", "options": {"A": "Arbitration", "B": "Litigation", "C": "Negotiation", "D": "Mediation"}, "answers": ["C"], "explanation": "Phương thức giải quyết tranh chấp nào được mô tả là thuận tiện, nhanh chóng, đơn giản, linh hoạt, hiệu quả và ít tốn kém?\nC. Negotiation (Thương lượng) — Negotiation cho phép các bên trực tiếp trao đổi đề đạt thỏa thuận mà không cần đưa tranh chấp ra tòa án.", "slide_img": "images/q_344_slide_1794473716964.jpg", "note_img": "images/q_344_note_1794473716964.jpg"}, {"id": 345, "subject": "GLI202", "question": "Which term refers to the total value of goods and services exported minus imports?", "options": {"A": "Balance of Payments.", "B": "Balance of Trade", "C": "Exchange Rate", "D": "GDP"}, "answers": ["B"], "explanation": "Thuật ngữ nào chỉ tổng giá trị hàng hóa và dịch vụ xuất khẩu trừ đi nhập khẩu?\nB. Balance of Trade (Cán cân thương mại)\n— Balance of Trade đo chênh lệch giữa xuất khẩu và nhập khẩu. Xuất khẩu lớn hơn nhập khẩu tạo ra thăng dư thương mại.", "slide_img": "images/q_345_slide_1794473718724.jpg", "note_img": "images/q_345_note_1794473718724.jpg"}, {"id": 346, "subject": "GLI202", "question": "Which department ensures compliance with international trade laws?", "options": {"A": "Legal or Compliance Department", "B": "HR Department", "C": "Sales Department", "D": "Operations Department"}, "answers": ["A"], "explanation": "Bộ phận nào đảm bảo doanh nghiệp tuân thủ các quy định pháp luật về thương mại quốc tê?\nA. Legal or Compliance Department (Bộ phận pháp lý hoặc tuân thủ) — Legal/Compliance Department kiểm tra các yêu cầu pháp luật, quy định xuất nhập khẩu và nghĩa vụ tuân thủ của\ndoanh nghiệp.", "slide_img": "images/q_346_slide_1794473720368.jpg", "note_img": "images/q_346_note_1794473720368.jpg"}, {"id": 347, "subject": "GLI202", "question": "Which FIATA document is related to dangerous goods?", "options": {"A": "Shipper's Declaration for Dangerous Goods", "B": "FIATA Consignment Note", "C": "Certificate of Insurance", "D": "Air Waybill"}, "answers": ["A"], "explanation": "Chứng từ FIATA nào liên quan đến hàng hóa nguy hiểm?\nA. Shipper's Declaration for Dangerous Goods (Tờ khai hàng hóa nguy hiểm của người gửi hàng) › Chứng từ này khai báo thông tin về hàng nguy hiểm đề phục vụ việc vận chuyền\nan toàn. Trong các lựa chọn của đề, A phù hợp nhất, dù đây không phải chứng từ chỉ riêng FIATA ban hành.", "slide_img": "images/q_347_slide_1794473722170.jpg", "note_img": "images/q_347_note_1794473722170.jpg"}, {"id": 348, "subject": "GLI202", "question": "Which function is most critical in a contract management team for ensuring legal compliance?", "options": {"A": "Legal and compliance expertise", "B": "Sales and promotion", "C": "Warehouse operations", "D": "Product design only"}, "answers": ["A"], "explanation": "Chức năng nào quan trọng nhất trong nhóm quản lý hợp đồng để đảm bảo tuân thủ pháp luật?\nA. Legal and compliance expertise (Chuyên môn pháp lý và tuân thủ) › Legal and compliance expertise giúp kiểm tra điều khoản, nhận diện rủi ro pháp lý và đảm bảo hợp đồng phù\nhợp với quy định hiện hành.", "slide_img": "images/q_348_slide_1794473724069.jpg", "note_img": "images/q_348_note_1794473724069.jpg"}, {"id": 349, "subject": "GLI202", "question": "Which major port is located in Singapore?", "options": {"A": "Port Klang", "B": "Port of Singapore", "C": "Port of Rotterdam", "D": "Port of Los Angeles"}, "answers": ["B"], "explanation": "Cảng biển lớn nào nằm tại Singapore?\nB. Port of Singapore (Cảng Singapore) — Port of Singapore là cảng biển quan trọng phục vụ hoạt động vận tải container và trung chuyền hàng hóa quốc té.", "slide_img": "images/q_349_slide_1794473725734.jpg", "note_img": "images/q_349_note_1794473725734.jpg"}, {"id": 350, "subject": "GLI202", "question": "Which factor is listed as a DYNAMIC of the Supply Market?", "options": {"A": "Locations of suppliers", "B": "Current & future of suppliers’ capabilities", "C": "Supply market's change and development", "D": "Sources of supply"}, "answers": ["C"], "explanation": "Yếu tố nào thuộc nhóm Dynamics (Động lực biến đổi) của thị trường cung ứng?\nC. Supply market's change and development (Sự thay đôi và phát triên của thị trường cung ứng) = Supply Market Dynamics tập trung vào xu hướng và sự biến động của thị trường\ntheo thời gian.", "slide_img": "images/q_350_slide_1794473727498.jpg", "note_img": "images/q_350_note_1794473727498.jpg"}, {"id": 351, "subject": "GLI202", "question": "Which internal role in sourcing is defined as the party who disseminates and controls information flows?", "options": {"A": "Users", "B": "Gatekeepers", "C": "Initiators", "D": "Influencers"}, "answers": ["B"], "explanation": "Trong hoạt động tìm nguồn cung ứng, vai trò nội bộ nào chịu trách nhiệm phân phối và kiểm soát luồng thông tin?\nB. Gatekeepers (Người kiểm soát thông tin) › Gatekeepers kiểm soát việc tiếp nhận và truyền đạt thông tin giữa các bên tham gia quá trình mua hàng.", "slide_img": "images/q_351_slide_1794473729279.jpg", "note_img": "images/q_351_note_1794473729279.jpg"}, {"id": 352, "subject": "GLI202", "question": "Which organization is responsible for promoting free and fair trade globally?", "options": {"A": "World Trade Organization (WTO)", "B": "United Nations (UN)", "C": "International Monetary Fund (IMF)", "D": "World Bank"}, "answers": ["A"], "explanation": "Tổ chức nào chịu trách nhiệm thúc đầy thương mại tự do và công bằng trên toàn cầu?\nA. World Trade Organization - WTO (Tổ chức Thương mại Thế giới) — WTO xây dựng và giám sát các quy tắc thương mại quốc tế, hỗ trợ giải quyết tranh chấp giữa các thành viên.", "slide_img": "images/q_352_slide_1794473731058.jpg", "note_img": "images/q_352_note_1794473731058.jpg"}, {"id": 353, "subject": "GLI202", "question": "Which city is considered the main air cargo hub in Asia?", "options": {"A": "Tokyo", "B": "Hong Kong", "C": "Seoul", "D": "Bangkok"}, "answers": ["B"], "explanation": "Thành phố nào được xem là trung tâm vận tải hàng hóa hàng không quan trọng của châu Á?\nB. Hong Kong (Hồng Kông) — Hong Kong là một trong những trung tâm hàng không vận chuyền hàng hóa quốc tế lớn, có mạng lưới kết nói thương mại rộng.", "slide_img": "images/q_353_slide_1794473732891.jpg", "note_img": "images/q_353_note_1794473732891.jpg"}, {"id": 354, "subject": "GLI202", "question": "Which type of trade involves exchanging goods directly without using money?", "options": {"A": "Barter trade", "B": "Direct investment", "C": "Franchise trade", "D": "None of these"}, "answers": ["A"], "explanation": "Loại hình thương mại nào trao đổi hàng hóa trực tiếp mà không sử dụng tiền?\nA. Barter trade (Thương mại hàng đồi hàng) — Barter trade là hình thức trao đổi hàng hóa hoặc dịch vụ lầy hàng hóa hoặc dịch vụ khác mà không thanh toán bằng tiền.", "slide_img": "images/q_354_slide_1794473734549.jpg", "note_img": "images/q_354_note_1794473734549.jpg"}, {"id": 355, "subject": "GLI202", "question": "ee Which organization supports developing countries in improving trade logistics capacity?", "options": {"A": "UNCTAD BWTO", "C": "OECD", "D": "ADB"}, "answers": ["A"], "explanation": "Tổ chức nào hỗ trợ các quốc gia đang phát triển nâng cao năng lực logistics phục vụ thương mại?\nA. UNCTAD (Hội nghị Liên Hợp Quốc về Thương mại và Phát triển) ¬ UNCTAD hỗ trợ các nước đang phát triển cải thiện năng lực thương mại, vận tải và tạo thuận lợi thương mại.", "slide_img": "images/q_355_slide_1794473736376.jpg", "note_img": "images/q_355_note_1794473736376.jpg"}, {"id": 356, "subject": "GLI202", "question": "The ICC is known for publishing which widely used trade terms?", "options": {"A": "ISO Codes", "B": "Incoterms", "C": "HS Codes", "D": "Dangerous Goods Codes"}, "answers": ["B"], "explanation": "ICC được biết đến với việc ban hành bộ quy tắc thương mại quốc tế phổ biến nào?\nB. Incoterms (Các điều kiện thương mại quốc tế) — Incoterms do ICC ban hành, quy định trách nhiệm, chi phí và thời điểm chuyền giao rủi ro giữa người mua và người bán.", "slide_img": "images/q_356_slide_1794473738107.jpg", "note_img": "images/q_356_note_1794473738107.jpg"}, {"id": 357, "subject": "GLI202", "question": "Which of the following focuses on global customs standards and simplification? AWCO BWTO", "options": {"C": "IATA", "D": "FIATA"}, "answers": ["A"], "explanation": "Tổ chức nào tập trung vào tiêu chuần hải quan toàn cầu và đơn giản hóa thủ tục hải quan?\nA. WGO - World Customs Organization (Tổ chức Hải quan Thế giới) › WCO thúc đầy hợp tác hải quan, xây dựng tiêu chuẩn và hỗ trợ đơn giản hóa thủ tục thông quan.", "slide_img": "images/q_357_slide_1794473739907.jpg", "note_img": "images/q_357_note_1794473739907.jpg"}, {"id": 358, "subject": "GLI202", "question": "ee Which organization promotes international air transport safety and cooperation?", "options": {"A": "FIATA", "B": "IATA CWTO", "D": "UNCTAD"}, "answers": ["B"], "explanation": "Tổ chức nào thúc đầy an toàn và hợp tác trong vận tải hàng không quóc té?\nB. IATA - International Air Transport Association (Hiệp hội Vận tải Hàng không Quốc tế) › IATA xây dựng các tiêu chuần và hướng dẫn nghiệp vụ nhằm thúc đầy hoạt động vận tải\nhàng không an toàn, hiệu quả.", "slide_img": "images/q_358_slide_1794473741748.jpg", "note_img": "images/q_358_note_1794473741748.jpg"}, {"id": 359, "subject": "GLI202", "question": "Who is responsible for ensuring all departments align with the company's objectives?", "options": {"A": "General Manager or Managing Director", "B": "Documentation Clerk", "C": "IT Administrator", "D": "Customs Officer"}, "answers": ["A"], "explanation": "Ai chịu trách nhiệm đảm bảo tất cả các phòng ban hoạt động phù hợp với mục tiêu chung của doanh nghiệp?\nA. General Manager or Managing Director (Tông giám đốc hoặc Giám đóc điều hành) › General Manager/Managing Director định hướng và phối hợp hoạt động giữa các bộ phận đề\nđạt mục tiêu tổ chức.", "slide_img": "images/q_359_slide_1794473743521.jpg", "note_img": "images/q_359_note_1794473743521.jpg"}, {"id": 360, "subject": "GLI202", "question": "Which document is typically used to request payment in international trade?", "options": {"A": "Invoice", "B": "Packing List", "C": "Bill of Lading", "D": "Delivery Note"}, "answers": ["A"], "explanation": "Chứng từ nào thường được sử dụng đề yêu cầu thanh toán trong thương mại quốc té?\nA. Invoice (Hóa đơn thương mại) — Invoice ghi rõ hàng hóa, số lượng, đơn giá và tồng số tiền mà người mua cần thanh toán.", "slide_img": "images/q_360_slide_1794473745328.jpg", "note_img": "images/q_360_note_1794473745328.jpg"}, {"id": 361, "subject": "GLI202", "question": "ee Which legal principle governs liability for loss in international carriage?", "options": {"A": "Hague-Visby Rules", "B": "Kyoto Protocol", "C": "ISO 9001", "D": "MARPOL"}, "answers": ["A"], "explanation": "Bộ quy tắc pháp lý nào điều chỉnh trách nhiệm đồi với mất mát hàng hóa trong vận chuyển quốc té?\nA. Hague-Visby Rules (Quy tắc Hague-Visby) — Hague-Visby Rules quy định trách nhiệm của người vận chuyển đồi với hàng hóa trong vận tải biển quóc té. Việc áp dụng phụ thuộc vào\ntuyến vận tải, hợp đồng và hệ thống pháp luật liên quan.", "slide_img": "images/q_361_slide_1794473747374.jpg", "note_img": "images/q_361_note_1794473747374.jpg"}, {"id": 362, "subject": "GLI202", "question": "Which document certifies that goods have been shipped as per contract?", "options": {"A": "Bill of Lading", "B": "Invoice", "C": "Insurance Certificate", "D": "Quotation"}, "answers": ["A"], "explanation": "Chứng từ nào xác nhận hàng hóa đã được gửi vận chuyền theo hợp đồng?\nA. Bill of Lading (Vận đơn đường biên) — Bill of Lading (B/L) là chứng từ vận tải xác nhận việc người vận chuyền đã nhận hàng hoặc hàng đã được xép lên tàu, tùy loại vận đơn.", "slide_img": "images/q_362_slide_1794473749190.jpg", "note_img": "images/q_362_note_1794473749190.jpg"}, {"id": 363, "subject": "GLI202", "question": "Which Incoterm places maximum responsibility on the seller?", "options": {"A": "DDP", "B": "FOB", "C": "CIF", "D": "EXW"}, "answers": ["A"], "explanation": "Điều kiện Incoterms nào đặt trách nhiệm lớn nhất lên người bán?\nA. DDP - Delivered Duty Paid (Giao hàng đã thông quan nhập khẩu và nộp thuế) ¬ DDP yêu cầu người bán chịu phần lớn trách nhiệm, chỉi phí và rủi ro để đưa hàng đến địa điểm đích đã\nthỏa thuận, bao gồm thông quan nhập khẩu và nộp các khoản thuế liên quan.", "slide_img": "images/q_363_slide_1794473751093.jpg", "note_img": "images/q_363_note_1794473751093.jpg"}, {"id": 364, "subject": "GLI202", "question": "Which canal connects the Mediterranean Sea to the Red Sea?", "options": {"A": "Panama Canal", "B": "Suez Canal", "C": "Kiel Canal", "D": "Corinth Canal"}, "answers": ["B"], "explanation": "Kênh đào nào nối Địa Trung Hải với Biển Đỏ?\nB. Suez Canal (Kênh đào Suez) —› Suez Canal nằm tại Ai Cập, kết nói Địa Trung Hải và Biển Đỏ, giúp tàu biển di chuyền giữa châu Âu và châu Á mà không cần vòng qua châu Phi.", "slide_img": "images/q_364_slide_1794473752902.jpg", "note_img": "images/q_364_note_1794473752902.jpg"}, {"id": 365, "subject": "GLI202", "question": "Which port serves as the main gateway to Europe for Asian goods?", "options": {"A": "Rotterdam", "B": "Hamburg", "C": "Antwerp", "D": "Genoa"}, "answers": ["A"], "explanation": "Cảng nào được xem là cửa ngõ chính của châu Âu đồi với hàng hóa đến từ châu Á?\nA. Rotterdam (Cảng Rotterdam) — Port of Rotterdam tại Hà Lan là một trung tâm logistics và cửa ngõ thương mại quan trọng của châu Âu.", "slide_img": "images/q_365_slide_1794473754674.jpg", "note_img": "images/q_365_note_1794473754674.jpg"}, {"id": 366, "subject": "GLI202", "question": "Which European city has one of the largest inland ports?", "options": {"A": "Duisburg", "B": "Paris", "C": "Vienna", "D": "Zurich"}, "answers": ["A"], "explanation": "Thành phố nào ở châu Âu có một trong những cảng nội địa lớn nhất?\nA. Duisburg (Thành phó Duisburg, Đức) — Duisburg nổi tiềng với cảng nội địa lớn, kết nồi vận tải đường thủy, đường sắt và đường bộ.", "slide_img": "images/q_366_slide_1794473756268.jpg", "note_img": "images/q_366_note_1794473756268.jpg"}, {"id": 367, "subject": "GLI202", "question": "Which term refers to cargo requiring special handling due to size, weight, or nature?", "options": {"A": "Project cargo", "B": "General cargo", "C": "Bulk cargo", "D": "Breakbulk"}, "answers": ["A"], "explanation": "Thuật ngữ nào chỉ loại hàng hóa cần được xử lý đặc biệt do kích thước, trọng lượng hoặc tính chất của hàng?\nA. Project cargo (Hàng dự án) — Project cargo thường gồm máy móc, thiết bị công nghiệp hoặc cầu kiện lớn, cằn phương án vận chuyền và bốc xép chuyên biệt.", "slide_img": "images/q_367_slide_1794473757987.jpg", "note_img": "images/q_367_note_1794473757987.jpg"}, {"id": 368, "subject": "GLI202", "question": "Which system allows electronic data interchange between logistics partners? AEDI", "options": {"B": "ERP CGPS", "D": "RFID"}, "answers": ["A"], "explanation": "Hệ thống nào cho phép trao đồi dữ liệu điện tử giữa các đối tác logistics?\nA. EDI - Electronic Data Interchange (Trao đôi dữ liệu điện tử) › EDI cho phép doanh nghiệp trao đổi các chứng từ và dữ liệu kinh doanh theo định dạng điện tử tiêu chuẩn, giảm thao\ntác nhập liệu thủ công.", "slide_img": "images/q_368_slide_1794473759780.jpg", "note_img": "images/q_368_note_1794473759780.jpg"}, {"id": 369, "subject": "GLI202", "question": "Which ICT tool supports digital booking and shipment management?", "options": {"A": "Freight Management System (FMS)", "B": "Accounting Software", "C": "Photo Editing Software", "D": "Word Processor"}, "answers": ["A"], "explanation": "Công cụ ICT nào hỗ trợ đặt chỗ vận chuyển và quản lý lô hàng bằng phương thức số?\nA. Freight Management System - FMS (Hệ thốóng quản lý giao nhận vận tải) › FMS hỗ trợ booking, theo dõi lô hàng, quản lý chứng từ và điều phói hoạt động vận chuyển.", "slide_img": "images/q_369_slide_1794473761509.jpg", "note_img": "images/q_369_note_1794473761509.jpg"}, {"id": 370, "subject": "GLI202", "question": "Which of the following technologies improves warehouse automation?", "options": {"A": "RFID", "B": "Fax machine", "C": "Typewriter", "D": "Telephone"}, "answers": ["A"], "explanation": "Công nghệ nào giúp cải thiện khả năng tự động hóa kho hàng?\nA. RFID - Radio Frequency Identification (Nhận dạng bằng sóng vô tuyến) —› RFID cho phép nhận diện và theo dõi hàng hóa bằng thẻ điện tử, hỗ trợ kiểm kê và quản lý tồn kho.", "slide_img": "images/q_370_slide_1794473763326.jpg", "note_img": "images/q_370_note_1794473763326.jpg"}, {"id": 371, "subject": "GLI202", "question": "Documentation used for measuring progress against quality requirements specifically includes which of the following?", "options": {"A": "Only the minutes of all site safety meetings", "B": "Inspection reports, laboratory tests, and certificates of quality", "C": "The contractor's full payroll records", "D": "None of these"}, "answers": ["B"], "explanation": "Những tài liệu nào được sử dụng đề đo lường tiền độ đáp ứng các yêu cầu chất lượng?\nB. Inspection reports, laboratory tests, and certificates of quality (Báo cáo kiêm tra, kết quả thử nghiệm và chứng nhận chất lượng) — Các tài liệu này cung cấp bằng chứng đề\nđánh giá sản phẩm hoặc công việc có đáp ứng tiêu chuần chất lượng đã thỏa thuận hay không.", "slide_img": "images/q_371_slide_1794473765223.jpg", "note_img": "images/q_371_note_1794473765223.jpg"}, {"id": 372, "subject": "GLI202", "question": "Which type of trade involves exchanging goods directly without using money?", "options": {"A": "Barter trade", "B": "Direct investment", "C": "Franchise trade", "D": "None of these"}, "answers": ["A"], "explanation": "Loại hình thương mại nào trao đổi hàng hóa trực tiếp mà không sử dụng tiền?\nA. Barter trade (Thương mại hàng đồi hàng) = Barter trade là hình thức trao đổi hàng hóa hoặc dịch vụ trực tiếp lắy hàng hóa hoặc dịch vụ khác.", "slide_img": "images/q_372_slide_1794473766931.jpg", "note_img": "images/q_372_note_1794473766931.jpg"}, {"id": 373, "subject": "GLI202", "question": "Which organization supports developing countries in improving trade logistics capacity?", "options": {"A": "UNCTAD BWTO", "C": "OECD", "D": "ADB"}, "answers": ["A"], "explanation": "Tổ chức nào hỗ trợ các quốc gia đang phát triển nâng cao năng lực logistics phục vụ thương mại?\nA. UNCTAD (Hội nghị Liên Hợp Quốc về Thương mại và Phát triển) * UNCTAD hỗ trợ các nước đang phát triển cải thiện hoạt động thương mại, vận tải và tạo thuận lợi thương mại.", "slide_img": "images/q_373_slide_1794473768703.jpg", "note_img": "images/q_373_note_1794473768703.jpg"}, {"id": 374, "subject": "GLI202", "question": "Which of the following focuses on global customs standards and simplification? AWCO BWTO", "options": {"C": "IATA", "D": "FIATA"}, "answers": ["A"], "explanation": "Tổ chức nào tập trung xây dựng tiêu chuần hải quan toàn cầu và đơn giản hóa thủ tục hải quan?\nA. WGO - World Customs Organization (Tổ chức Hải quan Thế giới) › WCO thúc đầy hợp tác hải quan, tiêu chuẩn hóa thủ tục và nâng cao hiệu quả thông quan quóc té.", "slide_img": "images/q_374_slide_1794473770455.jpg", "note_img": "images/q_374_note_1794473770455.jpg"}, {"id": 375, "subject": "GLI202", "question": "", "options": {"A": "FIATA", "B": "IATA CWTO", "D": "UNCTAD"}, "answers": ["B"], "explanation": "Tổ chức nào thúc đầy an toàn và hợp tác trong vận tải hàng không quóc té?\nB. IATA - International Air Transport Association (Hiệp hội Vận tải Hàng không Quóốc tế) — IATA xây dựng các tiêu chuần nghiệp vụ và hướng dẫn nhằm thúc đầy vận tải hàng không\nan toàn, hiệu quả.", "slide_img": "images/q_375_slide_1794473772332.jpg", "note_img": "images/q_375_note_1794473772332.jpg"}, {"id": 376, "subject": "GLI202", "question": "Who is responsible for ensuring all departments align with the company’s objectives?", "options": {"A": "General Manager or Managing Director", "B": "Documentation Clerk", "C": "IT Administrator", "D": "Customs Officer"}, "answers": ["A"], "explanation": "Ai chịu trách nhiệm đảm bảo tất cả các phòng ban hoạt động phù hợp với mục tiêu của doanh nghiệp?\nA. General Manager or Managing Director (Tông giám đóốc hoặc Giám đóc điều hành) — Người quản lý cấp cao có trách nhiệm định hướng, điều phối và giám sát hoạt động giữa các\nbộ phận.", "slide_img": "images/q_376_slide_1794473774177.jpg", "note_img": "images/q_376_note_1794473774177.jpg"}, {"id": 377, "subject": "GLI202", "question": "Which document is typically used to request payment in international trade?", "options": {"A": "Invoice", "B": "Packing List", "C": "Bill of Lading", "D": "Delivery Note"}, "answers": ["A"], "explanation": "Chứng từ nào thường được sử dụng đề yêu cầu thanh toán trong thương mại quốc té?\nA. Invoice (Hóa đơn thương mại) — Invoice thể hiện thông tin hàng hóa, số lượng, đơn giá và tồng số tiền người mua cần thanh toán.", "slide_img": "images/q_377_slide_1794473775917.jpg", "note_img": "images/q_377_note_1794473775917.jpg"}, {"id": 378, "subject": "GLI202", "question": "Which legal principle governs liability for loss in international carriage?", "options": {"A": "Hague-Visby Rules", "B": "Kyoto Protocol", "C": "ISO 9001", "D": "MARPOL"}, "answers": ["A"], "explanation": "Bộ quy tắc nào điều chỉnh trách nhiệm đối với tồn thất hàng hóa trong vận chuyển quốc té?\nA. Hague-Visby Rules (Quy tắc Hague-Visby) — Hague-Visby Rules quy định trách nhiệm của người vận chuyền đồi với hàng hóa trong vận tải biển quóc tế, khi bộ quy tắc này được áp\ndụng.", "slide_img": "images/q_378_slide_1794473777781.jpg", "note_img": "images/q_378_note_1794473777781.jpg"}, {"id": 379, "subject": "GLI202", "question": "Which document certifies that goods have been shipped as per contract?", "options": {"A": "Bill of Lading", "B": "Invoice", "C": "Insurance Certificate", "D": "Quotation"}, "answers": ["A"], "explanation": "Chứng từ nào xác nhận hàng hóa đã được gửi vận chuyền theo hợp đồng?\nA. Bill of Lading (Vận đơn đường biên) — Bill of Lading (B/L) xác nhận việc người vận chuyển đã nhận hàng hoặc hàng đã được xếp lên tàu, tùy loại vận đơn.", "slide_img": "images/q_379_slide_1794473779605.jpg", "note_img": "images/q_379_note_1794473779605.jpg"}, {"id": 380, "subject": "GLI202", "question": "Which Incoterm places maximum responsibility on the seller?", "options": {"A": "DDP", "B": "FOB", "C": "CIF DEXW"}, "answers": ["A"], "explanation": "Điều kiện Incoterms nào đặt trách nhiệm lớn nhất lên người bán?\nA. DDP - Delivered Duty Paid (Giao hàng đã thông quan nhập khâu và nộp thuế) — DDP yêu cầu người bán chịu phần lớn chi phí và trách nhiệm đề đưa hàng đến địa điểm đích đã\nthỏa thuận, bao gồm thông quan nhập khẩu và nộp thuế liên quan.", "slide_img": "images/q_380_slide_1794473781510.jpg", "note_img": "images/q_380_note_1794473781510.jpg"}, {"id": 381, "subject": "GLI202", "question": "Which canal connects the Mediterranean Sea to the Red Sea?", "options": {"A": "Panama Canal", "B": "Suez Canal", "C": "Kiel Canal", "D": "Corinth Canal"}, "answers": ["B"], "explanation": "Kênh đào nào kết nối Địa Trung Hải với Biền Đỏ?\nB. Suez Canal (Kênh đào Suez) ¬ Suez Canal tại Ai Cập là tuyến hàng hải quan trọng kết nồi châu Âu và châu Á.", "slide_img": "images/q_381_slide_1794473783179.jpg", "note_img": "images/q_381_note_1794473783179.jpg"}, {"id": 382, "subject": "GLI202", "question": "Which port serves as the main gateway to Europe for Asian goods?", "options": {"A": "Rotterdam", "B": "Hamburg", "C": "Antwerp", "D": "Genoa"}, "answers": ["A"], "explanation": "Cảng nào được xem là cửa ngõ chính của châu Âu đồi với hàng hóa đến từ châu Á?\nA. Rotterdam (Cảng Rotterdam) — Port of Rotterdam là trung tâm vận tải và logistics quan trọng, kết nối thương mại quốc tế với thị trường châu Âu.", "slide_img": "images/q_382_slide_1794473785010.jpg", "note_img": "images/q_382_note_1794473785010.jpg"}, {"id": 383, "subject": "GLI202", "question": "Which European city has one of the largest inland ports?", "options": {"A": "Duisburg", "B": "Paris", "C": "Vienna", "D": "Zurich"}, "answers": ["A"], "explanation": "Thành phố nào ở châu Âu có một trong những cảng nội địa lớn nhất?\nA. Duisburg (Thành phó Duisburg, Đức) — Duisburg nồi tiềng với hệ thống cảng nội địa và mạng lưới két nối vận tải đa phương thức.", "slide_img": "images/q_383_slide_1794473786625.jpg", "note_img": "images/q_383_note_1794473786625.jpg"}, {"id": 384, "subject": "GLI202", "question": "Which term refers to cargo requiring special handling due to size, weight, or nature?", "options": {"A": "Project cargo", "B": "General cargo", "C": "Bulk cargo", "D": "Breakbulk"}, "answers": ["A"], "explanation": "Thuật ngữ nào chỉ hàng hóa cần xử lý đặc biệt do kích thước, trọng lượng hoặc tính chất?\nA. Project cargo (Hàng dự án) — Project cargo thường là máy móc, thiết bị hoặc cầu kiện công nghiệp cần phương án vận chuyển chuyên biệt.", "slide_img": "images/q_384_slide_1794473788411.jpg", "note_img": "images/q_384_note_1794473788411.jpg"}, {"id": 385, "subject": "GLI202", "question": "Which system allows electronic data interchange between logistics partners? AEDI", "options": {"B": "ERP", "C": "GPS DO RFID"}, "answers": ["A"], "explanation": "Hệ thống nào cho phép trao đồi dữ liệu điện tử giữa các đối tác logistics?\nA. EDI - Electronic Data Interchange (Trao đôi dữ liệu điện tử) —› EDI cho phép truyền dữ liệu và chứng từ kinh doanh theo định dạng điện tử tiêu chuần.", "slide_img": "images/q_385_slide_1794473790123.jpg", "note_img": "images/q_385_note_1794473790123.jpg"}, {"id": 386, "subject": "GLI202", "question": "Which ICT tool supports digital booking and shipment management?", "options": {"A": "Freight Management System (FMS)", "B": "Accounting Software", "C": "Photo Editing Software", "D": "Word Processor"}, "answers": ["A"], "explanation": "Công cụ ICT nào hỗ trợ đặt chỗ vận chuyển và quản lý lô hàng bằng phương thức số?\nA. Freight Management System - FMS (Hệ thóng quản lý giao nhận vận tải) › FMS hỗ trợ booking, quản lý lô hàng, chứng từ và theo dõi tiền độ vận chuyền.", "slide_img": "images/q_386_slide_1794473791776.jpg", "note_img": "images/q_386_note_1794473791776.jpg"}, {"id": 387, "subject": "GLI202", "question": "Which of the following technologies improves warehouse automation?", "options": {"A": "RFID", "B": "Fax machine", "C": "Typewriter", "D": "Telephone"}, "answers": ["A"], "explanation": "Công nghệ nào giúp cải thiện tự động hóa kho hàng?\nA. RFID - Radio Frequency Identification (Nhận dạng bằng sóng vô tuyến) — RFID sử dụng thẻ điện tử để nhận diện và theo dõi hàng hóa, hỗ trợ quản lý tồn kho tự động.", "slide_img": "images/q_387_slide_1794473793424.jpg", "note_img": "images/q_387_note_1794473793424.jpg"}, {"id": 388, "subject": "GLI202", "question": "Which Incoterm places the greatest responsibility and cost burden on the seller?", "options": {"A": "FAS - Free Alongside Ship", "B": "FOB - Free On Board", "C": "DDP - Delivered Duty Paid", "D": "EXW - Ex Works"}, "answers": ["C"], "explanation": "Điều kiện Incoterms nào đặt trách nhiệm và chỉ phí lớn nhất lên người bán?\nC. DDP - Delivered Duty Paid (Giao hàng đã thông quan nhập khâu và nộp thuế) —› Người bán chịu trách nhiệm đưa hàng đến địa điểm đích, bao gồm nghĩa vụ thông quan nhập khẩu\nvà thuế liên quan.", "slide_img": "images/q_388_slide_1794473795218.jpg", "note_img": "images/q_388_note_1794473795218.jpg"}, {"id": 389, "subject": "GLI202", "question": "Which organization is responsible for creating the UCP 600, the set of guidelines that govern Letters of Credit in international trade finance?", "options": {"A": "The International Chamber of Commerce (ICC)", "B": "The World Bank", "C": "The International Monetary Fund (IMF)", "D": "The World Trade Organization (WTO)"}, "answers": ["A"], "explanation": "Tổ chức nào ban hành UCP 600, bộ quy tắc điều chỉnh thư tín dụng trong tài trợ thương mại quốc té?\nA. The International Chamber of Commerce - ICC (Phòng Thương mại Quốc tế) — UCP 600 là bộ quy tắc thực hành thống nhất về tín dụng chứng từ do ICC ban hành, được sử dụng\nrộng rãi trong thanh toán bằng L/C.", "slide_img": "images/q_389_slide_1794473797011.jpg", "note_img": "images/q_389_note_1794473797011.jpg"}, {"id": 390, "subject": "GLI202", "question": "Which Incoterm requires the buyer to take on the most responsibility, including all transport costs and risks from the seller's door onward?", "options": {"A": "CIF", "B": "CPT", "C": "DAP DEXW"}, "answers": ["D"], "explanation": "Điều kiện Incoterms nào yêu cầu người mua chịu trách nhiệm nhiều nhất, bao gồm chỉ phí và rủi ro vận chuyển từ cơ sở người bán?\nD. EXW - Ex Works (Giao hàng tại cơ sở người bán) —› EXW đặt trách nhiệm lớn nhất lên người mua, trong khi người bán chỉ cằn đặt hàng sẵn tại địa điểm thỏa thuận.", "slide_img": "images/q_390_slide_1794473798895.jpg", "note_img": "images/q_390_note_1794473798895.jpg"}, {"id": 391, "subject": "GLI202", "question": "Which Incoterm requires the seller to arrange and pay for marine insurance for the goods in addition to freight?", "options": {"A": "CIF - Cost, Insurance & Freight", "B": "FCA - Free Carrier", "C": "CIP - Carriage and Insurance Paid To", "D": "DOP - Delivered Duty Paid"}, "answers": ["A"], "explanation": "Điều kiện Incoterms nào yêu cầu người bán mua bảo hiểm hàng hải ngoài việc trả cước vận chuyền?\nA. CIF - Cost, Insurance & Freight (Tiền hàng, bảo hiểm và cước phí) › CIF yêu cầu người bán ký hợp đồng vận tải và mua bảo hiểm hàng hóa. CIP cũng yêu cầu bảo hiểm nhưng\nkhông giới hạn ở vận tải biển.", "slide_img": "images/q_391_slide_1794473800733.jpg", "note_img": "images/q_391_note_1794473800733.jpg"}, {"id": 392, "subject": "GLI202", "question": "When recording progress against schedule, besides the proposed and actual dates, what specific negative event detail must be included?", "options": {"A": "The total insurance premium paid", "B": "Delay period and cause", "C": "The name of the contract's legal advisor", "D": "The original negotiation minutes"}, "answers": ["B"], "explanation": "Khi ghi nhận tiền độ thực hiện, ngoài ngày dự kiến và ngày thực tế, cần ghi thêm thông tin nào về sự kiện bất lợi?\nB. Delay period and cause (Thời gian chậm trễ và nguyên nhân) — Ghi nhận thời gian và nguyên nhân chậm trễ giúp xác định trách nhiệm, đánh giá ảnh hưởng và đề xuất biện pháp\nkhắc phục.", "slide_img": "images/q_392_slide_1794473802715.jpg", "note_img": "images/q_392_note_1794473802715.jpg"}, {"id": 393, "subject": "GLI202", "question": "Acontract management team should establish clear roles and responsibilities to:", "options": {"A": "Avoid duplication and conflicts", "B": "Reduce supplier prices directly", "C": "Increase advertising budgets", "D": "Guarantee higher customer demand"}, "answers": ["A"], "explanation": "Nhóm quản lý hợp đồng cần phân định rõ vai trò và trách nhiệm nhằm mục đích gì?\nA. Avoid duplication and conflicts (Tránh chồng chéo công việc và xung đột) › Phân công rõ trách nhiệm giúp các bộ phận phói hợp hiệu quả và hạn chế việc bỏ sót hoặc thực hiện\ntrùng lặp nhiệm vụ.", "slide_img": "images/q_393_slide_1794473805430.jpg", "note_img": "images/q_393_note_1794473805430.jpg"}, {"id": 394, "subject": "GLI202", "question": "A supply chain firm wants to improve compliance and supplier reliability. Which contract management practice is most effective?", "options": {"A": "Monitoring performance against contract terms", "B": "Relying on verbal assurances", "C": "Ignoring variations in delivery", "D": "Setting prices informally"}, "answers": ["A"], "explanation": "Một doanh nghiệp chuỗối cung ứng muồn cải thiện việc tuân thủ hợp đồng và độ tin cậy của nhà cung cấp. Hoạt động quản lý hợp đồng nào hiệu quả nhất?\nA. Monitoring performance against contract terms (Giám sát hiệu quả thực hiện so với các điều khoản hợp đồng)\n— Việc giám sát giúp phát hiện các sai lệch về chất lượng, tiền độ và nghĩa vụ, từ đó yêu cầu nhà cung cấp khắc phục.", "slide_img": "images/q_394_slide_1794473807259.jpg", "note_img": "images/q_394_note_1794473807259.jpg"}, {"id": 395, "subject": "GLI202", "question": "ICT in freight forwarding mainly supports:", "options": {"A": "Data management and communication efficiency", "B": "Product manufacturing.", "C": "Cargo insurance underwriting.", "D": "Customs taxation"}, "answers": ["A"], "explanation": "Công nghệ thông tin và truyền thông (ICT) trong giao nhận vận tải chủ yếu hỗ trợ hoạt động nào?\nA. Data management and communication efficiency (Quản lý dữ liệu và nâng cao hiệu quả giao tiếp) — ICT hỗ trợ trao đồi chứng từ, cập nhật thông tin lô hàng và phối hợp giữa các\nbên trong chuối logistics.", "slide_img": "images/q_395_slide_1794473809098.jpg", "note_img": "images/q_395_note_1794473809098.jpg"}, {"id": 396, "subject": "GLI202", "question": "Ensuring that contractual terms remain consistent and aligned to the operational process outlined in the entire job scope is a key requirement during which contract administration stage?", "options": {"A": "Post Contract Administration", "B": "Ongoing Administration", "C": "Variation Administration", "D": "Post-Award Administration"}, "answers": ["D"], "explanation": "Việc đảm bảo các điều khoản hợp đồng luôn nhất quán và phù hợp với quy trình vận hành trong toàn bộ phạm vi công việc là yêu cầu của giai đoạn nào?\nD. Post-award Administration (Quản trị hợp đồng trong quá trình thực hiện)\n— Post-award Administration quản lý tài trợ, nghiên cứu hoặc dự án", "slide_img": "images/q_396_slide_1794473810912.jpg", "note_img": "images/q_396_note_1794473810912.jpg"}, {"id": 397, "subject": "GLI202", "question": "In which phase of contract administration must the contract manager verify that the delivery of goods or services is completed as detailed in the contract before the processing of invoices?", "options": {"A": "Post-Award Administration", "B": "Ongoing Administration", "C": "Payment Administration", "D": "Close-Out Administration"}, "answers": ["C"], "explanation": "Trong giai đoạn nào của quản trị hợp đồng, người quản lý phải xác minh hàng hóa hoặc dịch vụ đã được giao đúng hợp đồng trước khi xử lý hóa đơn?\nC. Payment Administration (Quản lý thanh toán)\n— Payment Administration kiểm tra việc hoàn thành nghĩa vụ giao hàng hoặc cung cấp dịch vụ trước khi phê duyệt thanh toán.", "slide_img": "images/q_397_slide_1794473812772.jpg", "note_img": "images/q_397_note_1794473812772.jpg"}, {"id": 398, "subject": "GLI202", "question": "Proper labeling on packages helps to:", "options": {"A": "Identify cargo and ensure correct delivery.", "B": "Reduce shipping insurance.", "C": "Hide product identity.", "D": "Simplify export tax."}, "answers": ["A"], "explanation": "Việc dán nhãn đúng trên bao bì hàng hóa giúp ích gì?\nA. Identify cargo and ensure correct delivery (Nhận diện hàng hóa và đảm bảo giao hàng chính xác) ¬ Proper labeling giúp xác định thông tin kiện hàng, hướng dẫn xử lý và hạn chề\ngiao nhằm hàng.", "slide_img": "images/q_398_slide_1794473814535.jpg", "note_img": "images/q_398_note_1794473814535.jpg"}, {"id": 399, "subject": "GLI202", "question": "A supply chain firm wants to improve compliance and supplier reliability. Which contract management practice is most effective?", "options": {"A": "Monitoring performance against contract terms", "B": "Relying only on verbal assurances", "C": "Ignoring variations in delivery", "D": "Setting prices informally"}, "answers": ["A"], "explanation": "Một doanh nghiệp chuối cung ứng muồn cải thiện việc tuân thủ hợp đồng và độ tin cậy của nhà cung cấp. Hoạt động nào hiệu quả nhất?\nA. Monitoring performance against contract terms (Giám sát hiệu quả thực hiện so với các điều khoản hợp đồng) — Theo dõi tiền độ, chất lượng và KPI giúp phát hiện sai lệch, yêu\ncầu khắc phục và nâng cao độ tin cậy của nhà cung cấp.", "slide_img": "images/q_399_slide_1794473816457.jpg", "note_img": "images/q_399_note_1794473816457.jpg"}, {"id": 400, "subject": "GLI202", "question": "A well-structured contract management team should include members from:", "options": {"A": "Procurement, legal, finance, and operations", "B": "Only procurement department", "C": "Only sales and marketing", "D": "External suppliers only"}, "answers": ["A"], "explanation": "Một nhóm quản lý hợp đồng có cơ cấu tốt nên bao gồm thành viên từ những bộ phận nào?\nA. Procurement, legal, finance, and operations (Mua sắm, pháp lý, tài chính và vận hành) — Nhóm liên chức năng giúp đánh giá hợp đồng toàn diện về chi phí, pháp luật, nguồn cung\nvà khả năng thực hiện.", "slide_img": "images/q_400_slide_1794473818315.jpg", "note_img": "images/q_400_note_1794473818315.jpg"}, {"id": 401, "subject": "GLI202", "question": "One of the risks of not having a cross-functional team is:", "options": {"A": "Increased likelihood of contract disputes", "B": "Faster approval of contracts", "C": "Improved supplier collaboration", "D": "Reduced need for documentation"}, "answers": ["A"], "explanation": "Một rủi ro khi không có nhóm quản lý hợp đồng liên chức năng là gì?\nA. Inereased Iikelinood of contract disputes (Gia tăng khả năng phát sinh tranh chấp hợp đồng) — Thiếu sự phối hợp giữa các bộ phận dễ dẫn đến điều khoản không rõ ràng, trách\nnhiệm chồng chéo và bất đồng trong thực hiện.", "slide_img": "images/q_401_slide_1794473820165.jpg", "note_img": "images/q_401_note_1794473820165.jpg"}, {"id": 402, "subject": "GLI202", "question": "The contract may be considered completed during the Post Contract Administration stage once the product/service is duly delivered and what specific period has ended?", "options": {"A": "The litigation period", "B": "The negotiation period", "C": "The close-out period", "D": "The warranty period"}, "answers": ["D"], "explanation": "Trong giai đoạn Post Contract Administration, hợp đồng có thể được xem là hoàn tất khi sản Wẳm hoặc dịch vụ đã được bàn giao đầy đủ và thời hạn nào đã kết thúc?\nD. The warranty period (Thời hạn bảo hành) — Sau khi bàn giao, một số nghĩa vụ vấn tiếp tục tồn tại trong thời gian bảo hành. Theo cách phân chia giai đoạn của đề, việc kết thúc bảo\nhành là điều kiện để hoàn tất quản trị sau hợp đồng.", "slide_img": "images/q_402_slide_1794473822159.jpg", "note_img": "images/q_402_note_1794473822159.jpg"}, {"id": 403, "subject": "GLI202", "question": "In sourcing problems, which internal role is defined as the individual who has the final say in the purchase decision?", "options": {"A": "Gatekeepers", "B": "Decision maker", "C": "Purchasing agent", "D": "Controller"}, "answers": ["B"], "explanation": "Trong quá trình tìm nguồn cung ứng, vai trò nội bộ nào có quyền quyết định cuồi cùng về việc mua hàng?\nB. Decision maker (Người ra quyết định) › Decision maker là người hoặc bộ phận có thẩm quyền phê duyệt lựa chọn mua hàng cuối cùng.", "slide_img": "images/q_403_slide_1794473823817.jpg", "note_img": "images/q_403_note_1794473823817.jpg"}, {"id": 404, "subject": "GLI202", "question": "The ICC is known for publishing which widely used trade terms?", "options": {"A": "ISO Codes", "B": "Incoterms", "C": "HS Codes", "D": "Dangerous Goods Codes"}, "answers": ["B"], "explanation": "ICC được biết đến với việc ban hành bộ điều kiện thương mại quốc tế phổ biến nào?\nB. Incoterms (Các điều kiện thương mại quốc tế) — Incoterms do ICC ban hành, quy định trách nhiệm, chi phí và việc chuyền giao rủi ro giữa người bán và người mua.", "slide_img": "images/q_404_slide_1794473825574.jpg", "note_img": "images/q_404_note_1794473825574.jpg"}, {"id": 405, "subject": "GLI202", "question": "ETE", "options": {"A": "Monitoring performance against contract terms", "B": "Relying only on verbal assurances", "C": "Ignoring variations in delivery", "D": "Setting prices informally"}, "answers": ["A"], "explanation": "Hoạt động quản lý hợp đồng nào hiệu quả nhất đề cải thiện việc tuân thủ và độ tin cậy của nhà cung cấp?\nA. Monitoring performance against contract terms (Giám sát hiệu quả thực hiện so với các điều khoản hợp đồng) — Theo dõi KPI và nghĩa vụ hợp đồng giúp phát hiện sai lệch, đánh\ngiá nhà cung cấp và yêu cầu khắc phục.", "slide_img": "images/q_405_slide_1794473827425.jpg", "note_img": "images/q_405_note_1794473827425.jpg"}, {"id": 406, "subject": "GLI202", "question": "A well-structured contract management team should include members from:", "options": {"A": "Procurement, legal, finance, and operations", "B": "Only procurement department", "C": "Only sales and marketing", "D": "External suppliers only"}, "answers": ["A"], "explanation": "Một nhóm quản lý hợp đồng có cơ cấu tốt nên bao gồm thành viên từ những bộ phận nào?\nA. Procurement, legal, finance, and operations (Mua sắm, pháp lý, tài chính và vận hành) — Nhóm liên chức năng giúp kiểm soát các vấn đề về hợp đồng, tài chính, nguồn cung và\nhoạt động thực hiện.", "slide_img": "images/q_406_slide_1794473829255.jpg", "note_img": "images/q_406_note_1794473829255.jpg"}, {"id": 407, "subject": "GLI202", "question": "Global sourcing decisions , such as \"Make or Buy,” must be made with consideration of core competence, proprietary knowledge, and what other factors?", "options": {"A": "Future govemmental subsidies", "B": "Trade secrets", "C": "Competitor employee turnover rates", "D": "External audit schedules"}, "answers": ["B"], "explanation": "Khi quyết định Make or Buy trong tìm nguồn cung ứng toàn cầu, ngoài năng lực cốt lõi và kiến thức độc quyền, doanh nghiệp cần cân nhắc yếu tố nào?\nB. Trade secrets (Bí mật thương mại) ¬ Doanh nghiệp cần đánh giá nguy cơ tiết lộ bí mật thương mại khi quyết định tự sản xuất hay thuê ngoài.", "slide_img": "images/q_407_slide_1794473831032.jpg", "note_img": "images/q_407_note_1794473831032.jpg"}, {"id": 408, "subject": "GLI202", "question": "Incoterms 2020 are divided into two main categories based on mode of transport. Which Incoterm below can be used for any mode of transport (land, sea, air, or multi-modal)?", "options": {"A": "CIF (Cost, Insurance & Freight)", "B": "FOB (Free on Board)", "C": "EXW (Ex Works)", "D": "FAS (Free Alongside Ship)"}, "answers": ["C"], "explanation": "Điều kiện Incoterms 2020 nào có thể sử dụng cho mọi phương thức vận tải?\nC. EXW — Ex Works (Giao hàng tại cơ sở người bán) —› EXW áp dụng cho vận tải đường bộ, đường biền, đường hàng không và đa phương thức. CIF, FOB và FAS chỉ áp dụng cho vận\ntải biển hoặc đường thủy nội địa.", "slide_img": "images/q_408_slide_1794473832987.jpg", "note_img": "images/q_408_note_1794473832987.jpg"}, {"id": 409, "subject": "GLI202", "question": "The operations department is responsible for:", "options": {"A": "Recruiting new employees", "B": "Managing daily shipment execution", "C": "Preparing annual reports", "D": "Handling legal compliance"}, "answers": ["B"], "explanation": "Bộ phận Operations chịu trách nhiệm về hoạt động nào?\nB. Managing daily shipment execution (Quản lý việc thực hiện các lô hàng hẳằng ngày) — Operations Department điều phói vận chuyền, theo dõi tiền độ và xử lý các vấn đề phát sinh\ntrong hoạt động giao nhận.", "slide_img": "images/q_409_slide_1794473834847.jpg", "note_img": "images/q_409_note_1794473834847.jpg"}, {"id": 410, "subject": "GLI202", "question": "The FIATA Bill of Lading (FBL) is primarily used for:", "options": {"A": "Multimodal transport operations.", "B": "Airfreight only.", "C": "Domestic trade within one country.", "D": "Marine insurance purposes."}, "answers": ["A"], "explanation": "FIATA Bill of Lading (FBL) chủ yếu được sử dụng cho hoạt động nào?\nA. Multimodal transport operations (Hoạt động vận tải đa phương thức) — FBL được sử dụng trong vận tải đa phương thức, hỗ trợ quản lý việc vận chuyền hàng hóa qua nhiều\nphương thức theo một hợp đồng.", "slide_img": "images/q_410_slide_1794473836701.jpg", "note_img": "images/q_410_note_1794473836701.jpg"}, {"id": 411, "subject": "GLI202", "question": "ee Proper labeling on packages helps to:", "options": {"A": "Identify cargo and ensure correct delivery.", "B": "Reduce shipping insurance.", "C": "Hide product identity.", "D": "Simplify export tax."}, "answers": ["A"], "explanation": "Việc dán nhãn đúng trên kiện hàng giúp ích gì?\nA. ldentify cargo and ensure correct delivery (Nhận diện hàng hóa và đảm bảo giao hàng chính xác) › Proper labeling hỗ trợ phân loại, xử lý và giao nhận đúng hàng hóa.", "slide_img": "images/q_411_slide_1794473838585.jpg", "note_img": "images/q_411_note_1794473838585.jpg"}, {"id": 412, "subject": "GLI202", "question": "The primary reason contracts are essential in supply chains is because they:", "options": {"A": "Ensure legal enforceability and clarity", "B": "Reduce transportation costs", "C": "Eliminate supplier competition", "D": "Guarantee higher profit margins"}, "answers": ["A"], "explanation": "Lý do chính khiến hợp đồng cần thiết trong chuỗối cung ứng là gì?\nA. Ensure legal enforceability and clarity (Đảm bảo tính ràng buộc pháp lý và sự rõ ràng) › Hợp đồng xác định quyền và nghĩa vụ của các bên, giúp giảm sự không chắc chắn và tạo\ncơ sở giải quyết tranh chấp.", "slide_img": "images/q_412_slide_1794473840501.jpg", "note_img": "images/q_412_note_1794473840501.jpg"}, {"id": 413, "subject": "GLI202", "question": "A company relies heavily on a subcontractor to provide specialized equipment. Midway through the project, the subcontractor fails to meet quality standards, leading to rework. Which risk type is triggered?", "options": {"A": "Quality and Sub-Contractor Risks", "B": "Commercial Risks", "C": "Schedule Risks", "D": "Cost Risks"}, "answers": ["A"], "explanation": "Một công ty phụ thuộc vào nhà thầu phụ cung cấp thiết bị chuyên dụng. Giữa dự án, nhà thầu phụ không đáp ứng tiêu chuần chát lượng, khiến công việc phải thực hiện lại. Đây là loại rủi ro\nnào?\nA. Quality and Sub-Contractor Risks (Rủi ro chất lượng và nhà thầu phụ) — Rủi ro xuất phát trực tiếp từ việc nhà thầu phụ không đáp ứng yêu cầu chất lượng.", "slide_img": "images/q_413_slide_1794473842398.jpg", "note_img": "images/q_413_note_1794473842398.jpg"}, {"id": 414, "subject": "GLI202", "question": "The contract may be considered completed during the Post Contract Administration stage once the product/service is duly delivered and what specific period has ended?", "options": {"A": "The litigation period", "B": "The negotiation period", "C": "The close-out period", "D": "The warranty period"}, "answers": ["D"], "explanation": "Trong giai đoạn Post Contract Administration, hợp đồng có thể được xem là hoàn tất khi sản Wẳm hoặc dịch vụ đã được bàn giao đầy đủ và thời hạn nào đã kết thúc?\nD. The warranty period (Thời hạn bảo hành) — Theo cách phân chia giai đoạn của đề, hợp đồng được xem là hoàn tất khi các nghĩa vụ bảo hành cũng đã kết thúc.", "slide_img": "images/q_414_slide_1794473844518.jpg", "note_img": "images/q_414_note_1794473844518.jpg"}, {"id": 415, "subject": "GLI202", "question": "The benefit of purchase item knowledge that allows suggesting solutions for obstacles applies to which area(s)?", "options": {"A": "Financial accounting only", "B": "Only production flow", "C": "Production, transportation", "D": "Only legal contract drafting"}, "answers": ["C"], "explanation": "Lợi ích của việc hiều rõ hàng hóa mua sắm, giúp đề xuất giải pháp cho các trở ngại, áp dụng trong lĩnh vực nào?\nC. Production, transportation (Sản xuất và vận chuyên) — Kiến thức về hàng hóa giúp giải quyết khó khăn trong sản xuất, bảo quản và vận chuyền.", "slide_img": "images/q_415_slide_1794473846303.jpg", "note_img": "images/q_415_note_1794473846303.jpg"}, {"id": 416, "subject": "GLI202", "question": "RRR EERE In sourcing problems, which internal role is defined as the individual who has the final say in the purchase decision?", "options": {"A": "Gatekeepers", "B": "Decision maker", "C": "Purchasing agent", "D": "Controller"}, "answers": ["B"], "explanation": "Trong quá trình tìm nguồn cung ứng, ai có quyền quyết định cuồi cùng về việc mua hàng?\nB. Decision maker (Người ra quyết định) › Decision maker là người hoặc bộ phận có thẩm quyền phê duyệt lựa chọn mua hàng cuối cùng.", "slide_img": "images/q_416_slide_1794473848185.jpg", "note_img": "images/q_416_note_1794473848185.jpg"}, {"id": 417, "subject": "GLI202", "question": "ee In international shipping, the party who sends the goods (and may be different from the seller) is called the:", "options": {"A": "Consignor", "B": "Consignee", "C": "Buyer", "D": "Carrier"}, "answers": ["A"], "explanation": "Trong vận chuyển quốc tế, bên gửi hàng hóa, có thể không phải người bán, được gọi là gì?\nA. Consignor (Người gửi hàng) = Consignor là bên giao hàng cho đơn vị vận chuyển. Người gửi hàng không nhất thiết là chủ sở hữu hoặc người bán.", "slide_img": "images/q_417_slide_1794473850096.jpg", "note_img": "images/q_417_note_1794473850096.jpg"}, {"id": 418, "subject": "GLI202", "question": "A buyer wants the seller to handle the main carriage to the destination port but is willing to take over costs and risk upon arrival at that port (and handle import customs). Which Incoterm would be appropriate?", "options": {"A": "CIF (Cost, Insurance & Freight)", "B": "CFR (Cost & Freight)", "C": "FOB (Free on Board)", "D": "DAP (Delivered at Place)"}, "answers": ["B"], "explanation": "Người mua muồn người bán sắp xếp vận tải chính đến cảng đích, sau đó người mua chịu chỉ phí, rủi ro và làm thủ tục nhập khẩu. Điều kiện nào phù hợp?\nB. CFR - Cost & Freight (Tiền hàng và cước phí) › CFR phù hợp nhất về việc người bán trả cước đến cảng đích và người mua làm thủ tục nhập khẩu. Tuy nhiên, theo CFR, rủi ro\nchuyền sang người mua ngay khi hàng lên tàu tại cảng đi, không phải khi hàng đến cảng đích như câu hỏi mô tả.", "slide_img": "images/q_418_slide_1794473852135.jpg", "note_img": "images/q_418_note_1794473852135.jpg"}, {"id": 419, "subject": "GLI202", "question": "", "options": {"A": "Operations Department", "B": "Human Resources Department", "C": "Marketing Department", "D": "Legal Department"}, "answers": ["A"], "explanation": "Trong cơ cấu tổ chức của một công ty Freight Forwarding, bộ phận nào chịu trách nhiệm lập tuyến đường, lựa chọn đơn vị vận tải và điều hành các lô hàng hằng ngày?\nA. Operations Department (Bộ phận vận hành) — Phụ trách lập kế hoạch vận chuyền, lựa chọn hãng vận tải và quản lý hoạt động giao nhận hằng ngày.", "slide_img": "images/q_419_slide_1794473854079.jpg", "note_img": "images/q_419_note_1794473854079.jpg"}, {"id": 420, "subject": "GLI202", "question": "ee", "options": {"A": "Negotiation and drafting", "B": "Contract closure", "C": "Risk allocation", "D": "Monitoring performance"}, "answers": ["A"], "explanation": "Vòng đời hợp đồng trong quản trị chuối cung ứng thường bắt đầu bằng hoạt động nào?\nA. Negotiation and drafting (Đàm phán và soạn thảo hợp đồng) — Trong các lựa chọn của đề, đây là bước đầu tiên. Trên thực tế, quá trình quản lý hợp đồng có thể bắt đầu sớm hơn\nbằng việc xác định nhu cầu và lập kế hoạch.", "slide_img": "images/q_420_slide_1794473856048.jpg", "note_img": "images/q_420_note_1794473856048.jpg"}, {"id": 421, "subject": "GLI202", "question": "Accontractor is working on a large infrastructure project. The specifications for some components are incomplete, leading to frequent design changes. Which risk type is most relevant here?", "options": {"A": "Schedule Risks", "B": "Commercial Risks", "C": "Cost Risks", "D": "Quality Risks"}, "answers": ["C"], "explanation": "Một nhà thầu đang thực hiện dự án hạ tằng lớn. Thông số kỹ thuật của một số bộ phận chưa đầy đủ, dẫn đén việc thay đồi thiết ké thường xuyên. Đây là loại rủi ro nào?\nC. Cost Risks (Rủi ro chi phí) ¬ Thông số kỹ thuật thiều chính xác có thể làm phát sinh thiết kế lại, thay đổi khối lượng và tăng chỉ phí thực hiện. Tình huồng cũng có thể ảnh hưởng đến\ntiền độ, nhưng Cost Risks là lựa chọn phù hợp nhất trong bồi cảnh này.", "slide_img": "images/q_421_slide_1794473857994.jpg", "note_img": "images/q_421_note_1794473857994.jpg"}, {"id": 422, "subject": "GLI202", "question": "A company relies heavily on a subcontractor to provide specialized equipment. Midway through the project, the subcontractor fails to meet quality standards. leading to rework. Which risk type is triggered?", "options": {"A": "Quality and Sub-Contractor Risks", "B": "Commercial Risks", "C": "Schedule Risks", "D": "Cost Risks"}, "answers": ["A"], "explanation": "Một doanh nghiệp phụ thuộc nhiều vào nhà thầu phụ cung cấp thiết bị chuyên dụng. Giữa dự án, nhà thầu phụ không đáp ứng tiêu chuẩn chất lượng, khiến công việc phải thực hiện lại. Đây\nlà loại rủi ro nào?\n\nA. Quality and Sub-Contractor Risks (Rủi ro chất lượng và nhà thầu phụ) — Rủi ro phát sinh trực tiếp từ việc nhà thầu phụ không đáp ứng tiêu chuần chất lượng, dẫn đến sửa chữa\nhoặc làm lại công việc.", "slide_img": "images/q_422_slide_1794473860049.jpg", "note_img": "images/q_422_note_1794473860049.jpg"}, {"id": 423, "subject": "GLI202", "question": "Failure to establish a proper contract management plan can lead to:", "options": {"A": "Non-compliance and contract disputes", "B": "Worse product branding", "C": "Inefficient marketing campaigns", "D": "Decreased employee morale"}, "answers": ["A"], "explanation": "Việc không thiết lập kế hoạch quản lý hợp đồng phù hợp có thể dẫn đến điều gì?\nA. Non-compliance and contract disputes (Không tuân thủ hợp đồng và phát sinh tranh chấp) — Thiếu kế hoạch quản lý khiến việc giám sát nghĩa vụ, tiền độ và trách nhiệm không\nhiệu quả, làm tăng nguy cơ vi phạm.", "slide_img": "images/q_423_slide_1794473861954.jpg", "note_img": "images/q_423_note_1794473861954.jpg"}, {"id": 424, "subject": "GLI202", "question": "Global sourcing decisions , such as \"Make or Buy,” must be made with consideration of core competence, proprietary knowledge, and what other factors?", "options": {"A": "Future govemmental subsidies", "B": "Trade secrets", "C": "Competitor employee turnover rates", "D": "External audit schedules"}, "answers": ["B"], "explanation": "Khi quyết định tìm nguồn cung ứng toàn cầu, chẳng hạn lựa chọn Make or Buy, ngoài năng lực cót lõi và kiềến thức độc quyền, doanh nghiệp cần cân nhắc yếu tố nào?\nB. Trade secrets (Bí mật thương mại) ¬ Quyết định tự sản xuất hay thuê ngoài cần xem xét nguy cơ tiết lộ bí mật thương mại và mấắt lợi thế cạnh tranh.", "slide_img": "images/q_424_slide_1794473863787.jpg", "note_img": "images/q_424_note_1794473863787.jpg"}, {"id": 425, "subject": "GLI202", "question": "The benefit of purchase item knowledge that allows suggesting solutions for obstacles applies to which area(s)?", "options": {"A": "Financial accounting only", "B": "Only production flow", "C": "Production, transportation", "D": "Only legal contract drafting"}, "answers": ["C"], "explanation": "Lợi ích của việc hiều rõ hàng hóa mua sắm, giúp đề xuất giải pháp cho các trở ngại, áp dụng trong lĩnh vực nào?\nC. Production, transportation (Sản xuất và vận chuyên) — Kiến thức về hàng hóa giúp người mua nhận diện các khó khăn kỹ thuật, bảo quản hoặc vận chuyền và đề xuất giải pháp phù\nhợp.", "slide_img": "images/q_425_slide_1794473865703.jpg", "note_img": "images/q_425_note_1794473865703.jpg"}, {"id": 426, "subject": "GLI202", "question": "RRR EERE The primary reason contracts are essential in supply chains is because they:", "options": {"A": "Ensure legal enforceability and clarity", "B": "Reduce transportation costs", "C": "Eliminate supplier competition", "D": "Guarantee higher profit margins"}, "answers": ["A"], "explanation": "Lý do chính khiến hợp đồng trở nên thiết yếu trong chuối cung ứng là gì?\nA. Ensure legal enforceability and clarity (Đảm bảo tính ràng buộc pháp lý và sự rõ ràng) › Hợp đồng quy định quyền, nghĩa vụ và trách nhiệm của các bên, đồng thời tạo cơ sở pháp\nlý khi phát sinh tranh chấp.", "slide_img": "images/q_426_slide_1794473867576.jpg", "note_img": "images/q_426_note_1794473867576.jpg"}, {"id": 427, "subject": "GLI202", "question": "Seo The operations department is responsible for:", "options": {"A": "Recruiting new employees", "B": "Managing daily shipment execution", "C": "Preparing annual reports", "D": "Handling legal compliance"}, "answers": ["B"], "explanation": "Bộ phận Operations trong công ty giao nhận vận tải chịu trách nhiệm về hoạt động nào?\nB. Managing daily shipment execution (Quản lý việc thực hiện các lô hàng hẳằng ngày) — Operations Department điều phói vận chuyền, theo dõi tiền độ và xử lý các vấn đề phát sinh\ntrong quá trình giao nhận.", "slide_img": "images/q_427_slide_1794473869519.jpg", "note_img": "images/q_427_note_1794473869519.jpg"}, {"id": 428, "subject": "GLI202", "question": "The FIATA Bill of Lading (FBL) is primarily used for:", "options": {"A": "Multimodal transport operations.", "B": "Airfreight only.", "C": "Domestic trade within one country.", "D": "Marine insurance purposes."}, "answers": ["A"], "explanation": "FIATA Bill of Lading (FBL) chủ yếu được sử dụng trong hoạt động nào?\nA. Multimodal transport operations (Hoạt động vận tải đa phương thức) — FBL là vận đơn do người giao nhận phát hành, được sử dụng trong vận tải đa phương thức, tức vận chuyển\nhàng hóa bằng từ hai phương thức vận tải trở lên theo một hợp đồng.", "slide_img": "images/q_428_slide_1794473871335.jpg", "note_img": "images/q_428_note_1794473871335.jpg"}, {"id": 429, "subject": "GLI202", "question": "Personalities involved in contract management processes can either enhance or create what for the involved parties?", "options": {"A": "New strategic benchmarks", "B": "Financial liabilities", "C": "Obstacles", "D": "Market fluctuations"}, "answers": ["C"], "explanation": "Tính cách của những người tham gia vào quá trình quản lý hợp đồng có thể giúp cải thiện hoặc tạo ra điều gì cho các bên liên quan?\n\nG. Obstacles\n\n— Những trở ngại hoặc khó khăn.\n\nTính cách và cách ứng jr của các cá nhân tham fflaẬquảp lý hợp đồng có ựìể ửfì hưc’ì’ng Ổr1 sự hợp tác giữa các bên. Những người có ửả năng giao fizếp ột, linh hoạt và biết gải`quyệt", "slide_img": "images/q_429_slide_1794473873650.jpg", "note_img": "images/q_429_note_1794473873650.jpg"}, {"id": 430, "subject": "GLI202", "question": "RRR EERE What is the primary purpose of a contract management plan?", "options": {"A": "Provide a roadmap for managing contract obligations", "B": "Increase product pricing strategies", "C": "Reduce cost of marketing campaigns", "D": "Guarantee higher brand recognition"}, "answers": ["A"], "explanation": "Mục đích chính của kế hoạch quản lý hợp đồng (Contract Management Plan) là gì?\n\nA. Provide a roadmap for managing contract obligations\n\n— Cung cấp một lộ trình đề quản lý các nghĩa vụ trong hợp đồng.\n\nContract Management Plan là tài liệu hướng dẫn cách mgản lý và thực hiện các nghĩa vụ đã được thỏa thuận trong hợp đồng. Kế hoạch này giúp các bên theo dõi tiền độ, phân công trách\nnhiệm, kiêm soát rủi ro và bảo đảm việc thực hiện hợp đông đúng các điêu khoản đã cam kêt.", "slide_img": "images/q_430_slide_1794473876478.jpg", "note_img": "images/q_430_note_1794473876478.jpg"}, {"id": 431, "subject": "GLI202", "question": "Which example best illustrates a cost risk?", "options": {"A": "Incorrect estimates of quantities and inflation", "B": "Reduced demand due to market downturn", "C": "Subcontractor’s poor quality control", "D": "Unrealistic timeframes for completion"}, "answers": ["A"], "explanation": "Ví dụ nào sau đây minh họa rõ nhất cho rủi ro chi phí (Cost Risk)?\n\nA. Incorrect estimates of quantities and inflation\n\n— Ước tính không chính xác về số lượng và lạm phát.\n\nCo.st Riẹk kỄ nguy cơ Ễhi mìí qìực tế l/ượt quá Ềgânẫsách Ar1oặc,: mtẮl’(.ĩ. chị phí <jự HÌến. Wệc ước tính sai số lượng nguyên vật liệu hoặc không dự đoán đúng mức lạm phát có thể khiến tổng chỉ", "slide_img": "images/q_431_slide_1794473878902.jpg", "note_img": "images/q_431_note_1794473878902.jpg"}, {"id": 432, "subject": "GLI202", "question": "When defining roles in a contract management plan, what is the biggest risk if responsibilities overlap?", "options": {"A": "Confusion in accountability and reduced compliance", "B": "Increased supplier bargaining power and higher costs", "C": "Better collaboration but longer contract negotiation", "D": "Stronger performance measurement but weaker supplier relations"}, "answers": ["A"], "explanation": "Khi xác định vai trò trong kế hoạch quản lý hợp đồng, rủi ro lớn nhất nếu trách nhiệm bị chồng chéo là gì?\nA. Confusion in accountability and reduced compliance (Không rõ trách nhiệm giải trình và giảm mức độ tuân thủ) — Khi trách nhiệm không được phân định rõ, công việc có thể bị\nbỏ sót hoặc thực hiện không nhất quán.", "slide_img": "images/q_432_slide_1794473880827.jpg", "note_img": "images/q_432_note_1794473880827.jpg"}, {"id": 433, "subject": "GLI202", "question": "SSS. SL SEE What is the primary reason listed for pre-qualifying suppliers related to financial risk mitigation?", "options": {"A": "Negotiating appropriate payment methods", "B": "Implementing ISO 9000 quality standards", "C": "Improving the organization's competitive position", "D": "Finding and developing new market segments"}, "answers": ["A"], "explanation": "Lý do nào liên quan đến giảm thiều rủi ro tài chính khi sơ tuyền nhà cung cáp?\nA. Negotiating appropriate payment methods (Đàm phán phương thức thanh toán phù hợp) — Điều kiện thanh toán phù hợp giúp giảm rủi ro tài chính và hạn chế gián đoạn cung ứng.", "slide_img": "images/q_433_slide_1794473882659.jpg", "note_img": "images/q_433_note_1794473882659.jpg"}, {"id": 434, "subject": "GLI202", "question": "What is the main purpose of a Letter of Credit (L/C)?", "options": {"A": "To guarantee payment between buyer and seller through a bank.", "B": "To insure goods against loss.", "C": "To declare the value of cargo for customs.", "D": "To reduce export taxes."}, "answers": ["A"], "explanation": "Mục đích chính của Letter of Credit (L/C) là gì?\nA. To guarantee payment between buyer and seller through a bank (Đảm bảo thanh toán giữa người mua và người bán thông qua ngân hàng) ¬ L/C là cam kết thanh toán của\nngân hàng khi người thụ hưởng xuất trình bộ chứng từ phù hợp với các điều kiện của thư tín dụng.", "slide_img": "images/q_434_slide_1794473884536.jpg", "note_img": "images/q_434_note_1794473884536.jpg"}, {"id": 435, "subject": "GLI202", "question": "What is the purpose of the \"fragile\" mark on cargo?", "options": {"A": "To indicate careful handling required.", "B": "To show the weight of cargo.", "C": "To display export license.", "D": "To signal customs inspection"}, "answers": ["A"], "explanation": "Mục đích của ký hiệu “Fragile” trên kiện hàng là gì?\nA. To indicate careful handling required (Thông báo hàng hóa cầằn được xử lý cân thận) — Fragile cảnh báo rằng hàng dễ vỡ hoặc dễ hư hỏng, cần tránh va đập trong quá trình vận\nchuyền.", "slide_img": "images/q_435_slide_1794473886306.jpg", "note_img": "images/q_435_note_1794473886306.jpg"}, {"id": 436, "subject": "GLI202", "question": "What is the main purpose of a Letter of Credit (L/C)?", "options": {"A": "To guarantee payment between buyer and seller through a bank.", "B": "To insure goods against loss.", "C": "To declare the value of cargo for customs.", "D": "To reduce export taxes."}, "answers": ["A"], "explanation": "Mục đích chính của Letter of Credit (L/C) là gì?\nA. To guarantee payment between buyer and seller through a bank (Đảm bảo thanh toán giữa người mua và người bán thông qua ngân hàng) ¬ L/C là cam kết của ngân hàng\nthanh toán cho người bán khi bộ chứng từ xuất trình phù hợp với các điều kiện của thư tín dụng.", "slide_img": "images/q_436_slide_1794473888148.jpg", "note_img": "images/q_436_note_1794473888148.jpg"}, {"id": 437, "subject": "GLI202", "question": "What does FIATA stand for?", "options": {"A": "Federation of International Air Transport Association", "B": "International Federation of Freight Forwarders Associations", "C": "Foreign Industry and Trade Association", "D": "Freight International Air Transport Authority"}, "answers": ["B"], "explanation": "FIATA là viết tắt của tổ chức nào?\nB. International Federation of Freight Forwarders Associations (Liên đoàn Quóốc tế các Hiệp hội Giao nhận Vận tải) — FIATA là tồ chức quốc tế đại diện cho ngành giao nhận vận tải,\ngóp phần tiêu chuẩn hóa chứng từ và thúc đây hoạt động freight forwarding.", "slide_img": "images/q_437_slide_1794473889978.jpg", "note_img": "images/q_437_note_1794473889978.jpg"}, {"id": 438, "subject": "GLI202", "question": "What is the primary goal of documenting risks in a register?", "options": {"A": "To track ownership, probability, and impact of each risk", "B": "To allocate budget for supplier training programs", "C": "To establish negotiation strategies with contractors", "D": "To measure employee performance against milestones"}, "answers": ["A"], "explanation": "Mục tiêu chính của việc ghi nhận rủi ro trong Risk Register là gì?\nA. To track ownership, probability, and impact of each risk (Theo dõi người chịu trách nhiệm, xác suất và mức độ tác động của từng rủi ro) › Risk Register giúp quản lý từng rủi ro\nmột cách có hệ thống và hỗ trợ xây dựng biện pháp ứng phó phù hợp.", "slide_img": "images/q_438_slide_1794473891782.jpg", "note_img": "images/q_438_note_1794473891782.jpg"}, {"id": 439, "subject": "GLI202", "question": "What is the main purpose of insurance in international trade?", "options": {"A": "To protect goods against loss or damage during transit.", "B": "To cover labor costs in production.", "C": "To guarantee payment by the buyer.", "D": "To reduce customs tariffs."}, "answers": ["A"], "explanation": "Mục đích chính của bảo hiểm trong thương mại quốc tế là gì?\nA. To protect goods against loss or damage during transit (Bảo vệ hàng hóa trước rủi ro mất mát hoặc hư hỏng trong quá trình vận chuyên) — Cargo insurance giúp giảm tồn thất\ntài chính khi hàng hóa gặp sự có thuộc phạm vi bảo hiềểm trong quá trình vận chuyển.", "slide_img": "images/q_439_slide_1794473893580.jpg", "note_img": "images/q_439_note_1794473893580.jpg"}, {"id": 440, "subject": "GLI202", "question": "What is the primary reason listed for pre-qualifying suppliers related to financial risk mitigation?", "options": {"A": "Negotiating appropriate payment methods", "B": "Implementing ISO 9000 quality standards", "C": "Improving the organization's competitive position", "D": "Finding and developing new market segments"}, "answers": ["A"], "explanation": "Lý do chính liên quan đến giảm thiều rủi ro tài chính khi thực hiện sơ tuyền nhà cung cấp là gì?\nA. Negotiating appropriate payment methods (Đàm phán phương thức thanh toán phù hợp) — Lựa chọn điều kiện thanh toán phù hợp với năng lực tài chính của nhà cung cấp giúp\nhạn chế rủi ro thanh toán và gián đoạn cung ứng.", "slide_img": "images/q_440_slide_1794473895476.jpg", "note_img": "images/q_440_note_1794473895476.jpg"}, {"id": 441, "subject": "GLI202", "question": "What makes litigation considered the final resort in dispute handling?", "options": {"A": "It allows for maximum protection of business secrets.", "B": "Itis typically costly and time-consuming", "C": "The outcome is always dependent on the goodwill of the parties", "D": "Itinvolves simplifying the documentation process."}, "answers": ["B"], "explanation": "Tại sao kiện tụng (Litigation) thường được xem là phương án cuối cùng trong giải quyết tranh chấp?\nB. ltis typically costly and time-consuming (Thường tồn kém và mắt nhiều thời gian) — Litigation có thể phát sinh chi phí pháp lý lớn và kéo dài, nên các bên thường ưu tiên thương\nlượng hoặc hòa giải trước.", "slide_img": "images/q_441_slide_1794473897279.jpg", "note_img": "images/q_441_note_1794473897279.jpg"}, {"id": 442, "subject": "GLI202", "question": "Which of the following is listed as a possible reason for adverse budget variances during contract execution?", "options": {"A": "Unplanned decreases in materials cost", "B": "Incomplete and/or incorrect specifications", "C": "Costs identified much earlier than originally anticipated DA pre-approved reduction in manpower requirements"}, "answers": ["B"], "explanation": "Đâu là một nguyên nhân có thề dẫn đến chênh lệch ngân sách bất lợi trong quá trình thực hiện hợp đồng?\nB. Incomplete and/or incorrect specifications (Thông số kỹ thuật không đầy đủ hoặc không chính xác)\n— Incomplete specifications có thể gây phát sinh sửa đồi thiết kế, làm lại công việc và tăng chi phí ngoài dự toán.", "slide_img": "images/q_442_slide_1794473899207.jpg", "note_img": "images/q_442_note_1794473899207.jpg"}, {"id": 443, "subject": "GLI202", "question": "Which of the following is an example of a commercial risk in contracts?", "options": {"A": "Business downturn leading to reduced demand", "B": "Incomplete and incorrect estimates of quantities", "C": "Failure to monitor subcontractor performance", "D": "Unrealistic milestones for project completion"}, "answers": ["A"], "explanation": "Đâu là ví dụ về rủi ro thương mại (Commercial risk) trong hợp đồng?\nA. Business downturn leading to reduced demand (Suy thoái kinh doanh dẫn đến nhu cầu giảm)\n— Commercial risk liên quan đến các yếu tố thị trường và kinh doanh, chẳng hạn nhu cầu giảm, doanh thu sụt giảm hoặc biến động thị trường.", "slide_img": "images/q_443_slide_1794473901246.jpg", "note_img": "images/q_443_note_1794473901246.jpg"}, {"id": 444, "subject": "GLI202", "question": "Which of the following best describes the relationship between logistics and freight forwarding?", "options": {"A": "Logistics is a broader concept that includes freight forwarding as one function.", "B": "Freight forwarding is broader and includes logistics.", "C": "They are completely unrelated.", "D": "Logistics deals only with passenger transport."}, "answers": ["A"], "explanation": "Mồi quan hệ giữa Logistics và Freight Forwarding được mô tả chính xác nhất như thế nào?\nA. Logistics is a broader concept that includes freight forwarding as one function (Logistics là khái niệm rộng hơn, bao gồm giao nhận vận tải như một chức năng) — Logistics\nbao gồm vận tải, kho bãi, tồn kho và phân phói; Freight Forwarding tập trung vào tổ chức vận chuyển hàng hóa.", "slide_img": "images/q_444_slide_1794473903210.jpg", "note_img": "images/q_444_note_1794473903210.jpg"}, {"id": 445, "subject": "GLI202", "question": "Which of the following best describes the scope section of a contract management plan?", "options": {"A": "Defines deliverables. objectives, and responsibilities", "B": "Focuses on brand image and marketing", "C": "Outlines recruitment of new staff", "D": "Specifies customer satisfaction surveys only"}, "answers": ["A"], "explanation": "Phần Scope trong kế hoạch quản lý hợp đồng được mô tả chính xác nhất như thế nào?\nA. Defines deliverables, objectives, and responsibilities (Xác định sản phẩm bàn giao, mục tiêu và trách nhiệm) — Scope làm rõ phạm vi công việc, két quả cần đạt và trách nhiệm\ncủa các bên.", "slide_img": "images/q_445_slide_1794473905021.jpg", "note_img": "images/q_445_note_1794473905021.jpg"}, {"id": 446, "subject": "GLI202", "question": "Which of the following is identified as a parameter for the measurement of contract performance ?", "options": {"A": "Progress against logistics infrastructure investment", "B": "Progress against suitability for use", "C": "Progress against the contractor's internal hiring targets", "D": "Progress against future governmental policies"}, "answers": ["B"], "explanation": "Thông số nào được sử dụng đề đo lường hiệu quả thực hiện hợp đồng?\nB. Progress against suitability for use (Mức độ đáp ứng yêu cầu phù hợp với mục đích sử dụng)\n— Việc đánh giá xem sản phẩm hoặc dịch vụ có đáp ứng mục đích sử dụng là một tiêu chí đo lường hiệu quả hợp đồng.", "slide_img": "images/q_446_slide_1794473906947.jpg", "note_img": "images/q_446_note_1794473906947.jpg"}, {"id": 447, "subject": "GLI202", "question": "ee Which factor most directly ensures that a contract management plan remains effective throughout its lifecycle?", "options": {"A": "Regular monitoring and updating based on performance data", "B": "Detailed advertising campaigns supporting contract visibility", "C": "Extensive supplier elimination to reduce risk", "D": "Maximization of workforce motivation strategies"}, "answers": ["A"], "explanation": "Yếu tố nào trực tiếp giúp kế hoạch quản lý hợp đồng duy trì hiệu quả trong suốt vòng đời hợp đồng?\nA. Regular monitoring and updating based on performance data (Giám sát và cập nhật thường xuyên dựa trên dữ liệu hiệu quả thực hiện) — Việc theo dõi KPI và điều chỉnh kế\nhoạch giúp phát hiện vấn đề kịp thời và duy trì hiệu quả hợp đồng.", "slide_img": "images/q_447_slide_1794473908987.jpg", "note_img": "images/q_447_note_1794473908987.jpg"}, {"id": 448, "subject": "GLI202", "question": "Which of the following factors is listed as an element of the STRUCTURE or ELEMENTS OF SUPPLY MARKET?", "options": {"A": "Market cycles, nature and induced", "B": "Life cycle of purchased items", "C": "Number of suppliers per category", "D": "Growth and Decline, profitability changes by segment"}, "answers": ["C"], "explanation": "Yếu tố nào thuộc nhóm cầu trúc hoặc các thành phần của thị trường cung ứng (Structure/Elements of Supply Market)?\nC. Number of suppliers per category (Số lượng nhà cung cấp trong từng danh mục) — Số lượng nhà cung cấp cho biết mức độ cạnh tranh và khả năng lựa chọn nguồn cung trong thị\ntrường.", "slide_img": "images/q_448_slide_1794473910843.jpg", "note_img": "images/q_448_note_1794473910843.jpg"}, {"id": 449, "subject": "GLI202", "question": "Which of the following best defines freight forwarding?", "options": {"A": "The process of producing and selling goods internationally", "B": "The organization and coordination of cargo movement on behalf of a shipper.", "C": "The control of import and export duties by government authorities.", "D": "The management of warehouse operations only."}, "answers": ["B"], "explanation": "Định nghĩa nào mô tả chính xác nhất hoạt động giao nhận vận tải (Freight Forwarding)?\nB. The organization and coordination of cargo movement on behalf of a shipper (Tổ chức và điều phối việc vận chuyên hàng hóa thay mặt người gửi hàng) — Freight forwarding\nbao gồm sắp xép vận tải, phối hợp các bên và xử lý chứng từ đề hàng hóa được vận chuyền hiệu quả.", "slide_img": "images/q_449_slide_1794473912780.jpg", "note_img": "images/q_449_note_1794473912780.jpg"}, {"id": 450, "subject": "GLI202", "question": "Which of the following best describes the relationship between logistics and freight forwarding?", "options": {"A": "Logistics is a broader concept that includes freight forwarding as one function.", "B": "Freight forwarding is broader and includes logistics.", "C": "They are completely unrelated.", "D": "Logistics deals only with passenger transport."}, "answers": ["A"], "explanation": "Mồi quan hệ giữa Logistics và Freight Forwarding được mô tả chính xác nhất như thế nào?\nA. Logistics is a broader concept that includes freight forwarding as one function (Logistics là khái niệm rộng hơn, bao gồm Freight Forwarding như một chức năng) — Logistics\nbao gồm vận tải, lưu kho, quản lý tồn kho và phân phói; còn Freight Forwarding tập trung vào tổ chức giao nhận vận chuyền hàng hóa.", "slide_img": "images/q_450_slide_1794473914780.jpg", "note_img": "images/q_450_note_1794473914780.jpg"}, {"id": 451, "subject": "GLI202", "question": "Which of the following is a knowledge area typically required of a professional freight forwarder?", "options": {"A": "Medical and pharmaceutical expertise", "B": "Software programming skills", "C": "Understanding of multi-modal transportation networks and global trade routes", "D": "Advanced culinary (cooking) skills"}, "answers": ["C"], "explanation": "Lĩnh vực kiền thức nào thường cần thiết đối với một Freight Forwarder chuyên nghiệp?\nC. Understanding of multi-modal transportation networks and global trade routes (Hiều biết về mạng lưới vận tải đa phương thức và các tuyến thương mại toàn cầu) — Kiến thức\nnày giúp lựa chọn tuyến đường, phương thức vận tải và phương án giao hàng phù hợp.", "slide_img": "images/q_451_slide_1794473916649.jpg", "note_img": "images/q_451_note_1794473916649.jpg"}, {"id": 452, "subject": "GLI202", "question": "Which of the following is a valid warranty in a supply chain contract?", "options": {"A": "A supplier guarantees product quality for a specified period", "B": "A supplier offers verbal assurances without documentation", "C": "A buyer assumes performance without terms", "D": "A contract is silent on product standards"}, "answers": ["A"], "explanation": "Đâu là ví dụ về một điều khoản bảo đảm (Warranty) hợp lệ trong hợp đồng chuối cung ứng?\nA. A supplier guarantees product quality for a specified period (Nhà cung cấp bảo đảm chất lượng sản phẩm trong một thời hạn xác định) — Warranty là cam két về chất lượng\nhoặc tình trạng sản phẩm, thường đi kèm thời hạn và điều kiện bảo hành cụ thể.", "slide_img": "images/q_452_slide_1794473918581.jpg", "note_img": "images/q_452_note_1794473918581.jpg"}, {"id": 453, "subject": "GLI202", "question": "Which of the following best describes the purpose of a Contract Risk Register?", "options": {"A": "Identification and documentation of potential risks in a structured format", "B": "Establishing a schedule for contractor performance reporting", "C": "Monitoring supplier negotiations and contract award decisions", "D": "Tracking changes in commercial market trends only"}, "answers": ["A"], "explanation": "Mục đích chính của Contract Risk Register là gì?\nA. Identification and documentation of potential risks in a structured format (Xác định và ghi nhận các rủi ro tiềm ân theo một cấu trúc có hệ thống) › Contract Risk Register là sồ\nđăng ký rủi ro, giúp theo dõi các rủi ro có thể ảnh hưởng đến việc thực hiện hợp đồng.", "slide_img": "images/q_453_slide_1794473920593.jpg", "note_img": "images/q_453_note_1794473920593.jpg"}, {"id": 454, "subject": "GLI202", "question": "Which criterion belongs to the ‘Technical Ability’ section of Supplier Evaluation?", "options": {"A": "Their technical competence", "B": "The location of the supplier", "C": "The quality of market information they supply", "D": "Their credit rating"}, "answers": ["A"], "explanation": "Tiêu chí nào thuộc nhóm Technical Ability (Năng lực kỹ thuật) trong đánh giá nhà cung cấp?\nA. Their technical competence (Năng lực chuyên môn Kỹ thuật của nhà cung cấp) — Technical competence phản ánh khả năng đáp ứng các yêu cầu Kỹ thuật, công nghệ và tiêu chuẩn\nsản phẩm.", "slide_img": "images/q_454_slide_1794473922401.jpg", "note_img": "images/q_454_note_1794473922401.jpg"}, {"id": 455, "subject": "GLI202", "question": "Which ‘Attitude’ criterion in supplier evaluation directly reflects the potential for collaborative partnership?", "options": {"A": "The quality of their consultation with you on new product development", "B": "Their ability to deliver on time", "C": "The percentage of schedules that are filled in full", "D": "Their credit terms"}, "answers": ["A"], "explanation": "Tiêu chí nào thuộc nhóm Attitude (Thái độ) trong đánh giá nhà cung cấp, thề hiện trực tiếp tiềẻm năng hợp tác lâu dài?\nA. The quality of their consultation with you on new product development (Chất lượng tư vấn và hợp tác trong phát triên sản phâm mới) — Tiêu chí này thể hiện mức độ chủ động,\nsẵn sàng chia sẻ kiến thức và khả năng hợp tác của nhà cung cấp.", "slide_img": "images/q_455_slide_1794473
