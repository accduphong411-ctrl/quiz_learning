ở nên thống nhất và dễ phân tích.", "slide_img": "images/q_113_slide_1794418967831.jpg", "note_img": "images/q_113_note_1794418967831.jpg"}, {"id": 114, "subject": "IAO202", "question": "Which technique is necessary to ensure a private transfer of data using a VPN?", "options": {"A": "authorization", "B": "virtualization", "C": "scalability", "D": "encryption"}, "answers": ["D"], "explanation": "Kỹ thuật nào cần thiết đ đảm bảo truyền dữ liệu riêng tư qua VPN?\nMã hóa.\nVPN dựa vào mã hóa đễ bảo vệ dữ liệu khỏi bị nghe lén.", "slide_img": "images/q_114_slide_1794418969491.jpg", "note_img": "images/q_114_note_1794418969491.jpg"}, {"id": 115, "subject": "IAO202", "question": "Which approach can be used to strengthen the security of a device?", "options": {"A": "Allow USB auto-detection.", "B": "Force periodic password changes.", "C": "Allow users to re-use old passwords.", "D": "Allow default services to remain enabled."}, "answers": ["B"], "explanation": "", "slide_img": "images/q_115_slide_1794418970953.jpg", "note_img": "images/q_115_note_1794418970953.jpg"}, {"id": 116, "subject": "IAO202", "question": "Which method is used by some malware to transfer files from infected hosts to a threat actor host?", "options": {"A": "HTTPS traffic encryption", "B": "ICMP tunneling", "C": "iFrame injection", "D": "UDP infiltration"}, "answers": ["B"], "explanation": "", "slide_img": "images/q_116_slide_1794418972416.jpg", "note_img": "images/q_116_note_1794418972416.jpg"}, {"id": 117, "subject": "IAO202", "question": "Which Windows log contains information about installations of software, including Windows updates?", "options": {"A": "system logs", "B": "application logs", "C": "setup logs", "D": "security logs"}, "answers": ["C"], "explanation": "", "slide_img": "images/q_117_slide_1794418973998.jpg", "note_img": "images/q_117_note_1794418973998.jpg"}, {"id": 118, "subject": "IAO202", "question": "Which technology could pose additional security challenges when implementing loT in an enterprise setting?", "options": {"A": "data storage", "B": "CPU processing speed", "C": "cloud computing", "D": "network bandwidth"}, "answers": ["C"], "explanation": "", "slide_img": "images/q_118_slide_1794418975386.jpg", "note_img": "images/q_118_note_1794418975386.jpg"}, {"id": 119, "subject": "IAO202", "question": "", "options": {"A": "Access layer switch", "B": "Edge router", "C": "Firewall", "D": "Internal router"}, "answers": ["C"], "explanation": "", "slide_img": "images/q_119_slide_1794418977060.jpg", "note_img": "images/q_119_note_1794418977060.jpg"}, {"id": 120, "subject": "IAO202", "question": "Which parameter is typically used to specify the name of a wireless network when setting up a home wireless access point?", "options": {"A": "ad hoc", "B": "ESS", "C": "BESS", "D": "SSID"}, "answers": ["D"], "explanation": "", "slide_img": "images/q_120_slide_1794418978445.jpg", "note_img": "images/q_120_note_1794418978445.jpg"}, {"id": 121, "subject": "IAO202", "question": "Which network monitoring tool can duplicate packets passing through one port and forward them to another port for analysis?", "options": {"A": "SPAN", "B": "syslog", "C": "SNMP", "D": "NAC"}, "answers": ["A"], "explanation": "", "slide_img": "images/q_121_slide_1794418979844.jpg", "note_img": "images/q_121_note_1794418979844.jpg"}, {"id": 122, "subject": "IAO202", "question": "Which technology would be used to create the server logs generated by network devices and reviewed by an entry level network person who works the night shift at a data center?", "options": {"A": "syslog", "B": "VPN", "C": "ACL", "D": "NAT"}, "answers": ["A"], "explanation": "Công nghệ nào được dùng đễ tạo log từ thiết bị mạng và được nhân viên trực ca đêm xem lại?\nSyslog.\nSyslog thu thập và lưu trữ log từ thiết bị mạng đễ phân tích.", "slide_img": "images/q_122_slide_1794418981628.jpg", "note_img": "images/q_122_note_1794418981628.jpg"}, {"id": 123, "subject": "IAO202", "question": "Which technology is a proprietary SIEM system?", "options": {"A": "StealthWatch", "B": "NetFlow collector", "C": "SNMP agent", "D": "Splunk"}, "answers": ["D"], "explanation": "Công nghệ nào là hệ thống SIEM độc quyền?\nSplunk.\nSplunk là SIEM thương mại phố biến dùng đễ phân tích và giám sát an ninh.", "slide_img": "images/q_123_slide_1794418983284.jpg", "note_img": "images/q_123_note_1794418983284.jpg"}, {"id": 124, "subject": "IAO202", "question": "Which type of Trojan horse security breach uses the computer of the victim as the source device to launch other attacks?", "options": {"A": "DoS", "B": "data-sending", "C": "proxy", "D": "FTP"}, "answers": ["C"], "explanation": "Loại Trojan nào sử dụng máy nạn nhân làm nguồn đễ thực hiện các cuộc tần công khác?\nTrojan proxy. :\nLoại này biến máy nạn nhân thành trung gian đễ tần công hệ thống khác.", "slide_img": "images/q_124_slide_1794418985186.jpg", "note_img": "images/q_124_note_1794418985186.jpg"}, {"id": 125, "subject": "IAO202", "question": "Which type of tool is used by a Linux administrator to attack a computer or network to find vulnerabilities?", "options": {"A": "Malware analysis", "B": "Intrusion detection system", "C": "Firewall", "D": "PenTesting"}, "answers": ["D"], "explanation": "Công cụ nào được quản trị viên Linux dùng đề tần công và tìm lỗ hống?\nCông cụ kiêm thử xâm nhập (PenTesting).\nPenTest giúp Kiễm tra độ an toàn của hệ thống bằng cách mô phỏng tần công.", "slide_img": "images/q_125_slide_1794418987004.jpg", "note_img": "images/q_125_note_1794418987004.jpg"}, {"id": 126, "subject": "IAO202", "question": "Which type of security attack would attempt a buffer overflow?", "options": {"A": "reconnaissance", "B": "scareware", "C": "DoS", "D": "ransomware"}, "answers": ["C"], "explanation": "Loại tắn công nào sẽ có gắng gây trản bộ đêm (buffer overflow)2\nDoS.\nTràn bộ đệm có thế làm hệ thống treo hoặc bị crash nhằm từ chóối dịch vụ.", "slide_img": "images/q_126_slide_1794418988712.jpg", "note_img": "images/q_126_note_1794418988712.jpg"}, {"id": 127, "subject": "IAO202", "question": "Which type of tool allows administrators to observe and understand every detail of a network transaction?", "options": {"A": "packet capture software", "B": "log manager", "C": "malware analysis tool", "D": "ticketing system"}, "answers": ["A"], "explanation": "Công cụ nào cho phép quản trị viên quan sát chỉ tiết từng giao dịch mạng?\nPhần mềm bắt gói tin\nCông cụ bắt gói giúp xem nội dung và tiền trình trao đối dữ liệu trên mạng.", "slide_img": "images/q_127_slide_1794418990489.jpg", "note_img": "images/q_127_note_1794418990489.jpg"}, {"id": 128, "subject": "IAO202", "question": "Which type of Windows PowerShell command performs an action and returns an output or object to the next", "options": {"A": "scripts", "B": "cmdlets", "C": "routines", "D": "functions"}, "answers": ["B"], "explanation": "Loại lệnh PowerShell nào thực thị hành động và trả kết quả cho lệnh tiếp theo?\nCmodilets. ]\nCmdlets là các lệnh nhỏ được PowerShell xử lý và có thễể truyền kết quả qua pipeline.", "slide_img": "images/q_128_slide_1794418992205.jpg", "note_img": "images/q_128_note_1794418992205.jpg"}, {"id": 129, "subject": "IAO202", "question": "Which type of network attack involves randomly opening many Telnet requests to a router and results in a valid network administrator not being able to access the device?", "options": {"A": "man-in-the-middle", "B": "DNS poisoning", "C": "SYN flooding", "D": "spoofing"}, "answers": ["C"], "explanation": "Loại tấn công mạng nào mở ngẫu nhiên nhiều yêu cầu Telnet đến router khiền quản trị viên thật không truy cập được?\nTầấn công SYN flooding.\nSYN flood làm cạn tài nguyên kết nổi của thiết bị bằng nhiều yêu cầu giả.", "slide_img": "images/q_129_slide_1794418994156.jpg", "note_img": "images/q_129_note_1794418994156.jpg"}, {"id": 130, "subject": "IAO202", "question": "Which type of transmission is used to transmit a single video stream such as a web-based video conference to a select number of users?", "options": {"A": "anycast", "B": "broadcast", "C": "unicast", "D": "multicast"}, "answers": ["D"], "explanation": "Kiễu truyền nào dùng đễ gửi một luông video đến một nhóm người dùng được chọn?\nMulticast gửi dữ liệu đến nhiều người nhận trong cùng nhóm, tiết kiệm băng thông.", "slide_img": "images/q_130_slide_1794418995926.jpg", "note_img": "images/q_130_note_1794418995926.jpg"}, {"id": 131, "subject": "IAO202", "question": "Which type of business policy establishes the rules of conduct and the responsibilities of employees and employers?", "options": {"A": "Company", "B": "Data", "C": "Employee", "D": "Security"}, "answers": ["A"], "explanation": "", "slide_img": "images/q_131_slide_1794418997426.jpg", "note_img": "images/q_131_note_1794418997426.jpg"}, {"id": 132, "subject": "IAO202", "question": "Which kind of security data can be utilized to characterize or forecast network behavior?", "options": {"A": "alert", "B": "statistical", "C": "transaction", "D": "session"}, "answers": ["B"], "explanation": "", "slide_img": "images/q_132_slide_1794418998865.jpg", "note_img": "images/q_132_note_1794418998865.jpg"}, {"id": 133, "subject": "IAO202", "question": "Which personnel in a SOC are assigned the task of hunting for potential threats and implementing threat detection tools?", "options": {"A": "Tier 2 Incident Reporter", "B": "SOC Manager", "C": "Tier 3 SME", "D": "Tier 1 Analyst"}, "answers": ["C"], "explanation": "Nhân sự nào trong SOC được giao nhiệm vụ săn tìm mồi đe dọa và triển khai công cụ phát hiện tần công?\nChuyên gia Tier 3 (SME).\nTier 3 chịu trách nhiệm threat hunting và phát triển/triên khai công cụ phát hiện.", "slide_img": "images/q_133_slide_1794419000677.jpg", "note_img": "images/q_133_note_1794419000677.jpg"}, {"id": 134, "subject": "IAO202", "question": "Which PDU is processed when a host computer is de-encapsulating a message at the transport layer of the TCP/IP model?", "options": {"A": "segment", "B": "bits", "C": "frame", "D": "packet"}, "answers": ["A"], "explanation": "PDU nào được xử lý khi máy chủ giải đóng gói dữ liệu ở tầng vận chuyên của mô hình TCP/IP?\n&Ềgment. i\nTầng vận chuyên dùng segment nên khi giải đóng gói sế xử lý segment.", "slide_img": "images/q_134_slide_1794419002461.jpg", "note_img": "images/q_134_note_1794419002461.jpg"}, {"id": 135, "subject": "IAO202", "question": "Which protocol is used by ping to test connectivity between network hosts?", "options": {"A": "ICMP", "B": "TCP", "C": "DHCP", "D": "ARP"}, "answers": ["A"], "explanation": "Giao thức nào được ping sử dụng đễ kiêm tra kết nối giữa các host mạng?\nPing gửi ICMP Echo Request/Reply đễ kiếm tra reachability.", "slide_img": "images/q_135_slide_1794419004030.jpg", "note_img": "images/q_135_note_1794419004030.jpg"}, {"id": 136, "subject": "IAO202", "question": "Which type of user account should be reserved solely for performing administrative tasks and not for everyday activities?", "options": {"A": "standard user", "B": "administrator", "C": "power user", "D": "guest"}, "answers": ["B"], "explanation": "", "slide_img": "images/q_136_slide_1794419005568.jpg", "note_img": "images/q_136_note_1794419005568.jpg"}, {"id": 137, "subject": "IAO202", "question": "Which value, that is contained in an IPv4 header field, is decremented by each router that receives a packet?", "options": {"A": "TTL", "B": "Differentiated Services", "C": "Fragment Offset", "D": "Header Length", "E": "None of the mentioned"}, "answers": ["A"], "explanation": "Giá trị nào trong header IPv4 bị giảm ởi bởi mối router nhận gói?\nTTL giảm từng bước đễ ngăn gói chạy vòng vô hạn.", "slide_img": "images/q_137_slide_1794419007375.jpg", "note_img": "images/q_137_note_1794419007375.jpg"}, {"id": 138, "subject": "IAO202", "question": "Which Windows tool can be used by a cyber-security administrator to secure stand-alone computers that are not part of an active directory domain?", "options": {"A": "Windows Defender", "B": "Local Security Policy", "C": "PowerShell", "D": "Windows Firewall"}, "answers": ["B"], "explanation": "Công cụ Windows nào có thế dùng đễ bảo mật máy tính độc lập không thuộc domain?\nLocal Security Policy. :\nCông cụ nảy cho phép kiêm soát chính sách bảo mật cục bộ.", "slide_img": "images/q_138_slide_1794419009241.jpg", "note_img": "images/q_138_note_1794419009241.jpg"}, {"id": 139, "subject": "IAO202", "question": "Which method ensures that VPN traffic stays confidential?", "options": {"A": "verification", "B": "authentication", "C": "encryption", "D": "encapsulation"}, "answers": ["C"], "explanation": "", "slide_img": "images/q_139_slide_1794419010763.jpg", "note_img": "images/q_139_note_1794419010763.jpg"}, {"id": 140, "subject": "IAO202", "question": "Which analysis method depends on predefined conditions and can evaluate applications that operate solely on well-known fixed ports?", "options": {"A": "deterministic", "B": "probabilistic", "C": "log", "D": "statistical"}, "answers": ["A"], "explanation": "", "slide_img": "images/q_140_slide_1794419012286.jpg", "note_img": "images/q_140_note_1794419012286.jpg"}, {"id": 141, "subject": "IAO202", "question": "Which network technology employs a passive splitter to send all traffic, including Layer 1 errors, to an analysis device?", "options": {"A": "NetFlow", "B": "network tap Cc. IDS", "D": "SNMP"}, "answers": ["B"], "explanation": "", "slide_img": "images/q_141_slide_1794419013719.jpg", "note_img": "images/q_141_note_1794419013719.jpg"}, {"id": 142, "subject": "IAO202", "question": "Which protocol provides authentication, integrity, and confidentiality services and is a type of VPN?", "options": {"A": "IPsec", "B": "MD5", "C": "ESP", "D": "AES"}, "answers": ["A"], "explanation": "", "slide_img": "images/q_142_slide_1794419015122.jpg", "note_img": "images/q_142_note_1794419015122.jpg"}, {"id": 143, "subject": "IAO202", "question": "Which feature of the transport layer ensures that a session is successfully established?", "options": {"A": "TCP port number", "B": "UDP ACK flag", "C": "TCP 3-way handshake", "D": "UDP sequence number"}, "answers": [], "explanation": "", "slide_img": "images/q_143_slide_1794419016353.jpg", "note_img": "images/q_143_note_1794419016353.jpg"}, {"id": 144, "subject": "IAO202", "question": "When a user turns on the PC on Wednesday. the PC displays a message indicating that all of the user files have been locked. In order to get the files unencrypted, the user is supposed to send an email and include a specific ID in the email title. The message also includes ways to buy and submit bitcoins as payment for the file decryption. After inspecting the message, the technician suspects a security breach occurred. What type of malware could be responsible?", "options": {"A": "ransomware", "B": "adware", "C": "Trojan", "D": "spyware"}, "answers": ["A"], "explanation": "Khi PC khởi động và báo tất cả file bị khóa và yêu cầâu trả bitcoin đễ mở khóa, loại malware nào gây ra?\nRansomware. Ñ i\nRansomware mã hóa dữ liệu và đòi tiên chuộc đề giải mã.", "slide_img": "images/q_144_slide_1794419018459.jpg", "note_img": "images/q_144_note_1794419018459.jpg"}, {"id": 145, "subject": "IAO202", "question": "When a security audit is performed at a company, the auditor reports that new users have access to network resources beyond their normal job roles. Additionally, users who move to different positions retain their prior permissions. What kind of violation is occurring?", "options": {"A": "least privilege", "B": "network policy", "C": "password", "D": "audit"}, "answers": ["A"], "explanation": "Trong kiễm toán bảo mật, phát hiện người dùng mới có quyền vượt quá vai trò và người chuyên vị trí vấn giữ quyền cũ — đang vi phạm gì?\nNguyên tắc đặc quyền tồi thiều. \\\nNgười dùng có nhiều quyền hơn mức cần thiết là vi phạm least privilege.", "slide_img": "images/q_145_slide_1794419020377.jpg", "note_img": "images/q_145_note_1794419020377.jpg"}, {"id": 146, "subject": "IAO202", "question": "When a user makes changes to the settings of a Windows system. where are these changes stored?", "options": {"A": "Boot.ini", "B": "Win ini", "C": "Registry", "D": "Control Panel"}, "answers": ["C"], "explanation": "Khi người dùng thay đôi cải đặt hệ thống Windows, thay đôi được lưu ở đâu?\nRegistry. :\nRegistry lưu cầu hình hệ thống, ứng dụng và thiết lập người dùng.", "slide_img": "images/q_146_slide_1794419022286.jpg", "note_img": "images/q_146_note_1794419022286.jpg"}, {"id": 147, "subject": "IAO202", "question": "When designing a prototype network for a new server farm. a network designer chooses to use redundant links to connect to the rest of the network. Which business goal will be addressed by this choice?", "options": {"A": "availability", "B": "manageability", "C": "scalability", "D": "security"}, "answers": ["A"], "explanation": "Khi thiết kế mạng cho server farm và dùng liên kết dự phòng, mục tiêu kinh doanh nào đạt được?\nKhả mẵng (availabilitv). ] -\nLiên kết dự phòng giúp hệ thống tiếp tục hoạt động khi liên kết chính gặp lối.", "slide_img": "images/q_147_slide_1794419024261.jpg", "note_img": "images/q_147_note_1794419024261.jpg"}, {"id": 148, "subject": "IAO202", "question": "When a user turns on the PC on Wednesday, the PC displays a message indicating that all of the user files have been locked. In order to get the files unencrypted, the user is supposed to send an email and include a specific ID in the email title. The message also includes ways to buy and submit bitcoins as payment for the file decryption. After inspecting the message, the technician suspects a security breach occurred. What type of malware could be responsible?", "options": {"A": "spyware", "B": "adware", "C": "Trojan", "D": "ransomware"}, "answers": ["D"], "explanation": "Khi người dùng bật PC vào thứ Tư và nhân thông báo tệp đã bị khóa, yêu cầu gửi email và trả tiền chuộc bằng bitcoin, loại phần mềm độc hại nào gây ra điều này?\nransomware — phần mềm tồng tiền -\nRansomvare khóa dữ liệu và yêu cầu trả tiền đễ giải mã.", "slide_img": "images/q_148_slide_1794419026247.jpg", "note_img": "images/q_148_note_1794419026247.jpg"}, {"id": 149, "subject": "IAO202", "question": "When security events from multiple sources are reported in real time. which SIEM function captures and processes the data into a standardized format?", "options": {"A": "normalization", "B": "compliance", "C": "log collection", "D": "aggregation"}, "answers": ["A"], "explanation": "", "slide_img": "images/q_149_slide_1794419027757.jpg", "note_img": "images/q_149_note_1794419027757.jpg"}, {"id": 150, "subject": "IAO202", "question": "nn OOOOOOOOOOOOOOOOOOOEOEO—O—O—ereeeeeeet When real-time reporting of security events from multiple sources is being received, which function in SIEM provides capturing and processing of data in a common format?", "options": {"A": "aggregation", "B": "log collection", "C": "normalization", "D": "compliance"}, "answers": ["C"], "explanation": "", "slide_img": "images/q_150_slide_1794419029213.jpg", "note_img": "images/q_150_note_1794419029213.jpg"}, {"id": 151, "subject": "IAO202", "question": "A cybersecurity analyst is going to verify security alerts using the Security Onion. Which tool should the analyst visit first?", "options": {"A": "Bro", "B": "Sguil", "C": "CapME", "D": "ELK"}, "answers": ["B"], "explanation": "Nhà phân tích an ninh muồốn kiễm tra các cảnh báo trong Security Onion, nên mở công cụ nào trước?\nSquil.\nSguil là giao diện chính đễ xem và xử lý cảnh báo đầu tiền trong Security Onion.", "slide_img": "images/q_151_slide_1794419030868.jpg", "note_img": "images/q_151_note_1794419030868.jpg"}, {"id": 152, "subject": "IAO202", "question": "A company has just had a cyber-security incident. The threat actor appeared to have a goal of network disruption and appeared to use a common security hack tool that overwhelmed a particular server with a large amount of traffic. This traffic rendered the server inoperable. How would a certified cyber-security analyst classify this type of threat actor?", "options": {"A": "state-sponsored", "B": "amateur", "C": "Terrorist", "D": "hacktivist"}, "answers": ["D"], "explanation": "Kề tầắn công dùng công cụ tạo lưu lượng lớn khiến máy chủ bị tê liệt: loại tác nhân đe dọa này được phân loại thế nào?\nhacktivist\nHacktivist thường gây gián đoạn dịch vụ bằng các cuộc tần công DDoS.", "slide_img": "images/q_152_slide_1794419032820.jpg", "note_img": "images/q_152_note_1794419032820.jpg"}, {"id": 153, "subject": "IAO202", "question": "A cybersecurity analyst has been called to a crime scene that contains several technology items including a computer. Which technique will be used so that the information found on the computer can be used in court?", "options": {"A": "Tor", "B": "rootkit", "C": "unaltered disk image", "D": "log collection"}, "answers": ["C"], "explanation": "Khi thu thập bằng chứng từ máy tính tại hiện trường, kỹ thuật nào giúp dữ liệu có thế dùng trước tòa?\nbản sao ö đĩa không bị thay đối \\\nẢnh ỗ đĩa nguyên vẹn giữ nguyên tính toàn vẹn bằng chứng.", "slide_img": "images/q_153_slide_1794419034660.jpg", "note_img": "images/q_153_note_1794419034660.jpg"}, {"id": 154, "subject": "IAO202", "question": "A cybersecurity analyst is performing a CVSS assessment on an attack where a web link was sent to several employees. Once clicked, an internal attack was launched. Which CVSS Base Metric Group Exploitability metric is used to document that the user had to click on the link in order for the attack to occur?", "options": {"A": "scope", "B": "integrity requirement", "C": "availability requirement", "D": "user interaction"}, "answers": ["D"], "explanation": "Trong đánh giá CVSS, người dùng phải nhấp vào liên kết mới kích hoạt tần công; thuộc tính nào thế hiện điều này?\nuser interaction ] |\nCVSS dùng \"user interaction\" đề mô tả khi cần hành động của người dùng.", "slide_img": "images/q_154_slide_1794419036520.jpg", "note_img": "images/q_154_note_1794419036520.jpg"}, {"id": 155, "subject": "IAO202", "question": "A large corporation has modified its network to allow users to access network resources from their personal laptops and smart phones. Which networking trend does this describe?", "options": {"A": "bring your own device", "B": "cloud computing", "C": "online collaboration", "D": "video conferencing"}, "answers": ["A"], "explanation": "Công ty cho phép truy cập tài nguyên mạng từ laptop và điện thoại cá nhân; đây là xu hướng gì?\nbring your own device\nBYOD cho phép dùng thiết bị cá nhân truy cập mạng công ty.", "slide_img": "images/q_155_slide_1794419038287.jpg", "note_img": "images/q_155_note_1794419038287.jpg"}, {"id": 156, "subject": "IAO202", "question": "A large corporation has modified its network to allow users to access network resources from their personal laptops and smart phones. Which networking trend does this describe?", "options": {"A": "cloud computing", "B": "video conferencing", "C": "online collaboration", "D": "bring your own device"}, "answers": ["D"], "explanation": "Công ty cho phép truy cập tài nguyên mạng từ thiết bị cá nhân; xu hướng mạng nào mô tả điều này?\nbring your own device\nBYOD là xu hướng cho phép thiết bị riêng truy cập hệ thống.", "slide_img": "images/q_156_slide_1794419040050.jpg", "note_img": "images/q_156_note_1794419040050.jpg"}, {"id": 157, "subject": "IAO202", "question": "A threat actor collects information from web servers of an organization and searches for employee contact information. The information collected is further used to search personal information on the Internet. To which attack phase do these activities belong according to the Cyber Kill Chain model?", "options": {"A": "weaponization", "B": "action on objectives", "C": "reconnaissance", "D": "exploitation"}, "answers": ["C"], "explanation": "Tác nhân đe dọa thu thập thông tin từ server và tìm dữ liệu cá nhân nhân viên: thuộc giai đoạn nào của Cyber Kill Chain?\nreconnaissance\nReconnaissance là giai đoạn thu thập thông tin trước tần công.", "slide_img": "images/q_157_slide_1794419042011.jpg", "note_img": "images/q_157_note_1794419042011.jpg"}, {"id": 158, "subject": "IAO202", "question": "A network administrator is checking the system logs and notices unusual connectivity tests to multiple well-known ports on a server. What kind of potential network attack could this indicate?", "options": {"A": "access", "B": "information theft", "C": "reconnaissance", "D": "denial of service"}, "answers": ["C"], "explanation": "Quản trị viên thầy nhiều lần kiễm tra kết nồi tới các công nỗi tiếng; đây là loại tần công nào?\nreconnaissance\nQuét công là hành vi trịnh sát thu thập thông tin.", "slide_img": "images/q_158_slide_1794419043888.jpg", "note_img": "images/q_158_note_1794419043888.jpg"}, {"id": 159, "subject": "IAO202", "question": "A network administrator is trying to download a valid file from an internal server. However, the process triggers an alert on a NMS tool. What condition describes this alert?", "options": {"A": "false negative", "B": "false positive", "C": "true negative", "D": "true positive"}, "answers": ["B"], "explanation": "Tải tệp hợp lệ nhưng hệ thống NMS vẫn báo động; đây là trường hợp gì?\nfalse positive\nHệ thống cảnh báo sai dù không có nguy cơ.", "slide_img": "images/q_159_slide_1794419045612.jpg", "note_img": "images/q_159_note_1794419045612.jpg"}, {"id": 160, "subject": "IAO202", "question": "A threat actor has successfully breached the network firewall without being detected by the IDS system. What condition describes the lack of alert?", "options": {"A": "false negative", "B": "false positive", "C": "true positive", "D": "true negative"}, "answers": ["A"], "explanation": "Một kẻ tần công đã đột nhập thành công tường lửa mạng mà không bị hệ thống IDS phát hiện. Tình trạng thiều cảnh báo này được mô tả bằng thuật ngữ nào?\nfalse negative\nIDS bỏ sót một cuộc tần công thật.", "slide_img": "images/q_160_slide_1794419047481.jpg", "note_img": "images/q_160_note_1794419047481.jpg"}, {"id": 161, "subject": "IAO202", "question": "A threat actor has successfully breached the network firewall without being detected by the IDS system. What condition describes the lack of alert?", "options": {"A": "false negative", "B": "true positive", "C": "false positive", "D": "true negative"}, "answers": ["A"], "explanation": "Tường lửa bị vượt qua nhưng IDS không cảnh báo; điều này là trường hợp gì?\nfalse negative\nIDS bỏ sót một cuộc tần công thật.", "slide_img": "images/q_161_slide_1794419049212.jpg", "note_img": "images/q_161_note_1794419049212.jpg"}, {"id": 162, "subject": "IAO202", "question": "A user receives a phone call from a person who claims to represent IT services and then asks that user for confirmation of username and password for auditing purposes. Which security threat does this phone call represent?", "options": {"A": "social engineering", "B": "spam", "C": "DDoS", "D": "anonymous keylogging"}, "answers": ["A"], "explanation": "Một người dùng nhận được một cuộc gọi điện thoại từ một người tự xưng là đại diện cho dịch vụ CNTT và sau đó yêu cầu người dùng đó xác nhận tên người dùng và mật", "slide_img": "images/q_162_slide_1794419051054.jpg", "note_img": "images/q_162_note_1794419051054.jpg"}, {"id": 163, "subject": "IAO202", "question": "A user Calls the help desk complaining that the password to access the wireless network has changed without warning. The user is allowed to change the password, but an hour later, the same thing occurs. What might be happening in this situation?", "options": {"A": "user error", "B": "password policy", "C": "user laptop", "D": "rogue access point"}, "answers": ["D"], "explanation": "", "slide_img": "images/q_163_slide_1794419052738.jpg", "note_img": "images/q_163_note_1794419052738.jpg"}, {"id": 164, "subject": "IAO202", "question": "A web server administrator is configuring access settings to require users to authenticate first before accessing certain web pages. Which requirement of information security is addressed through the configuration?", "options": {"A": "scalability", "B": "availability", "C": "integrity", "D": "confidentiality"}, "answers": ["D"], "explanation": "", "slide_img": "images/q_164_slide_1794419054387.jpg", "note_img": "images/q_164_note_1794419054387.jpg"}, {"id": 165, "subject": "IAO202", "question": "A cybersecurity analyst has been called to a crime scene that contains several technology items including a computer. Which technique will be used so that the information found on the computer can be used in court?", "options": {"A": "Tor", "B": "rootkit", "C": "unaltered disk image", "D": "log collection"}, "answers": ["C"], "explanation": "", "slide_img": "images/q_165_slide_1794419055818.jpg", "note_img": "images/q_165_note_1794419055818.jpg"}, {"id": 166, "subject": "IAO202", "question": "An employee connects wirelessly to the company network using a cell phone. The employee then configures the cell phone to act as a wireless access point that will allow new employees to connect to the company network. Which type of security threat best describes this situation?", "options": {"A": "rogue access point", "B": "cracking", "C": "spoofing", "D": "denial of service"}, "answers": ["A"], "explanation": "", "slide_img": "images/q_166_slide_1794419057599.jpg", "note_img": "images/q_166_note_1794419057599.jpg"}, {"id": 167, "subject": "IAO202", "question": "An attacker is redirecting traffic to a false default gateway in an attempt to intercept the data traffic of a switched network. What type of attack could achieve this?", "options": {"A": "MAC address snooping", "B": "DHCP snooping", "C": "MAC address starvation", "D": "DHCP spoofing"}, "answers": ["D"], "explanation": "", "slide_img": "images/q_167_slide_1794419059018.jpg", "note_img": "images/q_167_note_1794419059018.jpg"}, {"id": 168, "subject": "IAO202", "question": "An SOC is searching for a professional to fill a job opening. The employee must have expert-level skills in networking, endpoint, threat intelligence. and malware reverse engineering in order to search for cyber threats hidden within the network. Which job within an SOC requires a professional with those skills?", "options": {"A": "Incident Responder", "B": "Alert Analyst", "C": "SOC Manager", "D": "Threat Hunter"}, "answers": ["D"], "explanation": "", "slide_img": "images/q_168_slide_1794419060600.jpg", "note_img": "images/q_168_note_1794419060600.jpg"}, {"id": 169, "subject": "IAO202", "question": "An administrator discovers a vulnerability in the network. On analysis of the vulnerability the administrator decides the cost of managing the risk outweighs the cost of the risk itself. The risk is accepted, and no action is taken. What risk management strategy has been adopted?", "options": {"A": "risk transfer", "B": "risk acceptance", "C": "risk reduction", "D": "risk avoidance"}, "answers": ["B"], "explanation": "", "slide_img": "images/q_169_slide_1794419062142.jpg", "note_img": "images/q_169_note_1794419062142.jpg"}, {"id": 170, "subject": "IAO202", "question": "ee After obtaining administrative access, a threat actor sets up a communication channel with their own CnC to control the system for a future DDoS attack. Which phase of the Cyber Kill Chain does this scenario represent?", "options": {"A": "command and control", "B": "exploitation", "C": "action on objectives", "D": "delivery"}, "answers": ["A"], "explanation": "", "slide_img": "images/q_170_slide_1794419063805.jpg", "note_img": "images/q_170_note_1794419063805.jpg"}, {"id": 171, "subject": "IAO202", "question": "Consider the result of the Is -| command in the Linux output below. What are the file permissions assigned to the sales user for the analyst.txt file? Is -| analyst.txt -rwxrw-r-- Sales staff 1028 May 28 15:50 analyst txt", "options": {"A": "write only", "B": "read, write", "C": "read only", "D": "read, write, execute"}, "answers": ["D"], "explanation": "Xét kết quả lệnh Is -I trong Linux dưới đây. Quyền của user sales đồi với file analyst txt là gì?\nBa ký tự đầu dành cho user là rwx, trong đó có quyền đọc, ghi và thực thi.", "slide_img": "images/q_171_slide_1794419065812.jpg", "note_img": "images/q_171_note_1794419065812.jpg"}, {"id": 172, "subject": "IAO202", "question": "Consider the result of the ls -l command in the Linux output below. What are the group file permissions assigned to the analyst. txt file? ls -l analyst. txt -rwxrw-r-- Sales staff 1028 May 28 15:50 analyst. txt", "options": {"A": "Full access", "B": "Read, write", "C": "Read only", "D": "Read, write, execute"}, "answers": ["B"], "explanation": "Ba ký tự dành cho group là rw-, có quyền đọc và ghi.", "slide_img": "images/q_172_slide_1794419067609.jpg", "note_img": "images/q_172_note_1794419067609.jpg"}, {"id": 173, "subject": "IAO202", "question": "ee Employees in a company report poor network performance. Upon investigation, the IT team discovers that an attacker exploited a technique targeting the TCP three-way handshake. What is this type of network attack called?", "options": {"A": "DNS poisoning", "B": "session hijacking", "C": "SYN flood", "D": "DDoS"}, "answers": ["C"], "explanation": "", "slide_img": "images/q_173_slide_1794419069316.jpg", "note_img": "images/q_173_note_1794419069316.jpg"}, {"id": 174, "subject": "IAO202", "question": "In addressing an identified risk, which strategy aims to stop performing the activities that create risk?", "options": {"A": "risk retention", "B": "risk sharing", "C": "risk avoidance", "D": "risk reduction"}, "answers": ["C"], "explanation": "Trong việc xử lý rủi ro, chiền lược nào nhằm dừng việc thực hiện các hoạt động tạo ra rủi ro?\nRisk avoidance nghĩa là loại bỏ hoạt động gây rủi ro.", "slide_img": "images/q_174_slide_1794419071153.jpg", "note_img": "images/q_174_note_1794419071153.jpg"}, {"id": 175, "subject": "IAO202", "question": "If a network admin can ping www.cisco.com but not a company web server at a distant ISP. what tool can pinpoint the router where connectivity is failing?", "options": {"A": "ipconfig", "B": "telnet", "C": "traceroute", "D": "netstat"}, "answers": ["C"], "explanation": "", "slide_img": "images/q_175_slide_1794419072559.jpg", "note_img": "images/q_175_note_1794419072559.jpg"}, {"id": 176, "subject": "IAO202", "question": "In the Diamond Model, which meta-feature element refers to the tools and information—such as software, black hat knowledge bases, usernames, and passwords—that an adversary employs during an intrusion event?", "options": {"A": "resources", "B": "results", "C": "direction", "D": "methodology"}, "answers": ["A"], "explanation": "", "slide_img": "images/q_176_slide_1794419074002.jpg", "note_img": "images/q_176_note_1794419074002.jpg"}, {"id": 177, "subject": "IAO202", "question": "In which step of the NIST incident response process does the CSIRT perform an analysis to determine which networks, systems, or applications are affected: who or what originated the incident; and how the incident is occurring?", "options": {"A": "incident notification", "B": "attacker identification", "C": "scoping", "D": "detection"}, "answers": ["C"], "explanation": "", "slide_img": "images/q_177_slide_1794419075530.jpg", "note_img": "images/q_177_note_1794419075530.jpg"}, {"id": 178, "subject": "IAO202", "question": "In the data gathering process, which type of device will listen for traffic, but only gather traffic statistics?", "options": {"A": "NetFlow collector", "B": "SNMP agent", "C": "syslog server", "D": "NMS"}, "answers": ["A"], "explanation": "Trong quá trình thu thập dữ liệu, loại thiết bị nào chỉ lắng nghe và thu thập thống kê lưu lượng?\nBộ thu thập NetFlow.\nNetFlow chỉ thu thập metadata và thống kê, không bắt toàn bộ gói tin.", "slide_img": "images/q_178_slide_1794419077520.jpg", "note_img": "images/q_178_note_1794419077520.jpg"}, {"id": 179, "subject": "IAO202", "question": "In which step of the NIST incident response process does the CSIRT perform an analysis to determine which networks, systems, or applications are affected; who or what originated the incident; and how the incident is occurring?", "options": {"A": "incident notification", "B": "attacker identification", "C": "scoping", "D": "detection"}, "answers": ["C"], "explanation": "Trong bước nào của quy trình ứng phó sự có NIST, CSIRT phân tích đễ xác định mạng, hệ thống hoặc ứng dụng bị ảnh hưởng và nguồn góc sự có?\nXác định phạm vi (scoping).\nScoping giúp làm rõ phạm vi và nguôn gây ra sự cồ.", "slide_img": "images/q_179_slide_1794419079377.jpg", "note_img": "images/q_179_note_1794419079377.jpg"}, {"id": 180, "subject": "IAO202", "question": "In the operation of a SOC, which system is frequently used to let an analyst select alerts from a pool to investigate?", "options": {"A": "registration system", "B": "ticketing system", "C": "syslog server", "D": "security alert knowledge-based system"}, "answers": ["B"], "explanation": "", "slide_img": "images/q_180_slide_1794419081072.jpg", "note_img": "images/q_180_note_1794419081072.jpg"}, {"id": 181, "subject": "IAO202", "question": "ee Passwords, passphrases, and PINs are examples of which security term?", "options": {"A": "authorization", "B": "identification", "C": "access", "D": "authentication"}, "answers": ["D"], "explanation": "Mật khấu, cụm mật khẩu và mã PIN là ví dụ của thuật ngữ bảo mật nào?\nNhững thông tin này dùng đễ xác minh danh tính người dùng.", "slide_img": "images/q_181_slide_1794419083192.jpg", "note_img": "images/q_181_note_1794419083192.jpg"}, {"id": 182, "subject": "IAO202", "question": "The IT department is reporting that a company web server is receiving an abnormally high number of web page requests from different locations simultaneously. Which type of security attack is occurring?", "options": {"A": "phishing", "B": "social engineering", "C": "adware", "D": "DDoS", "E": "spyware"}, "answers": ["D"], "explanation": "Máy chủ web của công ty đang nhận số lượng lớn yêu cầu từ nhiều nơi cùng lúc. Loại tấn công nào đang xảy ra?\nTấn công DDoS. \\\nDDoS làm quá tải máy chủ bằng nhiều yêu cầu từ nhiều nguồn.", "slide_img": "images/q_182_slide_1794419085222.jpg", "note_img": "images/q_182_note_1794419085222.jpg"}, {"id": 183, "subject": "IAO202", "question": "Which process involves embedding one protocol data unit within another?", "options": {"A": "encoding", "B": "segmentation", "C": "encapsulation", "D": "flow control"}, "answers": ["C"], "explanation": "Quá trình nào liên quan đến việc nhúng một đơn vị dữ liệu giao thức (PDU) vào bên trong một PDU khác?\n\nC. Encapsulation\n\n— Đóng gói dữ liệu.\n\nEncapsulation là quá trình mối tằng mạng thêm thông tin header/trailer của mình vào dữ liệu nhận được từ tằng trên, tạo thành một PDU mới.", "slide_img": "images/q_183_slide_1794419087111.jpg", "note_img": "images/q_183_note_1794419087111.jpg"}, {"id": 184, "subject": "IAO202", "question": "In ICMPv6, which process allows a host to ensure that an IPv6 address is unique before assigning it to an interface?", "options": {"A": "SLAAC", "B": "EUI-64", "C": "DAD", "D": "ARP"}, "answers": ["C"], "explanation": "Trong ICMPv6, quá trình nào cho phép một host đảm bảo rằng địa chỉ IPv6 là duy nhất trước khi gán cho interface?\n\nC. DAD\n\n— Duplicate Address Detection — Phát hiện đĩa chỉ trùng lặp.\n\nDAD là một phần của Neighbor Discovery trong IPv6, được sử dụng đễ kiếm tra xem địa chỉ IPv6 dự kiến sử dụng đã được thiết bị khác sử dụng hay chưa.", "slide_img": "images/q_184_slide_1794419089211.jpg", "note_img": "images/q_184_note_1794419089211.jpg"}, {"id": 185, "subject": "IAO202", "question": "What application layer protocol describes the services that are used for file sharing in Microsoft networks?", "options": {"A": "DHCP", "B": "DNS", "C": "SMTP", "D": "SMB", "E": "Telnet"}, "answers": ["D"], "explanation": "Giao thức tầng ứng dụng nào mô tả các dịch vụ được sử dụng đễ chia sẻ file trong mạng Microsoft?\nD.SMB\n\n— Server Message Block - giao thức chia sẻ tệp trong mạng Microsoft.\n\nSMB được sử dụng phố biến trên Windows để chia sẻ file, thư mục, máy in và các tài nguyên mạng khác.", "slide_img": "images/q_185_slide_1794419091026.jpg", "note_img": "images/q_185_note_1794419091026.jpg"}, {"id": 186, "subject": "IAO202", "question": "Which application layer protocol uses message types such as GET. PUT, and POST?", "options": {"A": "HTTP", "B": "DNS", "C": "POP3", "D": "DHCP", "E": "SMTP"}, "answers": ["A"], "explanation": "Giao thức tầng ứng dụng nào sử dụng các loại message như GET, PUT và POST?\n\nA. HTTP\n\n— Hypertext Transfer Protocol — Giao thức truyền siêu văn bản.\n\nHTTP sử dụng các method như GET đề lấy tài nguyên, POST đễ gửi/tạo dữ liệu và PUT đễ cập nhật hoặc thay thể tài nguyên.", "slide_img": "images/q_186_slide_1794419092901.jpg", "note_img": "images/q_186_note_1794419092901.jpg"}, {"id": 187, "subject": "IAO202", "question": "In which discovery mode does an access point produce the highest amount of traffic on a WLAN?", "options": {"A": "open mode", "B": "passive mode", "C": "mixed mode", "D": "active mode"}, "answers": ["D"], "explanation": "Trong chế độ discovery nào, Access Point tạo ra lượng traffic lớn nhất trên WLAN?\n\nD. Acltive mode\n\n— Chế độ chủ động.\n\nTrong active mode, các thiết bị chủ động gửi các yêu cầu và nhận phản hồi đễ phát hiện mạng không dây, do đó tạo nhiều traffic hơn so với passive mode.", "slide_img": "images/q_187_slide_1794419094921.jpg", "note_img": "images/q_187_note_1794419094921.jpg"}, {"id": 188, "subject": "IAO202", "question": "Which technology is used by Cisco Advanced Malware Protection (AMP) in defending and protecting against known and emerging threats?", "options": {"A": "Network admission control", "B": "Website filtering and block listing", "C": "Network profiling", "D": "Threat intelligence"}, "answers": ["D"], "explanation": "Cisco Advanced Malvrare Protection (AMP) sử dụng công nghệ nào đễ phòng thủ và bảo vệ chồng lại các mối đe dọa đã biết và mới xuất hiện?\nD. Threat intelligence\n\n— Thông tin tình báo về mồi đe dọa.\n\nAMP sử dụng threat intelligence để nhận diện, phân tích và bảo vệ hệ thống trước malware cũng như các mồi đe dọa mới.", "slide_img": "images/q_188_slide_1794419096967.jpg", "note_img": "images/q_188_note_1794419096967.jpg"}, {"id": 189, "subject": "IAO202", "question": "In which type of attack is falsified information used to redirect users to malicious Internet sites?", "options": {"A": "DNS amplification and reflection", "B": "ARP cache poisoning", "C": "DNS cache poisoning", "D": "domain generation"}, "answers": ["C"], "explanation": "Trong loại tần công nào, thông tin giả mạo được sử dụng đề chuyên hướng người dùng đến các trang Internet độc hại?\n\nC. DNS cache poisoning\n\n— Đầu độc bộ nhớ đệm DNS.\n\nKề tắn công đưa thông tin DNS giả vào cache, khiến tên miền hợp lệ được phân giải sang địa chỉ IP do kẻ tần công kiếm soát.", "slide_img": "images/q_189_slide_1794419098862.jpg", "note_img": "images/q_189_note_1794419098862.jpg"}, {"id": 190, "subject": "IAO202", "question": "A security professional is making recommendations to a company for enhancing endpoint security. Which security endpoint technology would be recommended as an agent-based system to protect hosts against malware?", "options": {"A": "IPS", "B": "HIDS", "C": "blacklisting", "D": "baselining"}, "answers": ["B"], "explanation": "Một chuyên gia bảo mật đang đưa ra khuyến nghị đễ tăng cường endpoint security. Công nghệ endpoint nào là một hệ thống dựa trên agent (agent-based) đễ bảo vệ host.\nB.HIDS r\n\n— Host-based Intrusion Detection System — Hệ thống phát hiện xâm nhập trên máy chủ/thiết bị đầu cuồi.\n\nHIDS cải agent trực tiếp trên host đễ giám sát hoạt động, file, log và các dầu hiệu có thế liên quan đến malware hoặc xâm nhập.", "slide_img": "images/q_190_slide_1794419100851.jpg", "note_img": "images/q_190_note_1794419100851.jpg"}, {"id": 191, "subject": "IAO202", "question": "In the CVSS Basic Metric Group, which metric class specifies the effects on confidentiality, integrity, and availability?", "options": {"A": "Impact", "B": "Exploit Code Maturity", "C": "Modified Base", "D": "Exploitability"}, "answers": ["A"], "explanation": "Trong CVSS Basic Metric Group, lớp metric nào xác định ảnh hưởng đến Confidentiality, Integrity và Availability2\n\nA. Impact\n\n— Mức độ tác động.\n\nImpact metrics đánh giá hậu quả của lố hồng đối với ba yếu tổ bảo mật chính: tính bí mật, tính toàn vẹn và tính sẵn sảng.", "slide_img": "images/q_191_slide_1794419102941.jpg", "note_img": "images/q_191_note_1794419102941.jpg"}, {"id": 192, "subject": "IAO202", "question": "", "options": {"A": "AIS", "B": "FireEye", "C": "CVE", "D": "STIX"}, "answers": ["A"], "explanation": "Dịch vụ nào do U.S. Department of Homeland Security (DHS) cung cấp, cho phép trao đổi các chì báo về mồi đe dọa mạng theo thời gian thực giữa Chính phủ Liên bang F\nA.AIS\n\n— Automated Indicator Sharing — Chia sẻ chỉ báo tự động.\n\nAlS hố trợ việc trao đỗi tự động và gần thời gian thực các cyber threat indicators giữa chính phủ và các tổ chức tham gia.", "slide_img": "images/q_192_slide_1794419105124.jpg", "note_img": "images/q_192_note_1794419105124.jpg"}, {"id": 193, "subject": "IAO202", "question": "In the context of modern borderless networks, which vegetable is commonly used as a metaphor for a defense-in-depth strategy?", "options": {"A": "cabbage", "B": "lettuce", "C": "artichoke", "D": "onion"}, "answers": ["D"], "explanation": "Trong bồi cảnh các mạng hiện đại không còn biên giới rõ ràng (borderless networks), loại rau củ nào thường được dùng làm phép ấn dụ cho chiến lược defense-in-depth?\nD. Onion\n\n— Củ hảnh.\n\nDefense-in-depth được ví như các lớp của củ hành: hệ thống sử dụng nhiều lớp bảo mật khác nhau, đễ nều một lớp bị vượt qua thì vấn còn các lớp bảo vệ tiếp theo.", "slide_img": "images/q_193_slide_1794419106929.jpg", "note_img": "images/q_193_note_1794419106929.jpg"}, {"id": 194, "subject": "IAO202", "question": "Which type of attack entails the unauthorized identification and mapping of network systems and services?", "options": {"A": "DoS", "B": "reconnaissance", "C": "trust exploitation", "D": "access"}, "answers": ["B"], "explanation": "Loại tần công nào liên quan đến việc xác định và lập bản đồ trái phép các hệ thống và dịch vụ mạng?\n\nB. Reconnaissance\n\n— Tấn công trinh sát/thăm dò.\n\nReconnaissance là quá trình kẻ tắn công thu thập thông tin về hệ thống mục tiêu, như địa chỉ IP. cống mở, dịch vụ đang chạy và cầu trúc mạng.", "slide_img": "images/q_194_slide_1794419108832.jpg", "note_img": "images/q_194_note_1794419108832.jpg"}, {"id": 195, "subject": "IAO202", "question": "eS Which antimalware software approach can recognize various characteristics of known malware files to detect a threat?", "options": {"A": "Routing-based", "B": "Behavior-based", "C": "Signature-based", "D": "Heunistics-based"}, "answers": ["C"], "explanation": "Phương pháp phần mềm chống malware nào có thế nhận diện các đặc điểm của những file malware đã biết đễ phát hiện mồi đe doa?\nC. Signature-based\n\n— Phát hiện dựa trên chữ ký.\n\nSignature-based detection so sánh đặc điểm hoặc mẫu nhận dạng của file với cơ sở dữ liệu chữ ký của các malware đã biết.", "slide_img": "images/q_195_slide_1794419110862.jpg", "note_img": "images/q_195_note_1794419110862.jpg"}, {"id": 196, "subject": "IAO202", "question": "When an IPv4 host receives a DHCPOFFER message from a DHCP server, which message does it send in response?", "options": {"A": "DHCPREQUEST", "B": "DHCPACK", "C": "DHCPOFFER", "D": "DHCPDISCOVER"}, "answers": ["A"], "explanation": "Khi một host IPv4 nhận được thông báo DHCPOFFER từ DHCP server, nó sẽ gửi thông báo nào đễ phản hồi?\n\nA. DHCPREOUEST\n\n— Thông báo DHCPREOUEST.\n\nQuy trình DHCP thường theo thứ tự DORA: Discover — Offer — Request —¬ Acknowledge. Sau khi nhận DHCPOFFER, client gửi DHCPREQUEST đễ yêu cầu sử dụng đị", "slide_img": "images/q_196_slide_1794419112799.jpg", "note_img": "images/q_196_note_1794419112799.jpg"}, {"id": 197, "subject": "IAO202", "question": "What device would be used as a second line of defense in a defense-in-depth approach?", "options": {"A": "Firewall", "B": "Switch", "C": "Edge router", "D": "Internal router"}, "answers": ["A"], "explanation": "Thiết bị nào được sử dụng như tuyến phòng thủ thứ hai (second line of defense) trong phương pháp defense-in-depth?\n\nA. Firewall\n\n— Tường lửa.\n\nTrong mô hình defense-in-depth truyền thống, edge router thường là tuyến phòng thủ đầu tiên, còn firewall nằm phía sau và đóng vai trò tuyền phòng thủ thứ hai với khả nì", "slide_img": "images/q_197_slide_1794419114588.jpg", "note_img": "images/q_197_note_1794419114588.jpg"}, {"id": 198, "subject": "IAO202", "question": "eee What is the purpose of ICMP messages?", "options": {"A": "to inform routers about network topology changes", "B": "to ensure the delivery of an IP packet", "C": "to provide feedback of IP packet transmissions", "D": "to monitor the process of a domain name to IP address resolution"}, "answers": ["C"], "explanation": "", "slide_img": "images/q_198_slide_1794419117128.jpg", "note_img": "images/q_198_note_1794419117128.jpg"}, {"id": 199, "subject": "IAO202", "question": "What Is an action that should be taken in the discovery step of the vulnerability management life cycle?", "options": {"A": "documenting the security plan", "B": "assigning business value to assets", "C": "developing a network baseline", "D": "determining a risk profile"}, "answers": ["C"], "explanation": "Hành động nào nên được thực hiện trong bước khám phá (discovery) của vòng đời quản lý lỗ nông?\nPhát triển đường cơ sở mạng.\nDiscovery cần baseline đễ biết trạng thái hệ thống trước khi quét.", "slide_img": "images/q_199_slide_1794419119164.jpg", "note_img": "images/q_199_note_1794419119164.jpg"}, {"id": 200, "subject": "IAO202", "question": "OO eeeeeeeeee— What is a feature of the tcpdump tool?", "options": {"A": "It can display packet captures in real time or write them to a file", "B": "It records metadata about packet flows.", "C": "It uses agents to submit host logs to centralized management servers.", "D": "It provides real-time reporting and long-term analysis of security events."}, "answers": ["A"], "explanation": "", "slide_img": "images/q_200_slide_1794419120909.jpg", "note_img": "images/q_200_note_1794419120909.jpg"}, {"id": 201, "subject": "IAO202", "question": "What is the result of an ARP poisoning attack?", "options": {"A": "Network clients are infected with a virus.", "B": "Network clients experience a denial of service.", "C": "Client memory buffers are overwhelmed", "D": "Client information is stolen."}, "answers": ["D"], "explanation": "Kết quả của một cuộc tần công ARP poisoning là gì?\nThông tin của client bị đánh cắp. \\\nARP poisoning chuyễn hướng traffic đễ kẻ tần công lấy dữ liệu.", "slide_img": "images/q_201_slide_1794419122865.jpg", "note_img": "images/q_201_note_1794419122865.jpg"}, {"id": 202, "subject": "IAO202", "question": "What is the purpose for data normalization?", "options": {"A": "to enhance the secure transmission of alert data", "B": "to make the alert data transmission fast", "C": "to simplify searching for correlated events", "D": "to reduce the amount of alert data"}, "answers": ["C"], "explanation": "Mục đích của chuân hóa dữ liệu (data normalization) là gì?\nĐơn giản hóa việc tìm kiếm các sự kiện có liên quan.\nNormalization đưa log về định dạng chung giúp dễ phân tích.", "slide_img": "images/q_202_slide_1794419125000.jpg", "note_img": "images/q_202_note_1794419125000.jpg"}, {"id": 203, "subject": "IAO202", "question": "What is the result of an ARP poisoning attack?", "options": {"A": "Network clients are infected with a virus.", "B": "Network clients experience a denial of service.", "C": "Client memory buffers are overwhelmed.", "D": "Client information is stolen."}, "answers": ["D"], "explanation": "Kết quả của một cuộc tần công ARP poisoning là gì?\nThông tin của client bị đánh cắp. i\nTraffic bị chuyễn qua kẻ tần công nên dữ liệu bị lắy cắp.", "slide_img": "images/q_203_slide_1794419126779.jpg", "note_img": "images/q_203_note_1794419126779.jpg"}, {"id": 204, "subject": "IAO202", "question": "What is the result of a passive ARP poisoning attack?", "options": {"A": "Data is modified in transit or malicious data is inserted in transit.", "B": "Network clients experience a denial of service.", "C": "Confidential information is stolen.", "D": "Multiple subdomains are created."}, "answers": ["C"], "explanation": "Kết quả của một cuộc tần công ARP poisoning thụ động là gì?\nThông tin mật bị đánh cắp. | ]\nPassive ARP poisoning nghe lén đề thu thập dữ liêu mà không sửa đổi.", "slide_img": "images/q_204_slide_1794419128761.jpg", "note_img": "images/q_204_note_1794419128761.jpg"}, {"id": 205, "subject": "IAO202", "question": "What is a characteristic of a hub?", "options": {"A": "regenerates signals received on one port out all other ports", "B": "operates at Layer 2", "C": "uses CSMA/CA to avoid collisions", "D": "subdivides the network into collision domains"}, "answers": ["A"], "explanation": "Đặc điễm của hub là gì? ]\nTái tạo tín hiệu nhận ở một công và phát ra tất cả các công khác.\nHub chỉ lặp lại tín hiệu và không phân tách miền va chạm.", "slide_img": "images/q_205_slide_1794419130781.jpg", "note_img": "images/q_205_note_1794419130781.jpg"}, {"id": 206, "subject": "IAO202", "question": "What are examples of personally identifiable information (PII)?", "options": {"A": "credit card number and street address", "B": "street address and IP address", "C": "first name and IP address", "D": "first name and language preference"}, "answers": ["A"], "explanation": "Ví dụ nào là thông tin nhận dạng cá nhân (PII)?\nSố thẻ tín dụng và địa chỉ nhà.\nCả hai đều có thễ nhận dạng trực tiếp một cá nhân.", "slide_img": "images/q_206_slide_1794419132568.jpg", "note_img": "images/q_206_note_1794419132568.jpg"}, {"id": 207, "subject": "IAO202", "question": "What are examples of DoS attacks?", "options": {"A": "ping of death and buffer overflow", "B": "SQL injection and port scanning", "C": "Phishing and SQL injection", "D": "port scanning and phishing"}, "answers": ["A"], "explanation": "Ví dụ nào là tần công DoS?\nPing of death và buffer overflow. ,\nĐây là hai kiếu tắn công gây quá tải hệ thống.", "slide_img": "images/q_207_slide_1794419134272.jpg", "note_img": "images/q_207_note_1794419134272.jpg"}, {"id": 208, "subject": "IAO202", "question": "A. destination IPv4 address to the source MAC address", "options": {"B": "destination MAC address to a destination |Pv4 address", "C": "destination MAC address to the source IPv4 address", "D": "destination IPv4 address to the destination host name"}, "answers": ["B"], "explanation": "ARP ánh xạ địa chỉ nào?\nĐịa chỉ MAC đích với địa chỉ IPv4 đích.\nARP tìm MAC tương ứng với đĩa chỉ IPv4.", "slide_img": "images/q_208_slide_1794419136143.jpg", "note_img": "images/q_208_note_1794419136143.jpg"}, {"id": 209, "subject": "IAO202", "question": "What addresses are mapped by ARP?", "options": {"A": "|Pv4 address to a destination MAC address", "B": "destination IPv4 address to the source MAC address", "C": "destination IPv4 address to the destination host name", "D": "destination MAC address to the source IPv4 address"}, "answers": ["A"], "explanation": "", "slide_img": "images/q_209_slide_1794419137741.jpg", "note_img": "images/q_209_note_1794419137741.jpg"}, {"id": 210, "subject": "IAO202", "question": "What information is contained in the options section of a Snort rule?", "options": {"A": "action to be taken", "B": "direction of traffic flow", "C": "source and destination address", "D": "text describing the event"}, "answers": ["D"], "explanation": "Tùy chọn trong một rule Snort chứa thông tin gì?\nVăn bản mô tả sự kiện.\nPhần options dùng đễ mô tà chĩ tiết cảnh báo.", "slide_img": "images/q_210_slide_1794419139525.jpg", "note_img": "images/q_210_note_1794419139525.jpg"}, {"id": 211, "subject": "IAO202", "question": "What information is gathered by the CSIRT when determining the scope of a security incident?", "options": {"A": "the networks, systems, and applications affected by an incident", "B": "the amount of time and resources needed to handle an incident", "C": "the strategies and procedures used for incident containment", "D": "the processes used to preserve evidence"}, "answers": ["A"], "explanation": "CSIRT thu thập thông tin gì khi xác định phạm vi sự có?\nCác mạng, hệ thống và ứng dụng bị ảnh hưởng.\nPhạm vi giúp biết mức độ lan rộng của sự có.", "slide_img": "images/q_211_slide_1794419141594.jpg", "note_img": "images/q_211_note_1794419141594.jpg"}, {"id": 212, "subject": "IAO202", "question": "——SaEaE aera een nr What type of information is contained in an ARP table?", "options": {"A": "domain name to IP address mappings", "B": "switch ports associated with destination MAC addresses", "C": "routes to reach destination networks", "D": "IP address to MAC address mappings"}, "answers": ["D"], "explanation": "", "slide_img": "images/q_212_slide_1794419143145.jpg", "note_img": "images/q_212_note_1794419143145.jpg"}, {"id": 213, "subject": "IAO202", "question": "What type of information is contained in a DNS MX record?", "options": {"A": "the IP address of an authoritative name server", "B": "the FQDN of the alias used to identify a service", "C": "the domain name mapped to mail exchange servers", "D": "the IP address for an FQDN entry"}, "answers": ["C"], "explanation": "", "slide_img": "images/q_213_slide_1794419144573.jpg", "note_img": "images/q_213_note_1794419144573.jpg"}, {"id": 214, "subject": "IAO202", "question": "What websites should a user avoid when connecting to a free and open wireless hotspot?", "options": {"A": "websites to check stock prices", "B": "websites to make purchases", "C": "websites to check product details", "D": "websites to check account fees"}, "answers": ["B"], "explanation": "Người dùng nên tránh trang web nào khi dùng WiFi miễn phí?\nCác trang web dùng đễ mua hàng.\nVì có nguy cơ rò rì thông tin thanh toán.", "slide_img": "images/q_214_slide_1794419146319.jpg", "note_img": "images/q_214_note_1794419146319.jpg"}, {"id": 215, "subject": "IAO202", "question": "Which function is provided by the Sguil application?", "options": {"A": "It reports conversations between hosts on the network", "B": "It makes Snort-generated alerts readable and searchable.", "C": "It detects potential network intrusions.", "D": "It prevents malware from attacking a host."}, "answers": ["E"], "explanation": "Ứng dụng Sguil cung cấp chức năng gì?\nLàm cho cảnh báo do Snort tạo ra dễ đọc và dế tìm kiếm.\nSguil là giao diện phân tích alert của Snort.", "slide_img": "images/q_215_slide_1794419148271.jpg", "note_img": "images/q_215_note_1794419148271.jpg"}, {"id": 216, "subject": "IAO202", "question": "Which type of access control applies the strictest access control and is commonly used in military or mission critical applications?", "options": {"A": "attribute-based access control (ABAC)", "B": "discretionary access control (DAC)", "C": "mandatory access control (MAC)", "D": "Non-discretionary access control"}, "answers": ["C"], "explanation": "Kiễu kiếm soát truy cập nào nghiêm ngặt nhất và dùng trong quân sự?\nKiễm soát truy cập bắt buộc (MAC).\nMAC áp đặt quyền bởi hệ thống, người dùng không tự thay đối được.", "slide_img": "images/q_216_slide_1794419150153.jpg", "note_img": "images/q_216_note_1794419150153.jpg"}, {"id": 217, "subject": "IAO202", "question": "Which statement describes statistical data in network security monitoring processes?", "options": {"A": "It contains conversations between network hosts.", "B": "It lists each alert message along with statistical information.", "C": "It is created through an analysis of other forms of network data.", "D": "It shows the results of network activities between network hosts."}, "answers": ["C"], "explanation": "Mô tả nào nói về dữ liệu thông kê trong giám sát an ninh mạng?\nNó được tạo ra qua ựán tích các dạng dữ liệu mạng khác.\nDữ liệu thống kê là tỗng hợp, không phải bản ghĩ trực tiếp.", "slide_img": "images/q_217_slide_1794419152137.jpg", "note_img": "images/q_217_note_1794419152137.jpg"}, {"id": 218, "subject": "IAO202", "question": "Which statement describes session data in security logs?", "options": {"A": "|t reports detailed network activities between network hosts", "B": "It is a record of a conversation between network hosts.", "C": "It shows the result of network sessions.", "D": "It can be used to describe or predict network behavior."}, "answers": ["B"], "explanation": "Mô tả nào nói về session data trong log bảo mật?\nĐó là bản ghi cuộc trò chuyên giữa các máy trên mạng.\nSession data chứa thông tin ai nói chuyện với ai, thời gian, công...", "slide_img": "images/q_218_slide_1794419153963.jpg", "note_img": "images/q_218_note_1794419153963.jpg"}, {"id": 219, "subject": "IAO202", "question": "Which user can override file permissions on a Linux computer?", "options": {"A": "only the creator of the file", "B": "any user that has ‘group’ permission to the file", "C": "root user", "D": "any user that has ‘other permission to the file"}, "answers": ["C"], "explanation": "Người dùng nào có thễ ghi đè quyền file trong Linux?\nNgười dùng root.\nRoot có toàn quyền và không bị hạn chế bởi chmod.", "slide_img": "images/q_219_slide_1794419155850.jpg", "note_img": "images/q_219_note_1794419155850.jpg"}, {"id": 220, "subject": "IAO202", "question": "Which statement describes the ping and tracert commands?", "options": {"A": "Ping shows whether the transmission is successful; tracert does not.", "B": "Tracert shows each hop, while ping shows a destination reply only.", "C": "Tracert uses IP addresses; ping does not", "D": "Both ping and tracert can show results in a graphical display."}, "answers": ["B"], "explanation": "Mệnh đề nào mô tả lệnh ping và tracert? |\nTracert hiến thị từng bước nhảy, còn ping chì hiến thị phản Ệi từ đích.\nTracert cho biết tuyếền đường ối qua từng router, ping chỉ kiếm tra đích có phản hồi hay không.", "slide_img": "images/q_220_slide_1794419157755.jpg", "note_img": "images/q_220_note_1794419157755.jpg"}, {"id": 221, "subject": "IAO202", "question": "A. It helps identify malware signatures.", "options": {"B": "It is used to decode files.", "C": "It verifies confidentiality of files.", "D": "It is used as a key for encryption."}, "answers": ["A"], "explanation": "Giá trị băm của tệp hữu ích như thế nào trong điều tra an ninh mạng?\nNó giúp xác định chữ ký mã độc.\nHash được dùng đễ nhận diện tệp độc hại vì mỗi mã độc có dầu vân tay riêng.", "slide_img": "images/q_221_slide_1794419159573.jpg", "note_img": "images/q_221_note_1794419159573.jpg"}, {"id": 222, "subject": "IAO202", "question": "How does a security information and event management system (SIEM) in a SOC help the personnel fight against security threats?", "options": {"A": "by dynamically implementing firewall rules", "B": "by analyzing logging data in real time", "C": "by integrating all security devices and appliances in an organization", "D": "by combining data from multiple technologies"}, "answers": ["D"], "explanation": "", "slide_img": "images/q_222_slide_1794419161139.jpg", "note_img": "images/q_222_note_1794419161139.jpg"}, {"id": 223, "subject": "IAO202", "question": "How does network scanning help assess operations security?", "options": {"A": "It can detect open TCP ports on network systems.", "B": "It can detect weak or blank passwords.", "C": "It can simulate attacks from malicious sources", "D": "It can log abnormal activity."}, "answers": ["A"], "explanation": "Quét mạng giúp đánh giá an ninh vận hành như thế nào?\nNó có thễ phát hiện các công TCP đang mở trên hệ thống mạng.\nQuét công cho thầy điễm yếu dế bị khai thác.", "slide_img": "images/q_223_slide_1794419163074.jpg", "note_img": "images/q_223_note_1794419163074.jpg"}, {"id": 224, "subject": "IAO202", "question": "How is a DHCPDISCOVER transmitted on a network to reach a DHCP server?", "options": {"A": "A DHCPDISCOVER message is sent with the broadcast IP address as the destination address.", "B": "ADHCPDISCOVER message is sent with a multicast IP address that all DHCP servers listen to as the destination address.", "C": "ADHCPDISCOVER message is sent with the IP address of the default gateway as the destination address.", "D": "ADHCPDISCOVER message is sent with the IP address of the DHCP server as the destination address."}, "answers": ["A"], "explanation": "DHCPDISCOVER được truyền như thế nào đễ tới được DHCP server?\nGói DHCPDISCOVER được gửi với địa chì IP broadcast làm địa chỉ đích.\nClient chưa có IP nên phải broadcast đề tắt cả DHCP server nhận.", "slide_img": "images/q_224_slide_1794419165190.jpg", "note_img": "images/q_224_note_1794419165190.jpg"}, {"id": 225, "subject": "IAO202", "question": "Why is asset management a critical function of a growing organization against security threats?", "options": {"A": "It identifies the ever increasing attack surface to threats.", "B": "It allows for a build of a comprehensive AUP.", "C": "It serves to preserve an audit trail of all new purchases.", "D": "It prevents theft of older assets that are decommissioned."}, "answers": ["A"], "explanation": "Tại sao quản lý tài sản quan trọng với t chức đang phát triển đễ chồng lại mồi đe dọa?\nNó xác định bề mặt tần công ngày càng mở rộng.\nNhiều tài sản mới — nhiều điểm có thê bị tần công.", "slide_img": "images/q_225_slide_1794419167157.jpg", "note_img": "images/q_225_note_1794419167157.jpg"}, {"id": 226, "subject": "IAO202", "question": "Why is Linux considered to be better protected against malware than other operating systems?", "options": {"A": "customizable penetration and protection tools", "B": "fewer deployments", "C": "file system structure, file permissions, and user account restrictions", "D": "integrated firewall"}, "answers": ["C"], "explanation": "Tại sao Linux được xem là bảo vệ tốt hơn trước phần mềm độc hại?\nDo cầu trúc hệ thống tệp, quyền truy cập tệp và giới hạn tài khoản người dùng.\nLinux hạn chế quyền cao nên malware khó chạy tự do.", "slide_img": "images/q_226_slide_1794419169134.jpg", "note_img": "images/q_226_note_1794419169134.jpg"}, {"id": 227, "subject": "IAO202", "question": "Why does HTTPS technology add complexity to network security monitoring?", "options": {"A": "HTTPS uses tunneling technology for confidentiality.", "B": "HTTPS hides the true source IP address using NAT/PAT.", "C": "HTTPS conceals data traffic through end-to-end encryption.", "D": "HTTPS dynamically changes the port number on the web server."}, "answers": ["C"], "explanation": "Tại sao HTTPS làm việc giám sát an ninh mạng phức tạp?\nHTTPS che giấu lưu lượng nhờ mã hóa đầu cuồi.\nMã hóa khiến công cụ giám sát không đọc được nội dung gói tin.", "slide_img": "images/q_227_slide_1794419171020.jpg", "note_img": "images/q_227_note_1794419171020.jpg"}, {"id": 228, "subject": "IAO202", "question": "Why would threat actors prefer to use a zero-day attack in the Cyber Kill Chain weaponization phase?", "options": {"A": "to get a free malware package", "B": "to gain faster delivery of the attack on the target", "C": "to launch a DoS attack toward the target", "D": "to avoid detection by the target"}, "answers": ["D"], "explanation": "Tại sao tác nhân đe doa thích dùng zero-day trong giai đoạn vũ khí hóa?\nĐễ tránh bị phát hiện bởi mục tiêu.\nZero-day chưa bị vá nên rất khó bị phát hiện.", "slide_img": "images/q_228_slide_1794419172930.jpg", "note_img": "images/q_228_note_1794419172930.jpg"}, {"id": 229, "subject": "IAO202", "question": "Why would a rootkit be used by a hacker?", "options": {"A": "to try to guess a password", "B": "to reverse engineer binary files", "C": "to do reconnaissance", "D": "to gain access to a device without being detected"}, "answers": ["D"], "explanation": "ỀỈ sao hacker dùng rootkit2\nĐề truy cập thiết bị mà không bị phát hiện.\nRootkit ấn mình và che dầu hoạt động của kẻ tần công.", "slide_img": "images/q_229_slide_1794419174876.jpg", "note_img": "images/q_229_note_1794419174876.jpg"}, {"id": 230, "subject": "IAO202", "question": "Why would threat actors prefer to use a zero-day attack in the Cyber Kill Chain weaponization phase?", "options": {"A": "to get a free malware package", "B": "to launch a DoS attack toward the target", "C": "to avoid detection by the target", "D": "to gain faster delivery of the attack on the target"}, "answers": ["C"], "explanation": "Tại sao tác nhân đe dọa thích dùng zero-day trong giai đoạn vũ khí hóa?\nĐễ tránh bị phát hiện bởi mục tiêu.\nZero-day không bị nhận diện bởi hệ thống bảo mật.", "slide_img": "images/q_230_slide_1794419176758.jpg", "note_img": "images/q_230_note_1794419176758.jpg"}, {"id": 231, "subject": "IAO202", "question": "", "options": {"A": "It is easier to use than other operating systems", "B": "It is more secure than other server operating systems.", "C": "More network applications are created for this environment.", "D": "The administrator has more control over the operating system."}, "answers": ["D"], "explanation": "", "slide_img": "images/q_231_slide_1794419178527.jpg", "note_img": "images/q_231_note_1794419178527.jpg"}, {"id": 232, "subject": "IAO202", "question": "A user complains that the workstation cannot access the network. The network technician asks the user to issue the ping 127.0.0.1 command. What is the purpose of using this command?", "options": {"A": "to test the reachability of a remote network", "B": "to check that the workstation can reach a DHCP server", "C": "to verify that the TCP/IP stack is operational", "D": "to verify that the NIC is configured with a static address"}, "answers": ["C"], "explanation": "", "slide_img": "images/q_232_slide_1794419180103.jpg", "note_img": "images/q_232_note_1794419180103.jpg"}, {"id": 233, "subject": "IAO202", "question": "A user sends an HTTP request to a web server on a remote network. During encapsulation for this request, what information is added to the address field of a frame to indicate the destination?", "options": {"A": "the network domain of the destination host", "B": "the MAC address of the destination host", "C": "the IP address of the default gateway", "D": "the MAC address of the default gateway"}, "answers": ["D"], "explanation": "", "slide_img": "images/q_233_slide_1794419181704.jpg", "note_img": "images/q_233_note_1794419181704.jpg"}, {"id": 234, "subject": "IAO202", "question": "A. a specially defined group of hosts", "options": {"B": "all hosts in the same network", "C": "all hosts on the Internet", "D": "the closest neighbor on the same network"}, "answers": ["B"], "explanation": "Một host truyền broadcast thì những host nào nhận?\nTất cả các host trong cùng mạng.\nBroadcast chỉ lan trong cùng subnet.", "slide_img": "images/q_234_slide_1794419183614.jpg", "note_img": "images/q_234_note_1794419183614.jpg"}, {"id": 235, "subject": "IAO202", "question": "A PC user issues the netstat command without any options. What is displayed as the result of this command?", "options": {"A": "a local routing table", "B": "a network connection and usage report", "C": "a list of all established active TCP connections", "D": "a historical list of successful pings that have been sent,"}, "answers": ["C"], "explanation": "Lệnh netstat không kèm tùy chọn hiến thị gì?\nDanh sách tất cả các kết nối TCP đang thiết lập.\nNetstat mặc định liệt kê các kết nối TCP hiện hoạt.", "slide_img": "images/q_235_slide_1794419185546.jpg", "note_img": "images/q_235_note_1794419185546.jpg"}, {"id": 236, "subject": "IAO202", "question": "A customer purchases an item from an e-commerce site. The e-commerce site must maintain proof that the data exchange took place between the site and the customer. Which feature of digital signatures is required?", "options": {"A": "nonrepudiation of the transaction", "B": "integrity of digitally signed data", "C": "authenticity of digitally signed data", "D": "confidentiality of the public key"}, "answers": ["A"], "explanation": "Trang thương mại điện tử cần giữ bằng chứng rằng giao dịch dữ liệu đã xảy ra giữa trang và khách hàng. Tính chất nào của chữ ký số cần thiết?\nKhông thể chối bỏ giao dịch. \\\nNonrepudiation chứng minh người gửi không thê phủ nhận đã gửi dữ liệu.", "slide_img": "images/q_236_slide_1794419187674.jpg", "note_img": "images/q_236_note_1794419187674.jpg"}, {"id": 237, "subject": "IAO202", "question": "In a smart home, an owner has connected many home devices to the Internet, such as the refrigerator and the coffee maker. The owner is concerned that these devices will make the wireless network vulnerable to attacks. What action could be taken to address this issue?", "options": {"A": "Configure mixed mode wireless operation.", "B": "Assign static IP addresses to the wireless devices.", "C": "Install the latest firmware versions for the devices.", "D": "Disable the SSID broadcast."}, "answers": ["C"], "explanation": "Trong một ngôi nhà thông minh, chủ nhà đã kết nôi nhiều thiết bị vào Internet như tủ lạnh và máy pha cả phê, và lo rằng các thiết bị này khiến mạng Wiï-Fi dễ bị tần công. H\nCài đặt phiên bản firmware mới nhất cho các thiết bị.\nCập nhật firmware giúp vá lỗ hông bảo mật và giảm nguy cơ bị khai thác.", "slide_img": "images/q_237_slide_1794419189958.jpg", "note_img": "images/q_237_note_1794419189958.jpg"}, {"id": 238, "subject": "IAO202", "question": "What is the function of the distribution layer of the three-layer network design model?", "options": {"A": "providing direct access to the network", "B": "providing secure access to the Internet", "C": "aggregating access layer connections", "D": "providing high speed connection to the network edge"}, "answers": ["C"], "explanation": "Chức năng của Distribution Layer trong mô hình thiết kế mạng ba lớp (three-layer network design model) là gì?\n\nC. Aggregating access layer connections\n\n— Tông hợp các kết nồi từ tầng Access.\n\nDistribution Layer nằm giữa Access Layer và Core Layer, có nhiệm vụ tập hợp các kết nồi từ Access Layer, đồng thời thực hiện routing và áp dụng các chính sách mạng.", "slide_img": "images/q_238_slide_1794419191934.jpg", "note_img": "images/q_238_note_1794419191934.jpg"}, {"id": 239, "subject": "IAO202", "question": "What is the primary drawback of implementing AAA locally?", "options": {"A": "Local implementation cannot provide secure authentication.", "B": "Local implementation supports only TACACS+ servers.", "C": "Local implementation does not scale well.", "D": "Local implementation supports only RADIUS servers."}, "answers": ["C"], "explanation": "Nhược điễm chính của việc triển khai AAA (Authentication, Authorization, Accounting) cục bộ là gì?\n\nC. Local implementation does not scale well.\n\n— Triễn khai cục bộ không có khả năng mở rộng tốt.\n\nLocal AAA yêu cầu thông tin người dùng được quản lý riêng trên từng thiết bị mạng. Khi số lượng thiết bị và người dùng tăng lên, việc quản lý trở nên khó khăn.", "slide_img": "images/q_239_slide_1794419193896.jpg", "note_img": "images/q_239_note_1794419193896.jpg"}, {"id": 240, "subject": "IAO202", "question": "oo What does it indicate if the timestamp in the HEADER section of a syslog message is preceded by a period or asterisk symbol?", "options": {"A": "There is a problem associated with NTP.", "B": "The timestamp represents the round trip duration value", "C": "The syslog message should be treated with high priority.", "D": "The syslog message indicates the time an email is received."}, "answers": ["A"], "explanation": "Nếu timestamp trong phần HEADER của một syslog message có ký hiệu dầu chấm (.) hoặc dầu hoa thị (* đứng trước thì điều đó cho biết gì?\nA. merẹ Is ax problem asỊociated with NTP.\n\n— Có vân đề liên quan đến NTP (Network Time Protocol).\n\nCác ký hiệu này cho biết thiết bị có vần đề về đồng bộ thời gian hoặc thời gian chưa được xác thưc/đồng bộ chính xác thông qua NTP.", "slide_img": "images/q_240_slide_1794419196229.jpg", "note_img": "images/q_240_note_1794419196229.jpg"}, {"id": 241, "subject": "IAO202", "question": "What is the dark web?", "options": {"A": "It is a website that reports the most recent activities of cybercriminals all over the world.", "B": "It is a website that sells stolen credit cards.", "C": "It is part of the internet where a person can obtain personally identifiable information from anyone for free.", "D": "It is part of the internet that can only be accessed with special software."}, "answers": ["D"], "explanation": "", "slide_img": "images/q_241_slide_1794419198698.jpg", "note_img": "images/q_241_note_1794419198698.jpg"}, {"id": 242, "subject": "IAO202", "question": "What is a possible danger of using an unsecured public wireless hotspot?", "options": {"A": "The Intemet connection can become too slow when many users access the wireless hotspot.", "B": "Purchase of products from vendors might be required in exchange for the Internet access.", "C": "Network traffic might be hijacked and information stolen.", "D": "Too many users trying to connect to the Internet may cause a network traffic jam."}, "answers": ["C"], "explanation": "", "slide_img": "images/q_242_slide_1794419200311.jpg", "note_img": "images/q_242_note_1794419200311.jpg"}, {"id": 243, "subject": "IAO202", "question": "What is an example of \"hacktivism\"?", "options": {"A": "large oil spill.", "B": "A country tries to steal defense secrets from another country by infiltrating government networks.", "C": "A teenager breaks into the web server of a local newspaper and posts a picture of a favorite cartoon character.", "D": "A group of environmentalists launch a denial of service attack against an oil company that is responsible for"}, "answers": ["D"], "explanation": "", "slide_img": "images/q_243_slide_1794419201926.jpg", "note_img": "images/q_243_note_1794419201926.jpg"}, {"id": 244, "subject": "IAO202", "question": "What is a feature of distributed firewalls?", "options": {"A": "They all use an open sharing standard platform.", "B": "They use only TCP wrappers to configure rule-based access control and logging systems.", "C": "They use only iptables to configure network rules.", "D": "They combine the feature of host-based firewalls with centralized management."}, "answers": ["D"], "explanation": "", "slide_img": "images/q_244_slide_1794419203413.jpg", "note_img": "images/q_244_note_1794419203413.jpg"}, {"id": 245, "subject": "IAO202", "question": "What is a characteristic of a layered defense-in-depth security approach?", "options": {"A": "Three or more devices are used.", "B": "Routers are replaced with firewalls.", "C": "One safeguard failure does not affect the effectiveness of other safeguards.", "D": "When one device fails, another one takes over."}, "answers": ["C"], "explanation": "Đặc điễm nào mô tả a'chỵtiếp cận bảo mật phòng thủ nhiều lớp (defense-in-depth)?\nMột biện pháp bảo vệ bị lối không ảnh hưởng đến hiệu quả của các biện pháp khác.\nMỗi lớp bảo mật hoạt động độc lập nên không bị vô hiệu toàn bộ nếu một lớp bị phá.", "slide_img": "images/q_245_slide_1794419205365.jpg", "note_img": "images/q_245_note_1794419205365.jpg"}, {"id": 246, "subject": "IAO202", "question": "What is a description of a DNS zone transfer?", "options": {"A": "forwarding a request from a DNS server in a subdomain to an authoritative source", "B": "the action taken when a DNS server sends a query on behalf of a DNS resolver", "C": "transferring blocks of DNS data from a DNS server to another server", "D": "finding an address match and transferring the numbered address from a DNS server to the original requesting client"}, "answers": ["C"], "explanation": "", "slide_img": "images/q_246_slide_1794419207097.jpg", "note_img": "images/q_246_note_1794419207097.jpg"}, {"id": 247, "subject": "IAO202", "question": "What is a benefit to an organization of using SOAR as part of the SIEM system?", "options": {"A": "SOAR was designed to addres
