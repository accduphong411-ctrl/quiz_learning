consolidation shipment?", "options": {"A": "To ensure that even very small shipments contribute something toward handling costs - since the forwarder incurs costs for each shipment (paperwork, handling) regardless of size, a minimum fee helps cover those fixed handling costs.", "B": "To discourage small shippers from shipping at all.", "C": "It is required by law for LCL shipments.", "D": "To overcharge customers unfairly."}, "answers": ["A"], "explanation": "Tại sao Freight Forwarder áp dụng mức phí tối thiểu (Minimum Charge) cho mỗi lô hàng gom?\nA. To ensure that even very small shipments contribute something toward handling costs (Đảm bảo ngay cả lô hàng rất nhỏ cũng đóng góp một phần chỉ phí xử lý) — Mỗi lô\nhàng đều phát sinh chiỉ phí chứng từ và thao tác riêng.", "slide_img": "images/q_542_slide_1794474097822.jpg", "note_img": "images/q_542_note_1794474097822.jpg"}, {"id": 543, "subject": "GLI202", "question": "What is one challenge of consolidating shipments from different customers?", "options": {"A": "Managing the documentation and possibly varying destinations or customs requirements for each part of the consolidated load (e.g., need for House Bills of Lading and a Master Bill of Lading, ensuring proper segregation if goods are incompatible).", "B": "It always increases transit time by months.", "C": "It is illegal to consolidate without customer permission.", "D": "There are no challenges, it's straightforward."}, "answers": ["A"], "explanation": "Một thách thức khi gom hàng từ nhiều khách hàng là gì?\nA. Managing the documentation and possibly varying destinations or customs requirements for each part of the consolidated load (Quản lý chứng từ, các điềm đến và yêu cầu\nhải quan khác nhau của từng phần hàng trong lô hàng gom) — Có thề cằn nhiều House B/L và một Master B/L.", "slide_img": "images/q_543_slide_1794474099771.jpg", "note_img": "images/q_543_note_1794474099771.jpg"}, {"id": 544, "subject": "GLI202", "question": "What is the primary purpose of proper packaging in international shipping?", "options": {"A": "To protect the goods from damage and the environment (and vice versa) during transit, ensuring the merchandise arrives in good condition despite handling, moisture, or theft risks", "B": "To increase the weight of the shipment for higher charges", "C": "To make the goods difficult to access even for the consignee", "D": "To meet aesthetic standards set by carriers"}, "answers": ["A"], "explanation": "Mục đích chính của việc đóng gói đúng cách trong vận chuyền quóốc té là gì?\n\nA. To protect the goods from damage and the environment (and vice versa) during transit, ensuring the merchandise arrives in good condition despite handling, moisture, or\ntheft risks (Bảo vệ hàng hóa khỏi hư hỏng và tác động môi trường trong quá trình vận chuyên, đồng thời hạn chế nguy cơ do bốc xếp, độ âm hoặc trộm cắp) — Đóng gói giúp\nhàng đến nơi trong tình trạng tốt.", "slide_img": "images/q_544_slide_1794474101857.jpg", "note_img": "images/q_544_note_1794474101857.jpg"}, {"id": 545, "subject": "GLI202", "question": "Which of the following is a good packing practice for export shipments?", "options": {"A": "Leave plenty of empty space in boxes so items can shift (to reduce packing material costs).", "B": "Use sturdy, suitable containers; fill voids with cushioning to prevent movement: seal and strap packages, and use moisture-resistant barriers if needed.", "C": "Avoid using any labels or markings on the box.", "D": "Use the cheapest, thinnest cardboard available regardless of cargo weight."}, "answers": ["B"], "explanation": "Đâu là phương pháp đóng gói tốt đói với hàng xuất khẩu?\nB. Use sturdy, suitable containers; fill voids with cushioning to prevent movement; seal and strap packages, and use moisture-resistant barriers if needed (Sử dụng bao bì chắc\nchắn, phù hợp; chèn vật liệu đệm vào khoảng trống đề tránh xê dịch; niêm phong, đai kiện hàng và sử dụng lớp chóng âm khi cần) — Giảm nguy cơ va đập và hư hỏng.", "slide_img": "images/q_545_slide_1794474103845.jpg", "note_img": "images/q_545_note_1794474103845.jpg"}, {"id": 546, "subject": "GLI202", "question": "Why is it important to minimize unnecessary weight and dimensions in packaging?", "options": {"A": "Because shipping costs (for freight charges and sometimes duties) are often based on weight and volume, and smaller, lighter packages are more economical and easier to handle.", "B": "Because big packages are always rejected by carriers.", "C": "Because larger packages will never fit on any transport.", "D": "It isn't important; weight/size don't affect cost."}, "answers": ["A"], "explanation": "Tại sao cần giảm trọng lượng và kích thước bao bì không cần thiết?\nA. Because shipping costs are often based on weight and volume, and smaller, lighter packages are more economical and easier to handle (Vì chi phí vận chuyên thường được\ntính theo trọng lượng và thê tích, nên kiện hàng nhỏ và nhẹ hơn sẽ tiết kiệm và dễ xử lý hơn) — Giúp tối ưu chi phí vận tải.", "slide_img": "images/q_546_slide_1794474105851.jpg", "note_img": "images/q_546_note_1794474105851.jpg"}, {"id": 547, "subject": "GLI202", "question": "————eeeeeeeooooooooooooooooooooooo oo oo  ooaooassasasamssasaaamameo What could be the consequence of improper packaging for international cargo?", "options": {"A": "The goods may be damaged or cause damage to other cargo; claims may be denied by insurers if packaging was inadequate, and the shipment could even be rejected by carriers or incur fines (in cases like leaking hazardous goods).", "B": "The goods will move faster through customs.", "C": "It has no effect on the shipment outcome.", "D": "Carriers will repack the goods for free to ensure safety."}, "answers": ["A"], "explanation": "Đóng gói không đúng cách có thể gây ra hậu quả gì đối với hàng hóa quốc tê?\nA. The goods may be damaged or cause damage to other cargo; claims may be denied by insurers if packaging was inadequate (Hàng hóa có thể bị hư hỏng hoặc gây hư hại\ncho hàng khác; yêu cầu bồi thường bảo hiểm có thể bị từ chối nếu đóng gói không phù hợp) — Ngoài ra, đơn vị vận tải có thể từ chối nhận hàng không đảm bảo an toàn.", "slide_img": "images/q_547_slide_1794474107937.jpg", "note_img": "images/q_547_note_1794474107937.jpg"}, {"id": 548, "subject": "GLI202", "question": "Why should wooden crates or pallets used in international shipping be treated and marked (e.g., with an ISPM 15 stamp)?", "options": {"A": "To meet phytosanitary regulations (prevent spread of pests) - treated wood packaging material is required by many countries, and the ISPM 15 mark shows compliance.", "B": "To make them heavier for stability.", "C": "It's only for aesthetic branding purposes.", "D": "To increase the cost so that only serious exporters use them."}, "answers": ["A"], "explanation": "Tại sao thùng gỗ và pallet gỗ trong vận chuyển quốc tế cần được xử lý và đóng dấu ISPM 15?\nA. To meet phytosanitary regulations (prevent spread of pests) - treated wood packaging material is required by many countries (Đáp ứng quy định kiêm dịch thực vật nhằm\nngăn ngừa sâu bệnh lây lan; nhiều quốc gia yêu cầu bao bì gỗ phải được xử lý) = Dấu ISPM 15 thề hiện việc đáp ứng tiêu chuần xử lý bao bì gỗ.", "slide_img": "images/q_548_slide_1794474109961.jpg", "note_img": "images/q_548_note_1794474109961.jpg"}, {"id": 549, "subject": "GLI202", "question": "Which of the following packaging practices helps in theft prevention during transit?", "options": {"A": "Using unmarked or neutral packaging (no clear indication of valuable contents), sturdy seals or straps, and avoiding any markings that suggest high value inside.", "B": "Writing \"High Value Electronics\" in big letters to ensure careful handling.", "C": "Using transparent boxes so contents are visible to everyone.", "D": "Leaving packages unattended in transit hubs to check trustworthiness."}, "answers": ["A"], "explanation": "Phương pháp đóng gói nào giúp ngăn ngừa trộm cắp trong quá trình vận chuyền?\nA. Using unmarked or neutral packaging, sturdy seals or straps, and avoiding any markings that suggest high value inside (Sử dụng bao bì trung tính, không thê hiện rõ hàng\nhóa giá trị cao, có niêm phong hoặc dây đai chắc chắn và tránh ký hiệu tiết lộ giá trị hàng bên trong) —› Giảm khả năng thu hút hành vi trộm cắp.", "slide_img": "images/q_549_slide_1794474112108.jpg", "note_img": "images/q_549_note_1794474112108.jpg"}, {"id": 550, "subject": "GLI202", "question": "How does a Quality Management System (QMS) benefit the clients of a freight forwarder?", "options": {"A": "process for addressing any issues, thereby increasing customer confidence", "B": "By guaranteeing the cheapest rates in the market for each shipment", "C": "By adding multiple extra layers of paperwork for the client", "D": "It primarily benefits the forwarder internally and has no impact on clients."}, "answers": ["A"], "explanation": "Hệ thống quản lý chất lượng (QMS) mang lại lợi ích gì cho khách hàng của Freight Forwarder?\n\nA. By ensuring more consistent service outcomes (fewer errors or delays), clear communication, and a process for addressing any issues, thereby increasing customer\nconfidence (Đảm bảo chất lượng dịch vụ ồn định hơn, ít sai sót hoặc chậm trễ, giao tiếp rõ ràng và có quy trình xử lý vắn đề, từ đó tăng sự tin tưởng của khách hàng) ¬ QMS\ngiúp khách hàng nhận được dịch vụ đáng tin cậy hơn.", "slide_img": "images/q_550_slide_1794474114251.jpg", "note_img": "images/q_550_note_1794474114251.jpg"}, {"id": 551, "subject": "GLI202", "question": "Which scenario illustrates risk of non-payment in export business, and how can it be mitigated?", "options": {"A": "The buyer may fail to pay after goods are shipped; this can be mitigated by using a Letter of Credit or requiring payment in advance.", "B": "Goods might be damaged in transit; mitigate by packing well.", "C": "Port workers go on strike; mitigate by rerouting shipments.", "D": "The seller produces defective goods; mitigate by inspection."}, "answers": ["A"], "explanation": "Tình huống nào thề hiện rủi ro không thanh toán trong xuất khầu và cách giảm thiều?\nA. The buyer may fail to pay after goods are shipped; this can be mitigated by using a Letter of Credit or requiring payment in advance (Người mua có thê không thanh toán sau\nkhi hàng được gửi đi; có thê giảm rủi ro bằng thư tín dụng L/C hoặc yêu cầu thanh toán trước) — Đây là rủi ro tín dụng thương mại.", "slide_img": "images/q_551_slide_1794474116166.jpg", "note_img": "images/q_551_note_1794474116166.jpg"}, {"id": 552, "subject": "GLI202", "question": "Which of the following is true about the relationship between insurance and a forwarder's liability?", "options": {"A": "Even if a forwarder's liability is limited or excluded by contract, having cargo insurance ensures the cargo owner can recover losses without relying solely on the forwarder or carrier's liability coverage.", "B": "If cargo is insured, the forwarder automatically becomes liable for any loss.", "C": "Buying insurance eliminates the need for any risk management by the forwarder.", "D": "Forwarders are legally required to insure all shipments at full value."}, "answers": ["A"], "explanation": "Mi quan hệ giữa bảo hiểm hàng hóa và trách nhiệm của Freight Forwarder là gì?\n\nA. Even if a forwarder's liability is limited or excluded by contract, having cargo insurance ensures the cargo owner can recover losses without relying solely on the forwarder or\ncarrier's liability coverage (Ngay cả khi trách nhiệm của người giao nhận bị giới hạn hoặc loại trừ theo hợp đồng, bảo hiểm hàng hóa vẫn giúp chủ hàng có cơ sở yêu cầu bồi\nthường mà không chỉ phụ thuộc vào trách nhiệm của người giao nhận hoặc người vận tải) › Việc bồi thường phụ thuộc vào phạm vi và điều kiện bảo hiểm.", "slide_img": "images/q_552_slide_1794474118352.jpg", "note_img": "images/q_552_note_1794474118352.jpg"}, {"id": 553, "subject": "GLI202", "question": "Which of the following is a recommended way to mark cargo?", "options": {"A": "Use durable, weather-resistant labels or paint for addresses and handling instructions, with lettering large and clear enough to be read, and avoid markings that could be misinterpreted.", "B": "Only mark in pencil so it can be changed easily.", "C": "Hide all identification marks to avoid theft (with no labels at all).", "D": "Cover markings with tape completely to protect them (making them unreadable)."}, "answers": ["A"], "explanation": "Cách ghi ký hiệu hàng hóa nào được khuyến nghị?\nA. Use durable, weather-resistant labels or paint for addresses and handling instructions, with lettering large and clear enough to be read (Sử dụng nhãn hoặc sơn bền, chống\nchịu thời tiết đề ghi địa chỉ và hướng dẫn xử lý, với chữ đủ lớn và rõ ràng đề đọc) — Giúp thông tin không bị mất trong quá trình vận chuyển.", "slide_img": "images/q_553_slide_1794474120425.jpg", "note_img": "images/q_553_note_1794474120425.jpg"}, {"id": 554, "subject": "GLI202", "question": "The International Chamber of Commerce (ICC) is known for a broad range of activities in global trade. Which of the following is one of its roles?", "options": {"A": "Setting widely-used commercial standards like Incoterms and providing arbitration services for international business disputes", "B": "Regulating and inspecting cargo at international borders", "C": "Providing loans to developing countries for trade infrastructure", "D": "Enforcing customs rules worldwide"}, "answers": ["A"], "explanation": "Một trong những vai trò của International Chamber of Commerce (ICC) trong thương mại toàn cầu là gì?\n\nA. Setting widely-used commercial standards like Incoterms and providing arbitration services for international business disputes (Xây dựng các tiêu chuân thương mại phổ\nbiến như Incoterms và cung cấp dịch vụ trọng tài giải quyết tranh chấp quốc tế) — ICC xây dựng các quy tắc thương mại và hỗ trợ giải quyết tranh chấp thông qua International Court\nof Arbitration.", "slide_img": "images/q_554_slide_1794474123292.jpg", "note_img": "images/q_554_note_1794474123292.jpg"}, {"id": 555, "subject": "GLI202", "question": "The World Customs Organization (WCO) primarily focuses on:", "options": {"A": "Enhancing the effectiveness and harmonization of customs administrations worldwide to facilitate trade and security", "B": "Settling trade disputes between countries through legal rulings", "C": "Providing financial assistance and development loans to nations", "D": "Setting safety standards for international aviation"}, "answers": ["A"], "explanation": "World Customs Organization (WCO) chủ yếu tập trung vào hoạt động nào?\nA. Enhancing the effectiveness and harmonization of customs administrations worldwide to facilitate trade and security (Nâng cao hiệu quả và hài hòa hóa hoạt động hải quan\ntrên toàn thế giới nhằm tạo thuận lợi thương mại và đảm bảo an ninh) — WCO xây dựng tiêu chuẩn hải quan và thúc đầy hợp tác giữa cơ quan hải quan các quốc gia.", "slide_img": "images/q_555_slide_1794474125423.jpg", "note_img": "images/q_555_note_1794474125423.jpg"}, {"id": 556, "subject": "GLI202", "question": "The World Bank {as it relates to international trade) is best described as: AA source of financial and technical assistance to developing countries, which can include funding trade-related infrastructure and projects", "options": {"B": "A global bank that handles payments for all international trade transactions", "C": "An organization that sets international banking interest rates", "D": "A regulatory body for foreign exchange in trade contracts"}, "answers": ["A"], "explanation": "World Bank được mô tả chính xác nhất như thế nào trong thương mại quốc tếê?\n\nA. A source of financial and technical assistance to developing countries, which can include funding trade-related infrastructure and projects (Nguồn hỗ trợ tài chính và kỹ thuật\ncho các nước đang phát triên, bao gồm tài trợ cơ sở hạ tằng và dự án liên quan đến thương mại) — World Bank hỗ trợ phát triển kinh tế thông qua các khoản vay, viện trợ và tư vần\nkỹ thuật.", "slide_img": "images/q_556_slide_1794474127429.jpg", "note_img": "images/q_556_note_1794474127429.jpg"}, {"id": 557, "subject": "GLI202", "question": "The World Bank is composed of two main institutions - the IBRD and IDA. What do these entities do?", "options": {"A": "They provide loans and credits: IBRD lends to middle-income and creditworthy low-income countries. while IDA offers concessionary loans/grants to the poorest countries", "B": "They directly govern the trade policies of member countries", "C": "They issue international shipping licenses", "D": "They enforce the Incoterms created by ICC"}, "answers": ["A"], "explanation": "Hai tổ chức chính thuộc World Bank là IBRD và IDA có chức năng gì?\n\nA. They provide loans and credits: IBRD lends to middle-income and creditworthy low-income countries, while IDA offers concessionary loans/grants to the poorest countries\n(IBRD cho các nước thu nhập trung bình và một số nước thu nhập thấp đủ điều kiện vay; IDA cung cấp khoản vay ưu đãi và viện trợ cho các nước nghèo nhất) › IBRD và IDA\ncó đồi tượng hỗ trợ và điều kiện tài trợ khác nhau.", "slide_img": "images/q_557_slide_1794474129466.jpg", "note_img": "images/q_557_note_1794474129466.jpg"}, {"id": 558, "subject": "GLI202", "question": "ISO (International Organization for Standardization) is important in international trade because it:", "options": {"A": "Develops and publishes international standards (for products, services, and systems) to ensure quality, safety, and efficiency across different countries", "B": "Negotiates trade tariffs between nations", "C": "Certifies freight forwarders’ financial stability", "D": "Organizes trade fairs and exhibitions worldwide"}, "answers": ["A"], "explanation": "Tại sao ISO quan trọng trong thương mại quốc tê?\n\nA. Develops and publishes international standards for products, services, and systems to ensure quality, safety, and efficiency across different countries (Xây dựng và công bó\ntiêu chuâẩn quốc tế cho sản phẩm, dịch vụ và hệ thống nhằm nâng cao chất lượng, an toàn và hiệu quả) — ISO giúp các doanh nghiệp áp dụng tiêu chuần thống nhất, tạo thuận lợi\ncho hợp tác và thương mại quốc té.", "slide_img": "images/q_558_slide_1794474131499.jpg", "note_img": "images/q_558_note_1794474131499.jpg"}, {"id": 559, "subject": "GLI202", "question": "FIATA (International Federation of Freight Forwarders Associations) is known as the global organization representing freight forwarders. Which of the following is true about FIATA?", "options": {"A": "It is a non-governmental organization that represents tens of thousands of freight forwarders worldwide and is often called the \"Architects of Transport.”", "B": "It is a division of the World Trade Organization responsible for setting freight tariffs.", "C": "It consists only of government customs officials.", "D": "It operates as a freight forwarding company in competition with private forwarders."}, "answers": ["A"], "explanation": "Phát biểu nào đúng về FIATA?\n\nA. lt is a non-governmental organization that represents tens of thousands of freight forwarders worldwide and is often called the \"Architects of Transport\" (Đây là tô chức phi\nchính phủ đại diện cho hàng chục nghìn doanh nghiệp giao nhận vận tải và thường được gọi là “Kiến trúc sư của vận tải”) — FIATA đại diện cho lợi ích của ngành giao nhận vận tải\nquốc tế và thúc đầy các tiêu chuẩn nghiệp vụ.", "slide_img": "images/q_559_slide_1794474133600.jpg", "note_img": "images/q_559_note_1794474133600.jpg"}, {"id": 560, "subject": "GLI202", "question": "The World Customs Organization (WCO) is known for the development of the HS (Harmonized System) code. What is the purpose of the HS code in international trade?", "options": {"A": "It is a standardized tariff classification system for goods, allowing countries to classify traded products uniformly for customs purposes.", "B": "It encrypts trade documents for security.", "C": "It assigns a unique code to every freight forwarder globally.", "D": "It's a system to rate the performance of customs brokers."}, "answers": ["A"], "explanation": "Mục đích của mã HS (Harmonized System) do WCO phát triển là gì?\n\nA. ltis a standardized tariff classification system for goods, allowing countries to classify traded produets uniformly for customs purposes (Hệ thóng phân loại hàng hóa tiêu\nchuân nhằm giúp các quốc gia phân loại sản phẩm thống nhất phục vụ hải quan) › HS Code được sử dụng đề phân loại hàng hóa, xác định thuế quan và phục vụ thống kê thương\nmại.", "slide_img": "images/q_560_slide_1794474135757.jpg", "note_img": "images/q_560_note_1794474135757.jpg"}, {"id": 561, "subject": "GLI202", "question": "UNCTAD helps developing countries by integrating trade, finance, technology, and sustainable development. Which of the following best describes one of UNCTAD'’s activities?", "options": {"A": "Providing research, data. and policy advice on trade and investment issues to developing nations and organizing forums to negotiate better terms in international trade agreements", "B": "Policing international borders and inspecting cargo for contraband", "C": "Issuing quality certifications for export products", "D": "Running a global express shipping service for developing countries"}, "answers": ["A"], "explanation": "Hoạt động nào của UNCTAD hỗ trợ các quốc gia đang phát triển?\n\nA. Providing research, data, and policy advice on trade and investment issues to developing nations and organizing forums to negotiate better terms in international trade\nagreements (Cung cấp nghiên cứu, dữ liệu, tư vắấn chính sách thương mại và đầu tư, đồng thời tôổ chức các diễn đàn đàm phán) — UNCTAD giúp các nước đang phát triển nâng\ncao năng lực tham gia thương mại và đầu tư quốc tề.", "slide_img": "images/q_561_slide_1794474137813.jpg", "note_img": "images/q_561_note_1794474137813.jpg"}, {"id": 562, "subject": "GLI202", "question": "ICC (International Chamber of Commerce) is often called the voice of the global business community. Which of the following is not associated with the ICC?", "options": {"A": "ICC publishes Incoterms which are used worldwide in trade contracts.", "B": "ICC runs the International Court of Arbitration to settle commercial disputes.", "C": "ICC sets mandatory laws that all countries must follow in international trade.", "D": "ICC promotes open trade, self-regulation, and fighting corruption in international business."}, "answers": ["C"], "explanation": "Hoạt động nào sau đây KHÔNG thuộc chức năng của ICC?\nC. ICC sets mandatory laws that all countries must follow in international trade (ICC ban hành các luật bắt buộc tắt cả quốc gia phải tuân thủ trong thương mại quốc tế) › ICC\nxây dựng các quy tắc thương mại và cung cấp dịch vụ trọng tài, nhưng không có thẩm quyền ban hành luật bắt buộc cho mọi quốc gia.", "slide_img": "images/q_562_slide_1794474139743.jpg", "note_img": "images/q_562_note_1794474139743.jpg"}, {"id": 563, "subject": "GLI202", "question": "FIATA has a consultative status with bodies like the UN Economic and Social Council. What is the significance of this status?", "options": {"A": "FIATA can represent the logistics industry's interests and provide input when international trade and transport policies are discussed at the United Nations level.", "B": "FIATA can veto United Nations trade resolutions.", "C": "FIATA directly issues international regulations that all freight forwarders must follow by law.", "D": "FIATA receives funding from the UN to run its operations."}, "answers": ["A"], "explanation": "Việc FIATA có tư cách tham vần tại các tổ chức như Hội đồng Kinh tế và Xã hội Liên Hợp Quốc có ý nghĩa gì?\n\nA. FIATA can represent the logistics industry's interests and provide input when international trade and transport policies are discussed at the United Nations level (FIATA có thề\nđại diện cho lợi ích ngành Iogistics và đóng góp ý Kkiến trong các cuộc thảo luận chính sách thương mại, vận tải tại Liên Hợp Quốc) — Consultative status cho phép FIATA tham gia\nđóng góp ý kiến, nhưng không trao quyền phủ quyết hay ban hành luật quốc tề.", "slide_img": "images/q_563_slide_1794474141893.jpg", "note_img": "images/q_563_note_1794474141893.jpg"}, {"id": 564, "subject": "GLI202", "question": "In summary, which statement correctly matches the organization to its focus?", "options": {"A": "WTO - global trade rules; W/CO - customs matters; ISO - standards: FIATA - freight forwarders' industry; ICC - broad commerce and arbitration.", "B": "WTO - shipping safety; WWCO - finance loans: ISO - legal disputes; FIATA - customs enforcement; ICC - agricultural development.", "C": "WTO - sets Incoterms; WCO - airline regulations; ISO - ocean freight management; FIATA - issues letters of credit; ICC - intellectual property only.", "D": "WTO - humanitarian aid: WCO - weather forecasting; ISO - standardizing currency; FIATA - running logistics companies."}, "answers": ["A"], "explanation": "Phát biểu nào ghép đúng tổ chức quốc tế với lĩnh vực hoạt động?\nA. WTO - global trade rules; WCOO — customs matters; ISO — standards; FIATA — freight forwarders' industry; ICC — broad commerce and arbitration.\nDịch: WTO phụ trách quy tắc thương mại toàn cầu; WCO phụ trách hải quan; ISO phụ trách tiêu chuân; FIATA đại diện ngành giao nhận; ICC thúc đây thương mại và trọng tài.", "slide_img": "images/q_564_slide_1794474143938.jpg", "note_img": "images/q_564_note_1794474143938.jpg"}, {"id": 565, "subject": "GLI202", "question": "Freight forwarding companies can be categorized in various ways. Which of the following is one common way to classify types of forwarders?", "options": {"A": "By their service scope - e.g. some forwarders specialize in modes {sea freight forwarders. air freight forwarders) or in certain industries, while others offer full multi-modal services globally", "B": "By the number of employees they have", "C": "By the country in which their CEO was born", "D": "By the color of their company logo"}, "answers": ["A"], "explanation": "Một cách phồ biến đề phân loại các công ty Freight Forwarding là gì?\n\nA. By their service scope — e.g. some forwarders specialize in modes or industries, while others offer full multi-modal services globally (Phân loại theo phạm vi dịch vụ, chẳng\nhạn chuyên vận tải biên, hàng không, ngành hàng cụ thể hoặc cung cấp dịch vụ đa phương thức toàn cầu) — Freight Forwarders có thể được phân loại theo phương thức vận tải,\nngành hàng chuyên môn hoặc phạm vi dịch vụ.", "slide_img": "images/q_565_slide_1794474145890.jpg", "note_img": "images/q_565_note_1794474145890.jpg"}, {"id": 566, "subject": "GLI202", "question": "Integrators like DHL, UPS, and FedEx differ from traditional freight forwarders in that integrators:", "options": {"A": "Own extensive transportation assets (aircraft, trucks, hubs} and provide end-to-end express delivery services under one company, whereas forwarders typically subcontract carriers and focus on arranging shipments.", "B": "Only handle domestic freight, not international.", "C": "Are non-profit organizations.", "D": "Primarily focus on passenger transportation rather than cargo."}, "answers": ["A"], "explanation": "Các công ty Integrator như DHL, UPS và FedEx khác Freight Forwarder truyền thống như thế nào?\n\nA. Own extensive transportation assets and provide end-to-end express delivery services under one company, whereas forwarders typically subcontract carriers and focus on\n\narranging shipments (Sở hữu mạng lưới phương tiện, trung tâm khai thác và cung cấp dịch vụ chuyên phát nhanh trọn gói, trong khi người giao nhận truyền thống chủ yếu tổ\nchức vận chuyên qua các hãng vận tải) › Integrators thường kiểm soát mạng lưới vận chuyền và giao nhận tích hợp, còn Freight Forwarders thường phối hợp nhiều nhà cung cấp dịch\n\nvụ vận tải.", "slide_img": "images/q_566_slide_1794474148151.jpg", "note_img": "images/q_566_note_1794474148151.jpg"}, {"id": 567, "subject": "GLI202", "question": "ISO 9001:2015 certification in a logistics company signifies that the organization:", "options": {"A": "Has established and follows a rigorous set of quality management processes focusing on customer satisfaction and continual improvement", "B": "Is environmentally sustainable in all operations", "C": "Has the lowest shipping error rate in the industry", "D": "Is certified by customs for security (like C-TPAT or AEO)"}, "answers": ["A"], "explanation": "Chứng nhận ISO 9001:2015 trong công ty logistics cho biết điều gì?\n\nA. Has established and follows a rigorous set of quality management processes focusing on customer satisfaction and continual improvement (Đã thiết lập và tuân thủ hệ thóng\nquy trình quản lý chất lượng tập trung vào sự hài lòng của khách hàng và cải tiền liên tục) — ISO 9001 chứng nhận hệ thống quản lý chất lượng, không đảm bảo tuyệt đối không xảy\nra lỗi.", "slide_img": "images/q_567_slide_1794474149998.jpg", "note_img": "images/q_567_note_1794474149998.jpg"}, {"id": 568, "subject": "GLI202", "question": "A freight forwarder is ISO 9001 certified. What does an external auditor likely check during certification audits?", "options": {"A": "That the forwarder has documented procedures for key processes (like booking shipments, handling documents, customer service), is following those procedures in practice, monitors performance (e.g. shipment delays, customer complaints), and implements corrective actions for improvement", "B": "That the forwarder achieves zero cargo damage in a year", "C": "That the forwarder's prices are standardized", "D": "The personal qualifications of each employee"}, "answers": ["A"], "explanation": "Khi đánh giá chứng nhận ISO 9001, kiềm toán viên bên ngoài thường kiểm tra điều gì?\n\nA. That the forwarder has documented procedures for key processes (like booking shipments, handling documents, customer service), is following those procedures in practice,\nmonitors performanee (e.g. shipment delays, customer complaints), and implements corrective actions for improvement (Công ty có quy trình được ghi chép cho các hoạt động\nchính, thực hiện đúng quy trình, theo dõi hiệu quả và áp dụng biện pháp khắc phục đề cải tiền) — Kiểm toán viên đánh giá cả quy trình và bằng chứng thực hiện thực té.", "slide_img": "images/q_568_slide_1794474152310.jpg", "note_img": "images/q_568_note_1794474152310.jpg"}, {"id": 569, "subject": "GLI202", "question": "Freight forwarders must often integrate with many partners and suppliers. Maintaining quality standards internally can help in:", "options": {"A": "Ensuring that all parties in the supply chain know their roles, reducing miscommunications and service failures", "B": "Replacing the need for contracts with partners", "C": "Avoiding having to monitor subcontractors at all", "D": "Guaranteeing government subsidies"}, "answers": ["A"], "explanation": "Việc duy trì tiêu chuẩn chất lượng nội bộ giúp Freight Forwarder phói hợp với các đối tác và nhà cung cấp như thế nào?\nA. Ensuring that all parties in the supply chain know their roles, reducing miscommunications and service failures (Đảm bảo các bên trong chuỗi cung ứng hiều rõ vai trò của\nmình, giảm hiều nhằm và sai sót dịch vụ) ¬ Phân định trách nhiệm rõ ràng giúp phối hợp hiệu quả hơn.", "slide_img": "images/q_569_slide_1794474154267.jpg", "note_img": "images/q_569_note_1794474154267.jpg"}, {"id": 570, "subject": "GLI202", "question": "Different types of forwarders may include niche specialists. For example, a forwarder specializing in handling oversized project cargo would be different from one focusing on parcel express. Why is it beneficial for forwarding companies to identify their specialization or service scope?", "options": {"A": "It allows them to target the right customer base and develop expertise (and resources) suited to those types of shipments, improving efficiency and reputation in that segment.", "B": "It is required by international law to choose a specialization.", "C": "It prevents them from having to compete in the general market.", "D": "It simplifies customs licensing."}, "answers": ["A"], "explanation": "Tại sao các công ty Freight Forwarding cần xác định lĩnh vực chuyên môn hoặc phạm vi dịch vụ của mình?\n\nA. It allows them to target the right customer base and develop expertise (and resources) suited to those types of shipments, improving efficiency and reputation in that\nsegment (Giúp tiếp cận đúng nhóm khách hàng và phát triển chuyên môn, nguồn lực phù hợp với loại hàng vận chuyên, từ đó nâng cao hiệu quả và uy tín) › Chuyên môn hóa\ngiúp doanh nghiệp phục vụ tốt hơn một phân khúc cụ thể.", "slide_img": "images/q_570_slide_1794474156453.jpg", "note_img": "images/q_570_note_1794474156453.jpg"}, {"id": 571, "subject": "GLI202", "question": "In a freight forwarding firm, what is the role of a Customs Brokerage Department (if present)?", "options": {"A": "To handle the preparation and submission of customs documentation, ensuring that shipments comply with export-import regulations for clearance at borders", "B": "To physically transport goods across the border", "C": "To set the selling price of goods in international trade", "D": "To provide security escorts for high-value cargo"}, "answers": ["A"], "explanation": "Vai trò của bộ phận Customs Brokerage trong công ty Freight Forwarding là gì?\nA. To handle the preparation and submission of customs documentation, ensuring that shipments comply with export-import regulations for clearance at borders (Chuân bị và\nnộp chứng từ hải quan, đảm bảo lô hàng tuân thủ quy định xuất nhập khâu đề được thông quan) — Bộ phận này hỗ trợ thủ tục hải quan.", "slide_img": "images/q_571_slide_1794474158470.jpg", "note_img": "images/q_571_note_1794474158470.jpg"}, {"id": 572, "subject": "GLI202", "question": "A typical company structure for a medium-sized freight forwarder might include which of the following positions at the management level?", "options": {"A": "Operations Manager, Sales/Marketing Manager, Documentation/Customs Manager, Finance Manager (each overseeing their functional area)", "B": "Chief Medical Officer and Chief Design Officer", "C": "Production Line Manager", "D": "Store Manager and Cashier Lead"}, "answers": ["A"], "explanation": "Cơ cầu quản lý của một công ty Freight Forwarding quy mô trung bình thường bao gồm những vị trí nào?\nA. Operations Manager, Sales/Marketing Manager, Documentation/Customs Manager, Finance Manager (each overseeing their functional area) (Quản lý vận hành, quản lý kinh\ndoanh/marketing, quản lý chứng từ/hải quan và quản lý tài chính, mỗi người phụ trách một lĩnh vực) — Đây là những chức năng quản lý quan trọng của doanh nghiệp giao nhận.", "slide_img": "images/q_572_slide_1794474160508.jpg", "note_img": "images/q_572_note_1794474160508.jpg"}, {"id": 573, "subject": "GLI202", "question": "Freight forwarders often strive for quality certifications and service differentiation. If a client requires extremely time-critical shipments with guaranteed delivery times, a forwarder might highlight its:", "options": {"A": "ISO 9001 certification and any memberships in quality programs (to show reliability), as well as partnerships with express carriers or its track record in on-time delivery", "B": "Casual approach to documentation (to save time)", "C": "Lowest cost at the expense of reliability", "D": "Lack of any formal process (improvising each shipment)"}, "answers": ["A"], "explanation": "Nếu khách hàng yêu cầu vận chuyền cực kỳ gấp và đảm bảo thời gian giao hàng, Freight Forwarder nên nhắn mạnh điều gì?\n\nA. ISO 9001 certification and any memberships in quality programs (to show reliability), as well as partnerships with express carriers or its track record in on-time delivery\n(Chứng nhận ISO 9001, việc tham gia các chương trình chất lượng, quan hệ với hãng chuyên phát nhanh và thành tích giao hàng đúng hạn) — Những yếu tố này giúp chứng minh\nđộ tin cậy của dịch vụ.", "slide_img": "images/q_573_slide_1794474162587.jpg", "note_img": "images/q_573_note_1794474162587.jpg"}, {"id": 574, "subject": "GLI202", "question": "Financial accounting in a freight forwarding company is primarily concerned with:", "options": {"A": "Recording and reporting the company's financial transactions and performance (income, expenses, assets, liabilities) to guide management decisions and meet legal reporting requirements", "B": "Tracking individual shipment details like weight and volume", "C": "Managing only the petty cash for office expenses", "D": "Calculating customs duties for clients"}, "answers": ["A"], "explanation": "Kế toán tài chính trong công ty Freight Forwarding chủ yếu liên quan đến hoạt động nào?\n\nA. Recording and reporting the company's financial transactions and performance (income, expenses, assets, liabilities) to guide management decisions and meet legal\nreporting requirements (Ghi nhận và báo cáo các giao dịch, kết quả tài chính của công ty gồm doanh thu, chi phí, tài sản và nợ phải trả nhằm hỗ trợ quản lý và đáp ứng yêu cầu\npháp luật) ¬ Financial accounting phản ánh tình hình tài chính doanh nghiệp.", "slide_img": "images/q_574_slide_1794474164683.jpg", "note_img": "images/q_574_note_1794474164683.jpg"}, {"id": 575, "subject": "GLI202", "question": "Cost accounting differs from general accounting in that it:", "options": {"A": "Focuses on analyzing the company's costs (fixed vs variable) related to its operations, to support budgeting, pricing, and efficiency improvements", "B": "Is concerned only with tax preparation", "C": "Deals exclusively with financial statements for external stakeholders", "D": "Tracks the personal expenses of the company's directors"}, "answers": ["A"], "explanation": "Kế toán chi phí (Cost Accounting) khác kế toán tổng hợp ở điểm nào?\n\nA. Focuses on analyzing the company's costs (fixed vs variable) related to its operations, to support budgeting, pricing, and efficiency improvements (Tập trung phân tích chi\nphí hoạt động, gồm chi phí có định và biến đồi, nhằm hỗ trợ lập ngân sách, định giá và cải thiện hiệu quả) — Cost accounting giúp doanh nghiệp hiểu cầu trúc chỉ phí và tối ưu lợi\nnhuận.", "slide_img": "images/q_575_slide_1794474166789.jpg", "note_img": "images/q_575_note_1794474166789.jpg"}, {"id": 576, "subject": "GLI202", "question": "In accounting terms, what does “invoicing” entail for a freight forwarder?", "options": {"A": "Issuing a bill to the customer detailing the charges for the services provided (freight, fees, etc.), based on the agreed quotation or tariff", "B": "Paying a carrier's bill", "C": "Creating a packing list for a shipment", "D": "Filing a customs declaration"}, "answers": ["A"], "explanation": "Trong kế toán, Invoicing có nghĩa là gì đồi với Freight Forwarder?\nA. Issuing a bill to the customer detailing the charges for the services provided (Phát hành hóa đơn cho khách hàng, ghi rõ các khoản phí dịch vụ đã cung cấp) — Hóa đơn được\nlập dựa trên báo giá hoặc biểu phí đã thỏa thuận.", "slide_img": "images/q_576_slide_1794474169102.jpg", "note_img": "images/q_576_note_1794474169102.jpg"}, {"id": 577, "subject": "GLI202", "question": "A freight forwarder's invoice to a client might include which of the following items?", "options": {"A": "Freight charges, handling fees, documentation fees, insurance premium (if arranged), and any duties/taxes paid on the client's behalf", "B": "The client's profit margin on the goods", "C": "The forwarder's internal employee salaries", "D": "Irrelevant personal expenses of the forwarder's staff"}, "answers": ["A"], "explanation": "Hóa đơn Freight Forwarder gửi khách hàng có thể bao gồm những khoản nào?\nA. Freight charges, handling fees, documentation fees, insurance premium, and any duties/taxes paid on the client's behalf (Cước vận tải, phí xử lý hàng, phí chứng từ, phí bảo\nhiểm và thuế hoặc lệ phí đã thanh toán thay khách hàng) — Đây là những khoản chỉ phí có thề phát sinh trong quá trình giao nhận.", "slide_img": "images/q_577_slide_1794474171115.jpg", "note_img": "images/q_577_note_1794474171115.jpg"}, {"id": 578, "subject": "GLI202", "question": "Risk management in a forwarding company is the process of:", "options": {"A": "Identifying potential risks (loss, damage. delay, non-payment, etc.), analyzing their likelihood and impact, and developing strategies to prevent or mitigate these risks", "B": "Eliminating all risks entirely before accepting any shipment", "C": "Buying the cheapest insurance and hoping for the best", "D": "Transferring all responsibility to the customer"}, "answers": ["A"], "explanation": "Quản trị rủi ro (Risk Management) trong công ty Freight Forwarding là quá trình gì?\nA. Identifying potential risks, analyzing their Iikelinood and impact, and developing strategies to prevent or mitigate these risks (Xác định rủi ro tiềm ân, phân tích khả năng xảy\nra và mức độ tác động, sau đó xây dựng biện pháp phòng ngừa hoặc giảm thiêu) — Mục tiêu là hạn chế tồn thất và gián đoạn vận chuyển.", "slide_img": "images/q_578_slide_1794474173109.jpg", "note_img": "images/q_578_note_1794474173109.jpg"}, {"id": 579, "subject": "GLI202", "question": "An example of risk shifting in freight forwarding is:", "options": {"A": "Purchasing cargo insurance to cover potential loss or damage (shifts financial risk to the insurer)", "B": "Using cheaper packaging and hoping goods aren't damaged", "C": "Refusing to handle valuable cargo at all", "D": "Always using the fastest route regardless of cost"}, "answers": ["A"], "explanation": "Đâu là ví dụ về chuyền giao rủi ro (Risk Shifting) trong Freight Forwarding?\nA. Purchasing cargo insurance to cover potential loss or damage (Mua bảo hiêm hàng hóa đề bảo vệ trước nguy cơ mất mát hoặc hư hỏng) — Bảo hiểm chuyển một phần rủi ro tài\nchính sang công ty bảo hiểm theo điều khoản hợp đồng.", "slide_img": "images/q_579_slide_1794474174982.jpg", "note_img": "images/q_579_note_1794474174982.jpg"}, {"id": 580, "subject": "GLI202", "question": "————eeeeeeeooooooooooooooooooooooo oo oo  ooaooassasasamssasaaamameo Freight forwarders face foreign exchange risk when dealing with international clients. How might a forwarder manage or reduce currency risk on a transaction?", "options": {"A": "Quote freight charges in their home currency or a stable currency (like USD or EUR) and/or require prompt payment to avoid long exposure to exchange fluctuations", "B": "Gamble on currency markets to offset any loss", "C": "Only accept cash in their local currency regardless of client location", "D": "Ignore exchange rates and convert at the end of the year"}, "answers": ["A"], "explanation": "Freight Forwarder có thề giảm rủi ro tỷ giá như thế nào?\nA. Quote freight charges in their home currencoy or a stable currency and/or require prompt payment (Báo giá bằng nội tệ hoặc đồng tiền ôn định và/hoặc yêu cầu thanh toán\nsớm) — Giảm thời gian tiếp xúc với biến động tỷ giá.", "slide_img": "images/q_580_slide_1794474176992.jpg", "note_img": "images/q_580_note_1794474176992.jpg"}, {"id": 581, "subject": "GLI202", "question": "Political risk can affect freight forwarding - which of the following is a political risk event?", "options": {"A": "A sudden ban on exports or an import embargo by a government affecting the shipment", "B": "A trucking company's vehicle breaking down", "C": "Acustomer changing the delivery address last-minute", "D": "Bad weather at sea"}, "answers": ["A"], "explanation": "Đâu là ví dụ về rủi ro chính trị (Political Risk) trong Freight Forwarding?\nA. A sudden ban on exports or an import embargo by a government affecting the shipment (Chính phủ đột ngột cắm xuất khâu hoặc áp đặt lệnh cắm vận nhập khâu ảnh hưởng\nđến lô hàng) › Chính sách nhà nước có thể khiến hoạt động vận chuyển bị gián đoạn.", "slide_img": "images/q_581_slide_1794474178921.jpg", "note_img": "images/q_581_note_1794474178921.jpg"}, {"id": 582, "subject": "GLI202", "question": "If a forwarder identifies a \"risk of cargo damage due to rough handling”, a risk prevention strategy would be:", "options": {"A": "Ensuring proper packaging and handling instructions, and choosing reputable carriers known for careful handling", "B": "Deciding not to take any shipments at all", "C": "Simply warning the customer that damage might occur", "D": "Ignoring carrier handling practices"}, "answers": ["A"], "explanation": "Nếu có nguy cơ hàng hóa hư hỏng do bốc xếp mạnh tay, biện pháp phòng ngừa nào phù hợp?\nA. Ensuring proper packaging and handling instructions, and choosing reputable carriers known for careful handling (Đảm bảo đóng gói đúng cách, có hướng dẫn bóc xếp và\nlựa chọn hãng vận tải uy tín) ¬ Giúp giảm khả năng hư hỏng ngay từ đầu.", "slide_img": "images/q_582_slide_1794474180899.jpg", "note_img": "images/q_582_note_1794474180899.jpg"}, {"id": 583, "subject": "GLI202", "question": "In risk management, once you have identified and assessed risks, why is monitoring and reviewing them throughout the shipment process important?", "options": {"A": "Because conditions can change (new risks can emerge or known risks can intensify) and continuous monitoring allows the forwarder to respond or adjust plans proactively if a risk is becoming reality", "B": "Because it is required by law to fill out risk review forms daily", "C": "Since most risks will resolve on their own, monitoring is the only step needed", "D": "Itisn't important; once a plan is made, you stick to it regardless of changes"}, "answers": ["A"], "explanation": "Tại sao cần liên tục giám sát và đánh giá rủi ro trong quá trình vận chuyển?\nA. Because conditions can change and continuous monitoring allows the forwarder to respond or adjust plans proactively (Vì điều kiện có thê thay đổi và việc giám sát liên tục\ngiúp người giao nhận chủ động ứng phó hoặc điều chỉnh kế hoạch) — Rủi ro mới có thề phát sinh trong suốt hành trình.", "slide_img": "images/q_583_slide_1794474182912.jpg", "note_img": "images/q_583_note_1794474182912.jpg"}, {"id": 584, "subject": "GLI202", "question": "FIATA has developed standard trade documents for forwarders. What is one benefit of these FIATA documents?", "options": {"A": "They provide uniform formats recognized internationally, which helps streamline shipping processes and clarify forwarders’ roles (e.g., FIATA Bill of Lading).", "B": "They replace all government-required documents.", "C": "They are secret documents used only between forwarders and not shown to other parties.", "D": "They eliminate the need for any insurance in freight forwarding."}, "answers": ["A"], "explanation": "Một lợi ích của các chứng từ tiêu chuẩn do FIATA phát triển là gì?\n\nA. They provide uniform formats recognized internationally, which helps streamline shipping processes and clarify forwarders' roles (Cung cấp các mẫu chứng từ thống nhất\nđược quốc tế công nhận, giúp đơn giản hóa quy trình vận chuyên và làm rõ vai trò người giao nhận) › Các chứng từ như FIATA Bill of Lading giúp tiêu chuẩn hóa hoạt động giao\nnhận quốc té.", "slide_img": "images/q_584_slide_1794474184897.jpg", "note_img": "images/q_584_note_1794474184897.jpg"}, {"id": 585, "subject": "GLI202", "question": "The International Air Transport Association (IATA) and the International Road Transport Union (IRU) are examples of organizations that:", "options": {"A": "Develop industry standards and represent the interests of carriers in air and road transport, respectively, facilitating international transportation.", "B": "Govern trade treaties between countries.", "C": "Represent only shippers (exporters and importers) globally.", "D": "Issue licenses for freight forwarders to operate."}, "answers": ["A"], "explanation": "IATA và IRU là ví dụ về những tồ chức có chức năng gì?\nA. Develop industry standards and represent the interests of carriers in air and road transport, respectively, facilitating international transportation (Xây dựng tiêu chuân ngành\nvà đại diện lợi ích của các doanh nghiệp vận tải hàng không và đường bộ) — IATA tập trung vào vận tải hàng không, còn IRU đại diện cho ngành vận tải đường bộ.", "slide_img": "images/q_585_slide_1794474186956.jpg", "note_img": "images/q_585_note_1794474186956.jpg"}, {"id": 586, "subject": "GLI202", "question": "Fixed vs Variable costs: A forwarder's fixed costs (like salaries, rent) mean that if shipment volumes drop temporarily, those costs...", "options": {"A": "Stay the same in total, which can reduce profitability until volume picks up (because they don't decrease when you ship less)", "B": "Also drop to zero immediately", "C": "Turn into variable costs automatically", "D": "Increase per shipment in proportion to weight"}, "answers": ["A"], "explanation": "Khi khối lượng lô hàng giảm tạm thời, chi phí có định của Freight Forwarder sẽ như thế nào?\nA. Stay the same in total, which can reduce profitability until volume picKs up (Tông chi phí có định vẫn giữ nguyên, có thê làm giảm lợi nhuận cho đến khi số lượng lô hàng\ntăng trở lại) — Ví dụ tiền thuê văn phòng vẫn phải trả dù ít đơn hàng.", "slide_img": "images/q_586_slide_1794474188813.jpg", "note_img": "images/q_586_note_1794474188813.jpg"}, {"id": 587, "subject": "GLI202", "question": "Financial control: Why is it important for a freight forwarder to have a strong accounting and financial control system?", "options": {"A": "To accurately determine profitability per shipment or customer, prevent revenue leakage (like unbilled services), and ensure all carrier bills and duty payments are passed on to clients appropriately", "B": "To satisfy the curiosity of competitors", "C": "To hide profits from taxation", "D": "Freight forwarders deal only in cash and don't need accounting"}, "answers": ["A"], "explanation": "Tại sao Freight Forwarder cần có hệ thống kế toán và kiểm soát tài chính tốt?\n\nA. To accurately determine profitability per shipment or customer, prevent revenue leakage, and ensure all carrier bills and duty payments are passed on to clients appropriately\n(Xác định chính xác lợi nhuận theo từng lô hàng hoặc khách hàng, tránh thất thoát doanh thu và đảm bảo các khoản cước, thuế được tính lại cho khách hàng phù hợp) ¬ Giúp\nkiểm soát chi phí và tránh bỏ sót khoản phải thu.", "slide_img": "images/q_587_slide_1794474190892.jpg", "note_img": "images/q_587_note_1794474190892.jpg"}, {"id": 588, "subject": "GLI202", "question": "The FIATA FBL (FIATA Bill of Lading) is:", "options": {"A": "Anegotiable multimodal transport document issued by freight forwarders acting as carriers, which can be transferred by endorsement to transfer title to the goods (unless marked \"non-negotiable\")", "B": "A document issued by banks for letters of credit", "C": "A certificate of insurance for freight forwarders", "D": "A customs form required for all exports"}, "answers": ["A"], "explanation": "FIATA FBL (FIATA Bill of Lading) là gì?\nA. A negotiable multimodal transport document issued by freight forwarders acting as carriers (Chứng từ vận tải đa phương thức có thê chuyên nhượng do Freight Forwarder\nphát hành khi hoạt động với tư cách người vận tải) › FBL có thể được chuyền nhượng bằng ký hậu nếu được phát hành ở dạng có thể chuyền nhượng.", "slide_img": "images/q_588_slide_1794474192872.jpg", "note_img": "images/q_588_note_1794474192872.jpg"}, {"id": 589, "subject": "GLI202", "question": "The FIATA FWB (FIATA Waybill) is characterized by which of the following?", "options": {"A": "Itis a non-negotiable multimodal transport document (a waybill} issued by forwarders, which cannot be endorsed to transfer title and is used when the consignee is fixed.", "B": "It serves as a bank guarantee.", "C": "It is a negotiable document just like the FBL.", "D": "It is used only for air freight shipments."}, "answers": ["A"], "explanation": "Đặc điềm của FIATA FWB (FIATA WayPbill) là gì?\n\nA. ltis a non-negotiable multimodal transport document issued by forwarders, which cannot be endorsed to transfer title and is used when the consignee is fixed (Chứng từ vận\ntải đa phương thức không thê chuyên nhượng do Freight Forwarder phát hành, không thể ký hậu đề chuyên giao quyền định đoạt hàng hóa và được sử dụng khi người nhận\nhàng đã xác định) › FWB phù hợp khi không cần chuyển nhượng chứng từ.", "slide_img": "images/q_589_slide_1794474194863.jpg", "note_img": "images/q_589_note_1794474194863.jpg"}, {"id": 590, "subject": "GLI202", "question": "ee In what scenario might a forwarder choose to use an FWB (FIATA Waybill) instead of an FBL?", "options": {"A": "When no transfer of title is needed (the consignee is known and not intended to be changed) and quick release of goods is desired, since a waybill is non-negotiable and goods can be released to the named consignee without original documents.", "B": "When the goods are highly valuable and need negotiable title documents.", "C": "When the forwarder hasn't received freight payment yet.", "D": "When shipping by road only within one country."}, "answers": ["A"], "explanation": "Khi nào Freight Forwarder nên sử dụng FWB thay vì FBL?\nA. When no transfer of title ¡s needed and quick release of goods is desired (Khi không cần chuyên nhượng quyền định đoạt hàng hóa và muốn giải phóng hàng nhanh chóng)\n— FWB cho phép giao hàng cho người nhận được chỉ định mà không cần xuất trình vận đơn góc có thể chuyển nhượng.", "slide_img": "images/q_590_slide_1794474196881.jpg", "note_img": "images/q_590_note_1794474196881.jpg"}, {"id": 591, "subject": "GLI202", "question": "The FIATA FCR (Forwarder's Certificate of Receipt) serves what purpose?", "options": {"A": "It confirms that the freight forwarder has received the goods from the shipper in good order and thereby can be used by the shipper as proof to trigger payment (for example, in a cash-against-documents transaction).", "B": "It guarantees delivery to the consignee.", "C": "It is a negotiable title document like a bill of lading.", "D": "It is used to certify the origin of goods for customs."}, "answers": ["A"], "explanation": "Mục đích của FIATA FCR (Forwarder's Certificate of Receipt) là gì?\nA. lt confirms that the freight forwarder has received the goods from the shipper in good order and thereby can be used by the shipper as proof to trigger payment (Xác nhận\nFreight Forwarder đã nhận hàng từ người gửi trong tình trạng bên ngoài tốt và có thê được dùng làm bằng chứng đề thực hiện thanh toán) › FCR là chứng nhận đã nhận hàng.", "slide_img": "images/q_591_slide_1794474198884.jpg", "note_img": "images/q_591_note_1794474198884.jpg"}, {"id": 592, "subject": "GLI202", "question": "The FIATA FCT (Forwarder's Certificate of Transport) is largely replaced in modern use by the FBL, but what was the original purpose of the FCT?", "options": {"A": "It was a forwarder-issued document indicating the forwarder’s commitment to deliver the goods to a named consignee at destination (used to facilitate bank payment against documents, as it was negotiable like a carrier's document).", "B": "It certified the training of forwarder staff.", "C": "It was a non-negotiable receipt similar to FCR.", "D": "It served as a customs transit document."}, "answers": ["A"], "explanation": "Mục đích ban đầu của FIATA FCT (Forwarder's Certificate of Transport) là gì?\nA. lt was a forwarder-issued document indicating the forwarder's commitment to deliver the goods to a named consignee at destination (Chứng từ do Freight Forwarder phát\nhành thê hiện cam kéết giao hàng cho người nhận được chỉ định tại điểm đến) ¬ FCT từng được sử dụng đề hỗ trợ thanh toán bằng chứng từ.", "slide_img": "images/q_592_slide_1794474200829.jpg", "note_img": "images/q_592_note_1794474200829.jpg"}, {"id": 593, "subject": "GLI202", "question": "A forwarder has consolidated cargo from several shippers into one container. The forwarder wants to give each shipper a document they can use to prove their goods are shipped (and possibly for bank payment) even though the ocean carrier issued one master bill of lading for the container. Which FIATA document might the forwarder issue to each shipper?", "options": {"A": "A House Bill of Lading (which the FIATA FBL can serve as, functioning as a negotiable document for each shipper’s part of the shipment)", "B": "A single master FCR for all shippers", "C": "An airwaybill for each, even if it's by sea DA FIATA SIC"}, "answers": ["A"], "explanation": "Freight Forwarder gom hàng của nhiều người gửi vào một container. Họ có thể phát hành chứng từ nào cho từng người gửi đề chứng minh hàng đã được vận chuyển?\nA. A House Bill of Lading (which the FIATA FBL can serve as) (House Bill of Lading - vận đơn nhà, trong đó FIATA FBL có thê đảm nhiệm vai trò này) —› Mối chủ hàng có thể nhận\nchứng từ riêng dù hãng tàu phát hành một Master B/L cho container.", "slide_img": "images/q_593_slide_1794474202914.jpg", "note_img": "images/q_593_note_1794474202914.jpg"}, {"id": 594, "subject": "GLI202", "question": "ee EE Ee ne The FIATA SDT (Shipper's Declaration for Dangerous Goods) form is used for what purpose?", "options": {"A": "To provide the required detailed declaration and packing certificate for hazardous cargo, in alignment with international dangerous goods regulations (like ADR for road, IMDG Code for sea).", "B": "To declare the size and dimensions of cargo for container loading.", "C": "To certify the temperature of perishable goods.", "D": "To request special tariff discounts from carriers."}, "answers": ["A"], "explanation": "FIATA SDT (Shipper's Declaration for Dangerous Goods) được sử dụng đề làm gì?\nA. To provide the required detailed declaration and packing certificate for hazardous cargo, in alignment with international dangerous goods regulations (Cung cấp thông tin\nkhai báo chi tiết và chứng nhận đóng gói hàng nguy hiểm phù hợp với các quy định quốc tế) — Giúp xác định tính chất nguy hiểm và yêu cầu xử lý an toàn.", "slide_img": "images/q_594_slide_1794474204922.jpg", "note_img": "images/q_594_note_1794474204922.jpg"}, {"id": 595, "subject": "GLI202", "question": "River shipping (inland waterways} plays a role in certain supply chains. For example, container barges on the Rhine or the Mississippi allow what advantage?", "options": {"A": "Moving containers from inland locations to seaports cheaply and efficiently, using rivers to bypass highway congestion and with vessels designed (often with low draft and retractable structures) to pass under bridges", "B": "Eliminating the need for any trucks or trains", "C": "High-speed delivery faster than air freight", "D": "Transport without any weather limitations"}, "answers": ["A"], "explanation": "Vận tải đường thủy nội địa bằng sà lan trên các sông như Rhine hoặc Mississippi mang lại lợi ích gì?\nA. Moving containers from inland locations to seaports cheaply and efficiently, using rivers to bypass highway congestion (Vận chuyên container từ khu vực nội địa đến cảng\nbiên với chi phí thấp và hiệu quả, tận dụng đường sông đề tránh ùn tắc đường bộ) —› Phù hợp với hàng nặng và khối lượng lớn.", "slide_img": "images/q_595_slide_1794474207040.jpg", "note_img": "images/q_595_note_1794474207040.jpg"}, {"id": 596, "subject": "GLI202", "question": "", "options": {"A": "The sea-air combination can save several days or weeks compared to all-sea, though it's slower than pure air - providing intermediate delivery speed (often cutting ocean transit time roughly in half, depending on route).", "B": "It takes longer than an all-sea route.", "C": "It's just as slow as sea but as costly as air.", "D": "It doesn’t make any difference in time."}, "answers": ["A"], "explanation": "Vận tải Sea-Air thường ảnh hưởng đén thời gian vận chuyền như thế nào?\nA. The sea-air combination can save several days or weeks compared to all-sea, though it's slower than pure air (Kết hợp đường biên và hàng không có thể tiết kiệm vài ngày\nhoặc vài tuần so với hoàn toàn bằng đường biên, nhưng vẫn chậm hơn vận tải hàng không trực tiếp) ¬ Thời gian thực tế phụ thuộc tuyến đường và lịch trung chuyền.", "slide_img": "images/q_596_slide_1794474209077.jpg", "note_img": "images/q_596_note_1794474209077.jpg"}, {"id": 597, "subject": "GLI202", "question": "Main world air cargo hubs often coincide with:", "options": {"A": "Major passenger airports that also have large cargo facilities (e.g., Memphis, Hong Kong, Anchorage, Frankfurt), because of their strategic location and connectivity for freight transfers", "B": "Remote mountain airstrips", "C": "Ports at sea level", "D": "Locations selected randomly by airlines"}, "answers": ["A"], "explanation": "Các trung tâm vận tải hàng không quốc tế lớn thường nằm ở đâu?\nA. Major passenger airports that also have large cargo faoilities (Các sân bay hành khách lớn đồng thời có cơ sở xử lý hàng hóa quy mô lớn) — Ví dụ Hong Kong, Frankfurt hoặc\nAnchorage.", "slide_img": "images/q_597_slide_1794474210926.jpg", "note_img": "images/q_597_note_1794474210926.jpg"}, {"id": 598, "subject": "GLI202", "question": "A ship traveling from East Asia to Europe has two primary route options: through the Suez Canal or around the Cape of Good Hope. What is one reason the Suez Canal route is usually chosen?", "options": {"A": "It significantly shortens transit time by avoiding the long journey around Africa, saving fuel and time (despite canal transit fees).", "B": "It completely avoids all bad weather.", "C": "It's the only way to reach Europe from Asia by sea.", "D": "It allows ships to unload cargo midway and reduce weight."}, "answers": ["A"], "explanation": "Tại sao tàu biển từ Đông Á đến châu Âu thường lựa chọn tuyến kênh đào Suez thay vì vòng qua Mũi Hảo Vọng?\nA. lt significantly shortens transit time by avoiding the long journey around Africa, saving fuel and time (Rút ngắn đáng kê thời gian vận chuyên do không phải đi vòng quanh\nchâu Phi, giúp tiết kiệm nhiên liệu và thời gian) — Tuy nhiên, lựa chọn thực tế còn phụ thuộc phí kênh đào và tình hình an ninh hàng hải.", "slide_img": "images/q_598_slide_1794474212944.jpg", "note_img": "images/q_598_note_1794474212944.jpg"}, {"id": 599, "subject": "GLI202", "question": "River shipping example: A shipment of heavy machinery is moved by barge from an inland European city via the Rhine to the Port of Rotterdam for ocean export. What advantage did this offer?", "options": {"A": "The ability to move very heavy, bulky cargo from inland with lower cost and energy use than trucking, and without highway size restrictions.", "B": "Faster transit than any other method.", "C": "It avoided all customs checks.", "D": "There is no advantage; it's done only if trucks are unavailable."}, "answers": ["A"], "explanation": "Vận chuyển máy móc nặng bằng sà lan từ nội địa châu Âu qua sông Rhine đến cảng Rotterdam có lợi ích gì?\n\nA. The ability to move very heavy, bulky cargo from inland with lower cost and energy use than trucking, and without highway size restrictions (Có thê vận chuyên hàng rất nặng\nvà công kènh từ nội địa với chi phí, năng lượng thấp hơn vận tải đường bộ và không bị giới hạn kích thước như trên đường cao tốc) ¬ Đường thủy nội địa phù hợp với hàng siêu\ntrường, siêu trọng.", "slide_img": "images/q_599_slide_1794474215231.jpg", "note_img": "images/q_599_note_1794474215231.jpg"}, {"id": 600, "subject": "GLI202", "question": "Heavy lift and out-of-gauge cargo refers to shipments that:", "options": {"A": "Exceed the dimensions and/or weight of standard containers or transport equipment, requiring special planning, permits, and often specialized carriers or equipment (like flat-rack containers, heavy-lift cranes, multi-axle trailers).", "B": "Are slightly overweight but still fit in containers.", "C": "Can be carried in passenger luggage.", "D": "Are dangerous goods due to their weight."}, "answers": ["A"], "explanation": "Heavy Lift và Out-of-Gauge Cargo là loại hàng hóa nào?\nA. Exceed the dimensions and/or weight of standard containers or transport equipment, requiring special planning, permits, and often specialized carriers or equipment (Hàng\nvượt quá kích thước hoặc trọng lượng của container và thiết bị vận tải tiêu chuân, cần kế hoạch, giấy phép và thiết bị cnuyên dụng) — Ví dụ máy móc công nghiệp lớn.", "slide_img": "images/q_600_slide_1794474217274.jpg", "note_img": "images/q_600_note_1794474217274.jpg"}, {"id": 601, "subject": "GLI202", "question": "Dangerous goods (DG) are substances that can pose risks during transport. What must forwarders and carriers do when handling DG shipments?", "options": {"A": "Charge ten times the normal rate by default.", "B": "Hide the nature of the goods to avoid delays.", "C": "Only transport them by road at night.", "D": "Classify, package, label, and document the goods according to international regulations (like IMDG Code for sea, IATA DGR for air), and often segregate them from incompatible cargo."}, "answers": ["D"], "explanation": "Khi xử lý hàng nguy hiểm (Dangerous Goods), Freight Forwarder và Carrier phải làm gì?\nD. Classify, package, label, and document the goods according to international regulations, and often segregate them from incompatible cargo (Phân loại, đóng gói, dán nhãn và\nlập chứng từ theo quy định quốc tế, đồng thời tách biệt những loại hàng nguy hiểm không tương thích) —- Đảm bảo an toàn trong vận chuyền.", "slide_img": "images/q_601_slide_1794474219327.jpg", "note_img": "images/q_601_note_1794474219327.jpg"}, {"id": 602, "subject": "GLI202", "question": "Foodstuffs in transit require special care because:", "options": {"A": "They must remain safe for consumption - this often means using clean, sometimes temperature-controlled containers or reefer units, and ensuring hygiene and compliance with food safety regulations.", "B": "They are always classified as dangerous goods.", "C": "They never expire or spoil.", "D": "Customs does not inspect food items."}, "answers": ["A"], "explanation": "Tại sao thực Wẳm cần được chăm sóc đặc biệt trong quá trình vận ®uyển?\n\nA. They mustremain safe for consumption - this often means using clean, sometimes temperature-controlled containers or reefer units, and ensuring hygiene and compliance\nwith food safety regulations (Thực phâm phải đảm bảo an toàn khi sử dụng, thường cần container sạch, đôi khi phải kiểm soát nhiệt độ và tuân thủ quy định vệ sinh an toàn\nthực phẩm) — Giúp tránh hư hỏng và nhiễm bản.", "slide_img": "images/q_602_slide_1794474221470.jpg", "note_img": "images/q_602_note_1794474221470.jpg"}, {"id": 603, "subject": "GLI202", "question": "Flowers and live plants are extremely sensitive cargo. How are they typically transported to ensure freshness?", "options": {"A": "In the dark at all times to avoid photosynthesis.", "B": "By slow boat, to give them time to acclimate.", "C": "Without any cooling, as they don't need it.", "D": "By air, in a temperature-controlled environment, often with fast transit times, because they are time and temperature sensitive (they may also require specific humidity and ventilation)."}, "answers": ["D"], "explanation": "Hoa và cây sống thường được vận chuyền như thế nào đề giữ độ tươi?\nD. By air, in a temperature-controlled environment, often with fast transit times (Bằng đường hàng không, trong môi trường kiêm soát nhiệt độ và thời gian vận chuyên nhanh)\n— Hoa và cây sống nhạy cảm với nhiệt độ và thời gian.", "slide_img": "images/q_603_slide_1794474223416.jpg", "note_img": "images/q_603_note_1794474223416.jpg"}, {"id": 604, "subject": "GLI202", "question": "Livestock (live animals) transport requires:", "options": {"A": "Special equipment (ventilated, modified aircraft or vessels, or trucks with pens), compliance with animal welfare regulations (adequate space. food, water}, and handlers experienced in minimizing stress to the animals.", "B": "Only young animals, since they are easier to move.", "C": "Keeping the animals sedated the entire journey (which is generally not true beyond certain calming measures).", "D": "No documentation except a waybill."}, "answers": ["A"], "explanation": "Vận chuyển động vật sống (Livestock) cần đáp ứng yêu cầu nào?\nA. Special equipment, compliance with animal welfare regulations, and handlers experienced in minimizing stress to the animals (Thiết bị chuyên dụng, tuân thủ quy định phúc\nlợi động vật và nhân sự có kinh nghiệm giảm căng thẳng cho động vật) › Cần đảm bảo thông gió, không gian, thức ăn và nước uống phù hợp.", "slide_img": "images/q_604_slide_1794474225446.jpg", "note_img": "images/q_604_note_1794474225446.jpg"}, {"id": 605, "subject": "GLI202", "question": "A cargo is labeled \"Out of Gauge” because it does not fit into a standard container. What solution might a forwarder offer for ocean transport?", "options": {"A": "Use a flat-rack or open-top container, or ship as break-bulk, and coordinate with the carrier for special stowage; also obtain any required overdimensional permits for inland moves.", "B": "Compress the cargo to fit into a container.", "C": "Only send it via air freight.", "D": "Disassemble it fully and reassemble at destination regardless of feasibility."}, "answers": ["A"], "explanation": "Nếu hàng được đánh dấu Out of Gauge vì không vừa container tiêu chuẩn, Freight Forwarder có thể đề xuất giải pháp nào?\nA. Use a flat-rack or open-top container, or ship as break-bulk, and coordinate with the carrier for special stowage (Sử dụng container Flat Rack, Open Top hoặc vận chuyên\nhàng rời từng kiện, đồng thời phối hợp với hãng vận tải đề sắp xếp xếp dỡ đặc biệt) — Phù hợp với hàng quá khổ.", "slide_img": "images/q_605_slide_1794474227434.jpg", "note_img": "images/q_605_note_1794474227434.jpg"}, {"id": 606, "subject": "GLI202", "question": "In handling dangerous goods, what is the significance of the DG classes and compatibility?", "options": {"A": "Certain dangerous goods classes cannot be stored or transported together (e.g., oxidizers and flammables) for safety; the forwarder must ensure compatibility and proper segregation as per regulations.", "B": "It's just a labeling formality with no impact on loading.", "C": "Compatibility rules apply only in warehousing, not during transport.", "D": "All DG can be mixed as long as the quantity is small."}, "answers": ["A"], "explanation": "Trong vận chuyền hàng nguy hiểm, việc phân loại DG và kiểm tra tính tương thích có ý nghĩa gì?\n\nA. Certain dangerous goods classes cannot be stored or transported together for safety; the forwarder must ensure compaftibility and proper segregation (Một số nhóm hàng\nnguy hiểm không được lưu kho hoặc vận chuyên chung vì lý do an toàn; người giao nhận phải đảm bảo tính tương thích và phân tách phù hợp) — Ví dụ chất oxy hóa không được\nxếp tùy tiện cùng chất dễ cháy.", "slide_img": "images/q_606_slide_1794474229513.jpg", "note_img": "images/q_606_note_1794474229513.jpg"}, {"id": 607, "subject": "GLI202", "question": "If a forwarder is arranging transport of highly perishable seafood from Asia to Europe, which service might they recommend?", "options": {"A": "An expedited mode like air freight (possibly sea-air if cost is a factor), with refrigerated facilities throughout, to ensure the seafood remains fresh by delivery.", "B": "The cheapest sea route with no refrigeration to save money.", "C": "Sending by rail through multiple countries without temperature control.", "D": "Waiting until winter so it can ship by ocean without spoiling."}, "answers": ["A"], "explanation": "Khi vận chuyển hải sản rất dễ hư hỏng từ châu Á sang châu Âu, Freight Forwarder nên đề xuất dịch vụ nào?\nA. An expedited mode like air freight, with refrigerated facilities throughout (Phương thức vận chuyên nhanh như hàng không, kết hợp hệ thống bảo quản lạnh xuyên suốt) ¬\nGiúp duy trì chuối lạnh và độ tươi của hải sản.", "slide_img": "images/q_607_slide_1794474231681.jpg", "note_img": "images/q_607_note_1794474231681.jpg"}, {"id": 608, "subject": "GLI202", "question": "A well-packed shipment should be able to withstand:", "options": {"A": "The normal stresses of handling and transit (vibration, stacking, jolts, and exposure to elements) without damage to the goods.", "B": "Being dropped from an airplane without a parachute.", "C": "Unlimited rough handling with no limits.", "D": "Nothing - you expect some damage every time."}, "answers": ["A"], "explanation": "Một lô hàng được đóng gói tốt phải chịu được những điều kiện nào?\nA. The normal stresses of handling and transit (vibration, stacking, jolts, and exposure to elements) without damage to the goods (Những tác động thông thường khi bốc xếp và\nvận chuyên như rung lắc, xếp chồng, va đập và môi trường mà không làm hư hỏng hàng hóa) — Bao bì phải phù hợp với điều kiện vận chuyền thực té.", "slide_img": "images/q_608_slide_1794474233731.jpg", "note_img": "images/q_608_note_1794474233731.jpg"}, {"id": 609, "subject": "GLI202", "question": "One function of packaging aside from protecting the product is:", "options": {"A": "To communicate handling instructions and product information via markings and labels to carriers and customers (e.g., \"Fragile,\" \"This Side Up,” address labels, etc.)}.", "B": "To conceal the identity of the product from everyone, including the consignee.", "C": "To increase the value of the product automatically.", "D": "To serve as a substitute for insurance."}, "answers": ["A"], "explanation": "Ngoài bảo vệ sản phẩm, bao bì còn có chức năng gì?\nA. To communicate handling instructions and produet information via markings and labels to carriers and customers (Truyền đạt hướng dẫn xử lý và thông tin sản phẩm thông\nqua ký hiệu, nhãn hàng cho đơn vị vận tải và khách hàng) ; Ví dụ Fragile hoặc This Side Up.", "slide_img": "images/q_609_slide_1794474235730.jpg", "note_img": "images/q_609_note_1794474235730.jpg"}, {"id": 610, "subject": "GLI202", "question": "Marking and labeling packages correctly is important because:", "options": {"A": "Clear marks (like addresses, handling instructions, and identification codes) help ensure proper handling, prevent misdelivery, and reduce risk of loss, damage, or accidents.", "B": "It is required only for air freight and can be ignored for sea freight.", "C": "It primarily benefits marketing of the product.", "D": "Too many markings can confuse carriers, so it's better to ship unmarked."}, "answers": ["A"], "explanation": "Tại sao việc ghi ký hiệu và dán nhãn kiện hàng chính xác lại quan trọng?\nA. Clear marks help ensure proper handling, prevent misdelivery, and reduce risk of loss, damage, or accidents (Ký hiệu rõ ràng giúp bóc xếp đúng cách, tránh giao nhằm và\ngiảm nguy cơ mắt mát, hư hỏng hoặc tai nạn) › Nhãn hàng hỗ trợ nhận diện và xử lý chính xác.", "slide_img": "images/q_610_slide_1794474237708.jpg", "note_img": "images/q_610_note_1794474237708.jpg"}, {"id": 611, "subject": "GLI202", "question": "If a package is marked \"Fragile\", what should a freight handler do?", "options": {"A": "Handle it with extra care - avoid dropping, place it on top of stacks, and not throw or bump it, as it contains breakable items.", "B": "Ignore the label since all cargo is handled the same way.", "C": "Keep it aside and not ship it with other cargo.", "D": "Open it to check what is fragile inside."}, "answers": ["A"], "explanation": "Nếu kiện hàng được đánh dấu Fragile, nhân viên bốc xếp cần làm gì?\nA. Handle it with extra care - avoid dropping, place it on top of stacKs, and not throw or bump it (Xử lý đặc biệt cân thận, tránh làm rơi, không ném hoặc va đập và sắp xếp ở vị trí\nphù hợp đề tránh bị đè nén) — Fragile nghĩa là hàng dễ vỡ.", "slide_img": "images/q_611_slide_1794474239626.jpg", "note_img": "images/q_611_note_1794474239626.jpg"}, {"id": 612, "subject": "GLI202", "question": "Proper labeling for hazardous materials (dangerous goods) on a package is crucial because:", "options": {"A": "It communicates the specific risks (flammable, toxic, corrosive, etc.) to carriers and emergency responders, enabling safe handling and compliance with regulations.", "B": "It's only for insurance purposes and doesn't affect handling.", "C": "It can be replaced by a generic sticker of any kind.", "D": "It ensures the goods are charged higher freight automatically."}, "answers": ["A"], "explanation": "Tại sao dán nhãn hàng nguy hiểm đúng cách lại đặc biệt quan trọng?\n\nA. t communicates the specific risks (flammable, toxic, GcOrrosive, etc.) to carriers and emergencoy responders, enabling safe handling and compliance with regulations (Thông\nbáo các nguy cơ cụ thê như dễ cháy, độc hại, ăn mòn cho đơn vị vận tải và lực lượng ứng cứu, giúp xử lý an toàn và tuân thủ quy định) — Nhãn nguy hiểm giúp phòng ngừa và\nứng phó sự cồ.", "slide_img": "images/q_612_slide_1794474241760.jpg", "note_img": "images/q_612_note_1794474241760.jpg"}, {"id": 613, "subject": "GLI202", "question": "Void fill (filling empty space in a carton with cushioning like foam, airbags, or paper) is important because:", "options": {"A": "It prevents the contents from shifting during transit, which could otherwise lead to damage if items collide or if the box is crushed due to lack of support.", "B": "It increases the weight unnecessarily.", "C": "It is required by customs in certain countries.", "D": "It makes packages harder to open for the receiver."}, "answers": ["A"], "explanation": "Tại sao cần sử dụng vật liệu chèn khoảng trồng (Void Fill) trong thùng hàng?\n\nA. lt prevents the contents from shifting during transit, which could otherwise lead to damaoge if items collide or if the box is crushed due to lack of support (Ngăn hàng hóa xê\ndịch trong quá trình vận chuyền, tránh hư hỏng do các vật va chạm với nhau hoặc thùng bị ép méo vì thiếu vật liệu hỗ trợ) — Vật liệu chèn như mút, giấy hoặc túi khí giúp có định\nhàng.", "slide_img": "images/q_613_slide_1794474243780.jpg", "note_img": "images/q_613_note_1794474243780.jpg"}, {"id": 614, "subject": "GLI202", "question": "", "options": {"A": "Locations of suppliers", "B": "Current & future of suppliers’ capabilities", "C": "Supply market's change and development", "D": "Sources of supply"}, "answers": ["C"], "explanation": "Yếu tố nào thuộc nhóm Dynamics của thị trường cung ứng?\nC. Supply market's change and development (Sự thay đồi và phát triên của thị trường cung ứng) — Supply Market Dynamics tập trung vào sự biến động và xu hướng phát triển của\nthị trường theo thời gian.", "slide_img": "images/q_614_slide_1794474245675.jpg", "note_img": "images/q_614_note_1794474245675.jpg"}, {"id": 615, "subject": "GLI202", "question": "Freight forwarders can operate either as intermediaries (agents) or as principals. What is a key difference between these roles?", "options": {"A": "As an agent, a forwarder has full liability for cargo loss; as a principal, it has none.", "B": "As a principal, a forwarder never contracts other carriers for any part of the transport.", "C": "As an agent, a forwarder arranges transport with third-party carriers on the client's behalf; as a principal, the forwarder acts as a carrier itself. issuing its own transport documents and assuming responsibility for delivery.", "D": "There is no difference - the terms \"agent\" and \"principal\" are interchangeable in freight forwarding."}, "answers": ["C"], "explanation": "Freight Forwarder có thề hoạt động với tư cách Agent hoặc Principal. Điểm khác biệt chính là gì?\n\nC. As an agent, a forwarder arranges transport with third-party carriers on the client's behalf; as a principal, the forwarder acts as a carrier itself, Issuing its own transport\ndocuments and assuming responsibility for delivery (Agent tổ chức vận chuyên thay khách hàng; Principal đứng ra với tư cách người vận tải và chịu trách nhiệm giao hàng) ¬\nAgent chủ yếu đại diện sắp xếp dịch vụ: Principal nhận nghĩa vụ vận chuyền theo hợp đồng của chính mình.", "slide_img": "images/q_615_slide_1794474247800.jpg", "note_img": "images/q_615_note_1794474247800.jpg"}, {"id": 616, "subject": "GLI202", "question": "A freight forwarder's work involves coordinating among multiple parties. Which of the following groups of parties is a forwarder most likely to deal with?", "options": {"A": "Only the buyer and seller of the goods", "B": "Carriers, customs officials, i
