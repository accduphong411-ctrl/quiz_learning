nsurance companies, and banks (for payment documents)", "C": "Only government trade authorities", "D": "Other freight forwarders, exclusively"}, "answers": ["B"], "explanation": "Freight Forwarder thường phải phối hợp với những bên nào?\nB. Carriers, customs officials, insurance companies, and banks (for payment documents) — Các đơn vị vận tải, cơ quan hải quan, công ty bảo hiểm và ngân hàng (để xử lý chứng từ\nthanh toán).", "slide_img": "images/q_616_slide_1794474249716.jpg", "note_img": "images/q_616_note_1794474249716.jpg"}, {"id": 617, "subject": "GLI202", "question": "As part of statutory compliance, freight forwarders must be knowledgeable about:", "options": {"A": "Regulations for transporting dangerous goods and customs clearance laws in various countries", "B": "How to design and manufacture the products they ship", "C": "Managing the financial audits of their client's entire business", "D": "Setting national trade policy and tariffs"}, "answers": ["A"], "explanation": "Đề tuân thủ các quy định pháp luật, Freight Forwarder cần hiều biết về vần đề nào?\nA. Regulations for transporting dangerous goods and customs clearance laws in various countries (Quy định vận chuyên hàng nguy hiểm và luật thông quan tại các quốc gia) ¬\nNgười giao nhận cần tuân thủ quy định về hàng hóa, vận tải và thủ tục xuất nhập khẩu.", "slide_img": "images/q_617_slide_1794474251740.jpg", "note_img": "images/q_617_note_1794474251740.jpg"}, {"id": 618, "subject": "GLI202", "question": "Freight forwarders often advise clients on risk management. Which of the following is an example of advice a forwarder might give?", "options": {"A": "“Ignore potential port strikes or weather issues to avoid worrying about delays.”", "B": "\"Prepare for possible transit delays (e.g. port congestion or bad weather) and have contingency plans for time-sensitive shipments.”", "C": "\"It's best to ship uninsured to cut costs since losses are very rare.\"", "D": "\"Always choose the absolute cheapest route, even if the transit time doubles.\""}, "answers": ["B"], "explanation": "Đâu là ví dụ về lời khuyên quản trị rủi ro phù hợp của Freight Forwarder?\nB. Prepare for possible transit delays and have contingency plans for time-sensitive shipments (Chuân bị cho khả năng chậm vận chuyên và có kế hoạch dự phòng đối với hàng\ncần giao đúng thời hạn) › Contingency plan giúp doanh nghiệp chủ động ứng phó với tắc nghẽn cảng, thời tiết xấu hoặc sự cố vận chuyền.", "slide_img": "images/q_618_slide_1794474253772.jpg", "note_img": "images/q_618_note_1794474253772.jpg"}, {"id": 619, "subject": "GLI202", "question": "International shipments can be affected by currency fluctuations. How might a freight forwarder assist an exporter regarding foreign exchange risk?", "options": {"A": "Instruct the exporter that exchange rates are not the forwarder’s concern and can be ignored.", "B": "Decline to get involved in any financial aspects of a shipment.", "C": "Caution the exporter about potential exchange rate fluctuations and perhaps suggest using a stable currency or securing a forward exchange contract for the transaction.", "D": "Personally guarantee a fixed exchange rate for the shipment at no additional cost."}, "answers": ["C"], "explanation": "Freight Forwarder có thề hỗ trợ nhà xuất khẩu quản lý rủi ro tỷ giá như thế nào?\n\nC. Caution the exporter about potential exchange rate fluctuations and perhaps suggest using a stable currency or securing a forward exchange contract (Cảnh báo biến động tỷ\ngiá và gợi ý sử dụng đồng tiền ôn định hoặc hợp đồng ngoại hồi kỳ hạn) › Foreign exchange risk có thể làm thay đồi giá trị khoản thanh toán. Người giao nhận có thể cảnh báo rủi ro,\ncòn việc lựa chọn công cụ phòng ngừa cần có tư vấn tài chính phù hợp.", "slide_img": "images/q_619_slide_1794474255916.jpg", "note_img": "images/q_619_note_1794474255916.jpg"}, {"id": 620, "subject": "GLI202", "question": "Incoterms are standardized international trade terms primarily used to specify:", "options": {"A": "The division of responsibilities, costs, and risks for delivery of goods between seller and buyer", "B": "The quality of goods being sold", "C": "The payment due date and method", "D": "The legal jurisdiction for contract disputes"}, "answers": ["A"], "explanation": "Incoterms chủ yếu được sử dụng đề quy định điều gì?\nA. The division of responsibilities, costs, and risks for delivery of goods between seller and buyer (Phân chia trách nhiệm, chi phí và rủi ro giao hàng giữa người bán và người\nmua) — Incoterms làm rõ nghĩa vụ giao hàng, vận tải, thông quan và thời điểm chuyền giao rủi ro.", "slide_img": "images/q_620_slide_1794474257839.jpg", "note_img": "images/q_620_note_1794474257839.jpg"}, {"id": 621, "subject": "GLI202", "question": "Under the Incoterm EXW (Ex Works), what is the seller's minimum obligation?", "options": {"A": "Making the goods available at their premises for pickup by the buyer, with the buyer bearing all costs and risks from that point onward", "B": "Delivering the goods to the buyer's door. including paying for all transport and import duties", "C": "Loading the goods onto the international carriage and clearing them for export", "D": "Arranging freight and insurance to the buyer's named destination"}, "answers": ["A"], "explanation": "Theo EXW, nghĩa vụ tối thiêu của người bán là gì?\n\nA. Making the goods available at their premises for pickup by the buyer, with the buyer bearing all costs and risks from that point onward (Đặt hàng sẵn tại cơ sở đề người mua\nđến nhận và chịu các chi phí, rủi ro tiếp theo) ¬ EXW đặt trách nhiệm tồi thiều lên người bán. Người bán thường không có nghĩa vụ bốc hàng lên phương tiện do người mua bố trí hoặc\nthông quan xuất khẩu.", "slide_img": "images/q_621_slide_1794474259973.jpg", "note_img": "images/q_621_note_1794474259973.jpg"}, {"id": 622, "subject": "GLI202", "question": "Under DDP (Delivered Duty Paid), the seller is responsible for:", "options": {"A": "All costs and risks of transporting the goods to the agreed destination and clearing the goods for import, including paying import duties and taxes", "B": "Delivering the goods only to the port of export and nothing more", "C": "Paying for shipping but not for import clearance or duties", "D": "Insuring the goods but not transporting them"}, "answers": ["A"], "explanation": "Theo DDP, người bán chịu trách nhiệm gì?\nA. All costs and risks of transporting the goods to the agreed destination and clearing the goods for import, including paying import duties and taxes (Chịu chi phí và rủi ro đưa\nhàng đến địa điểm thỏa thuận, làm thủ tục nhập khâu và nộp thuế) — DDP đặt trách nhiệm lớn nhất lên người bán trong các điều kiện Incoterms.", "slide_img": "images/q_622_slide_1794474261953.jpg", "note_img": "images/q_622_note_1794474261953.jpg"}, {"id": 623, "subject": "GLI202", "question": "Under FOB (Free on Board), when does the risk transfer from the seller to the buyer?", "options": {"A": "Once the goods are loaded onto the vessel at the port of shipment, the buyer assumes risk from that point onward", "B": "When the goods arrive at the buyer's warehouse", "C": "When the goods are delivered alongside the ship at the port", "D": "Only after the ship reaches the destination port"}, "answers": ["A"], "explanation": "Theo FOB, rủi ro được chuyển từ người bán sang người mua vào thời điểm nào?\nA. Once the goods are loaded onto the vessel at the port of shipment, the buyer assumes risk from that point onward (Khi hàng đã được xếp lên tàu tại cảng đi, người mua bắt\nđầu chịu rủi ro) › FOB chuyền giao rủi ro khi hàng đã ở trên tàu tại cảng xếp hàng được chỉ định.", "slide_img": "images/q_623_slide_1794474264093.jpg", "note_img": "images/q_623_note_1794474264093.jpg"}, {"id": 624, "subject": "GLI202", "question": "CIF (Cost, Insurance & Freight) and CFR (Cost & Freight) are similar, but CIF includes one element that CFR does not. What is the additional obligation for the seller under CIF?", "options": {"A": "The seller must procure marine insurance for the goods in transit for the buyer's benefit.", "B": "The seller must clear the goods for import at the destination.", "C": "The seller must arrange air freight instead of sea freight.", "D": "The seller must unload the goods at the destination port."}, "answers": ["A"], "explanation": "CIF và CFR tương tự nhau, nhưng CIF có thêm nghĩa vụ nào đồi với người bán?\nA. The seller must procure marine insurance for the goods in transit for the buyer's benefit (Người bán phải mua bảo hiểm hàng hóa vận chuyền bằng đường biên vì lợi ích của\nngười mua) — CIF = Cost + Insurance + Freight, còn CFR = Cost + Freight. Cả hai đều chuyền rủi ro khi hàng được xép lên tàu tại cảng đi.", "slide_img": "images/q_624_slide_1794474266076.jpg", "note_img": "images/q_624_note_1794474266076.jpg"}, {"id": 625, "subject": "GLI202", "question": "Under CFR (Cost and Freight) terms, the seller is obligated to:", "options": {"A": "Pay the costs of transporting goods to the named destination port, but risk transfers to the buyer once the goods are loaded on the ship in the port of departure", "B": "Deliver goods only to the seller's own port and charge nothing for freight", "C": "Insure the goods all the way to the buyer's warehouse", "D": "Bear all import duty and tax at destination"}, "answers": ["A"], "explanation": "Theo điều kiện CFR, người bán có nghĩa vụ gì?\n\nA. Pay the costs of transporting goods to the named destination port, but risk transfers to the buyer once the goods are loaded on the ship in the port of departure (Trả cước vận\nchuyên đến cảng đích, nhưng rủi ro chuyên sang người mua khi hàng đã lên tàu tại cảng đi) › Điểm quan trọng của CFR là chỉ phí vận tải và thời điểm chuyển giao rủi ro không trùng\nnhau.", "slide_img": "images/q_625_slide_1794474268053.jpg", "note_img": "images/q_625_note_1794474268053.jpg"}, {"id": 626, "subject": "GLI202", "question": "ee The latest version of Incoterms (as of 2020) contains how many rules, and who publishes these terms?", "options": {"A": "11 rules, published by the International Chamber of Commerce (ICC)", "B": "10 rules, published by the World Trade Organization (WTO)", "C": "7 rules, published by the United Nations", "D": "12 rules. published by the International Freight Forwarders Association (FIATA)"}, "answers": ["A"], "explanation": "Incoterms 2020 gồm bao nhiêu điều kiện và do tổ chức nào ban hành?\nA. 11 rules, published by the International Chamber of Commerce - ICC (11 điều kiện, do Phòng Thương mại Quóốc tế ban hành) — Incoterms 2020 gồm 11 điều kiện: EXW, FCA,\nGPT, GIP, DAP, DPU, DDP, FAS, FOB, CFR và GIF.", "slide_img": "images/q_626_slide_1794474269993.jpg", "note_img": "images/q_626_note_1794474269993.jpg"}, {"id": 627, "subject": "GLI202", "question": "If a seller agrees to DAP (Delivered at Place), what costs or risks are they not responsible for?", "options": {"A": "Unloading the goods at the named destination and any import duties/taxes in the buyer's country", "B": "Main transport to the agreed destination", "C": "Export clearance formalities in the seller's country", "D": "Insurance of the cargo during the main transit"}, "answers": ["A"], "explanation": "Theo DAP, người bán không chịu trách nhiệm về những khoản nào?\nA. Unloading the goods at the named destination and any import duties/taxes in the buyer's country (Dỡ hàng tại địa điểm đích và các khoản thuế, phí nhập khâu tại nước người\nmua) ¬ Theo DAP, người bán giao hàng trên phương tiện vận tải đến, sẵn sàng để dỡ. Người mua thường chịu trách nhiệm dỡ hàng và thông quan nhập khẩu.", "slide_img": "images/q_627_slide_1794474271874.jpg", "note_img": "images/q_627_note_1794474271874.jpg"}, {"id": 628, "subject": "GLI202", "question": "8 a In an export contract, the Incoterm is \"FOB Shanghai.” What does this imply for the seller's obligations?", "options": {"A": "The seller must load the goods on board a vessel at Shanghai at their cost and clear the goods for export, after which the buyer bears all further costs and risks.", "B": "The seller must deliver the goods to the buyer's warehouse in Shanghai.", "C": "The seller must pay freight to Shanghai and insure the goods.", "D": "The seller has no responsibilities once the goods leave their factory."}, "answers": ["A"], "explanation": "Trong hợp đồng xuất khẩu sử dụng điều kiện FOB Shanghai, người bán có nghĩa vụ gì?\n\nA. The seller must load the goods on board a vessel at Shanghai at their cost and clear the goods for export, after which the buyer bears all further costs and risks (Người bán\nphải xếp hàng lên tàu tại Thượng Hải và thông quan xuất khâu, sau đó người mua chịu các chi phí và rủi ro tiếp theo) › FOB Shanghai xác định Thượng Hải là cảng xếp hàng, nơi\nrủi ro chuyền giao khi hàng đã lên tàu.", "slide_img": "images/q_628_slide_1794474274066.jpg", "note_img": "images/q_628_note_1794474274066.jpg"}, {"id": 629, "subject": "GLI202", "question": "A trade contract between an international buyer and seller typically includes several key items. Which of the following is one of the main items that should be specified in a foreign sales contract?", "options": {"A": "The Incoterm (delivery term) defining obligations for shipping and risk transfer", "B": "The names of the freight forwarders both parties will use", "C": "The social media handles of the company CEOs", "D": "A detailed history of previous contracts between the parties"}, "answers": ["A"], "explanation": "Một hợp đồng thương mại giữa người mua và người bán quốc tế thường bao gồm một số nội dung quan trọng. Nội dung nào sau đây cần được quy định trong hợp đồng mua bán ngoại\nthương?\n\nA. The Incoterm (delivery term) defining obligations for shipping and risk transfer (Điều kiện Incoterms quy định nghĩa vụ vận chuyên và chuyên giao rủi ro).— Giải thích:\nIncoterms xác định trách nhiệm của người mua và người bán đối với việc giao hàng, chi phí vận chuyền và thời điểm chuyền giao rủi ro.", "slide_img": "images/q_629_slide_1794474276310.jpg", "note_img": "images/q_629_note_1794474276310.jpg"}, {"id": 630, "subject": "GLI202", "question": "Incoterms are revised periodically. What is the main reason for updating Incoterms (such as the move from Incoterms 2010 to Incoterms 2020)?", "options": {"A": "To reflect changes in global trade practices, transportation, and insurance so that the terms remain clear and relevant", "B": "To increase the number of terms to cover every possible scenario", "C": "To change all the abbreviations and confuse non-ICC members", "D": "To regulate domestic trade within countries"}, "answers": ["A"], "explanation": "Tại sao Incoterms được cập nhật định kỳ, chẵng hạn từ Incoterms 2010 sang Incoterms 2020?\nA. To reflect changes in global trade practices, transportation, and insurance so that the terms remain clear and relevant (Phản ánh những thay đôi trong thương mại, vận tải và\nbảo hiêm đề các điều kiện tiếp tục rõ ràng và phù hợp) — ICC cập nhật Incoterms đề đáp ứng sự phát triển của thực tiến thương mại quốc té.", "slide_img": "images/q_630_slide_1794474278385.jpg", "note_img": "images/q_630_note_1794474278385.jpg"}, {"id": 631, "subject": "GLI202", "question": "", "options": {"A": "To ensure the maximum penalty is always imposed", "B": "Because the devil is in the details, and precise clauses reduce misinterpretation chances", "C": "To guarantee that litigation is chosen as the first resort.", "D": "To ensure that only complex documentation is used"}, "answers": ["B"], "explanation": "Khi có gắng tránh các xung đột, tại sao điều quan trọng là các điều khoản chấm dứt hợp đồng (Termination Clauses) phải “rõ ràng và chính xác”?\n\nB. Because the devil is in the details, and precise clauses reduce misinterpretation chances\n\n— Bởi vì những vấn đề quan trọng thường nằm ở các chỉ tiết nhỏ, và các điều khoản chính xác giúp giảm nguy cơ hiều sai.\n\nTermination Clauses quy định những trường hợp và Qiểêu kiện mà hợp fflẫáng có mệ bị chấm dứt. Khi các fflâèu moản được viết rõ ràng và chính xác, các bên sẽ hiều đúng quyền lợi, nghĩa vụ", "slide_img": "images/q_631_slide_1794474280736.jpg", "note_img": "images/q_631_note_1794474280736.jpg"}];
let questions = JSON.parse(JSON.stringify(RAW_QUESTIONS));

const STORAGE_KEY = "slide_quiz_state_v3";
let savedState = {};
try {
  savedState = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
} catch(e) {}

if (savedState.customAnswers) {
  questions.forEach(q => {
    if (savedState.customAnswers[q.id]) {
      q.answers = savedState.customAnswers[q.id];
    }
  });
}

let currentSubject = savedState.currentSubject || "ALL";
let currentMode = "practice";
let activePool = [];
let currentIndex = 0;
let userAttempts = {};
let wrongIds = new Set(savedState.wrongIds || []);

function getSubjectsMap() {
  const map = {};
  questions.forEach(q => {
    const s = q.subject || "Khác";
    map[s] = (map[s] || 0) + 1;
  });
  return map;
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      currentSubject,
      wrongIds: Array.from(wrongIds),
      customAnswers: savedState.customAnswers || {}
    }));
  } catch(e) {}
}

function renderSubjectBar() {
  const bar = document.getElementById("subjectBar");
  const smap = getSubjectsMap();
  const subjects = Object.keys(smap);
  if (currentSubject !== "ALL" && !smap[currentSubject]) {
    currentSubject = subjects.length > 0 ? subjects[0] : "ALL";
  }

  let html = `<span class="subject-label">📂 CHỌN MÔN HỌC:</span>`;
  html += `<button class="subj-pill ${currentSubject === 'ALL' ? 'active' : ''}" onclick="selectSubject('ALL')">Tất cả các môn (${questions.length})</button>`;
  subjects.forEach(s => {
    const active = currentSubject === s ? "active" : "";
    html += `<button class="subj-pill ${active}" onclick="selectSubject('${s.replace(/'/g, "\\'")}')">📘 ${s} (${smap[s]} câu)</button>`;
  });
  bar.innerHTML = html;
}

function renderSubjectsOverview() {
  const box = document.getElementById("subjectsOverview");
  const smap = getSubjectsMap();
  const subjects = Object.keys(smap);

  let cardsHtml = subjects.map(s => {
    const pool = questions.filter(q => (q.subject || "Khác") === s);
    const wrongCount = pool.filter(q => wrongIds.has(q.id)).length;
    let doneCount = 0;
    pool.forEach(q => { if (userAttempts[q.id]?.submitted) doneCount++; });

    return `<div class="subject-card" onclick="openSubjectPractice('${s.replace(/'/g, "\\'")}')">
      <div>
        <div style="font-size:1.25rem;font-weight:700;color:#38bdf8;margin-bottom:6px;">📘 Môn: ${s}</div>
        <div style="color:var(--muted);font-size:0.92rem;">Tổng số: <strong style="color:#fff">${pool.length} câu trắc nghiệm</strong></div>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;padding-top:10px;border-top:1px solid var(--border);font-size:0.85rem;">
        <span>📊 Đã làm: ${doneCount}/${pool.length}</span>
        <span style="color:${wrongCount > 0 ? '#f87171' : '#4ade80'}">🔥 Câu sai: ${wrongCount}</span>
      </div>
    </div>`;
  }).join("");

  box.innerHTML = `
    <h2 style="margin-bottom:14px;font-size:1.25rem;">🗂️ Chọn Môn Học Để Bắt Đầu Làm Quiz</h2>
    <div class="subjects-grid">${cardsHtml}</div>
  `;
}

function openSubjectPractice(subj) {
  currentSubject = subj;
  saveState();
  setMode("practice");
}

function selectSubject(subj) {
  currentSubject = subj;
  saveState();
  rebuildActivePool();
  renderSubjectBar();
  if (currentMode === "subjects") {
    setMode("practice");
  } else if (currentMode === "list") {
    renderListView();
  } else {
    renderCurrentQuestion();
  }
}

function rebuildActivePool() {
  let base = currentSubject === "ALL"
    ? [...questions]
    : questions.filter(q => (q.subject || "Khác") === currentSubject);

  if (currentMode === "wrong") {
    activePool = base.filter(q => wrongIds.has(q.id));
  } else {
    activePool = base;
  }
  currentIndex = 0;
}

function updateHeaderStats() {
  const subjPool = currentSubject === "ALL"
    ? questions
    : questions.filter(q => (q.subject || "Khác") === currentSubject);
  const subjWrongCount = subjPool.filter(q => wrongIds.has(q.id)).length;

  document.getElementById("totalBadge").textContent = subjPool.length + " Câu";
  document.getElementById("wrongCountTab").textContent = subjWrongCount;
  document.getElementById("statSubject").textContent = currentSubject === "ALL" ? "Tất cả các môn" : currentSubject;

  let c = 0, w = 0, done = 0;
  activePool.forEach(q => {
    const att = userAttempts[q.id];
    if (!att || !att.submitted) return;
    done++;
    if (att.isCorrect) c++; else w++;
  });
  document.getElementById("statCorrect").textContent = c;
  document.getElementById("statWrong").textContent = w;
  document.getElementById("statProgress").textContent = done + "/" + activePool.length;
}

function setMode(mode) {
  currentMode = mode;
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
  document.getElementById("tab-" + mode).classList.add("active");

  rebuildActivePool();
  renderSubjectBar();

  document.getElementById("subjectsOverview").style.display = mode === "subjects" ? "block" : "none";
  document.getElementById("quizView").style.display = (mode === "practice" || mode === "wrong") ? "block" : "none";
  document.getElementById("listView").style.display = mode === "list" ? "block" : "none";

  if (mode === "subjects") {
    renderSubjectsOverview();
  } else if (mode === "list") {
    renderListView();
  } else {
    renderCurrentQuestion();
  }
}

function getOptionsForQuestion(q) {
  if (q.options && Object.keys(q.options).length > 0) return q.options;
  const fallback = { A: "Phương án A (Xem trên ảnh Slide)", B: "Phương án B (Xem trên ảnh Slide)", C: "Phương án C (Xem trên ảnh Slide)", D: "Phương án D (Xem trên ảnh Slide)" };
  (q.answers || []).forEach(a => {
    if (!fallback[a]) fallback[a] = "Phương án " + a + " (Xem trên ảnh Slide)";
  });
  return fallback;
}

function renderCurrentQuestion() {
  renderSubjectBar();
  updateHeaderStats();
  const card = document.getElementById("questionCard");
  if (activePool.length === 0) {
    card.innerHTML = `<div style="text-align:center;padding:40px 20px;">
      <h2 style="margin-bottom:10px;">🎉 Không có câu hỏi nào trong mục này!</h2>
      <p style="color:var(--muted);margin-bottom:20px;">Môn học này chưa có câu sai hoặc đã hoàn thành.</p>
      <button class="btn btn-primary" onclick="setMode('practice')">Quay lại Luyện Tập</button>
    </div>`;
    document.getElementById("questionGrid").innerHTML = "";
    return;
  }

  if (currentIndex >= activePool.length) currentIndex = activePool.length - 1;
  if (currentIndex < 0) currentIndex = 0;

  const q = activePool[currentIndex];
  const opts = getOptionsForQuestion(q);
  const hasOcrOptions = q.options && Object.keys(q.options).length > 0;
  const forceShowSlide = document.getElementById("toggleSlideImg").checked || !q.question || !hasOcrOptions;
  const attempt = userAttempts[q.id] || { selected: [], submitted: false, isCorrect: false };
  const requiredCount = Math.max(1, (q.answers || []).length);

  let multiHintHtml = "";
  if (requiredCount > 1) {
    multiHintHtml = `<div class="multi-hint">📌 Câu có ${requiredCount} đáp án đúng — Hãy chọn đủ ${requiredCount} phương án (Đã chọn: ${attempt.selected.length}/${requiredCount})</div>`;
  }

  let slideImgHtml = "";
  if (forceShowSlide && q.slide_img) {
    slideImgHtml = `<div class="slide-img-box"><img loading="lazy" src="${q.slide_img}" alt="Slide ${q.id}"></div>`;
  }

  let optionsHtml = "";
  Object.keys(opts).sort().forEach(letter => {
    let cls = "option-btn";
    const isPicked = attempt.selected.includes(letter);
    const isRight = q.answers.includes(letter);

    if (attempt.submitted) {
      cls += " locked";
      if (isRight && isPicked) cls += " correct";
      else if (isRight && !isPicked) cls += " missed";
      else if (!isRight && isPicked) cls += " wrong";
    } else if (isPicked) {
      cls += " selected";
    }

    optionsHtml += `
      <button class="${cls}" onclick="selectOption(${q.id}, '${letter}')">
        <span class="opt-letter">${letter}</span>
        <span>${opts[letter]}</span>
      </button>
    `;
  });

  let feedbackHtml = "";
  if (attempt.submitted) {
    const ansText = q.answers.length ? q.answers.join(", ") : "Chưa xác định (Xem ảnh ghi chú bên dưới)";
    const statusText = attempt.isCorrect
      ? `<span style="color:#4ade80">✅ CHÍNH XÁC! Đáp án đúng là: ${ansText}</span>`
      : `<span style="color:#f87171">❌ CHƯA ĐÚNG! Bạn chọn: ${attempt.selected.join(", ")} — Đáp án đúng là: ${ansText}</span>`;

    const expHtml = q.explanation
      ? `<div style="margin-top:8px;color:#e2e8f0;white-space:pre-line;">${q.explanation}</div>`
      : "";

    const noteImgHtml = q.note_img
      ? `<div style="margin-top:10px;"><div style="font-size:0.82rem;color:var(--muted);margin-bottom:4px;">Ảnh chụp vùng Đáp án / Giải thích gốc:</div><div class="note-img-wrap"><img loading="lazy" src="${q.note_img}" alt="Answer Note"></div></div>`
      : "";

    feedbackHtml = `
      <div class="feedback-box">
        <div class="feedback-title">${statusText}</div>
        ${expHtml}
        ${noteImgHtml}
      </div>
    `;
  }

  card.innerHTML = `
    <div class="q-header">
      <div>
        <span class="q-number">CÂU ${currentIndex + 1} / ${activePool.length}</span>
        <span class="subj-tag">📘 Môn: ${q.subject || 'Chung'}</span>
      </div>
      <div style="display:flex;gap:8px;align-items:center;">
        <span class="kbd-hint">Sửa đáp án đúng (VD: C hoặc ADE):</span>
        <input class="edit-ans-input" value="${q.answers.join('')}" onchange="overrideAnswer(${q.id}, this.value)">
      </div>
    </div>
    ${multiHintHtml}
    <div class="q-text">${q.question || "(Xem nội dung câu hỏi trên ảnh Slide bên dưới)"}</div>
    ${slideImgHtml}
    <div class="options-grid">${optionsHtml}</div>
    ${feedbackHtml}
    <div class="nav-footer">
      <button class="btn" onclick="prevQuestion()" ${currentIndex===0?'disabled':''}>⬅ Câu trước (←)</button>
      <span class="kbd-hint">Phím tắt: Bấm <b>1-6</b> hoặc <b>A-F</b> để chọn, <b>Space / →</b> sang câu tiếp</span>
      <button class="btn btn-primary" onclick="nextQuestion()" ${currentIndex===activePool.length-1?'disabled':''}>Câu tiếp theo (→) ➡</button>
    </div>
  `;

  renderQuestionGrid();
}

function evaluateSelection(q, selectedList) {
  if (!q.answers || q.answers.length === 0) return true;
  const s1 = [...selectedList].sort().join(",");
  const s2 = [...q.answers].sort().join(",");
  return s1 === s2;
}

function selectOption(qId, letter) {
  const q = activePool.find(item => item.id === qId);
  if (!q) return;

  let att = userAttempts[qId];
  if (!att) {
    att = { selected: [], submitted: false, isCorrect: false };
    userAttempts[qId] = att;
  }
  if (att.submitted) return;

  const requiredCount = Math.max(1, (q.answers || []).length);

  if (att.selected.includes(letter)) {
    att.selected = att.selected.filter(x => x !== letter);
  } else {
    att.selected.push(letter);
  }

  if (att.selected.length >= requiredCount) {
    att.submitted = true;
    att.isCorrect = evaluateSelection(q, att.selected);
    if (!att.isCorrect) {
      wrongIds.add(qId);
    } else {
      wrongIds.delete(qId);
    }
    saveState();
  }
  renderCurrentQuestion();
}

function overrideAnswer(qId, rawStr) {
  const letters = (rawStr.toUpperCase().match(/[A-F]/g) || []);
  const uniq = [...new Set(letters)];
  if (uniq.length === 0) return;

  const q = questions.find(item => item.id === qId);
  if (q) q.answers = uniq;
  const pq = activePool.find(item => item.id === qId);
  if (pq) pq.answers = uniq;

  if (!savedState.customAnswers) savedState.customAnswers = {};
  savedState.customAnswers[qId] = uniq;
  delete userAttempts[qId];
  saveState();
  renderCurrentQuestion();
}

function prevQuestion() {
  if (currentIndex > 0) {
    currentIndex--;
    renderCurrentQuestion();
  }
}

function nextQuestion() {
  if (currentIndex < activePool.length - 1) {
    currentIndex++;
    renderCurrentQuestion();
  }
}

function jumpToQuestion(idx) {
  currentIndex = idx;
  renderCurrentQuestion();
}

function shuffleQuestions() {
  for (let i = activePool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [activePool[i], activePool[j]] = [activePool[j], activePool[i]];
  }
  currentIndex = 0;
  renderCurrentQuestion();
}

function resetProgress() {
  activePool.forEach(q => {
    delete userAttempts[q.id];
  });
  currentIndex = 0;
  renderCurrentQuestion();
}

function renderQuestionGrid() {
  const grid = document.getElementById("questionGrid");
  grid.innerHTML = activePool.map((q, idx) => {
    let cls = "grid-dot";
    if (idx === currentIndex) cls += " current";
    const att = userAttempts[q.id];
    if (att && att.submitted) cls += att.isCorrect ? " done-ok" : " done-bad";
    return `<button class="${cls}" onclick="jumpToQuestion(${idx})">${idx + 1}</button>`;
  }).join("");
}

function renderListView() {
  renderSubjectBar();
  updateHeaderStats();
  const kw = (document.getElementById("searchInput").value || "").toLowerCase().trim();
  const container = document.getElementById("listContainer");
  const pool = currentSubject === "ALL"
    ? questions
    : questions.filter(q => (q.subject || "Khác") === currentSubject);

  const filtered = pool.filter(q => {
    if (!kw) return true;
    const textBlob = (q.question + " " + Object.values(q.options || {}).join(" ") + " " + q.explanation).toLowerCase();
    return textBlob.includes(kw);
  });

  container.innerHTML = filtered.map((q, idx) => {
    const opts = getOptionsForQuestion(q);
    const optsList = Object.keys(opts).sort().map(k => {
      const isRight = q.answers.includes(k);
      return `<div style="padding:4px 0;${isRight ? 'color:#4ade80;font-weight:700;' : 'color:#cbd5e1;'}">
        ${isRight ? '✓ ' : '&nbsp;&nbsp;&nbsp;'}${k}. ${opts[k]}
      </div>`;
    }).join("");

    return `<div class="list-item">
      <div style="display:flex;justify-content:space-between;margin-bottom:8px;">
        <div>
          <strong style="color:var(--primary)">Câu ${idx + 1} (#${q.id})</strong>
          <span class="subj-tag">📘 ${q.subject || 'Chung'}</span>
        </div>
        <span style="color:#4ade80;font-weight:700;">Đáp án đúng: ${q.answers.join(", ") || "?"}</span>
      </div>
      <div style="font-weight:600;font-size:1.05rem;margin-bottom:10px;">${q.question || "(Câu hỏi hình ảnh)"}</div>
      ${q.slide_img ? `<div style="margin-bottom:10px;"><img loading="lazy" src="${q.slide_img}" style="max-height:180px;border-radius:8px;background:#fff;padding:4px;"></div>` : ''}
      <div style="margin-bottom:10px;">${optsList}</div>
      ${q.explanation ? `<div style="color:#cbd5e1;font-size:0.93rem;white-space:pre-line;margin-top:6px;">${q.explanation}</div>` : ''}
      ${q.note_img ? `<div class="note-img-wrap"><img loading="lazy" src="${q.note_img}" style="max-height:110px;"></div>` : ''}
    </div>`;
  }).join("");
}

document.addEventListener("keydown", (e) => {
  if (currentMode !== "practice" && currentMode !== "wrong") return;
  if (["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement?.tagName)) return;
  const key = e.key.toUpperCase();
  const q = activePool[currentIndex];
  if (!q) return;

  const keyMap = { "1": "A", "2": "B", "3": "C", "4": "D", "5": "E", "6": "F", "A": "A", "B": "B", "C": "C", "D": "D", "E": "E", "F": "F" };
  if (keyMap[key]) {
    e.preventDefault();
    selectOption(q.id, keyMap[key]);
  } else if (e.key === "ArrowRight" || e.key === " ") {
    e.preventDefault();
    nextQuestion();
  } else if (e.key === "ArrowLeft") {
    e.preventDefault();
    prevQuestion();
  }
});

rebuildActivePool();
renderCurrentQuestion();
</script>
</body>
</html>
