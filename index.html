<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hệ Thống Ôn Thi Trắc Nghiệm Đa Môn (631 Câu)</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --card-hover: #334155;
    --text: #f8fafc;
    --muted: #94a3b8;
    --primary: #3b82f6;
    --primary-hover: #2563eb;
    --accent: #8b5cf6;
    --success: #22c55e;
    --success-bg: rgba(34, 197, 94, 0.16);
    --danger: #ef4444;
    --danger-bg: rgba(239, 68, 68, 0.16);
    --warning: #f59e0b;
    --warning-bg: rgba(245, 158, 11, 0.16);
    --border: #334155;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    padding-bottom: 60px;
  }
  header {
    background: rgba(30, 41, 59, 0.95);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 100;
    padding: 12px 24px;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    font-weight: 700;
    font-size: 1.15rem;
    cursor: pointer;
  }
  .badge {
    background: var(--primary);
    color: #fff;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 0.8rem;
    font-weight: 600;
  }
  .nav-tabs {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .tab-btn {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
    padding: 7px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
    font-size: 0.9rem;
    transition: all 0.15s;
  }
  .tab-btn:hover {
    color: var(--text);
    background: var(--card-hover);
  }
  .tab-btn.active {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
  }
  .container {
    max-width: 980px;
    margin: 20px auto;
    padding: 0 16px;
  }
  .subject-bar {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 16px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .subject-label {
    font-weight: 700;
    font-size: 0.92rem;
    color: #38bdf8;
    margin-right: 4px;
  }
  .subj-pill {
    background: rgba(15, 23, 42, 0.7);
    color: var(--muted);
    border: 1px solid var(--border);
    padding: 6px 14px;
    border-radius: 999px;
    cursor: pointer;
    font-weight: 600;
    font-size: 0.88rem;
    transition: all 0.15s;
  }
  .subj-pill:hover {
    color: #fff;
    border-color: #38bdf8;
  }
  .subj-pill.active {
    background: linear-gradient(135deg, #2563eb, #7c3aed);
    color: #fff;
    border-color: transparent;
    box-shadow: 0 4px 12px rgba(59, 130, 246, 0.35);
  }
  .subjects-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
    gap: 16px;
    margin-bottom: 24px;
  }
  .subject-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    cursor: pointer;
    transition: all 0.18s;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 12px;
  }
  .subject-card:hover {
    border-color: #38bdf8;
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.3);
  }
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    background: var(--card);
    padding: 14px 18px;
    border-radius: 12px;
    border: 1px solid var(--border);
    margin-bottom: 20px;
  }
  .stats-row {
    display: flex;
    gap: 14px;
    font-size: 0.92rem;
    flex-wrap: wrap;
  }
  .stat-pill {
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(15, 23, 42, 0.6);
    padding: 5px 12px;
    border-radius: 8px;
  }
  .controls-row {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }
  .btn {
    background: var(--card-hover);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
    font-size: 0.88rem;
    transition: all 0.15s;
  }
  .btn:hover { background: #475569; }
  .btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  .btn-primary:hover { background: var(--primary-hover); }
  .quiz-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.25);
  }
  .q-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
    flex-wrap: wrap;
    gap: 8px;
  }
  .q-number {
    font-size: 0.9rem;
    color: #38bdf8;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .subj-tag {
    background: rgba(139, 92, 246, 0.2);
    color: #c4b5fd;
    border: 1px solid rgba(139, 92, 246, 0.4);
    padding: 2px 10px;
    border-radius: 6px;
    font-size: 0.8rem;
    font-weight: 700;
    margin-left: 8px;
  }
  .multi-hint {
    display: inline-block;
    background: var(--warning-bg);
    color: #fbbf24;
    border: 1px solid var(--warning);
    padding: 4px 12px;
    border-radius: 999px;
    font-size: 0.85rem;
    font-weight: 700;
    margin-bottom: 12px;
  }
  .q-text {
    font-size: 1.22rem;
    font-weight: 600;
    margin-bottom: 16px;
    color: #fff;
  }
  .slide-img-box {
    margin-bottom: 18px;
    text-align: center;
    background: #fff;
    padding: 8px;
    border-radius: 10px;
    overflow: hidden;
  }
  .slide-img-box img {
    max-width: 100%;
    max-height: 360px;
    object-fit: contain;
    display: block;
    margin: 0 auto;
  }
  .options-grid {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 16px;
  }
  .option-btn {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    text-align: left;
    background: rgba(15, 23, 42, 0.55);
    border: 2px solid var(--border);
    color: var(--text);
    padding: 13px 16px;
    border-radius: 12px;
    cursor: pointer;
    font-size: 1.02rem;
    transition: all 0.15s;
  }
  .option-btn:hover:not(.locked) {
    border-color: var(--primary);
    background: rgba(59, 130, 246, 0.1);
  }
  .opt-letter {
    width: 34px;
    height: 34px;
    border-radius: 8px;
    background: var(--card-hover);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    flex-shrink: 0;
  }
  .option-btn.selected {
    border-color: var(--primary);
    background: rgba(59, 130, 246, 0.22);
  }
  .option-btn.selected .opt-letter {
    background: var(--primary);
    color: #fff;
  }
  .option-btn.correct {
    border-color: var(--success);
    background: var(--success-bg);
  }
  .option-btn.correct .opt-letter {
    background: var(--success);
    color: #fff;
  }
  .option-btn.missed {
    border-color: var(--warning);
    background: var(--warning-bg);
  }
  .option-btn.missed .opt-letter {
    background: var(--warning);
    color: #000;
  }
  .option-btn.wrong {
    border-color: var(--danger);
    background: var(--danger-bg);
  }
  .option-btn.wrong .opt-letter {
    background: var(--danger);
    color: #fff;
  }
  .feedback-box {
    margin-top: 18px;
    padding: 16px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: rgba(15, 23, 42, 0.7);
  }
  .feedback-title {
    font-weight: 700;
    font-size: 1.05rem;
    margin-bottom: 8px;
  }
  .note-img-wrap {
    margin-top: 10px;
    background: #fff;
    padding: 8px;
    border-radius: 8px;
    display: inline-block;
    max-width: 100%;
  }
  .note-img-wrap img {
    max-width: 100%;
    max-height: 180px;
    display: block;
  }
  .nav-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 22px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    flex-wrap: wrap;
    gap: 10px;
  }
  .question-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 20px;
    background: var(--card);
    padding: 16px;
    border-radius: 12px;
    border: 1px solid var(--border);
  }
  .grid-dot {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: rgba(15, 23, 42, 0.6);
    color: var(--muted);
    font-weight: 600;
    font-size: 0.85rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .grid-dot.current { border: 2px solid var(--primary); color: #fff; }
  .grid-dot.done-ok { background: var(--success-bg); border-color: var(--success); color: #4ade80; }
  .grid-dot.done-bad { background: var(--danger-bg); border-color: var(--danger); color: #f87171; }
  .search-input {
    width: 100%;
    padding: 12px 16px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    font-size: 1rem;
    margin-bottom: 16px;
  }
  .list-item {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 14px;
  }
  .edit-ans-input {
    background: var(--bg);
    color: #4ade80;
    border: 1px solid var(--border);
    padding: 4px 10px;
    border-radius: 6px;
    font-weight: 700;
    width: 90px;
    text-transform: uppercase;
  }
  .kbd-hint {
    font-size: 0.8rem;
    color: var(--muted);
  }
</style>
</head>
<body>

<header>
  <div class="brand" onclick="setMode('subjects')">
    <span>🎓 Hệ Thống Ôn Thi Trắc Nghiệm Đa Môn</span>
    <span class="badge" id="totalBadge">0 Câu</span>
  </div>
  <div class="nav-tabs">
    <button class="tab-btn" onclick="setMode('subjects')" id="tab-subjects">🗂️ Danh Sách Môn Học</button>
    <button class="tab-btn active" onclick="setMode('practice')" id="tab-practice">🎯 Luyện Từng Câu</button>
    <button class="tab-btn" onclick="setMode('wrong')" id="tab-wrong">🔥 Ôn Câu Sai (<span id="wrongCountTab">0</span>)</button>
    <button class="tab-btn" onclick="setMode('list')" id="tab-list">📚 Toàn Bộ Đề & Tìm Kiếm</button>
  </div>
</header>

<div class="container">
  <div class="subject-bar" id="subjectBar"></div>

  <div id="subjectsOverview" style="display:none;"></div>

  <div id="quizView">
    <div class="toolbar">
      <div class="stats-row">
        <div class="stat-pill">📖 Môn: <strong id="statSubject" style="color:#c4b5fd">Tất cả</strong></div>
        <div class="stat-pill">✅ Đúng: <strong id="statCorrect" style="color:#4ade80">0</strong></div>
        <div class="stat-pill">❌ Sai: <strong id="statWrong" style="color:#f87171">0</strong></div>
        <div class="stat-pill">📊 Tiến độ: <strong id="statProgress">0/0</strong></div>
      </div>
      <div class="controls-row">
        <label style="display:flex;align-items:center;gap:6px;font-size:0.88rem;cursor:pointer;">
          <input type="checkbox" id="toggleSlideImg" onchange="renderCurrentQuestion()"> Luôn hiện ảnh gốc Slide
        </label>
        <button class="btn" onclick="shuffleQuestions()">🔀 Trộn câu hỏi</button>
        <button class="btn" onclick="resetProgress()">🔄 Làm lại môn này</button>
      </div>
    </div>

    <div class="quiz-card" id="questionCard"></div>

    <div class="question-grid" id="questionGrid"></div>
  </div>

  <div id="listView" style="display:none;">
    <input type="text" class="search-input" id="searchInput" placeholder="🔍 Nhập từ khóa câu hỏi hoặc đáp án để tra cứu nhanh..." oninput="renderListView()">
    <div id="listContainer"></div>
  </div>
</div>

<script>
const RAW_QUESTIONS = [{"id": 1, "subject": "IAO202", "question": "A user issues a ping 192.168.250.103 command and receives a response that includes a code of 1. What does this code represent?", "options": {"A": "host unreachable", "B": "protocol unreachable", "C": "port unreachable", "D": "network unreachable"}, "answers": ["A"], "explanation": "Một người dùng thực hiện lệnh ping 192.168.250.103 và nhận được phản hồi có mã 1. Mã này biễu thị điều gì?\nPing trả về code 1 nghĩa là thiết bị gửi ICMP không thể tìm thầy host đích.", "slide_img": "images/q_001_slide_1794418770843.jpg", "note_img": "images/q_001_note_1794418770843.jpg"}, {"id": 2, "subject": "IAO202", "question": "A user issues a ping 2001:db8:FACE:39::10 command and receives a response that includes a code of 2. What does this code represent?", "options": {"A": "host unreachable", "B": "port unreachable", "C": "network unreachable", "D": "protocol unreachable"}, "answers": ["D"], "explanation": "", "slide_img": "images/q_002_slide_1794418772312.jpg", "note_img": "images/q_002_note_1794418772312.jpg"}, {"id": 3, "subject": "IAO202", "question": "Le aa What is the compressed version of the IPv6 address 2001 :Odb8:eeff:000a:0000:0000:0000:0001?", "options": {"A": "2001:db8:eeff.a:::1", "B": "2001:db8:eeff:a::1", "C": "2001:db8:eeff:a::0001", "D": "2001:db8:eeff:a:1"}, "answers": ["B"], "explanation": "", "slide_img": "images/q_003_slide_1794418774600.jpg", "note_img": "images/q_003_note_1794418774600.jpg"}, {"id": 4, "subject": "IAO202", "question": "What is the full decompressed form of the IPv6 address 2001:420:59:0:1:a/64?", "options": {"A": "2001:4200:5900:0:1:0:a000", "B": "2001:0420:0059:0000:0001:0000:000a", "C": "2001:0420:0059:0000:0001:000a", "D": "2001:0420:0059:0000:0001:0000:0000:000a", "E": "2001:420:59:0:1:0:a", "F": "2001:4200:5900:0000:1000:0000:0000:a000"}, "answers": ["D"], "explanation": "", "slide_img": "images/q_004_slide_1794418775940.jpg", "note_img": "images/q_004_note_1794418775940.jpg"}, {"id": 5, "subject": "IAO202", "question": "What is the well-known port address number used by DNS to serve requests?", "options": {"A": "53", "B": "110", "C": "35", "D": "80", "E": "25"}, "answers": ["A"], "explanation": "Công well-known DNS dùng đễ phục vụ các yêu cầu là bao nhiêu?\n53\nDNS sử dụng công 53 cho cả TCP và UDP.", "slide_img": "images/q_005_slide_1794418778113.jpg", "note_img": "images/q_005_note_1794418778113.jpg"}, {"id": 6, "subject": "IAO202", "question": "Which personnel in a SOC is assigned the task of verifying whether an alert triggered by monitoring software represents a true security incident?", "options": {"A": "Tier 2 personnel", "B": "Tier 1 personnel", "C": "SOC Manager", "D": "Tier 3 personnel"}, "answers": ["B"], "explanation": "", "slide_img": "images/q_006_slide_1794418779454.jpg", "note_img": "images/q_006_note_1794418779454.jpg"}, {"id": 7, "subject": "IAO202", "question": "How many host addresses are available on the 192.168.10.128/26 network?", "options": {"A": "62", "B": "70", "C": "64", "D": "68"}, "answers": ["A"], "explanation": "Có bao nhiều địa chỉ host khả dụng trong mạng 192.168.10.128/26?\n62\nSubnet /26 có 64 địa chì, trừ network và broadcast còn 62 địa chỉ usable.", "slide_img": "images/q_007_slide_1794418781178.jpg", "note_img": "images/q_007_note_1794418781178.jpg"}, {"id": 8, "subject": "IAO202", "question": "A PC is downloading a large file from a server. The TCP window is 1000 bytes. The server is sending the file using 100-byte segments. How many segments will the server send before it requires an acknowledgment from the PC?", "options": {"A": "1000 segments", "B": "100 segments", "C": "1 segment", "D": "10 segments"}, "answers": ["D"], "explanation": "Một PC tàải tệp lớn từ server, cửa số TCP là 1000 byte, mối segment là 100 byte. Server sẽ gửi bao nhiêu segment trước khi cần ACK?\n10segment\n1000 chia cho 100 bằng 10 nên gửi được 10 segment trước khi cần ACK.", "slide_img": "images/q_008_slide_1794418783193.jpg", "note_img": "images/q_008_note_1794418783193.jpg"}, {"id": 9, "subject": "IAO202", "question": "What three application layer protocols are parts of the TCP/IP protocol suite?", "options": {"A": "IP. TCP, UDP", "B": "ARP, NAT, PPP", "C": "DHCP. DNS, FTP", "D": "ARP, NAT, IP"}, "answers": ["C"], "explanation": "Ba giao thức lớp ứng dụng nào là một phần của bộ giao thức TCP/IP?\nDHCP. DNS, FTP\nĐây là ba giao thức hoạt động ở tầng ứng dụng dùng cho cầu hình mạng, phân giải tên miền và truyền tệp.", "slide_img": "images/q_009_slide_1794418785664.jpg", "note_img": "images/q_009_note_1794418785664.jpg"}, {"id": 10, "subject": "IAO202", "question": "Which two parts are components of an IPv4 address?", "options": {"A": "physical portion, logical portion", "B": "subnet portion, logical portion", "C": "network portion, host portion", "D": "physical portion, broadcast portion"}, "answers": ["C"], "explanation": "Hai phần nào cầu thành một địa chỉ IPv4?\nPhần mạng và phần host ]\nIPv4 được chia thành phần mạng đề định tuyến và phần host đễ nhận diện thiết bị.", "slide_img": "images/q_010_slide_1794418787393.jpg", "note_img": "images/q_010_note_1794418787393.jpg"}, {"id": 11, "subject": "IAO202", "question": "Which two devices would commonly be found at the access layer of the hierarchical enterprise LAN design model?", "options": {"A": "Firewall, modular switch", "B": "Modular switch, Layer 3 device", "C": "Firewall, Layer 3 device", "D": "Access point, Layer 2 switch"}, "answers": ["D"], "explanation": "Hai thiết bị nào thường có ở tầng truy cập của mô hình LAN phân cấp của doanh nghiệp?\nĐiễm truy cập và switch Layer 2\nTầng truy cập cung cấp kết nối cho thiết bị cuồi, thường dùng AP và switch L2.", "slide_img": "images/q_011_slide_1794418789168.jpg", "note_img": "images/q_011_note_1794418789168.jpg"}, {"id": 12, "subject": "IAO202", "question": "Which three are major categories of elements in a security operations center?", "options": {"A": "data center, database engine, Internet connection", "B": "Security, processes, technologies", "C": "People, processes, technologies", "D": "People, data center, security", "E": "data center, database engine, security"}, "answers": ["C"], "explanation": "Ba loại thành phần chính trong một trung tâm điều hành an ninh (SOC) là gì?\nCon người, quy trình, công nghệ\nSOC được xây dựng dựa trên đội ngũ nhân sự, quy trình chuẫn và công nghệ hố trợ giám sát - phản ứng.", "slide_img": "images/q_012_slide_1794418791038.jpg", "note_img": "images/q_012_note_1794418791038.jpg"}, {"id": 13, "subject": "IAO202", "question": "Which three technologies should be included in a SOC security information and event management system?", "options": {"A": "proxy service, firewall appliance, security monitoring", "B": "log management, security monitoring, firewall appliance", "C": "log management, threat intelligence. security monitoring", "D": "proxy service, firewall appliance, intrusion prevention"}, "answers": ["C"], "explanation": "Ba công nghệ nào nên được bao gồm trong hệ thống SIEM của trung tâm điều hành an ninh (SOC)?\nQuản lý log, tình báo mồi đe dọa, giám sát bảo mật\nSIEM chủ yếu phụ trách thu thập log, phân tích mồối đe dọa và giám sát an ninh liên tục.", "slide_img": "images/q_013_slide_1794418792811.jpg", "note_img": "images/q_013_note_1794418792811.jpg"}, {"id": 14, "subject": "IAO202", "question": "A web client is receiving a response for a web page from a web server. From the perspective of the client, what is the correct order of the protocol stack that is used to decode the received transmission?", "options": {"A": "Ethernet, IP, TCP, HTTP", "B": "HTTP, TCP, IP, Ethernet", "C": "HTTP, Ethermet, IP, TCP", "D": "Ethernet, TCP. IP, HTTP"}, "answers": ["A"], "explanation": "Một web client nhận phản hồi từ veb server, từ góc nhìn client, thứ tự giải mã tầng giao thức là gì?\nEthernet, IP. TCP, HTTP\nClient xử lý từ tầng thấp — cao: lớp vật lý trước rồi lên IP/TCP và cuối cùng là HTTP.", "slide_img": "images/q_014_slide_1794418794746.jpg", "note_img": "images/q_014_note_1794418794746.jpg"}, {"id": 15, "subject": "IAO202", "question": "In what order are the steps in the vulnerability management life cycle conducted?", "options": {"A": "discover, assess, prioritize assets, report. remediate, verify", "B": "discover, prioritize assets, assess, report. remediate, verify", "C": "discover, prioritize assets, assess, remediate, report, verify", "D": "discover. prioritize assets, assess, remediate. verify. report"}, "answers": ["B"], "explanation": "Thứ tự các bước trong vòng đời quản lý lỗ hỗng là gì?", "slide_img": "images/q_015_slide_1794418796481.jpg", "note_img": "images/q_015_note_1794418796481.jpg"}, {"id": 16, "subject": "IAO202", "question": "What are three responsibilities of the transport layer? (Choose three.)", "options": {"A": "identifying the applications and services on the client and server that should handle transmitted data", "B": "conducting error detection of the contents in frames", "C": "meeting the reliability requirements of applications, if any", "D": "directing packets towards the destination network", "E": "formatting data into a compatible form for receipt by the destination devices", "F": "multiplexing multiple communication streams from many users or applications on the same network"}, "answers": ["A", "C", "F"], "explanation": "", "slide_img": "images/q_016_slide_1794418798622.jpg", "note_img": "images/q_016_note_1794418798622.jpg"}, {"id": 17, "subject": "IAO202", "question": "What are the three major components of a worm attack? (Choose three.)", "options": {"A": "a payload", "B": "a propagation mechanism", "C": "an infecting vulnerability", "D": "a probing mechanism", "E": "an enabling vulnerability", "F": "a penetration mechanism"}, "answers": ["A", "B", "E"], "explanation": "Ba thành phâần chính của một cuộc tần công sâu máy tính là gì?\nPayload, cơ chế lan truyền, lố hông cho phép kích hoạt\nWorm cần payload đễ gây hại, cơ chế lan truyền đễ nhân bản và lố hồng đễ xâm nhập.", "slide_img": "images/q_017_slide_1794418800449.jpg", "note_img": "images/q_017_note_1794418800449.jpg"}, {"id": 18, "subject": "IAO202", "question": "What are the three outcomes of the NIST Cybersecurity Framework identify core function? (Choose three.)", "options": {"A": "asset management", "B": "risk assessment", "C": "governance", "D": "mitigation", "E": "recovery planning", "F": "information protection process and procedures"}, "answers": ["A", "B", "C"], "explanation": "Ba kết quả của chức năng lõi \"Identify\" trong NIST Cybersecurity Framework là gì?\nBa nhóm này thuộc nhóm “Identify\", dùng đề nhận diện và hiều rủi ro trong hệ thống", "slide_img": "images/q_018_slide_1794418802068.jpg", "note_img": "images/q_018_note_1794418802068.jpg"}, {"id": 19, "subject": "IAO202", "question": "What are three access control security services? (Choose three. )", "options": {"A": "authentication", "B": "repudiation", "C": "availability", "D": "accounting", "E": "authorization", "F": "access"}, "answers": ["A", "D", "E"], "explanation": "Ba dịch vụ bảo mật Ẹểm soát truy cập là gì?\nXác thực, kế toán, cấp quyền truy cập.\nĐây là các thành phần chính của mô hình AAA (Authentication, Authorization, Accounting).", "slide_img": "images/q_019_slide_1794418803709.jpg", "note_img": "images/q_019_note_1794418803709.jpg"}, {"id": 20, "subject": "IAO202", "question": "Which two operations are provided by TCP but not by UDP? (Choose two.)", "options": {"A": "retransmitting any unacknowledged data", "B": "acknowledging received data", "C": "reconstructing data in the order received", "D": "identifying the applications", "E": "tracking individual conversations"}, "answers": ["A", "B"], "explanation": "Hai chức năng TCP có nhưng UDP không có là gì?", "slide_img": "images/q_020_slide_1794418805434.jpg", "note_img": "images/q_020_note_1794418805434.jpg"}, {"id": 21, "subject": "IAO202", "question": "What are the three major components of a worm attack? (Choose three.)", "options": {"A": "a payload", "B": "an enabling vulnerability", "C": "an infecting vulnerability", "D": "a propagation mechanism"}, "answers": ["A", "B", "D"], "explanation": "Ba thành phân chính của một cuộc tần công bằng sâu máy tính là gì?\nPayload, lố hống kích hoạt, cơ chế lan ừuyện.\nPayload, lố hống kích hoạt, cơ chế lan truyền.", "slide_img": "images/q_021_slide_1794418807037.jpg", "note_img": "images/q_021_note_1794418807037.jpg"}, {"id": 22, "subject": "IAO202", "question": "What are three functionalities provided by SOAR? (Choose three. )", "options": {"A": "It automates complex incident response procedures and investigations.", "B": "It provides 24x7 statistics on packets that flow through a Cisco router or multilayer switch.", "C": "It uses artificial intelligence to detect incidents and aid in incident analysis and response.", "D": "It presents the correlated and aggregated event data in real-time monitoring and long-term summaries.", "E": "It provides a complete audit trail of basic information about every IP flow forwarded on a device.", "F": "It provides case management tools that allow cybersecurity personnel to research and investigate incidents."}, "answers": ["A", "C", "F"], "explanation": "Ba chức năng mà SOAR cung cấp là gì?\nTự động hóa phản ứng sự cô, dùng AI hỗ trợ phân tích, cung cấp công cụ quản lý tình huống.\nSOAR hố trợ tự động hóa, phân tích nâng cao và quản lý quy trình điều tra.", "slide_img": "images/q_022_slide_1794418808906.jpg", "note_img": "images/q_022_note_1794418808906.jpg"}, {"id": 23, "subject": "IAO202", "question": "What are three benefits of using symbolic links over hard links in Linux? (Choose three.)", "options": {"A": "They can link to a directory.", "B": "They can be compressed.", "C": "Symbolic links can be exported.", "D": "They can be encrypted.", "E": "They can link to a file in a different file system.", "F": "They can show the location of the original file."}, "answers": ["A", "E", "F"], "explanation": "Ba lợi ích của việc dùng symbolic link thay vì hard link trong Linux là gì? —\nChúng có thể liên kết đến thư mục; Chúng có thế liên kết đền file ở hệ thống tệp khác; Chúng có thể hiến thị vị trí của file gốc.\nSymbolic link linh hoạt hơn hard link và không bị giới hạn trong cùng filesystem.", "slide_img": "images/q_023_slide_1794418810700.jpg", "note_img": "images/q_023_note_1794418810700.jpg"}, {"id": 24, "subject": "IAO202", "question": "What three goals does a BYOD security policy accomplish? (Choose three.)", "options": {"A": "identify all malware signatures and synchronize them across corporate databases", "B": "identify which employees can bring their own devices", "C": "identify safeguards to put in place if a device is compromised", "D": "identify and prevent all heuristic virus signatures", "E": "identify a list of websites that users are not permitted to access", "F": "describe the rights to access and activities permitted to security personnel on the device Ffe)} eee ee ae en ee"}, "answers": ["B", "C", "F"], "explanation": "Ba mục tiêu mà chính sách BYOD đạt được là gì?\nXác định nhân viên ủg được phép mang thiết bị riêng; Xác định biện pháp bảo vệ khi thiết bị bị xâm phạm; Mô tả quyền truy cập và hoạt động được phép cho bộ phận an\nBYOD tập trung vào kiếm soát thiết bị, bảo vệ dữ liệu và quyền truy cập của người dùng.", "slide_img": "images/q_024_slide_1794418812609.jpg", "note_img": "images/q_024_note_1794418812609.jpg"}, {"id": 25, "subject": "IAO202", "question": "Which three are major categories of elements in a security operations center? (Choose three.)", "options": {"A": "technologies", "B": "Internet connection", "C": "processes", "D": "data center", "E": "people", "F": "database engine"}, "answers": ["A", "C", "E"], "explanation": "Ba nhóm thành phân chính của một trung tâm SOC là gì?\nCông nghệ: Quy trình: Con người.\nSOC luôn xoay quanh ba nền tảng: People - Process - Technology.", "slide_img": "images/q_025_slide_1794418814160.jpg", "note_img": "images/q_025_note_1794418814160.jpg"}, {"id": 26, "subject": "IAO202", "question": "Which three IP addresses are private? (Choose three.)", "options": {"A": "10.1.1.1", "B": "172.32.5.2", "C": "192.168.5.5", "D": "192.167.10.10", "E": "172.16.4.4"}, "answers": ["A", "C", "E"], "explanation": "Ba địa chỉ IP nào là private?\n10.1.1.1/192.168.5.5; 172.16.4.4.\nBa địa chỉ này nằm trong các dải IP private do IANA quy định.", "slide_img": "images/q_026_slide_1794418815697.jpg", "note_img": "images/q_026_note_1794418815697.jpg"}, {"id": 27, "subject": "IAO202", "question": "Which three analysis tools come integrated with Security Onion? (Select three.)", "options": {"A": "Sguil", "B": "Kibana", "C": "OSSEC", "D": "Wireshark"}, "answers": ["A", "B", "D"], "explanation": "", "slide_img": "images/q_027_slide_1794418817079.jpg", "note_img": "images/q_027_note_1794418817079.jpg"}, {"id": 28, "subject": "IAO202", "question": "Which three technologies should be included in a SOC security information and event management system? (Choose three.)", "options": {"A": "security monitoring", "B": "threat intelligence", "C": "proxy service", "D": "firewall appliance", "E": "log management"}, "answers": ["A", "B", "E"], "explanation": "Ba công nghệ nên có trong hệ thống SIEM của SOC là gì?\nGiám sát an ninh; Tình báo mồi đe dọa; Quản lý log.\nSIEM cần thu thập log, phân tích mồi đe dọa và theo dõi bảo mật theo thời gian thực.", "slide_img": "images/q_028_slide_1794418818769.jpg", "note_img": "images/q_028_note_1794418818769.jpg"}, {"id": 29, "subject": "IAO202", "question": "Data is being sent from a source PC to a destination server. Which three statements correctly describe the function of TCP or UDP in this situation? (Choose three. }", "options": {"A": "The TCP process running on the PC randomly selects the destination port when establishing a session with the server.", "B": "The UDP destination port number identifies the application or service on the server which will handle the data.", "C": "TCP is the preferred protocol when a function requires lower network overhead.", "D": "The source port field identifies the running application or service that will handle data returning to the PC.", "E": "UDP segments are encapsulated within IP packets for transport across the network.", "F": "The TCP source port number identifies the sending host on the network."}, "answers": ["B", "D", "E"], "explanation": "Dữ liệu đang được gửi từ PC nguồn đến máy chủ đích. Ba phát biểu nào mô tả đúng chức năng của TCP hoặc UDP?", "slide_img": "images/q_029_slide_1794418820779.jpg", "note_img": "images/q_029_note_1794418820779.jpg"}, {"id": 30, "subject": "IAO202", "question": "In a defense-in-depth approach, which three options must be identified to effectively defend a network against attacks? (Choose three.)", "options": {"A": "total number of devices that attach to the wired and wireless network", "B": "assets that need protection", "C": "vulnerabilities in the system", "D": "location of attacker or attackers", "E": "past security breaches", "F": "threats to assets"}, "answers": ["B", "C", "F"], "explanation": "Trong phương pháp phòng thủ nhiều lớp, ba yêu tô nào phải được xác định đễ bảo vệ mạng trước tần công?\nTài sản cần bảo vệ: các lỗ hồng hệ thống; các mồi đe dọa đối với tài sản.\nĐây là ba yếu tố cồt lõi trong mô hình defense-in-depth.", "slide_img": "images/q_030_slide_1794418822679.jpg", "note_img": "images/q_030_note_1794418822679.jpg"}, {"id": 31, "subject": "IAO202", "question": "What three application layer protocols are part of the TCP/IP protocol suite? (Choose three.)", "options": {"A": "ARP", "B": "DHCP", "C": "DNS", "D": "FTP", "E": "NAT", "F": "PPP"}, "answers": ["B"], "explanation": "", "slide_img": "images/q_031_slide_1794418824013.jpg", "note_img": "images/q_031_note_1794418824013.jpg"}, {"id": 32, "subject": "IAO202", "question": "Data is being sent from a source PC to a destination server. Which three statements correctly describe the function of TCP or UDP in this situation? (Choose three. )", "options": {"A": "The TCP process running on the PC randomly selects the destination port when establishing a session with the server.", "B": "The UDP destination port number identifies the application or service on the server which will handle the data.", "C": "TCP is the preferred protocol when a function requires lower network overhead.", "D": "The source port field identifies the running application or service that will handle data returning to the PC.", "E": "UDP segments are encapsulated within IP packets for transport across the network.", "F": "The TCP source port number identifies the sending host on the network."}, "answers": ["B", "D", "E"], "explanation": "", "slide_img": "images/q_032_slide_1794418825476.jpg", "note_img": "images/q_032_note_1794418825476.jpg"}, {"id": 33, "subject": "IAO202", "question": "——emaeeeneee eee eee eer What are two popular SIEM platforms? (Choose two.)", "options": {"A": "Splunk", "B": "Security Onion with ELK", "C": "Tcpdump", "D": "NetFlow", "E": "Cisco Umbrella"}, "answers": ["A", "B"], "explanation": "", "slide_img": "images/q_033_slide_1794418827818.jpg", "note_img": "images/q_033_note_1794418827818.jpg"}, {"id": 34, "subject": "IAO202", "question": "8 a a What are two characteristics of IP? (Choose two)", "options": {"A": "does not require a dedicated end-to-end connection", "B": "operates independently of the network media", "C": "retransmits packets if errors occur", "D": "re-assembles out of order packets into the correct order at the receiver end"}, "answers": ["A", "B"], "explanation": "", "slide_img": "images/q_034_slide_1794418829279.jpg", "note_img": "images/q_034_note_1794418829279.jpg"}, {"id": 35, "subject": "IAO202", "question": "What are two disadvantages of using an IDS? (Choose two.)", "options": {"A": "The IDS does not stop malicious traffic.", "B": "The IDS works offline using copies of network traffic.", "C": "The IDS has no impact on traffic.", "D": "The IDS analyzes actual forwarded packets.", "E": "The IDS requires other devices to respond to attacks."}, "answers": ["A", "E"], "explanation": "", "slide_img": "images/q_035_slide_1794418830676.jpg", "note_img": "images/q_035_note_1794418830676.jpg"}, {"id": 36, "subject": "IAO202", "question": "What are two symmetric encryption algorithms? (Choose two.)", "options": {"A": "3DES", "B": "SHA", "C": "MD5", "D": "AES", "E": "HMAC"}, "answers": ["A", "D"], "explanation": "Hai thuật toán mã hóa đối xứng là gì?\n3DES và AES.\nSHA, MD5 và HMAC không phải mã hóa đối xứng.", "slide_img": "images/q_036_slide_1794418832169.jpg", "note_img": "images/q_036_note_1794418832169.jpg"}, {"id": 37, "subject": "IAO202", "question": "What are two evasion methods used by hackers? (Choose two.)", "options": {"A": "scanning", "B": "access attack", "C": "resource exhaustion", "D": "phishing", "E": "encryption"}, "answers": ["C", "E"], "explanation": "Hai phương thức né tránh mả hacker sử dụng là gì?\nLàm cạn tài nguyên hệ thống và dùng mã hóa.\nĐây là hai kỹ thuật giúp hacker tránh bị phát hiện.", "slide_img": "images/q_037_slide_1794418833788.jpg", "note_img": "images/q_037_note_1794418833788.jpg"}, {"id": 38, "subject": "IAO202", "question": "What are two advantages of the NTFS file system compared with FAT32? (Choose two.)", "options": {"A": "NTFS is easier to configure.", "B": "NTFS supports larger files.", "C": "NTFS allows faster formatting of drives.", "D": "NTFS allows the automatic detection of bad sectors.", "E": "NTFS allows faster access to external peripherals such as a USB drive", "F": "NTFS provides more security features."}, "answers": ["B", "F"], "explanation": "Hai ưu điểm của hệ thống tệp NTFS so với FAT32 là gì? (Chọn hai)\nNTFS hỗ trợ tệp lớn hơn; NTFS cung cấp nhiều tính năng bảo mật hơn.\nNTFS cho phép dùng tệp dung lượng lớn và có nhiều cơ chế bảo mật hơn FAT32.", "slide_img": "images/q_038_slide_1794418835552.jpg", "note_img": "images/q_038_note_1794418835552.jpg"}, {"id": 39, "subject": "IAO202", "question": "What are two benefits of using an ext4 partition instead of ext3? (Choose two.)", "options": {"A": "an increase in the number of supported devices", "B": "improved performance", "C": "compatibility with NTFS", "D": "increase in the size of supported files", "E": "decreased load time", "F": "compatibility with CDFS"}, "answers": ["B", "D"], "explanation": "Hai lợi ích của việc dùng phân vùng ext4 thay cho atíị? (Chọn hai)\nHiệu năng được cải thiện; tăng kích thước tệp được hồ trợ.\nExt4 nhanh hơn và hố trợ tệp lớn hơn ext3.", "slide_img": "images/q_039_slide_1794418837441.jpg", "note_img": "images/q_039_note_1794418837441.jpg"}, {"id": 40, "subject": "IAO202", "question": "What are two benefits of using an ext4 partition instead of ext3? (Choose two.)", "options": {"A": "improved performance", "B": "increase in the size of supported files", "C": "an increase in the number of supported devices", "D": "compatibility with NTFS"}, "answers": ["A", "B"], "explanation": "Hai lợi ích của việc dùng phân vùng ext4 thay ơ19 ext3? (Chọn hai)\nCài thiện hiệu năng; tăng kích thước tệp được hồ trợ.\nExt4 nhanh hơn và hố trợ tệp lớn hơn ext3.", "slide_img": "images/q_040_slide_1794418839322.jpg", "note_img": "images/q_040_note_1794418839322.jpg"}, {"id": 41, "subject": "IAO202", "question": "What are two monitoring tools that capture network traffic and forward it to network monitoring devices? (Choose two.)", "options": {"A": "SPAN", "B": "network tap", "C": "SNMP", "D": "SIEM", "E": "Wireshark"}, "answers": ["A", "B"], "explanation": "Hai công cụ giám sát bắt lưu lượng mạng và chuyễn tiếp đến thiết bị giám sát? (Chọn hai)\nSPAN; network tap. : :\nSPAN và network tap đều được dùng đễ sao chép lưu lượng và gửi đến thiết bị phân tích.", "slide_img": "images/q_041_slide_1794418840964.jpg", "note_img": "images/q_041_note_1794418840964.jpg"}, {"id": 42, "subject": "IAO202", "question": "What are two ICMPv6 messages that are not present in ICMP for IPv4? (Choose two.)", "options": {"A": "Neighbor Solicitation", "B": "Destination Unreachable", "C": "Host Confirmation", "D": "Time Exceeded", "E": "Router Advertisement", "F": "Route Redirection"}, "answers": ["A", "E"], "explanation": "Hai thông điệp ICMPv6 không tôn tại trong ICMP của IPv4? (Chọn hai)\nNeighbor Solicitation; Router Advertisement.\nHai thông điệp này phục vụ cơ chế Neighbor Discovery đặc thù của IPv8.", "slide_img": "images/q_042_slide_1794418842667.jpg", "note_img": "images/q_042_note_1794418842667.jpg"}, {"id": 43, "subject": "IAO202", "question": "What are two problems that can be caused by a large number of ARP request and reply messages? (Choose two.)", "options": {"A": "All ARP request messages must be processed by all nodes on the local network.", "B": "A large number of ARP request and reply messages may slow down the switching process, leading the switch to make many changes in its MAC table.", "C": "The network may become overloaded because ARP reply messages have a very large payload due to the 48-bit MAC address and 32-bit IP address that they contain.", "D": "The ARP request is sent as a broadcast, and will flood the entire subnet.", "E": "Switches become overloaded because they concentrate all the traffic from the attached subnets."}, "answers": ["A", "B"], "explanation": "Hai vấn đề nào có thễ xảy ra do số lượng lớn thông điệp yêu cầu và phản hồi ARP2\nTất cả các thông điệp ARP request phải được xử lý bởi mọi thiết bị trong mạng cục bộ; Số lượng lớn thông điệp ARP có thể làm chậm quá trình chuyển mạch, khiến sviitch", "slide_img": "images/q_043_slide_1794418844739.jpg", "note_img": "images/q_043_note_1794418844739.jpg"}, {"id": 44, "subject": "IAO202", "question": "What are two methods used by cybercriminals to mask DNS attacks? (Choose two.)", "options": {"A": "reflection", "B": "shadowing", "C": "domain generation algorithms", "D": "fast flux", "E": "tunneling"}, "answers": ["C", "D"], "explanation": "Hai phương thức nào được tội phạm mạng dùng đề che giầu các cuộc tần công DNS?\nC. Thuật toán tạo tên miền (domain generation algoritnms) D. Fast fluxIl\nDGA tạo nhiều tên miền đề tránh bị chặn, fast flux thay đối nhanh IP đễ che giầu botnet.", "slide_img": "images/q_044_slide_1794418846395.jpg", "note_img": "images/q_044_note_1794418846395.jpg"}, {"id": 45, "subject": "IAO202", "question": "What are two benefits of using an ext4 partition instead of ext3? (Choose two.)", "options": {"A": "an increase in the number of supported devices", "B": "improved performance", "C": "compatibility with NTFS", "D": "increase in the size of supported files", "E": "decreased load time", "F": "compatibility with CDFS"}, "answers": ["B", "D"], "explanation": "Hai lợi ích của việc dùng phân vùng ext4 thay VJ exi32?\ncải thiện hiệu suất; tăng kích thước file được hố trợ", "slide_img": "images/q_045_slide_1794418848235.jpg", "note_img": "images/q_045_note_1794418848235.jpg"}, {"id": 46, "subject": "IAO202", "question": "Which two parts are components of an IPv4 address? (Choose two.)", "options": {"A": "logical portion", "B": "host portion", "C": "broadcast portion", "D": "subnet portion", "E": "network portion", "F": "physical portion"}, "answers": ["B", "E"], "explanation": "Hai phần nào là thành phần của một địa chỉ IPv4?\nB. Phần host E. Phần network\nIPv4 luôn bao gồm phần mạng và phần host đễ định tuyến và nhận dạng thiết bị.", "slide_img": "images/q_046_slide_1794418849759.jpg", "note_img": "images/q_046_note_1794418849759.jpg"}, {"id": 47, "subject": "IAO202", "question": "Which two commands could be used to check if DNS name resolution is working properly on a Windows PC? (Choose two.)", "options": {"A": "ping cisco.com", "B": "net cisco.com", "C": "nslookup cisco.com", "D": "ipconfig /flushdns"}, "answers": ["A", "C"], "explanation": "Hai lệnh nào có thễ dùng đề kiễm tra việc phân giải DNS trên Windows?\nA. ping cisco.com C. nslookup cisco.com : :\nPing kiểm tra phân giải DNS trước khi gửi ICMP, nslookup kiễm tra trực tiếp máy chủ DNS.", "slide_img": "images/q_047_slide_1794418851410.jpg", "note_img": "images/q_047_note_1794418851410.jpg"}, {"id": 48, "subject": "IAO202", "question": "Which two devices would commonly be found at the access layer of the hierarchical enterprise LAN design model? (Choose two.)", "options": {"A": "modular switch", "B": "Layer 3 device", "C": "Layer 2 switch", "D": "firewall", "E": "access point"}, "answers": ["C", "E"], "explanation": "Hai thiết bị nào thường được tìm thấy ở tầng truy cập của mô hình LAN doanh nghiệp phân cấp?\nLayer 2 switch và Access point .\nTầng truy cập phục vụ kết nồi thiết bị đầu cuồi, nên thường dùng switch L2 và access point.", "slide_img": "images/q_048_slide_1794418853160.jpg", "note_img": "images/q_048_note_1794418853160.jpg"}, {"id": 49, "subject": "IAO202", "question": "Which two technologies are primarily used on peer-to-peer networks? (Choose two.)", "options": {"A": "Bitcoin", "B": "BitTorrent", "C": "Wireshark", "D": "Darknet", "E": "Snort"}, "answers": ["A", "B"], "explanation": "Hai công nghệ nào được dùng chủ yếu trên mạng ngang hàng?\nBitcoin và BitTorrent\nCả hai hoạt động dựa trên việc chia sẻ ngang hàng, không cần máy chủ trung tâm.", "slide_img": "images/q_049_slide_1794418854946.jpg", "note_img": "images/q_049_note_1794418854946.jpg"}, {"id": 50, "subject": "IAO202", "question": "Which two statements correctly describe certificate classes used in the PKI? (Choose two.)", "options": {"A": "A class 4 certificate is for online business transactions between companies.", "B": "Aclass 0 certificate is for testing purposes.", "C": "The lower the class number, the more trusted the certificate.", "D": "Aclass 0 certificate is more trusted than a class 1 certificate."}, "answers": ["A", "B"], "explanation": "Hai phát biễu nào mô tả đúng các lớp chứng chỉ trong PKI?\nChứng chỉ lớp 4 dùng cho giao dịch doanh nghiệp:; chứng chỉ lớp 0 dùng cho thử nghiệm\nLớp số cảng thấp thì độ tin cậy cảng thấp, lớp 4 dùng trong giao dịch quan trọng, lớp 0 chỉ phục vụ thử nghiệm.", "slide_img": "images/q_050_slide_1794418856980.jpg", "note_img": "images/q_050_note_1794418856980.jpg"}, {"id": 51, "subject": "IAO202", "question": "Which two devices would commonly be found at the access layer of the hierarchical enterprise LAN design model? (Choose two.)", "options": {"A": "modular switch", "B": "Layer 3 device", "C": "Layer 2 switch", "D": "firewall", "E": "access point"}, "answers": ["C", "E"], "explanation": "Hai thiết bị nào thường có ở tầng truy cập của mô hình LAN doanh nghiệp phân cấp?\nLayer 2 switch và Access point\nSwitch L2 kết nồi người dùng, AP cung cấp kết nói không dây.", "slide_img": "images/q_051_slide_1794418858650.jpg", "note_img": "images/q_051_note_1794418858650.jpg"}, {"id": 52, "subject": "IAO202", "question": "Which two options are security best practices that help mitigate BYOD risks? (Choose two.)", "options": {"A": "Use paint that reflects wireless signals and glass that prevents the signals from going outside the building.", "B": "Keep the device OS and software updated.", "C": "Only allow devices that have been approved by the corporate IT team.", "D": "Only turn on Wi-Fi when using the wireless network", "E": "Decrease the wireless antenna gain level.", "F": "Use wireless MAC address filtering."}, "answers": ["B", "D"], "explanation": "", "slide_img": "images/q_052_slide_1794418860605.jpg", "note_img": "images/q_052_note_1794418860605.jpg"}, {"id": 53, "subject": "IAO202", "question": "Which two parts are components of an IPv4 address? (Choose two.)", "options": {"A": "logical portion", "B": "host portion", "C": "broadcast portion", "D": "subnet portion", "E": "network portion", "F": "physical portion"}, "answers": ["B", "E"], "explanation": "Hai phần nào là thành phần của một địa chỉ IPv4?\nPhần mạng và phần host.\nĐịa chỉ IPv4 luôn được chia thành netvrork portion (xác định mạng) và host portion (xác định thiết bị trong mạng).", "slide_img": "images/q_053_slide_1794418862397.jpg", "note_img": "images/q_053_note_1794418862397.jpg"}, {"id": 54, "subject": "IAO202", "question": "Which two methods can be used to harden a computing device? (Choose two.)", "options": {"A": "Allow default services to remain enabled.", "B": "Ensure physical security.", "C": "Allow USB auto-detection.", "D": "Enforce the password history mechanism."}, "answers": ["B", "D"], "explanation": "Hai phương pháp nào có thể được dùng ạẽ tăng cường bảo mật cho thiết bị tính toán?\nĐảm bảo an ninh vật lý và áp dụng cơ chê lịch sử mật khẩâu. :\nAn ninh vật lý và quản lý mật khẩu là hai biện pháp bảo mật phố biến đễ giảm rủi ro truy cập trái phép.", "slide_img": "images/q_054_slide_1794418864364.jpg", "note_img": "images/q_054_note_1794418864364.jpg"}, {"id": 55, "subject": "IAO202", "question": "Which two ICMP messages are used by both IPv4 and IPv6 protocols? (Choose two)", "options": {"A": "router solicitation", "B": "route redirection", "C": "neighbor solicitation", "D": "protocol unreachable", "E": "router advertisement"}, "answers": ["B", "D"], "explanation": "Hai môn_g điệp ICMP nào được sử dụng bởi cả IPv4 và IPv62\nB. chuyễn hướng tuyền & D giao thức không thế đến được", "slide_img": "images/q_055_slide_1794418866117.jpg", "note_img": "images/q_055_note_1794418866117.jpg"}, {"id": 56, "subject": "IAO202", "question": "Which two statements are true about NTP servers in an enterprise network? (Choose two.)", "options": {"A": "There can only be one NTP server on an enterprise network", "B": "NTP servers at stratum 1 are directly connected to an authoritative time source.", "C": "NTP servers control the mean time between failures (MTBF) for key network devices.", "D": "NTP servers ensure an accurate time stamp on logging and debugging information.", "E": "All NTP servers synchronize directly to a stratum 1 time source."}, "answers": ["B", "D"], "explanation": "Hai phát biêễu nào đúng về máy chủ NTP trong mạng doanh nghiệp?\nMáy chủ NTP cấp stratum 1 kết nỷi trực tiếp với nguồn thời gian chuẩn và đảm bảo dầu thời gian chính xác cho log.\nStratum 1 là nguôn thời gian chuẩn; NTP giúp hệ thống ghi log và phân tích sự có chính xác.", "slide_img": "images/q_056_slide_1794418868250.jpg", "note_img": "images/q_056_note_1794418868250.jpg"}, {"id": 57, "subject": "IAO202", "question": "Which two options are network security monitoring approaches that use advanced analytic techniques to analyze network telemetry data? (Choose two.)", "options": {"A": "NBAD", "B": "Sguil", "C": "NetFlow", "D": "IPFIX", "E": "Snorby", "F": "NBA"}, "answers": ["A", "F"], "explanation": "Hai lựa chọn nào dùng kỹ thuật phân tích nâng cao đễ phân tích dữ liệu telemetry mạng?\nNEAD và NBA.\nNEBAD/NBA dùng phân tích hành vi đễ phát hiện bất thường trong lưu lượng mạng.", "slide_img": "images/q_057_slide_1794418870249.jpg", "note_img": "images/q_057_note_1794418870249.jpg"}, {"id": 58, "subject": "IAO202", "question": "Which two commands could be used to check if DNS name resolution is working properly on a Windows PC? (Choose two.)", "options": {"A": "nslookup cisco.com", "B": "net cisco.com", "C": "ipconfig /flushdns", "D": "nbtstat cisco.com", "E": "ping cisco.com"}, "answers": ["A", "E"], "explanation": "Hai lệnh nào có thễ dùng đề kiễm tra phân giải DNS trên Windows?\nnslookup cisco.com và ping cisco.com.\nnslookup kiêm tra việc phân giải DNS trực tiếp, ping kiếm tra có phân giải tên host trước khi gửi gói ICMP.", "slide_img": "images/q_058_slide_1794418872006.jpg", "note_img": "images/q_058_note_1794418872006.jpg"}, {"id": 59, "subject": "IAO202", "question": "Which two commands can be used on a Windows host to display the routing table? (Choose two.)", "options": {"A": "netstat -s", "B": "route print", "C": "show ip route", "D": "netstat -r", "E": "tracert"}, "answers": ["B", "D"], "explanation": "Hai lệnh nào có thễ được dùng trên máy Windows đề xem bảng định tuyến?\nroute print: netstat -r\nHai lệnh này đều hiến thị bằng định tuyến của Windows.", "slide_img": "images/q_059_slide_1794418873859.jpg", "note_img": "images/q_059_note_1794418873859.jpg"}, {"id": 60, "subject": "IAO202", "question": "Which two areas must an IT security person understand in order to identify vulnerabilities on a network? (Choose two.)", "options": {"A": "Data analysis trends", "B": "Important applications used", "C": "Hardware used by applications", "D": "Number of systems on each network", "E": "Network baseline data"}, "answers": ["B", "C"], "explanation": "", "slide_img": "images/q_060_slide_1794418875261.jpg", "note_img": "images/q_060_note_1794418875261.jpg"}, {"id": 61, "subject": "IAO202", "question": "eS Which two classes of metrics are included in the CVSS Base Metric Group? (Choose two.}", "options": {"A": "Confidentiality Requirement", "B": "Modified Base", "C": "Exploit Code Maturity", "D": "Exploitability", "E": "Impact metrics"}, "answers": [], "explanation": "", "slide_img": "images/q_061_slide_1794418876608.jpg", "note_img": "images/q_061_note_1794418876608.jpg"}, {"id": 62, "subject": "IAO202", "question": "When dealing with security threats and using the Cyber Kill Chain model, which two approaches can an organization use to block a potential back door creation? (Choose two.)", "options": {"A": "Audit endpoints to discover abnormal file creations", "B": "Establish an incident response playbook.", "C": "Consolidate the number of Internet points of presence.", "D": "Conduct damage assessment.", "E": "Use HIPS to alert or place a block on common installation paths."}, "answers": ["A", "E"], "explanation": "Khi xử lý môi đe dọa bảo mật... hai cách nào giúp chặn việc tạo backdoor?\nAudit endpoints; Use HIPS to alert or block installation paths\nCả hai phương pháp đều giúp phát hiện và ngăn chặn hành vi cải backdoor.", "slide_img": "images/q_062_slide_1794418878490.jpg", "note_img": "images/q_062_note_1794418878490.jpg"}, {"id": 63, "subject": "IAO202", "question": "Which two operations are provided by TCP but not by UDP? (Choose two.)", "options": {"A": "retransmitting any unacknowledged data", "B": "acknowledging received data", "C": "reconstructing data in the order received", "D": "identifying the applications", "E": "tracking individual conversations"}, "answers": ["A", "B"], "explanation": "Hai chức năng nào TCP có nhưng UDP không có?", "slide_img": "images/q_063_slide_1794418880123.jpg", "note_img": "images/q_063_note_1794418880123.jpg"}, {"id": 64, "subject": "IAO202", "question": "eee Which two characteristics describe a worm? (Choose two.)", "options": {"A": "executes when software is run on a computer", "B": "is self-replicating", "C": "hides in a dormant state until needed by an attacker", "D": "infects computers by attaching to software code", "E": "travels to new computers without any intervention or knowledge of the user"}, "answers": ["B", "E"], "explanation": "", "slide_img": "images/q_064_slide_1794418881660.jpg", "note_img": "images/q_064_note_1794418881660.jpg"}, {"id": 65, "subject": "IAO202", "question": "A user Is Curious about how someone might know a computer has been infected with malware. What are two common malware behaviors? (Choose two.)", "options": {"A": "The computer gets increasingly slower to respond.", "B": "The computer emits a hissing sound every time the pencil sharpener is used.", "C": "The computer freezes and requires reboots.", "D": "The computer beeps once during the boot process"}, "answers": ["A", "C"], "explanation": "Hai dấu hiệu phố biến cho thầy máy tính bị malware là gì?\nComputer gets slower: Computer freezes and requires reboots\nMalware làm máy chậm dần và dế bị treo, buộc phải khởi động lại.", "slide_img": "images/q_065_slide_1794418883412.jpg", "note_img": "images/q_065_note_1794418883412.jpg"}, {"id": 66, "subject": "IAO202", "question": "A network administrator is configuring an AAA server to manage TACACS+ authentication. What are two attributes of TACACS+ authentication? (Choose two )", "options": {"A": "TCP port 40", "B": ". encryption for all communication", "C": "single process for authentication and authorization", "D": "UDP port 1645", "E": "encryption for only the password of a user", "F": "separate processes for authentication and authorization"}, "answers": ["B", "F"], "explanation": "Hai đặc điểm nào của cơ chế xác thực TACACS+2\nEncryption for all communication: Separate processes for authentication and authorization\nTACACS+ mã hóa toàn bộ phiên làm việc và tách riêng xác thực - ủy quyền.", "slide_img": "images/q_066_slide_1794418885391.jpg", "note_img": "images/q_066_note_1794418885391.jpg"}, {"id": 67, "subject": "IAO202", "question": "A threat actor uses a program to launch an attack by sending a flood of UDP packets to a server on the network. The program sweeps through all of the known ports trying to find closed ports. It causes the server to reply with an ICMP port unreachable message and is similar to a DoS attack. Which two programs could be used by the threat actor to launch the attack? (Choose two.)", "options": {"A": "WireShark", "B": "Ping", "C": "UDP Unicom", "D": "Smurf", "E": "Low Orbit lon Cannon"}, "answers": ["C", "E"], "explanation": "", "slide_img": "images/q_067_slide_1794418886904.jpg", "note_img": "images/q_067_note_1794418886904.jpg"}, {"id": 68, "subject": "IAO202", "question": "Lightweight access points forward data between which two devices on the network? (Choose two.)", "options": {"A": "wireless router", "B": "default gateway", "C": "wireless LAN controller", "D": "autonomous access point", "E": "wireless client"}, "answers": ["C", "E"], "explanation": "Lighiwreight access points chuyên tiếp dữ liệu giữa hai thiết bị nào trên mạng?\nBộ điều khiến LAN không dây và máy khách không dây.\nLight/eight AP phải dựa vào WLAN controller đễ xử lý gói và truyền dữ liệu tới client.", "slide_img": "images/q_068_slide_1794418888486.jpg", "note_img": "images/q_068_note_1794418888486.jpg"}, {"id": 69, "subject": "IAO202", "question": "What are two examples of personally identifiable information (PII)? (Choose two.)", "options": {"A": "first name", "B": "lOP address", "C": "language preference", "D": "street address", "E": "credit card number"}, "answers": ["D"], "explanation": "", "slide_img": "images/q_069_slide_1794418889801.jpg", "note_img": "images/q_069_note_1794418889801.jpg"}, {"id": 70, "subject": "IAO202", "question": "What is done to an IP packet before it is transmitted over the physical medium?", "options": {"A": "It is encapsulated into a TCP segment.", "B": "It is segmented into smaller individual pieces", "C": "It is tagged with information guaranteeing reliable delivery.", "D": "It is encapsulated in a Layer 2 frame."}, "answers": ["D"], "explanation": "Điều gì được thực hiện với một gói IP trước khi nó được truyền qua môi trường vật lý?\nNó được đóng gói vào một khung Layer 2.\nTrước khi truyền đï, gói IP luôn phải được đóng gói thành írame Layer 2 (Ethernet).", "slide_img": "images/q_070_slide_1794418892533.jpg", "note_img": "images/q_070_note_1794418892533.jpg"}, {"id": 71, "subject": "IAO202", "question": "What is a basic characteristic of the IP protocol?", "options": {"A": "reliable end-to-end delivery", "B": "connectionless", "C": "media dependent", "D": "user data segmentation"}, "answers": ["B"], "explanation": "Đặc điễm cơ bản của giao thức IP là gì?\nKhông kết nối. |\nIP là giao thức không kết nối, không bảo đảm việc truyền dữ liệu.", "slide_img": "images/q_071_slide_1794418894152.jpg", "note_img": "images/q_071_note_1794418894152.jpg"}, {"id": 72, "subject": "IAO202", "question": "What mechanism is used by a router to prevent a received IPv4 packet from traveling endlessly on a network?", "options": {"A": "Time Exceeded message to the source host.", "B": "It checks the value of the TTL field and if it is 0, it discards the packet and sends a Destination Unreachable message to the source host.", "C": "It decrements the value of the TTL field by 1 and if the result is 0, it discards the packet and sends", "D": "It checks the value of the TTL field and if it is 100, it discards the packet and sends a Destination Unreachable message to the source host."}, "answers": ["C"], "explanation": "Cơ chế nào được router sử dụng đễ ngăn gói IPv4 di chuyên mãi trên mạng?\nRouter giảm giá trị TTL đĩ 1 và nếu TTL bằng 0, gói bị hủy và gửi thông báo Time Exceeded về nguồn.\nTTL giúp giới hạn vòng đời của gói đề tránh vòng lặp vô hạn.", "slide_img": "images/q_072_slide_1794418896150.jpg", "note_img": "images/q_072_note_1794418896150.jpg"}, {"id": 73, "subject": "IAO202", "question": "ee What command allows a user to manually request a DNS server to resolve a particular hostname?", "options": {"A": "ipconfig /displaydns", "B": "net", "C": "tracert", "D": "nslookup"}, "answers": ["D"], "explanation": "", "slide_img": "images/q_073_slide_1794418897557.jpg", "note_img": "images/q_073_note_1794418897557.jpg"}, {"id": 74, "subject": "IAO202", "question": "Which objective of secure communications is achieved by encrypting data?", "options": {"A": "confidentiality", "B": "integrity", "C": "availability", "D": "authentication"}, "answers": ["A"], "explanation": "Mục tiêu nào của truyền thông bảo mật đạt được bằng cách mã hóa dữ liệu?\nBảo mật (confidentiality).\nMã hóa giúp ngăn người không được phép đọc được dữ liệu.", "slide_img": "images/q_074_slide_1794418899272.jpg", "note_img": "images/q_074_note_1794418899272.jpg"}, {"id": 75, "subject": "IAO202", "question": "What message informs |Pv6 enabled interfaces to use stateful DHCPv6 for obtaining an IPv6 address?", "options": {"A": "the ICMPv6 Router Solicitation", "B": "the DHCPv6 Advertise message", "C": "the DHCPv6 Reply message", "D": "the ICMPv6 Router Advertisement"}, "answers": ["D"], "explanation": "Thông điệp nào thông báo cho giao diện IPv6 dùng DHCPv6 dạng stateful đễ lấy địa chỉ IPv6?\nThông điệp ICMPv6 Router Advertisement.\nRouter Advertisement có cờ chỉ định dùng DHCPv6 stateful.", "slide_img": "images/q_075_slide_1794418901129.jpg", "note_img": "images/q_075_note_1794418901129.jpg"}, {"id": 76, "subject": "IAO202", "question": "Which field in an IPv4 packet header will typically stay the same during its transmission?", "options": {"A": "TTL", "B": "None of the mentioned.", "C": "Destination Address", "D": "Flag", "E": "Packet Length"}, "answers": ["C"], "explanation": "Trường nào trong header IPv4 thường giữ nguyên trong quá trình truyền?\nĐịa chỉ đích.\nĐịa chỉ đích không thay đối khi gói được chuyễn qua các router.", "slide_img": "images/q_076_slide_1794418902844.jpg", "note_img": "images/q_076_note_1794418902844.jpg"}, {"id": 77, "subject": "IAO202", "question": "Which field in the |Pv6 header points to optional network layer information that is carried in the IPv6 packet?", "options": {"A": "traffic class", "B": "version", "C": "flow label", "D": "next header"}, "answers": ["D"], "explanation": "Trường nào trong header IPv6 trò đến thông tin tùy chọn của tầng mạng trong gói IPv6?\nTrường Next Header.\nNext Header cho biết kiều header kế tiếp hoặc header mở rộng.", "slide_img": "images/q_077_slide_1794418904621.jpg", "note_img": "images/q_077_note_1794418904621.jpg"}, {"id": 78, "subject": "IAO202", "question": "Which value, that is contained in an IPv4 header field, is decremented by each router that receives a packet?", "options": {"A": "Header Length", "B": "Fragment Offset", "C": "TTL", "D": "None of the mentioned.", "E": "Differentiated Services"}, "answers": ["C"], "explanation": "Giá trị nào trong header IPv4 bị giảm ởi bởi mối router nhận gói?\nTTL.\nTTL giảm mối lần đi qua router đễ tránh gói chạy vòng vô hạn.", "slide_img": "images/q_078_slide_1794418906616.jpg", "note_img": "images/q_078_note_1794418906616.jpg"}, {"id": 79, "subject": "IAO202", "question": "Which type of attack is carried out by threat actors against a network to determine which IP addresses, protocols, and ports are allowed by ACLs?", "options": {"A": "phishing", "B": "social engineering", "C": "denial of service", "D": "reconnaissance"}, "answers": ["D"], "explanation": "Loại tắn công nào được thực hiện bởi các tác nhân đe dọa đễ xác định những địa chỉ IP, giao thức và công nào được ACL cho phép?\ndo thám (reconnaissance) ] ]\nTấn công reconnaissance dùng đễ quét và thu thập thông tin về tài nguyên mạng, bao gồm IP. công và giao thức được phép bởi ACL.", "slide_img": "images/q_079_slide_1794418908396.jpg", "note_img": "images/q_079_note_1794418908396.jpg"}, {"id": 80, "subject": "IAO202", "question": "Which statement describes a feature of the IP protocol?", "options": {"A": "IP relies on Layer 2 protocols for transmission error control.", "B": "MAC addresses are used during the IP packet encapsulation.", "C": "IP relies on upper layer services to handle situations of missing or out-of-order packets.", "D": "IP encapsulation is modified based on network media."}, "answers": ["C"], "explanation": "Phát biễu nào mô tả một đặc điểm của giao thức IP?\nC. IP dựa vào các dịch vụ tầng trên đễ xử lý gói tin mắt hoặc sai thứ tự. | :\nIP là giao thức không đảm bảo nên nó phụ thuộc vào tằng vận chuyễn (ví dụ TCP) đề xử lý lối và sắp xếp lại dữ liệu.", "slide_img": "images/q_080_slide_1794418910345.jpg", "note_img": "images/q_080_note_1794418910345.jpg"}, {"id": 81, "subject": "IAO202", "question": "Which PDU is processed when a host computer is de-encapsulating a message at the transport layer of the TCP/IP model?", "options": {"A": "packet", "B": "bits", "C": "segment", "D": "frame"}, "answers": ["C"], "explanation": "Loại PDU nào được xử lý khi máy chủ giải đóng gói dữ liệu ở tầng vận chuyên của mô hình TCP/IP?\nq segment fflogạn dữ liệu)\nTầng vận chuyễn làm việc với segment, vì vậy quá trình giải đóng gói ở tầng này xử lý segment.", "slide_img": "images/q_081_slide_1794418912264.jpg", "note_img": "images/q_081_note_1794418912264.jpg"}, {"id": 82, "subject": "IAO202", "question": "When a wireless network in a small office is being set up, which type of IP addressing is typically used on the networked devices?", "options": {"A": "network", "B": "wireless", "C": "private", "D": "public"}, "answers": ["C"], "explanation": "Khi thiết lập mạng Wi-Fi trong một văn phòng nhồ, loại đĩa chỉ IP nào thường được sử dụng cho các thiết bị?\nC. IP riêng (private IP) ]\nMạng văn phòng nhỏ dùng IP private đễ tiết kiệm địa chỉ và cho phép các thiết bị dùng NAT ra Internet.", "slide_img": "images/q_082_slide_1794418914158.jpg", "note_img": "images/q_082_note_1794418914158.jpg"}, {"id": 83, "subject": "IAO202", "question": "Which two functions does the transport layer perform in network data communication? (Select two.)", "options": {"A": "tracking the individual communication between applications on the source and destination hosts", "B": "performing a cyclic redundancy check on the frame for errors", "C": "identifying the proper application for each communication stream", "D": "providing the interface between applications and the underlying network over which messages are transmitted"}, "answers": ["A", "C"], "explanation": "", "slide_img": "images/q_083_slide_1794418915603.jpg", "note_img": "images/q_083_note_1794418915603.jpg"}, {"id": 84, "subject": "IAO202", "question": "ee What is a vulnerability that allows criminals to inject scripts into web pages viewed by users?", "options": {"A": "Cross-site scripting", "B": "XML injection", "C": "buffer overflow", "D": "SQL injection"}, "answers": ["A"], "explanation": "", "slide_img": "images/q_084_slide_1794418917899.jpg", "note_img": "images/q_084_note_1794418917899.jpg"}, {"id": 85, "subject": "IAO202", "question": "nn OOOO——————————————————————————————eeeeeeereererererrr What is a monitoring tool used for capturing traffic statistics?", "options": {"A": "Netflow", "B": "SPAN", "C": "Syslog", "D": "SNMP"}, "answers": ["A"], "explanation": "", "slide_img": "images/q_085_slide_1794418919375.jpg", "note_img": "images/q_085_note_1794418919375.jpg"}, {"id": 86, "subject": "IAO202", "question": "What is the term used when a malicious party sends a fraudulent email disguised as being from a legitimate, trusted source?", "options": {"A": "Backdoor", "B": "Vishing", "C": "Phishing", "D": "Trojan"}, "answers": ["C"], "explanation": "", "slide_img": "images/q_086_slide_1794418920837.jpg", "note_img": "images/q_086_note_1794418920837.jpg"}, {"id": 87, "subject": "IAO202", "question": "What is the goal of a white hat hacker?", "options": {"A": "modifying data", "B": "stealing data", "C": "protecting data", "D": "validating data"}, "answers": ["C"], "explanation": "Mục tiêu của một hacker mũ trắng là gì?\nBào vệ dữ liệu.\nHacker mũ trắng tập trung vào bảo mật hệ thống và bảo vệ dữ liệu hợp pháp.", "slide_img": "images/q_087_slide_1794418922421.jpg", "note_img": "images/q_087_note_1794418922421.jpg"}, {"id": 88, "subject": "IAO202", "question": "What is the first line of defense when an organization is using a defense-in-depth approach to network security?", "options": {"A": "edge router", "B": "firewall", "C": "proxy server", "D": "IPS"}, "answers": ["A"], "explanation": "Tuyến phòng thủ đầu tiên khi tỗ chức dùng mô hình phòng thủ nhiều lớp là gì?\nRouter biên.\nEdge router là lớp bảo vệ đầu tiên lọc lưu lượng từ bên ngoài trước khi vào mạng nội bộ.", "slide_img": "images/q_088_slide_1794418924176.jpg", "note_img": "images/q_088_note_1794418924176.jpg"}, {"id": 89, "subject": "IAO202", "question": "What are security event logs commonly based on when sourced by traditional firewalls?", "options": {"A": "static filtering", "B": "application analysis", "C": "signatures", "D": "5-tuples"}, "answers": ["D"], "explanation": "Nhật ký sự kiện bảo mật được tường lửa truyền thông ghi dựa trên cơ sở nào?\n5-tuple.\nTường lửa truyền thống chủ yếu dựa trên 5 thông só: IP nguồn, IP đích, cống nguồn, công đích, giao thức.", "slide_img": "images/q_089_slide_1794418925966.jpg", "note_img": "images/q_089_note_1794418925966.jpg"}, {"id": 90, "subject": "IAO202", "question": "What contains information on how hard drive partitions are organized?", "options": {"A": "MBR", "B": "BOOTMGR", "C": "CPU", "D": "Windows Registry"}, "answers": ["A"], "explanation": "Thông tin nào chứa cách phân vùng ỗ cứng được tổ chức?\nMEBR\nMBR lưu bảng phân vùng và cách sắp xếp các phân vùng trên ô đĩa.", "slide_img": "images/q_090_slide_1794418927647.jpg", "note_img": "images/q_090_note_1794418927647.jpg"}, {"id": 91, "subject": "IAO202", "question": "What classification is used for an alert that correctly identifies that an exploit has occurred?", "options": {"A": "false negative", "B": "false positive", "C": "true positive", "D": "true negative"}, "answers": ["C"], "explanation": "Phân loại nào được dùng cho một cảnh báo xác định đúng rằng có khai thác đã xảy ra?\ntrue positive ]\nTrue positive nghĩa là hệ thống phát hiện đúng một sự cổ thực sự xảy ra.", "slide_img": "images/q_091_slide_1794418929643.jpg", "note_img": "images/q_091_note_1794418929643.jpg"}, {"id": 92, "subject": "IAO202", "question": "What kind of ICMP message can be used by threat actors to create a man-in-the-middle attack?", "options": {"A": "ICMP echo request", "B": "ICMP unreachable", "C": "ICMP redirects", "D": "ICMP mask reply"}, "answers": ["C"], "explanation": "Loại thông điệp ICMP nào có thế bị kẻ tần công lợi dụng đễ tạo tần công man-in-the-middle2?\nICMP redirects :\nICMP redirect có thế bị lạm dụng đễ điều hướng lưu lượng về thiết bị giả mạo.", "slide_img": "images/q_092_slide_1794418931540.jpg", "note_img": "images/q_092_note_1794418931540.jpg"}, {"id": 93, "subject": "IAO202", "question": "oo What information does an Ethernet switch examine and use to forward a frame?", "options": {"A": "destination MAC address", "B": "destination IP address", "C": "source MAC address", "D": "source IP address"}, "answers": ["A"], "explanation": "", "slide_img": "images/q_093_slide_1794418933023.jpg", "note_img": "images/q_093_note_1794418933023.jpg"}, {"id": 94, "subject": "IAO202", "question": "What technique is a security attack that depletes the pool of IP addresses available for legitimate hosts?", "options": {"A": "reconnaissance attack", "B": "DHCP starvation", "C": "DHCP spoofing", "D": "DHCP snooping"}, "answers": ["B"], "explanation": "Kỹ thuật nào là tắn công làm cạn kiệt địa chỉ IP dành cho các host hợp lệ?\nDHOCP starvation\nDHCP starvation gửi yêu cầu giả mạo liên tục đề chiếm hết IP của DHCP server.", "slide_img": "images/q_094_slide_1794418934965.jpg", "note_img": "images/q_094_note_1794418934965.jpg"}, {"id": 95, "subject": "IAO202", "question": "What type of malware has the primary objective of spreading across the network?", "options": {"A": "botnet", "B": "worm", "C": "Trojan horse", "D": "virus"}, "answers": ["B"], "explanation": "Loại malware nào có mục tiêu chính là tự lan truyền qua mạng?\nworm Ñ\n\nˆ - - ^` - ˆ .ˆ M s- Ñ\nWorm tự nhân bản và lan truyền qua mạng mã không cần sự can thiệp của người dùng.", "slide_img": "images/q_095_slide_1794418936676.jpg", "note_img": "images/q_095_note_1794418936676.jpg"}, {"id": 96, "subject": "IAO202", "question": "What would be the target of an SQL injection attack?", "options": {"A": "email", "B": "DNS", "C": "database", "D": "DHCP"}, "answers": ["C"], "explanation": "Mục tiêu của một cuộc tần công SOL injection là gì?\nC. database\nSOL injection nhắm vào cơ sở dữ liệu đề đánh cắp hoặc chỉnh sửa dữ liệu.", "slide_img": "images/q_096_slide_1794418938448.jpg", "note_img": "images/q_096_note_1794418938448.jpg"}, {"id": 97, "subject": "IAO202", "question": "Which component of the zero trust security model focuses on secure access when an API, a microservice, or a container is accessing a database within an application?", "options": {"A": "workforce", "B": "workflow", "C": "workload", "D": "workplace"}, "answers": ["C"], "explanation": "", "slide_img": "images/q_097_slide_1794418940057.jpg", "note_img": "images/q_097_note_1794418940057.jpg"}, {"id": 98, "subject": "IAO202", "question": "Which attack involves threat actors positioning themselves between a source and destination with the intent of", "options": {"A": "ICMP attack", "B": "DoS attack", "C": "SYN flood attack", "D": "man-in-the-middle attack"}, "answers": ["D"], "explanation": "Cuộc tần công nào liên quan đến việc kẻ tắấn công đứng giữa nguồn và đích đễ theo dõi và điều khiến liên lạc?\nD. man-in-the-middle attack :\nMITM cho phép kẻ tần công xen giữa luồng truyền đề xem hoặc chỉnh sửa dữ liệu.", "slide_img": "images/q_098_slide_1794418941915.jpg", "note_img": "images/q_098_note_1794418941915.jpg"}, {"id": 99, "subject": "IAO202", "question": "Which AAA component can be established using token cards?", "options": {"A": "authentication", "B": "accounting", "C": "authorization", "D": "auditing"}, "answers": ["A"], "explanation": "Thành phần AAA nào có thễ được thiết lập bằng thẻ token?\nA. authentication :\nToken cung cấp mã xác thực dùng một lần đễ xác minh danh tính người dùng.", "slide_img": "images/q_099_slide_1794418943645.jpg", "note_img": "images/q_099_note_1794418943645.jpg"}, {"id": 100, "subject": "IAO202", "question": "OO ——————OO——O———O——e—e—ererereeerererrrr Which AAA component specifies the resources a user can access and the actions they are permitted to perform?", "options": {"A": "auditing", "B": "authorization", "C": "authentication", "D": "accounting"}, "answers": ["B"], "explanation": "", "slide_img": "images/q_100_slide_1794418945107.jpg", "note_img": "images/q_100_note_1794418945107.jpg"}, {"id": 101, "subject": "IAO202", "question": "Which cyber-attack involves a coordinated attack from a botnet of zombie computers?", "options": {"A": "address spoofing", "B": "MITM", "C": "ICMP redirect", "D": "DDoS"}, "answers": ["D"], "explanation": "Cuộc tần công mạng nào gồm nhiều máy zombie đồng loạt tần công mục tiêu?\nD. DDoS : :\nDDoS sử dụng boïnet đề tạo lưu lượng lớn nhằm làm mục tiêu quá tài.", "slide_img": "images/q_101_slide_1794418946889.jpg", "note_img": "images/q_101_note_1794418946889.jpg"}, {"id": 102, "subject": "IAO202", "question": "Which devices should be secured to mitigate against MAC address spoofing attacks?", "options": {"A": "Layer 3 devices", "B": "Layer 2 devices", "C": "Layer 7 devices", "D": "Layer 4 devices"}, "answers": ["B"], "explanation": "Thiết bị nào cần được bảo mật đễ giảm thiều tần công giả mạo địa chỉ MAC?\nB. Layer 2 devices : :\nGiả mạo MAC xảy ra ở tầng 2, nên switch phải được bảo vệ đễ ngăn tần công.", "slide_img": "images/q_102_slide_1794418948610.jpg", "note_img": "images/q_102_note_1794418948610.jpg"}, {"id": 103, "subject": "IAO202", "question": "Which firewall feature is used to ensure that packets coming into a network are legitimate responses to requests initiated from internal hosts?", "options": {"A": "stateful packet inspection", "B": "URL filtering", "C": "packet filtering", "D": "application filtering"}, "answers": ["A"], "explanation": "Tính năng tường lửa nào được ủng đề đảm bảo gói tin đi vào mạng là phản hồilhợp lệ cho các yêu cầu được khởi tạo từ bên trong2?\nStateful firewall theo dõi trạng thái kết nói, chỉ cho phép phản hồi hợp lệ từ các kết nối đã được khởi tạo từ bên trong.", "slide_img": "images/q_103_slide_1794418950576.jpg", "note_img": "images/q_103_note_1794418950576.jpg"}, {"id": 104, "subject": "IAO202", "question": "Which KPI metric does SOAR use to measure the time required to stop the spread of malware in the network?", "options": {"A": "MITR", "B": "Time to Control", "C": "MITC", "D": "MTTD"}, "answers": ["B"], "explanation": "SOAR dùng chỉ số KPI nào đễ đo thời gian cần thiết nhằm ngăn chặn sự lan rộng của malware trong mạng?\nTime to Control đo tốc độ SOAR phản ứng đề kiếm soát và ngăn malware lan rộng.", "slide_img": "images/q_104_slide_1794418952411.jpg", "note_img": "images/q_104_note_1794418952411.jpg"}, {"id": 105, "subject": "IAO202", "question": "", "options": {"A": "CybOX", "B": "Talos", "C": "MISP", "D": "TAXII"}, "answers": ["A"], "explanation": "", "slide_img": "images/q_105_slide_1794418954044.jpg", "note_img": "images/q_105_note_1794418954044.jpg"}, {"id": 106, "subject": "IAO202", "question": "Which Linux command can be used to display the name of the current working directory?", "options": {"A": "sudo", "B": "ps", "C": "pwd", "D": "chmod"}, "answers": ["C"], "explanation": "Lệnh Linux nào dùng đễ hiền thị tên của thư mục hiện tại?\nLệnh pwd hiến thị đường dẫn thư mục làm việc hiện tại của người dùng.", "slide_img": "images/q_106_slide_1794418955816.jpg", "note_img": "images/q_106_note_1794418955816.jpg"}, {"id": 107, "subject": "IAO202", "question": "Which Linux command can be used to display the name of the current working directory?", "options": {"A": "chmod", "B": "pwd", "C": "ps", "D": "Is", "E": "sudo"}, "answers": ["B"], "explanation": "Lệnh Linux nào được dùng đề hiền thị tên thư mục đang làm việc hiện tại?\npwd hiễn thị đường dẫn đây đủ của thư mục hiện tại.", "slide_img": "images/q_107_slide_1794418957622.jpg", "note_img": "images/q_107_note_1794418957622.jpg"}, {"id": 108, "subject": "IAO202", "question": "Which meta-feature element in the Diamond Model describes information gained by the adversary?", "options": {"A": "resources", "B": "direction", "C": "methodology", "D": "results"}, "answers": ["D"], "explanation": "Yếu tố meta-feature nào trong Diamond Model mô tả thông tin mà kẻ tần công thu được?\n“Results\" thế hiện kết quả mà adversary đạt được sau cuộc tần công, bao gồm dữ liệu hoặc thông tin thu được.", "slide_img": "images/q_108_slide_1794418959425.jpg", "note_img": "images/q_108_note_1794418959425.jpg"}, {"id": 109, "subject": "IAO202", "question": "Which networking model is being used when an author uploads one chapter document to a file server of a book publisher?", "options": {"A": "point-to-point", "B": "client/server", "C": "peer-to-peer", "D": "master-slave"}, "answers": ["B"], "explanation": "Mô hình mạng nào được sử dụng khi một tác giả ẹi một chương sách lên máy chủ của nhà xuất bản?\nTác giả (client) tải tài liệu lên máy chủ của nhả xuất bản (server), đúng mô hình client/server.", "slide_img": "images/q_109_slide_1794418961217.jpg", "note_img": "images/q_109_note_1794418961217.jpg"}, {"id": 110, "subject": "IAO202", "question": "oo Which organization is an international nonprofit organization that offers the CISSP certification?", "options": {"A": "CompTIA", "B": "(ISC)2", "C": "IEEE", "D": "GIAC"}, "answers": ["B"], "explanation": "", "slide_img": "images/q_110_slide_1794418962651.jpg", "note_img": "images/q_110_note_1794418962651.jpg"}, {"id": 111, "subject": "IAO202", "question": "A. availability", "options": {"B": "integrity", "C": "confidentiality", "D": "authentication"}, "answers": ["C"], "explanation": "Mục tiêu nào của truyền thông an toàn được đạt được bằng cách mã hóa dữ liệu?\nTính bảo mật.\nMã hóa giúp ngăn người không được phép đọc dữ liệu, đảm bảo bí mật.", "slide_img": "images/q_111_slide_1794418964295.jpg", "note_img": "images/q_111_note_1794418964295.jpg"}, {"id": 112, "subject": "IAO202", "question": "Which tool included in the Security Onion includes the capability of designing custom dashboards?", "options": {"A": "Sguil", "B": "Kibana", "C": "Squert", "D": "OSSEC"}, "answers": ["B"], "explanation": "Công cụ nào trong Security Onion có khả năng thiết kế các bằng dashboard tùy chỉnh?\nKibana.\nKibana cho phép tạo dashboard tùy chình đễ trực quan hóa dữ liệu log.", "slide_img": "images/q_112_slide_1794418966059.jpg", "note_img": "images/q_112_note_1794418966059.jpg"}, {"id": 113, "subject": "IAO202", "question": "Which term is used to describe the process of converting log entries into a common format?", "options": {"A": "standardization", "B": "normalization", "C": "classification", "D": "systemization"}, "answers": ["B"], "explanation": "Thuật ngữ nào mô tà quá trình chuyễn đôi các bản ghi log về cùng một định dạng?\n%uẹn hóa (Normalization).\nChuẩn hóa giúp log từ nhiều nguồn tr
